<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>BCMS Portal - 로그인</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f8fafc;
      --surface:  #ffffff;
      --border:   rgba(100,116,139,.15);
      --text:     #0f172a;
      --text-2:   #475569;
      --text-3:   #94a3b8;
      --accent:   #0070f3;
      --accent-subtle: rgba(0,112,243,.08);
      --r:        12px;
      --error:    #dc2626;
      --success:  #16a34a;
    }
    [data-theme="dark"] {
      --bg:       #0f172a;
      --surface:  #1e293b;
      --border:   rgba(100,116,139,.25);
      --text:     #f1f5f9;
      --text-2:   #94a3b8;
      --text-3:   #475569;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      padding: 20px;
    }

    .auth-wrap {
      width: 100%;
      max-width: 420px;
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-brand-icon { font-size: 40px; line-height: 1; }
    .auth-brand-title {
      margin-top: 10px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.03em;
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .auth-brand-sub { font-size: 13px; color: var(--text-2); margin-top: 4px; }

    .auth-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
    }

    .auth-tabs {
      display: flex;
      border-bottom: 0.5px solid var(--border);
    }
    .auth-tab {
      flex: 1;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      color: var(--text-2);
      background: none;
      border: none;
      font-family: inherit;
      transition: color .12s, background .12s;
    }
    .auth-tab.active {
      color: var(--accent);
      background: var(--accent-subtle);
      border-bottom: 2px solid var(--accent);
    }
    .auth-tab:hover:not(.active) { background: rgba(0,0,0,.02); }

    .auth-panel { padding: 28px; display: none; }
    .auth-panel.active { display: block; }

    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
      letter-spacing: .02em;
    }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: 8px;
      outline: none;
      font-family: inherit;
      transition: border-color .12s, box-shadow .12s;
    }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,112,243,.12);
    }
    .form-input::placeholder { color: var(--text-3); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .btn-primary {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      margin-top: 4px;
      transition: opacity .12s, transform .08s;
    }
    .btn-primary:hover:not(:disabled) { opacity: .9; }
    .btn-primary:active:not(:disabled) { transform: scale(.99); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    .alert {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }
    .alert.error   { background: rgba(220,38,38,.08);  color: var(--error);   border: 0.5px solid rgba(220,38,38,.2);  }
    .alert.success { background: rgba(22,163,74,.08);  color: var(--success); border: 0.5px solid rgba(22,163,74,.2);  }
    .alert.show    { display: block; }

    .divider {
      display: flex; align-items: center; gap: 10px;
      margin: 18px 0; font-size: 12px; color: var(--text-3);
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 0.5px; background: var(--border); }

    .form-hint { font-size: 11px; color: var(--text-3); margin-top: 4px; }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-3);
    }
    .auth-footer a { color: var(--text-2); text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
    .auth-footer-sep { margin: 0 6px; }

    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 이메일 인증 안내 */
    .verify-box {
      text-align: center; padding: 24px 0 8px;
      display: none;
    }
    .verify-box .verify-icon { font-size: 40px; }
    .verify-box .verify-title { font-size: 17px; font-weight: 700; margin-top: 10px; }
    .verify-box .verify-desc  { font-size: 13px; color: var(--text-2); margin-top: 6px; line-height: 1.6; }
    .verify-box.show { display: block; }

    /* 테마 토글 */
    .theme-toggle-auth {
      position: fixed; top: 16px; right: 16px;
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: 50%; width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; box-shadow: 0 1px 6px rgba(0,0,0,.08);
    }

    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }

    /* 조직 가입 방식 버튼 */
    .org-mode-btn {
      padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
      text-align: center; cursor: pointer; border: 1.5px solid var(--border);
      background: var(--bg); color: var(--text-2); font-family: inherit;
      transition: all .12s; line-height: 1.4;
    }
    .org-mode-btn:hover { border-color: var(--accent); color: var(--accent); }
    .org-mode-btn.active { border-color: var(--accent); background: var(--accent-subtle); color: var(--accent); }
  </style>
</head>
<body>

  <button class="theme-toggle-auth" id="themeToggle" title="다크모드">🌙</button>

  <div class="auth-wrap">
    <!-- 브랜드 -->
    <div class="auth-brand">
      <div class="auth-brand-icon">🛡️</div>
      <div class="auth-brand-title">BCMS Portal</div>
      <div class="auth-brand-sub">ISO 22301 업무연속성경영 포털</div>
    </div>

    <!-- 카드 -->
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">로그인</button>
        <button class="auth-tab"        id="tabSignup" onclick="switchTab('signup')">회원가입</button>
      </div>

      <!-- 로그인 패널 -->
      <div class="auth-panel active" id="panelLogin">
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="loginEmail">이메일</label>
            <input class="form-input" id="loginEmail" type="email" placeholder="company@example.com" required autocomplete="email"/>
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPw">비밀번호</label>
            <input class="form-input" id="loginPw" type="password" placeholder="비밀번호 입력" required autocomplete="current-password"/>
          </div>
          <button class="btn-primary" id="loginBtn" type="submit">로그인</button>
          <div class="alert error" id="loginError"></div>
        </form>
      </div>

      <!-- 회원가입 패널 -->
      <div class="auth-panel" id="panelSignup">
        <div id="signupForm">

          <!-- 조직 가입 방식 선택 -->
          <div class="form-group" id="orgModeGroup">
            <label class="form-label">가입 방식 *</label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
              <button type="button" class="org-mode-btn active" id="modeBtnNew" onclick="setOrgMode('new')">
                🏢 새 조직 만들기<br><span style="font-size:10px;font-weight:400;opacity:.7;">관리자(admin)로 시작</span>
              </button>
              <button type="button" class="org-mode-btn" id="modeBtnInvite" onclick="setOrgMode('invite')">
                🔗 초대 링크로 가입<br><span style="font-size:10px;font-weight:400;opacity:.7;">초대받은 경우 선택</span>
              </button>
            </div>
          </div>

          <!-- 새 조직 필드 (기본 표시) -->
          <div id="newOrgFields">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="signupCompany">회사명 *</label>
                <input class="form-input" id="signupCompany" type="text" placeholder="㈜ 예시 회사"/>
              </div>
              <div class="form-group">
                <label class="form-label" for="signupIndustry">업종 *</label>
                <input class="form-input" id="signupIndustry" type="text" placeholder="제조/금융/IT…"/>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="signupGoal">인증 목표</label>
              <input class="form-input" id="signupGoal" type="text" placeholder="ISO 22301 인증 취득 (선택 사항)"/>
            </div>
          </div>

          <!-- 초대 토큰 필드 (기본 숨김) -->
          <div id="inviteFields" style="display:none;">
            <div class="form-group">
              <label class="form-label" for="inviteToken">초대 토큰 *</label>
              <input class="form-input" id="inviteToken" type="text" placeholder="초대 링크의 토큰을 붙여넣으세요"/>
              <div class="form-hint">초대 링크: auth.html?invite=토큰</div>
            </div>
          </div>

          <div class="divider">계정 정보</div>

          <div class="form-group">
            <label class="form-label" for="signupEmail">이메일 *</label>
            <input class="form-input" id="signupEmail" type="email" placeholder="company@example.com" required autocomplete="email"/>
          </div>
          <div class="form-group">
            <label class="form-label" for="signupPw">비밀번호 *</label>
            <input class="form-input" id="signupPw" type="password" placeholder="8자 이상" required autocomplete="new-password" minlength="8"/>
            <div class="form-hint">영문, 숫자 조합 8자 이상</div>
          </div>
          <div class="form-group">
            <label class="form-label" for="signupPw2">비밀번호 확인 *</label>
            <input class="form-input" id="signupPw2" type="password" placeholder="비밀번호 재입력" required autocomplete="new-password"/>
          </div>

          <button class="btn-primary" id="signupBtn" type="button" onclick="handleSignup()">회원가입</button>
          <div class="alert error"   id="signupError"></div>
          <div class="alert success" id="signupSuccess"></div>
        </div>

        <!-- 이메일 인증 안내 -->
        <div class="verify-box" id="verifyBox">
          <div class="verify-icon">📧</div>
          <div class="verify-title">이메일을 확인해 주세요</div>
          <div class="verify-desc">
            가입하신 이메일로 인증 링크를 보냈습니다.<br>
            이메일의 링크를 클릭하면 로그인됩니다.
          </div>
        </div>
      </div>
    </div>

    <!-- 푸터 -->
    <div class="auth-footer">
      <a href="privacy.html">개인정보처리방침</a>
      <span class="auth-footer-sep">|</span>
      <a href="terms.html">이용약관</a>
    </div>
  </div>

  <script>
  'use strict';

  const SUPABASE_URL      = 'https://otgqizneyzpwqsgdtwzv.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_owe_kg_7eEE16I51QHOFxA_vo4acx4d';
  const LS_SESSION_KEY    = 'bcms_supabase_session';
  const LS_USER_KEY       = 'bcms_supabase_user';
  const LS_PROFILE_KEY    = 'bcms_user_profile';
  const LS_ORG_KEY        = 'bcms_org';
  const LS_MEMBER_KEY     = 'bcms_org_member';

  let sb          = null;
  let _orgMode    = 'new'; // 'new' | 'invite'
  let _inviteToken = null; // URL ?invite= 파라미터

  // ── 클라이언트 초기화 ─────────────────────────────────────────
  function initClient() {
    if (sb) return sb;
    if (!window.supabase) { alert('Supabase SDK 로드 실패. 네트워크를 확인하세요.'); return null; }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    return sb;
  }

  // ── URL 파라미터에서 초대 토큰 추출 ──────────────────────────
  function parseInviteToken() {
    const params = new URLSearchParams(window.location.search);
    return params.get('invite') || null;
  }

  // ── 이미 로그인 중이면 대시보드로 이동 ────────────────────────
  async function checkExistingSession() {
    const client = initClient(); if (!client) return;
    const { data } = await client.auth.getSession();
    if (data?.session) {
      const userId = data.session.user.id;
      localStorage.setItem(LS_SESSION_KEY, JSON.stringify(data.session));
      localStorage.setItem(LS_USER_KEY,    JSON.stringify(data.session.user));

      // 초대 토큰: URL 파라미터 우선, 없으면 이메일 인증 후 sessionStorage 확인
      // (Supabase 이메일 인증 리디렉트 URL에는 ?invite= 파라미터가 없으므로
      //  sessionStorage를 통해 토큰을 전달받아야 함)
      const pendingInvite = _inviteToken || sessionStorage.getItem('bcms_pending_invite');
      if (pendingInvite) {
        await handleInviteAccept(userId, pendingInvite);
      } else {
        // 새 조직 생성 (이메일 인증 완료 후 bcms_pending_org 처리)
        const pendingOrgStr = sessionStorage.getItem('bcms_pending_org');
        if (pendingOrgStr) {
          try {
            const { company, industry, goal } = JSON.parse(pendingOrgStr);
            if (company) await createOrgForUser(userId, company, industry, goal);
            sessionStorage.removeItem('bcms_pending_org');
          } catch (e) { console.warn('[auth] 조직 생성 오류:', e); }
        }
      }

      window.location.href = 'index.html';
    }
  }

  // ── 조직 가입 방식 전환 ───────────────────────────────────────
  function setOrgMode(mode) {
    _orgMode = mode;
    document.getElementById('modeBtnNew').classList.toggle('active',    mode === 'new');
    document.getElementById('modeBtnInvite').classList.toggle('active', mode === 'invite');
    document.getElementById('newOrgFields').style.display    = mode === 'new'    ? '' : 'none';
    document.getElementById('inviteFields').style.display    = mode === 'invite' ? '' : 'none';
  }

  // ── 탭 전환 ──────────────────────────────────────────────────
  function switchTab(tab) {
    document.getElementById('tabLogin').classList.toggle('active',  tab === 'login');
    document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
    document.getElementById('panelLogin').classList.toggle('active',  tab === 'login');
    document.getElementById('panelSignup').classList.toggle('active', tab === 'signup');
    clearAlerts();
  }

  function clearAlerts() {
    ['loginError','signupError','signupSuccess'].forEach(id => {
      const el = document.getElementById(id);
      el.classList.remove('show'); el.textContent = '';
    });
  }

  function showAlert(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg; el.classList.add('show');
  }

  function setLoading(btnId, loading, text) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.innerHTML = loading ? `<span class="spinner"></span>${text}` : text;
  }

  // ── 로그인 ────────────────────────────────────────────────────
  async function handleLogin(e) {
    e.preventDefault();
    clearAlerts();
    const client = initClient(); if (!client) return;

    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPw').value;
    setLoading('loginBtn', true, '로그인 중...');

    const { data, error } = await client.auth.signInWithPassword({ email, password });
    setLoading('loginBtn', false, '로그인');

    if (error) {
      showAlert('loginError',
        error.message.includes('Invalid login credentials') ? '이메일 또는 비밀번호가 올바르지 않습니다.' :
        error.message.includes('Email not confirmed')       ? '이메일 인증이 필요합니다. 메일함을 확인해 주세요.' :
        error.message);
      return;
    }

    if (data?.session) {
      localStorage.setItem(LS_SESSION_KEY, JSON.stringify(data.session));
      localStorage.setItem(LS_USER_KEY,    JSON.stringify(data.user));
      if (_inviteToken) await handleInviteAccept(data.user.id, _inviteToken);
      await loadProfileAndSync(data.user.id);
      window.location.href = 'index.html';
    }
  }

  // ── 회원가입 에러 메시지 번역 ────────────────────────────────
  function translateSignupError(msg) {
    if (!msg) return '알 수 없는 오류가 발생했습니다.';
    if (msg.includes('already registered') || msg.includes('User already registered'))
      return '이미 가입된 이메일입니다. 로그인해 주세요.';
    if (msg.includes('Password should be at least') || msg.includes('password'))
      return '비밀번호는 8자 이상 영문·숫자 조합이어야 합니다.';
    if (msg.includes('Unable to validate email') || msg.includes('invalid format'))
      return '유효하지 않은 이메일 형식입니다.';
    if (msg.includes('For security purposes') || msg.includes('rate limit') || msg.includes('after 60'))
      return '잠시 후 다시 시도해 주세요. (요청 제한)';
    if (msg.includes('Signup is disabled'))
      return '현재 회원가입이 비활성화되어 있습니다.';
    if (msg.includes('Email address') && msg.includes('not authorized'))
      return '허용되지 않은 이메일 주소입니다.';
    if (msg.includes('Network') || msg.includes('fetch'))
      return '네트워크 오류가 발생했습니다. 인터넷 연결을 확인해 주세요.';
    return msg;
  }

  // ── 회원가입 ──────────────────────────────────────────────────
  async function handleSignup() {
    clearAlerts();
    const client = initClient(); if (!client) return;

    const email = document.getElementById('signupEmail').value.trim();
    const pw    = document.getElementById('signupPw').value;
    const pw2   = document.getElementById('signupPw2').value;

    if (!email || !pw) { showAlert('signupError', '이메일과 비밀번호를 입력해 주세요.'); return; }
    if (pw !== pw2)    { showAlert('signupError', '비밀번호가 일치하지 않습니다.'); return; }
    if (pw.length < 8) { showAlert('signupError', '비밀번호는 8자 이상이어야 합니다.'); return; }

    let company = '', industry = '', goal = '', inviteToken = '';

    if (_orgMode === 'new') {
      company  = document.getElementById('signupCompany').value.trim();
      industry = document.getElementById('signupIndustry').value.trim();
      goal     = document.getElementById('signupGoal').value.trim();
      if (!company || !industry) { showAlert('signupError', '회사명과 업종을 입력해 주세요.'); return; }
    } else {
      inviteToken = (document.getElementById('inviteToken').value.trim()) || _inviteToken || '';
      if (!inviteToken) { showAlert('signupError', '초대 토큰을 입력해 주세요.'); return; }
    }

    setLoading('signupBtn', true, '가입 처리 중...');

    try {
      const { data, error } = await client.auth.signUp({
        email, password: pw,
        options: { data: { company_name: company, industry, certification_goal: goal } }
      });

      if (error) {
        showAlert('signupError', translateSignupError(error.message));
        return;
      }

      if (!data?.user) {
        showAlert('signupError', '회원가입 처리 중 오류가 발생했습니다. 다시 시도해 주세요.');
        return;
      }

      // Supabase 이메일 열거 방지: 이미 가입된 이메일은 error 없이 identities:[] 반환
      if (Array.isArray(data.user.identities) && data.user.identities.length === 0) {
        showAlert('signupError', '이미 가입된 이메일입니다. 로그인해 주세요.');
        return;
      }

      if (!data.session) {
        // 이메일 인증 필요 → 인증 후 로그인 시 조직 처리됨
        if (_orgMode === 'new' && company) {
          sessionStorage.setItem('bcms_pending_org', JSON.stringify({ company, industry, goal }));
        } else if (inviteToken) {
          sessionStorage.setItem('bcms_pending_invite', inviteToken);
        }
        // verifyBox에 실제 이메일 주소 표시
        const vDesc = document.querySelector('#verifyBox .verify-desc');
        if (vDesc) vDesc.innerHTML =
          `<strong>${email}</strong>으로 인증 링크를 보냈습니다.<br>` +
          `메일함을 확인하고 링크를 클릭하면 로그인됩니다.<br>` +
          `<span style="font-size:12px;opacity:.7;margin-top:6px;display:block;">스팸·프로모션 폴더도 확인해 주세요.</span>`;
        document.getElementById('signupForm').style.display = 'none';
        document.getElementById('verifyBox').classList.add('show');
      } else {
        // 즉시 로그인됨 (이메일 인증 비활성화 시)
        localStorage.setItem(LS_SESSION_KEY, JSON.stringify(data.session));
        localStorage.setItem(LS_USER_KEY,    JSON.stringify(data.user));

        await saveProfile(data.user.id, { company_name: company, industry, certification_goal: goal });

        if (_orgMode === 'new' && company) {
          await createOrgForUser(data.user.id, company, industry, goal);
        } else if (inviteToken) {
          await handleInviteAccept(data.user.id, inviteToken);
        }

        if (company)  localStorage.setItem('bcmsCompanyName', company);
        if (industry) localStorage.setItem('bcmsIndustry', industry);
        window.location.href = 'index.html';
      }
    } catch (e) {
      console.error('[auth] 회원가입 오류:', e);
      showAlert('signupError', '네트워크 오류가 발생했습니다. 인터넷 연결을 확인해 주세요.');
    } finally {
      setLoading('signupBtn', false, '회원가입');
    }
  }

  // ── 조직 생성 (신규 가입 admin) ──────────────────────────────
  async function createOrgForUser(userId, name, industry, certGoal) {
    if (!sb) return;
    try {
      const { data: org, error: orgErr } = await sb
        .from('organizations')
        .insert({ name, industry, cert_goal: certGoal, created_by: userId })
        .select().single();
      if (orgErr) { console.error('[auth] 조직 생성 실패:', orgErr); return; }

      await sb.from('org_members')
        .insert({ org_id: org.id, user_id: userId, role: 'admin' });

      await sb.from('bcms_users')
        .upsert({ id: userId, org_id: org.id, updated_at: new Date().toISOString() });

      localStorage.setItem(LS_ORG_KEY,    JSON.stringify(org));
      localStorage.setItem(LS_MEMBER_KEY, JSON.stringify({ org_id: org.id, role: 'admin', department: '' }));
    } catch (e) { console.warn('[auth] 조직 생성 오류:', e); }
  }

  // ── 초대 토큰 수락 ────────────────────────────────────────────
  async function handleInviteAccept(userId, token) {
    if (!sb || !token) return;
    try {
      const { data: inv } = await sb
        .from('org_invitations')
        .select('*')
        .eq('token', token)
        .is('accepted_at', null)
        .gt('expires_at', new Date().toISOString())
        .single();
      if (!inv) { console.warn('[auth] 초대 토큰 유효하지 않음'); return; }

      await sb.from('org_members')
        .upsert({ org_id: inv.org_id, user_id: userId, role: inv.role, department: inv.department, invited_by: inv.invited_by });
      await sb.from('org_invitations')
        .update({ accepted_at: new Date().toISOString() }).eq('id', inv.id);
      await sb.from('bcms_users')
        .upsert({ id: userId, org_id: inv.org_id, updated_at: new Date().toISOString() });

      const { data: org } = await sb.from('organizations').select('*').eq('id', inv.org_id).single();
      if (org) {
        localStorage.setItem(LS_ORG_KEY,    JSON.stringify(org));
        localStorage.setItem(LS_MEMBER_KEY, JSON.stringify({ org_id: inv.org_id, role: inv.role, department: inv.department }));
        if (org.name) localStorage.setItem('bcmsCompanyName', org.name);
      }
      // 초대 가입 사용자는 온보딩 스킵
      localStorage.setItem('bcmsOnboardingDone', 'true');
      sessionStorage.removeItem('bcms_pending_invite');
    } catch (e) { console.warn('[auth] 초대 수락 오류:', e); }
  }

  // ── 프로필 저장 ───────────────────────────────────────────────
  async function saveProfile(userId, profile) {
    if (!sb) return;
    try {
      const { data } = await sb.from('bcms_users')
        .upsert({ id: userId, ...profile, updated_at: new Date().toISOString() })
        .select().single();
      if (data) localStorage.setItem(LS_PROFILE_KEY, JSON.stringify(data));
    } catch (e) { console.warn('[auth] 프로필 저장 실패:', e); }
  }

  // ── 로그인 후 데이터 동기화 ───────────────────────────────────
  async function loadProfileAndSync(userId) {
    if (!sb) return;
    try {
      const { data: profile } = await sb.from('bcms_users').select('*').eq('id', userId).single();
      if (profile) {
        localStorage.setItem(LS_PROFILE_KEY, JSON.stringify(profile));
        if (profile.company_name) localStorage.setItem('bcmsCompanyName', profile.company_name);
        if (profile.industry)     localStorage.setItem('bcmsIndustry',    profile.industry);
      }

      // 조직 멤버십 로드
      const { data: memberRow } = await sb
        .from('org_members')
        .select('org_id, role, department, organizations(id,name,industry,cert_goal,created_by)')
        .eq('user_id', userId)
        .single();
      if (memberRow) {
        localStorage.setItem(LS_ORG_KEY,    JSON.stringify(memberRow.organizations));
        localStorage.setItem(LS_MEMBER_KEY, JSON.stringify({
          org_id: memberRow.org_id, role: memberRow.role, department: memberRow.department
        }));
        if (memberRow.organizations?.name) localStorage.setItem('bcmsCompanyName', memberRow.organizations.name);
        // pending org from email-verify flow
        const pendingOrg    = sessionStorage.getItem('bcms_pending_org');
        const pendingInvite = sessionStorage.getItem('bcms_pending_invite');
        if (!memberRow.org_id && pendingOrg) {
          const { company, industry: ind, goal } = JSON.parse(pendingOrg);
          await createOrgForUser(userId, company, ind, goal);
          sessionStorage.removeItem('bcms_pending_org');
        } else if (!memberRow.org_id && pendingInvite) {
          await handleInviteAccept(userId, pendingInvite);
        }
      }

      // BIA 등 핵심 데이터 로드
      if (!localStorage.getItem('bcmsBIAData')) {
        const orgId = memberRow?.org_id || null;
        for (const t of ['bcms_bia','bcms_risk','bcms_bcp','bcms_training','bcms_audit']) {
          let q = sb.from(t).select('*');
          q = orgId ? q.eq('org_id', orgId) : q.eq('id', userId);
          const { data } = await q.maybeSingle();
          if (!data) continue;
          const keyMap = { bcms_bia:'bcmsBIAData', bcms_risk:'bcmsRiskAssessment', bcms_bcp:'bcmsBCP', bcms_training:'bcmsTrainingData', bcms_audit:'bcmsAuditData' };
          if (data.data != null) localStorage.setItem(keyMap[t], JSON.stringify(data.data));
          if (data.meta != null && t === 'bcms_bcp') localStorage.setItem('bcmsBCPMeta', JSON.stringify(data.meta));
        }
      }
    } catch (e) { console.warn('[auth] 데이터 동기화 실패:', e); }
  }

  // ── 테마 ──────────────────────────────────────────────────────
  const root  = document.documentElement;
  const tog   = document.getElementById('themeToggle');
  const saved = localStorage.getItem('bcmsTheme') || 'light';
  root.setAttribute('data-theme', saved);
  tog.textContent = saved === 'dark' ? '☀️' : '🌙';
  tog.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    tog.textContent = next === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('bcmsTheme', next);
  });

  // ── 초기화 ───────────────────────────────────────────────────
  _inviteToken = parseInviteToken();
  if (_inviteToken) {
    // 초대 링크로 접속 → 회원가입 탭 + 초대 모드 자동 선택
    switchTab('signup');
    setOrgMode('invite');
    document.getElementById('inviteToken').value = _inviteToken;
  }
  checkExistingSession();
  </script>
</body>
</html>
