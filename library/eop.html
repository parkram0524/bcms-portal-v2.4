<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BCMS - 비상대응절차서 (EOP)</title>
<link rel="stylesheet" href="../assets/style.css"/>
<style>
  html, body { overflow-x: hidden; max-width: 100%; }
  .main { overflow-x: hidden; min-width: 0; }
  .wrap { max-width: 1000px; margin: 0 auto; overflow-x: hidden; }

  /* ── 버튼 ── */
  .btn {
    padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); text-decoration: none; white-space: nowrap;
    transition: background .15s; display: inline-block;
  }
  .btn:hover { background: var(--surface-hover); }
  .btn.primary { background: var(--accent,#0070f3); color:#fff; border-color: var(--accent,#0070f3); }
  .btn.primary:hover { opacity:.88; }
  .btn.sm { padding: 4px 10px; font-size: 12px; }
  .btn.danger { border-color:#dc2626; color:#dc2626; }
  .btn.danger:hover { background:#fef2f2; }
  [data-theme="dark"] .btn.danger:hover { background:#2a0000; }

  /* ── 헤더 ── */
  .pageHeader {
    display: flex; align-items: flex-start; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
  }
  .pageHeader h1 { font-size: 22px; font-weight: 700; margin: 0; }
  .headerBtns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* ── 메타 카드 ── */
  .metaCard {
    border: 0.5px solid var(--border); border-radius: 12px;
    background: var(--surface); padding: 16px 20px; margin-bottom: 16px;
  }
  .metaCard h3 { font-size: 13px; font-weight: 700; margin: 0 0 12px 0; color: var(--text-2); }
  .metaGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 700px) { .metaGrid { grid-template-columns: 1fr 1fr; } }
  .metaField label { display: block; font-size: 11px; font-weight: 700; color: var(--text-2); margin-bottom: 3px; }
  .metaField input {
    width: 100%; box-sizing: border-box; padding: 6px 8px;
    border-radius: 7px; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 13px; outline: none; font-family: inherit;
  }
  .metaField input:focus { border-color: var(--accent,#0070f3); }

  /* ── accordion ── */
  .section {
    border: 0.5px solid var(--border); border-radius: 12px;
    background: var(--surface); margin-bottom: 10px; overflow: hidden;
  }
  .sectionHead {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 18px; cursor: pointer;
    border-left: 3px solid var(--accent,#0070f3);
    background: var(--surface-hover); user-select: none;
  }
  .sectionHead:hover { filter: brightness(1.03); }
  .sectionTitle { font-size: 14px; font-weight: 800; color: var(--text); }
  .sectionMeta  { font-size: 11px; color: var(--text-2); margin-left: 8px; }
  .sectionLeft  { display: flex; align-items: center; gap: 4px; }
  .sectionRight { display: flex; align-items: center; gap: 8px; }
  .chevron { font-size: 12px; color: var(--text-2); transition: transform .2s; }
  .chevron.open { transform: rotate(180deg); }

  .sectionBody { display: none; padding: 16px 18px; }
  .sectionBody.open { display: block; }

  /* 자동생성 영역 */
  .autoArea {
    background: rgba(0,112,243,.03); border: 0.5px solid rgba(0,112,243,.15);
    border-radius: 8px; padding: 12px; margin-bottom: 10px;
  }
  [data-theme="dark"] .autoArea { background: rgba(0,112,243,.06); }
  .autoLabel {
    font-size: 11px; font-weight: 700; color: var(--accent,#0070f3);
    margin-bottom: 8px;
  }

  /* ── 테이블 ── */
  .tableWrap { overflow-x: auto; }
  table.doc {
    width: 100%; border-collapse: collapse; font-size: 13px; min-width: 500px;
  }
  table.doc th {
    text-align: left; font-size: 11px; font-weight: 700; color: var(--text-2);
    padding: 7px 10px; border-bottom: 1px solid var(--border);
    white-space: nowrap; background: var(--surface);
  }
  table.doc td {
    padding: 7px 10px; border-bottom: 1px solid var(--border);
    color: var(--text); vertical-align: middle; line-height: 1.4;
  }
  table.doc tr:last-child td { border-bottom: none; }
  .emptyRow td { text-align: center; color: var(--text-2); padding: 18px !important; }

  /* 인라인 입력 */
  .cellInput, .cellSel {
    width: 100%; box-sizing: border-box; padding: 5px 7px;
    border-radius: 6px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-size: 12px; outline: none; font-family: inherit;
  }
  .cellInput:focus, .cellSel:focus { border-color: var(--accent,#0070f3); }
  .cellTa {
    width: 100%; box-sizing: border-box; padding: 5px 7px;
    border-radius: 6px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-size: 12px; outline: none; font-family: inherit;
    resize: vertical; min-height: 48px;
  }
  .cellTa:focus { border-color: var(--accent,#0070f3); }

  /* textarea */
  .sectionTa {
    width: 100%; box-sizing: border-box; padding: 10px 12px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 13px; outline: none; font-family: inherit;
    resize: vertical; line-height: 1.6;
  }
  .sectionTa:focus { border-color: var(--accent,#0070f3); }

  /* ── 체크리스트 ── */
  .checkList { display: flex; flex-direction: column; gap: 6px; }
  .checkItem {
    display: grid;
    grid-template-columns: 24px 1fr 130px 110px 40px;
    gap: 8px; align-items: center;
    padding: 7px 10px; border-radius: 8px;
    border: 0.5px solid var(--border); background: var(--bg);
  }
  @media (max-width: 700px) { .checkItem { grid-template-columns: 24px 1fr 40px; } }
  .checkItem input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
  .checkHead {
    display: grid;
    grid-template-columns: 24px 1fr 130px 110px 40px;
    gap: 8px; padding: 4px 10px;
    font-size: 11px; font-weight: 700; color: var(--text-2);
  }
  @media (max-width: 700px) { .checkHead { display: none; } }

  /* ── 시나리오 카드 ── */
  .scenarioList { display: flex; flex-direction: column; gap: 10px; }
  .scenarioCard {
    border: 0.5px solid var(--border); border-radius: 10px;
    background: var(--bg); padding: 14px;
  }
  .scenarioCardHead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .scenarioNum {
    width: 24px; height: 24px; border-radius: 999px; flex-shrink: 0;
    background: #dc2626; color: #fff;
    font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .scenarioGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 640px) { .scenarioGrid { grid-template-columns: 1fr; } }
  .scField label { display: block; font-size: 11px; font-weight: 700; color: var(--text-2); margin-bottom: 3px; }
  .scField input, .scField textarea {
    width: 100%; box-sizing: border-box; padding: 6px 8px;
    border-radius: 7px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-size: 12px; outline: none; font-family: inherit;
  }
  .scField textarea { resize: vertical; min-height: 64px; }
  .scField input:focus, .scField textarea:focus { border-color: var(--accent,#0070f3); }
  .scField.full { grid-column: 1 / -1; }

  /* ── 행 추가 버튼 ── */
  .addRowBtn {
    display: flex; align-items: center; gap: 6px; margin-top: 8px;
    font-size: 12px; font-weight: 600; color: var(--accent,#0070f3);
    cursor: pointer; border: none; background: none; padding: 4px 0;
  }
  .addRowBtn:hover { opacity: .75; }

  /* ── 토스트 ── */
  .toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 999;
    padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 700;
    background: #16a34a; color: #fff; opacity: 0; pointer-events: none;
    transition: opacity .3s;
  }
  .toast.show { opacity: 1; }

  /* ── 인쇄 ── */
  @media print {
    aside, .headerBtns, .sectionRight button, .addRowBtn,
    #themeToggle, .btn { display: none !important; }
    html, body { background: #fff !important; color: #000 !important; overflow: visible !important; }
    .main { padding: 0 !important; }
    .wrap { max-width: 100% !important; padding: 0 12px !important; }
    .section { border: 1px solid #ccc !important; break-inside: avoid; margin-bottom: 12px !important; }
    .sectionBody { display: block !important; }
    .sectionHead { background: #f5f5f5 !important; }
    .metaCard { border: 1px solid #ccc !important; }
    table.doc th, table.doc td { border-color: #ccc !important; }
    .autoArea { background: #f9f9f9 !important; border-color: #ccc !important; }
    .cellInput, .cellSel, .cellTa, .sectionTa,
    .scField input, .scField textarea { border: 1px solid #ccc !important; background: #fff !important; color: #000 !important; }
    .checkItem { border-color: #ccc !important; background: #fff !important; }
    @page { size: A4; margin: 15mm; }
  }

  @media (max-width: 640px) {
    .pageHeader { flex-direction: column; }
    .headerBtns { width: 100%; }
  }
</style>
</head>
<body>
<aside id="sidebarMount"></aside>
<main class="main">
<div class="wrap">

  <!-- 헤더 -->
  <div class="pageHeader">
    <h1>🚨 비상대응절차서 (EOP)</h1>
    <div class="headerBtns">
      <button class="btn primary" id="btnSave">💾 저장</button>
      <button class="btn" onclick="window.print()">🖨️ 인쇄</button>
      <a href="./index.html" class="btn">← 라이브러리</a>
      <button id="themeToggle" class="btn">🌙 다크모드</button>
    </div>
  </div>

  <!-- 메타 -->
  <div class="metaCard">
    <h3>📌 문서 정보</h3>
    <div class="metaGrid">
      <div class="metaField"><label>문서번호</label><input type="text" id="metaDocNo" placeholder="EOP-2026-001"/></div>
      <div class="metaField"><label>버전</label><input type="text" id="metaVersion" placeholder="v1.0"/></div>
      <div class="metaField"><label>작성일</label><input type="date" id="metaCreated"/></div>
      <div class="metaField"><label>검토일</label><input type="date" id="metaReview"/></div>
      <div class="metaField"><label>작성자</label><input type="text" id="metaAuthor" placeholder="작성자명"/></div>
      <div class="metaField"><label>승인자</label><input type="text" id="metaApprover" placeholder="승인자명"/></div>
    </div>
  </div>

  <!-- 섹션1: 목적 및 적용범위 -->
  <div class="section" id="sec1">
    <div class="sectionHead" onclick="toggleSec('sec1')">
      <div class="sectionLeft"><span class="sectionTitle">1. 목적 및 적용범위</span></div>
      <div class="sectionRight"><span class="chevron open" id="chev-sec1">▼</span></div>
    </div>
    <div class="sectionBody open" id="body-sec1">
      <textarea class="sectionTa" id="sec1Text" rows="5"
        placeholder="이 절차서의 목적과 적용 범위를 기술하세요.&#10;&#10;예) 본 절차서는 자연재해, IT 시스템 장애, 화재·폭발, 전력 중단 등 비상상황 발생 시 초기 대응절차를 규정하여 피해를 최소화하고 신속한 복구를 지원하기 위해 작성되었습니다."></textarea>
    </div>
  </div>

  <!-- 섹션2: 비상상황 유형 및 발동기준 -->
  <div class="section" id="sec2">
    <div class="sectionHead" onclick="toggleSec('sec2')">
      <div class="sectionLeft">
        <span class="sectionTitle">2. 비상상황 유형 및 발동기준</span>
        <span class="sectionMeta" id="sec2meta"></span>
      </div>
      <div class="sectionRight">
        <button class="btn sm" onclick="event.stopPropagation();loadActivation()">자동 로드</button>
        <span class="chevron open" id="chev-sec2">▼</span>
      </div>
    </div>
    <div class="sectionBody open" id="body-sec2">
      <div class="tableWrap" id="sec2table"></div>
      <button class="addRowBtn" onclick="addActivationRow()">＋ 행 추가</button>
    </div>
  </div>

  <!-- 섹션3: 초기 대응 체크리스트 -->
  <div class="section" id="sec3">
    <div class="sectionHead" onclick="toggleSec('sec3')">
      <div class="sectionLeft"><span class="sectionTitle">3. 초기 대응 체크리스트</span></div>
      <div class="sectionRight">
        <button class="btn sm" onclick="event.stopPropagation();addCheckItem()">＋ 항목 추가</button>
        <span class="chevron open" id="chev-sec3">▼</span>
      </div>
    </div>
    <div class="sectionBody open" id="body-sec3">
      <div class="checkHead">
        <span></span><span>행동 내용</span><span>담당 역할</span><span>시간 기준</span><span></span>
      </div>
      <div class="checkList" id="checkList"></div>
    </div>
  </div>

  <!-- 섹션4: 비상조직 역할 및 책임 -->
  <div class="section" id="sec4">
    <div class="sectionHead" onclick="toggleSec('sec4')">
      <div class="sectionLeft">
        <span class="sectionTitle">4. 비상조직 역할 및 책임</span>
        <span class="sectionMeta" id="sec4meta"></span>
      </div>
      <div class="sectionRight">
        <button class="btn sm" onclick="event.stopPropagation();loadOrgRegistry()">담당자 관리에서 로드</button>
        <span class="chevron open" id="chev-sec4">▼</span>
      </div>
    </div>
    <div class="sectionBody open" id="body-sec4">
      <div class="tableWrap" id="sec4table"></div>
      <button class="addRowBtn" onclick="addOrgRow()">＋ 행 추가</button>
    </div>
  </div>

  <!-- 섹션5: 상황별 대응 시나리오 -->
  <div class="section" id="sec5">
    <div class="sectionHead" onclick="toggleSec('sec5')">
      <div class="sectionLeft"><span class="sectionTitle">5. 상황별 대응 시나리오</span></div>
      <div class="sectionRight">
        <button class="btn sm" onclick="event.stopPropagation();loadTrainingScenarios()">훈련 시나리오 불러오기</button>
        <button class="btn sm" onclick="event.stopPropagation();addScenario()">＋ 시나리오 추가</button>
        <span class="chevron open" id="chev-sec5">▼</span>
      </div>
    </div>
    <div class="sectionBody open" id="body-sec5">
      <div class="scenarioList" id="scenarioList"></div>
    </div>
  </div>

  <!-- 섹션6: 커뮤니케이션 절차 -->
  <div class="section" id="sec6">
    <div class="sectionHead" onclick="toggleSec('sec6')">
      <div class="sectionLeft"><span class="sectionTitle">6. 커뮤니케이션 절차</span></div>
      <div class="sectionRight">
        <span class="chevron open" id="chev-sec6">▼</span>
      </div>
    </div>
    <div class="sectionBody open" id="body-sec6">
      <div class="tableWrap" id="sec6table"></div>
      <button class="addRowBtn" onclick="addCommRow()">＋ 행 추가</button>
    </div>
  </div>

  <!-- 섹션7: 문서 이력 -->
  <div class="section" id="sec7">
    <div class="sectionHead" onclick="toggleSec('sec7')">
      <div class="sectionLeft"><span class="sectionTitle">7. 문서 이력</span></div>
      <div class="sectionRight"><span class="chevron open" id="chev-sec7">▼</span></div>
    </div>
    <div class="sectionBody open" id="body-sec7">
      <div class="tableWrap" id="sec7table"></div>
      <button class="addRowBtn" onclick="addHistRow()">＋ 이력 추가</button>
    </div>
  </div>

</div>
</main>
<div class="toast" id="toast"></div>

<script src="../assets/sidebar.js"></script>
<script>
(function () {
  'use strict';

  const KEY_DOC  = 'bcmsEOPDoc';
  const KEY_META = 'bcmsEOPMeta';

  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const $ = id => document.getElementById(id);

  function load(key, def) {
    try { const v = localStorage.getItem(key); if (!v) return def; return JSON.parse(v) ?? def; }
    catch { return def; }
  }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
  function arr(v) { return Array.isArray(v) ? v : []; }

  function todayStr() { return new Date().toISOString().split('T')[0]; }

  /* ── 토스트 ── */
  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg ?? '✓ 저장되었습니다';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  /* ── accordion ── */
  window.toggleSec = function (id) {
    const body = $('body-' + id);
    const chev = $('chev-' + id);
    if (!body) return;
    const open = body.classList.contains('open');
    body.classList.toggle('open', !open);
    if (chev) chev.classList.toggle('open', !open);
  };

  /* ── 재난 유형 옵션 ── */
  const DISASTER_TYPES = ['자연재해','화재·폭발','IT시스템장애','전력중단','공급망차단','인력부재','기타'];
  function disasterSel(val) {
    return `<select class="cellSel" data-field="disasterType">
      ${DISASTER_TYPES.map(t => `<option${val === t ? ' selected' : ''}>${t}</option>`).join('')}
    </select>`;
  }

  /* ── 상태 ── */
  let state = {
    sec1Text:        '',
    activationRows:  [],
    checkItems:      [],
    orgRows:         [],
    scenarios:       [],
    commRows:        [],
    histRows:        [],
  };

  /* ── 기본 체크리스트 ── */
  const DEFAULT_CHECKS = [
    { action: '비상상황 인지 및 상황 파악',        role: '최초 발견자',       time: '5분 이내' },
    { action: '초기 피해 규모 확인',               role: '현장 책임자',       time: '10분 이내' },
    { action: '비상대응팀장에게 보고',              role: '현장 책임자',       time: '10분 이내' },
    { action: 'BCP 발동 여부 판단',                role: '비상대응팀장',      time: '20분 이내' },
    { action: '비상대응팀 소집',                   role: '비상대응팀장',      time: '30분 이내' },
    { action: '이해관계자 초기 공지',              role: '커뮤니케이션 담당',  time: '1시간 이내' },
    { action: '대체 운영 체계 확인',               role: 'IT/운영 담당',      time: '1시간 이내' },
    { action: '외부 기관 신고/연락 (필요시)',       role: '담당 부서장',       time: '필요시 즉시' },
    { action: '피해 현황 1차 기록',                role: '비상대응팀 서기',   time: '30분 이내' },
    { action: '30분 단위 상황 업데이트 시작',      role: '비상대응팀장',      time: '지속' },
  ];

  /* ── 기본 커뮤니케이션 ── */
  const DEFAULT_COMM = [
    { target:'경영진',      timing:'즉시',        method:'전화+문자',    owner:'비상대응팀장',   template:'' },
    { target:'전 직원',     timing:'1시간 이내',   method:'사내 공지',    owner:'커뮤니케이션 담당', template:'' },
    { target:'고객/파트너', timing:'2시간 이내',   method:'이메일+전화',  owner:'대외협력 담당',  template:'' },
    { target:'관계기관',    timing:'필요시',       method:'공문+전화',    owner:'담당 부서장',    template:'' },
    { target:'미디어',      timing:'필요시',       method:'공식 보도자료', owner:'CEO/홍보팀',    template:'' },
  ];

  /* ── 불러오기 ── */
  function loadDoc() {
    const doc  = load(KEY_DOC, null);
    const meta = load(KEY_META, {});

    $('metaDocNo').value    = meta.docNo     ?? '';
    $('metaVersion').value  = meta.version   ?? '';
    $('metaCreated').value  = meta.created   ?? '';
    $('metaReview').value   = meta.review    ?? '';
    $('metaAuthor').value   = meta.author    ?? '';
    $('metaApprover').value = meta.approver  ?? '';

    if (doc) {
      state.sec1Text       = doc.sec1Text       ?? '';
      state.activationRows = arr(doc.activationRows);
      state.checkItems     = arr(doc.checkItems).length > 0 ? arr(doc.checkItems) : DEFAULT_CHECKS.map(c => ({ ...c, checked: false }));
      state.orgRows        = arr(doc.orgRows);
      state.scenarios      = arr(doc.scenarios);
      state.commRows       = arr(doc.commRows).length > 0 ? arr(doc.commRows) : DEFAULT_COMM.map(c => ({ ...c }));
      state.histRows       = arr(doc.histRows);
    } else {
      state.checkItems = DEFAULT_CHECKS.map(c => ({ ...c, checked: false }));
      state.commRows   = DEFAULT_COMM.map(c => ({ ...c }));
    }

    $('sec1Text').value = state.sec1Text;
  }

  /* ── 저장 ── */
  function saveAll() {
    collectState();
    const meta = {
      docNo:    $('metaDocNo').value.trim(),
      version:  $('metaVersion').value.trim(),
      created:  $('metaCreated').value,
      review:   $('metaReview').value,
      author:   $('metaAuthor').value.trim(),
      approver: $('metaApprover').value.trim(),
      updatedAt: todayStr(), savedAt: todayStr(),
    };
    save(KEY_META, meta);
    save(KEY_DOC, { ...state });
    showToast('✓ 저장되었습니다');
  }

  function collectState() {
    state.sec1Text       = $('sec1Text').value;
    state.activationRows = collectTableRows('sec2table', ['disasterType','condition','authority','responseTime']);
    state.checkItems     = collectCheckItems();
    state.orgRows        = collectTableRows('sec4table', ['role','name','duties','contact']);
    state.scenarios      = collectScenarios();
    state.commRows       = collectTableRows('sec6table', ['target','timing','method','owner','template']);
    state.histRows       = collectTableRows('sec7table', ['version','date','editor','summary']);
  }

  function collectTableRows(tableId, fields) {
    const rows = [];
    const tbody = $(tableId)?.querySelector('tbody');
    if (!tbody) return rows;
    tbody.querySelectorAll('tr').forEach(tr => {
      const obj = {};
      fields.forEach(f => {
        const el = tr.querySelector(`[data-field="${f}"]`);
        if (el) obj[f] = el.value ?? '';
      });
      rows.push(obj);
    });
    return rows;
  }

  function collectCheckItems() {
    const items = [];
    $('checkList').querySelectorAll('.checkItem').forEach(item => {
      items.push({
        checked: item.querySelector('input[type="checkbox"]')?.checked ?? false,
        action:  item.querySelector('[data-cf="action"]')?.value  ?? '',
        role:    item.querySelector('[data-cf="role"]')?.value    ?? '',
        time:    item.querySelector('[data-cf="time"]')?.value    ?? '',
      });
    });
    return items;
  }

  function collectScenarios() {
    const items = [];
    $('scenarioList').querySelectorAll('.scenarioCard').forEach(card => {
      items.push({
        name:      card.querySelector('[data-sf="name"]')?.value     ?? '',
        trigger:   card.querySelector('[data-sf="trigger"]')?.value  ?? '',
        actions:   card.querySelector('[data-sf="actions"]')?.value  ?? '',
        rto:       card.querySelector('[data-sf="rto"]')?.value      ?? '',
      });
    });
    return items;
  }

  /* ── 섹션2: 발동기준 ── */
  function renderActivation() {
    const wrap = $('sec2table');
    let html = `<table class="doc">
      <thead><tr>
        <th style="width:130px">재난 유형</th>
        <th>발동 기준 조건</th>
        <th style="width:110px">발동 권한자</th>
        <th style="width:110px">초기 대응 목표</th>
        <th style="width:44px"></th>
      </tr></thead><tbody>`;
    if (state.activationRows.length === 0) {
      html += `<tr class="emptyRow"><td colspan="5">행을 추가하거나 자동 로드 버튼을 누르세요</td></tr>`;
    } else {
      state.activationRows.forEach((r, i) => { html += activationRowHtml(r, i); });
    }
    html += `</tbody></table>`;
    wrap.innerHTML = html;
    $('sec2meta').textContent = state.activationRows.length > 0 ? `(${state.activationRows.length}건)` : '';
  }

  function activationRowHtml(r, i) {
    return `<tr>
      <td>${disasterSel(r.disasterType ?? '자연재해')}</td>
      <td><input class="cellInput" data-field="condition"    value="${esc(r.condition ?? '')}"    placeholder="구체적 발동 조건"/></td>
      <td><input class="cellInput" data-field="authority"    value="${esc(r.authority ?? '')}"    placeholder="권한자"/></td>
      <td><input class="cellInput" data-field="responseTime" value="${esc(r.responseTime ?? '')}" placeholder="예: 15분"/></td>
      <td><button class="btn sm danger" onclick="delActivationRow(${i})">✕</button></td>
    </tr>`;
  }

  window.loadActivation = function () {
    const data = arr(load('bcmsActivationProc', []));
    if (data.length > 0) {
      state.activationRows = data.map(r => ({
        disasterType: r.type ?? r.triggerType ?? r.conditionType ?? '기타',
        condition:    r.condition ?? r.detail ?? r.description ?? '',
        authority:    r.authority ?? r.authorizer ?? '',
        responseTime: r.responseTime ?? r.targetTime ?? '',
      }));
      showToast(`${data.length}건 로드됨`);
    } else {
      showToast('bcmsActivationProc 데이터 없음');
    }
    renderActivation();
  };

  window.addActivationRow = function () {
    collectState();
    state.activationRows.push({ disasterType:'기타', condition:'', authority:'', responseTime:'' });
    renderActivation();
  };

  window.delActivationRow = function (i) {
    collectState();
    state.activationRows.splice(i, 1);
    renderActivation();
  };

  /* ── 섹션3: 체크리스트 ── */
  function renderCheckList() {
    $('checkList').innerHTML = state.checkItems.map((c, i) => checkItemHtml(c, i)).join('');
  }

  function checkItemHtml(c, i) {
    return `<div class="checkItem" data-ci="${i}">
      <input type="checkbox" ${c.checked ? 'checked' : ''}
        onchange="toggleCheck(${i},this.checked)"/>
      <input class="cellInput" data-cf="action" value="${esc(c.action)}" placeholder="행동 내용"/>
      <input class="cellInput" data-cf="role"   value="${esc(c.role)}"   placeholder="담당 역할"/>
      <input class="cellInput" data-cf="time"   value="${esc(c.time)}"   placeholder="시간 기준"/>
      <button class="btn sm danger" onclick="delCheckItem(${i})">✕</button>
    </div>`;
  }

  window.toggleCheck = function (i, checked) {
    collectState();
    if (state.checkItems[i]) state.checkItems[i].checked = checked;
  };

  window.addCheckItem = function () {
    collectState();
    state.checkItems.push({ checked: false, action:'', role:'', time:'' });
    renderCheckList();
  };

  window.delCheckItem = function (i) {
    collectState();
    state.checkItems.splice(i, 1);
    renderCheckList();
  };

  /* ── 섹션4: 비상조직 ── */
  function renderOrg() {
    const wrap = $('sec4table');
    let html = `<table class="doc">
      <thead><tr>
        <th style="width:120px">역할명</th>
        <th style="width:100px">담당자</th>
        <th>주요 책임</th>
        <th style="width:130px">비상연락처</th>
        <th style="width:44px"></th>
      </tr></thead><tbody>`;
    if (state.orgRows.length === 0) {
      html += `<tr class="emptyRow"><td colspan="5">행을 추가하거나 담당자 관리에서 로드하세요</td></tr>`;
    } else {
      state.orgRows.forEach((r, i) => { html += orgRowHtml(r, i); });
    }
    html += `</tbody></table>`;
    wrap.innerHTML = html;
    $('sec4meta').textContent = state.orgRows.length > 0 ? `(${state.orgRows.length}건)` : '';
  }

  function orgRowHtml(r, i) {
    return `<tr>
      <td><input class="cellInput" data-field="role"    value="${esc(r.role ?? '')}"    placeholder="역할명"/></td>
      <td><input class="cellInput" data-field="name"    value="${esc(r.name ?? '')}"    placeholder="성명"/></td>
      <td><input class="cellInput" data-field="duties"  value="${esc(r.duties ?? '')}"  placeholder="주요 책임"/></td>
      <td><input class="cellInput" data-field="contact" value="${esc(r.contact ?? '')}" placeholder="연락처"/></td>
      <td><button class="btn sm danger" onclick="delOrgRow(${i})">✕</button></td>
    </tr>`;
  }

  window.loadOrgRegistry = function () {
    const data = arr(load('bcmsOrgRegistry', []));
    if (data.length > 0) {
      state.orgRows = data.map(r => ({
        role:    r.role ?? r.position ?? r.title ?? '',
        name:    r.name ?? r.memberName ?? '',
        duties:  r.duties ?? r.responsibility ?? r.description ?? '',
        contact: r.phone ?? r.contact ?? r.tel ?? '',
      }));
      showToast(`${data.length}건 로드됨`);
    } else {
      showToast('bcmsOrgRegistry 데이터 없음');
    }
    renderOrg();
  };

  window.addOrgRow = function () {
    collectState();
    state.orgRows.push({ role:'', name:'', duties:'', contact:'' });
    renderOrg();
  };

  window.delOrgRow = function (i) {
    collectState();
    state.orgRows.splice(i, 1);
    renderOrg();
  };

  /* ── 섹션5: 시나리오 ── */
  function renderScenarios() {
    const list = $('scenarioList');
    if (state.scenarios.length === 0) {
      list.innerHTML = `<p style="font-size:13px;color:var(--text-2)">시나리오를 추가하거나 훈련 데이터에서 불러오세요.</p>`;
      return;
    }
    list.innerHTML = state.scenarios.map((s, i) => scenarioCardHtml(s, i)).join('');
  }

  function scenarioCardHtml(s, i) {
    return `<div class="scenarioCard" data-si="${i}">
      <div class="scenarioCardHead">
        <span class="scenarioNum">${i + 1}</span>
        <input style="flex:1;padding:5px 8px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:700;outline:none;font-family:inherit"
          data-sf="name" value="${esc(s.name)}" placeholder="시나리오명 (예: IT 시스템 전면 장애)"/>
        <button class="btn sm danger" onclick="delScenario(${i})">✕</button>
      </div>
      <div class="scenarioGrid">
        <div class="scField">
          <label>발동 조건</label>
          <input data-sf="trigger" value="${esc(s.trigger)}" placeholder="이 시나리오의 발동 조건"/>
        </div>
        <div class="scField">
          <label>복구 목표 시간 (RTO)</label>
          <input data-sf="rto" value="${esc(s.rto)}" placeholder="예: 4시간"/>
        </div>
        <div class="scField full">
          <label>주요 행동 절차</label>
          <textarea data-sf="actions" rows="4" placeholder="시나리오별 단계적 대응 행동을 기술하세요">${esc(s.actions)}</textarea>
        </div>
      </div>
    </div>`;
  }

  window.loadTrainingScenarios = function () {
    const data = arr(load('bcmsTrainingData', []));
    const scenarios = data
      .filter(t => t && (t.scenario || t.name || t.title))
      .map(t => ({
        name:    t.scenario ?? t.name ?? t.title ?? '',
        trigger: t.trigger ?? t.condition ?? '',
        actions: t.actions ?? t.procedure ?? t.description ?? '',
        rto:     t.rto ?? t.targetTime ?? '',
      }));
    if (scenarios.length > 0) {
      collectState();
      scenarios.forEach(s => {
        if (!state.scenarios.some(e => e.name === s.name)) state.scenarios.push(s);
      });
      renderScenarios();
      showToast(`${scenarios.length}건 로드됨`);
    } else {
      showToast('bcmsTrainingData에 시나리오 없음');
    }
  };

  window.addScenario = function () {
    collectState();
    state.scenarios.push({ name:'', trigger:'', actions:'', rto:'' });
    renderScenarios();
  };

  window.delScenario = function (i) {
    collectState();
    state.scenarios.splice(i, 1);
    renderScenarios();
  };

  /* ── 섹션6: 커뮤니케이션 ── */
  function renderComm() {
    const wrap = $('sec6table');
    let html = `<table class="doc">
      <thead><tr>
        <th style="width:100px">대상</th>
        <th style="width:100px">연락 시점</th>
        <th style="width:110px">연락 방법</th>
        <th style="width:120px">담당자</th>
        <th>메시지 템플릿</th>
        <th style="width:44px"></th>
      </tr></thead><tbody>`;
    if (state.commRows.length === 0) {
      html += `<tr class="emptyRow"><td colspan="6">행을 추가하세요</td></tr>`;
    } else {
      state.commRows.forEach((r, i) => { html += commRowHtml(r, i); });
    }
    html += `</tbody></table>`;
    wrap.innerHTML = html;
  }

  function commRowHtml(r, i) {
    return `<tr>
      <td><input class="cellInput" data-field="target"   value="${esc(r.target ?? '')}"   placeholder="대상"/></td>
      <td><input class="cellInput" data-field="timing"   value="${esc(r.timing ?? '')}"   placeholder="연락 시점"/></td>
      <td><input class="cellInput" data-field="method"   value="${esc(r.method ?? '')}"   placeholder="연락 방법"/></td>
      <td><input class="cellInput" data-field="owner"    value="${esc(r.owner ?? '')}"    placeholder="담당자"/></td>
      <td><input class="cellInput" data-field="template" value="${esc(r.template ?? '')}" placeholder="메시지 템플릿 (선택)"/></td>
      <td><button class="btn sm danger" onclick="delCommRow(${i})">✕</button></td>
    </tr>`;
  }

  window.addCommRow = function () {
    collectState();
    state.commRows.push({ target:'', timing:'', method:'', owner:'', template:'' });
    renderComm();
  };

  window.delCommRow = function (i) {
    collectState();
    state.commRows.splice(i, 1);
    renderComm();
  };

  /* ── 섹션7: 문서 이력 ── */
  function renderHist() {
    const wrap = $('sec7table');
    let html = `<table class="doc">
      <thead><tr>
        <th style="width:80px">버전</th>
        <th style="width:110px">수정일</th>
        <th style="width:100px">수정자</th>
        <th>수정 내용</th>
        <th style="width:44px"></th>
      </tr></thead><tbody>`;
    if (state.histRows.length === 0) {
      html += `<tr class="emptyRow"><td colspan="5">이력을 추가하세요</td></tr>`;
    } else {
      state.histRows.forEach((r, i) => { html += histRowHtml(r, i); });
    }
    html += `</tbody></table>`;
    wrap.innerHTML = html;
  }

  function histRowHtml(r, i) {
    return `<tr>
      <td><input class="cellInput" data-field="version" value="${esc(r.version ?? '')}" placeholder="v1.0"/></td>
      <td><input class="cellInput" type="date" data-field="date" value="${esc(r.date ?? '')}"/></td>
      <td><input class="cellInput" data-field="editor"  value="${esc(r.editor ?? '')}"  placeholder="수정자"/></td>
      <td><input class="cellInput" data-field="summary" value="${esc(r.summary ?? '')}" placeholder="수정 내용"/></td>
      <td><button class="btn sm danger" onclick="delHistRow(${i})">✕</button></td>
    </tr>`;
  }

  window.addHistRow = function () {
    collectState();
    state.histRows.push({ version:'', date: todayStr(), editor:'', summary:'' });
    renderHist();
  };

  window.delHistRow = function (i) {
    collectState();
    state.histRows.splice(i, 1);
    renderHist();
  };

  /* ── 저장 버튼 ── */
  $('btnSave').addEventListener('click', saveAll);

  /* ── 다크모드 ── */
  const htmlEl = document.documentElement;
  const themeBtn = $('themeToggle');
  function applyTheme(t) {
    htmlEl.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'dark' ? '☀️ 라이트모드' : '🌙 다크모드';
    try { localStorage.setItem('bcmsTheme', t); } catch {}
  }
  try { const s = localStorage.getItem('bcmsTheme'); if (s) applyTheme(s); } catch {}
  themeBtn.addEventListener('click', () =>
    applyTheme(htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark')
  );

  /* ── 초기 렌더 ── */
  loadDoc();
  loadActivation();
  renderActivation();
  renderCheckList();
  renderOrg();
  renderScenarios();
  renderComm();
  renderHist();

})();
</script>
</body>
</html>
