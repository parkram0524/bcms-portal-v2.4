<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>BCMS Portal - 대시보드</title>
  <link rel="stylesheet" href="assets/style.css"/>
  <style>
    .wrap { max-width: 1280px; margin: 0 auto; }

    /* ── Header ── */
    .dashHeader {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--r); padding: 20px 24px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .dashHeaderLeft { display: flex; flex-direction: column; gap: 6px; }
    .dashTitle {
      font-size: 28px; font-weight: 800; letter-spacing: -.03em;
      display: flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, #0070f3 0%, #00bcd4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: var(--accent); /* fallback */
    }
    .dashSubtitle { font-size: 13px; color: var(--text-2); }
    .dashHeaderRight { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .headerChip {
      font-size: 12px; font-weight: 600; padding: 5px 12px;
      border-radius: 999px; border: 0.5px solid var(--border-strong);
      background: var(--surface); color: var(--text-2); white-space: nowrap;
    }
    .headerChip.industry { border-color: var(--accent-border); background: var(--accent-subtle); color: var(--accent); }
    .certBadge { font-size: 12px; font-weight: 700; padding: 5px 14px; border-radius: 999px; border: 0.5px solid; white-space: nowrap; }
    .certBadge.early  { background: rgba(156,163,175,.08); color:#6b7280; border-color:rgba(156,163,175,.3); }
    .certBadge.prep   { background: rgba(245,158,11,.08);  color:#b45309; border-color:rgba(245,158,11,.3); }
    .certBadge.ready  { background: rgba(0,112,243,.08);   color:#0070f3; border-color:rgba(0,112,243,.3); }
    .certBadge.cert   { background: rgba(34,197,94,.08);   color:#16a34a; border-color:rgba(34,197,94,.3); }

    /* ── Action TOP 3 ── */
    .sectionTitle { font-size: 13px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .actionGrid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 20px; }
    .actionCard {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--r); padding: 18px 20px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .actionCard.urgent { border-color: rgba(239,68,68,.3); background: rgba(239,68,68,.02); }
    .actionCard.important { border-color: rgba(245,158,11,.3); background: rgba(245,158,11,.02); }
    .actionCard.suggest { border-color: var(--border); }
    .actionCardTop { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .actionIcon { font-size: 22px; line-height: 1; flex-shrink: 0; }
    .urgBadge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; border: 0.5px solid; white-space: nowrap; flex-shrink: 0; }
    .urgBadge.긴급   { background:rgba(239,68,68,.1);  color:#dc2626; border-color:rgba(239,68,68,.3); }
    .urgBadge.중요   { background:rgba(245,158,11,.1); color:#b45309; border-color:rgba(245,158,11,.3); }
    .urgBadge.권고   { background:rgba(99,102,241,.1); color:#4338ca; border-color:rgba(99,102,241,.3); }
    .actionTitle { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .actionDesc  { font-size: 12px; color: var(--text-2); line-height: 1.5; flex: 1; }
    .actionLink  { font-size: 12px; font-weight: 600; color: var(--accent); text-decoration: none; align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; }
    .actionLink:hover { text-decoration: underline; }

    /* ── BCMS Flow ── */
    .flowWrap {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--r); padding: 20px 24px; margin-bottom: 20px;
    }
    .flowSteps { display: grid; grid-template-columns: repeat(6,1fr); gap: 0; align-items: stretch; }
    .flowStep {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 14px 8px; position: relative; cursor: pointer; text-decoration: none;
      border-radius: var(--r-sm); transition: background .12s;
    }
    .flowStep:hover { background: var(--surface-hover); }
    .flowStep:not(:last-child)::after {
      content: '→'; position: absolute; right: -8px; top: 50%; transform: translateY(-50%);
      font-size: 16px; color: var(--text-3); z-index: 1; pointer-events: none;
    }
    .flowStepNum { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border-strong); background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--text-2); flex-shrink: 0; }
    .flowStepNum.done  { border-color: #16a34a; background: rgba(34,197,94,.1); color: #16a34a; }
    .flowStepNum.prog  { border-color: var(--accent); background: var(--accent-subtle); color: var(--accent); }
    .flowStepNum.none  { border-color: var(--border-strong); }
    .flowStepName { font-size: 12px; font-weight: 700; color: var(--text); text-align: center; word-break: keep-all; }
    .flowPctBar { width: 100%; max-width: 72px; height: 5px; background: var(--bg); border-radius: 999px; overflow: hidden; border: 0.5px solid var(--border); }
    .flowPctFill { height: 100%; border-radius: 999px; transition: width .4s; }
    .flowPct { font-size: 11px; font-weight: 700; color: var(--text-2); font-family: "SF Mono","Consolas",monospace; }

    /* ── KPI Grid ── */
    .kpiGrid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 20px; }
    .kpiCard { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 18px 20px; }
    .kpiCard .k { font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
    .kpiCard .v { margin-top: 8px; font-size: 26px; font-weight: 800; font-family: "SF Mono","Consolas",monospace; color: var(--text); line-height: 1; }
    .kpiCard .v.accent { color: var(--accent); }
    .kpiCard .v.warn   { color: #dc2626; }
    .kpiCard .v.ok     { color: #16a34a; }
    .kpiCard .v.word   { font-size: 15px; font-family: inherit; font-weight: 700; }
    .kpiCard .m { margin-top: 5px; font-size: 11px; color: var(--text-3); }
    .kpiDivider { grid-column: 1/-1; height: 0; border: none; border-top: 0.5px dashed var(--border); margin: 2px 0; }

    /* ── MBCO Panel ── */
    .mbcoGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
    .mbcoCard { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 16px 18px; text-decoration: none; display: block; transition: background .12s; }
    .mbcoCard:hover { background: var(--surface-hover); }
    .mbcoCard.unset { border-color: rgba(245,158,11,.3); background: rgba(245,158,11,.02); }
    .mbcoCard .mc-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
    .mbcoCard .mc-team { font-size: 11px; color: var(--text-3); margin-bottom: 8px; }
    .mbcoCard .mc-val { font-size: 24px; font-weight: 800; font-family: "SF Mono","Consolas",monospace; line-height: 1; }
    .mbcoCard .mc-bar { height: 4px; background: var(--bg); border-radius: 999px; overflow: hidden; margin-top: 8px; border: 0.5px solid var(--border); }
    .mbcoCard .mc-fill { height: 100%; border-radius: 999px; transition: width .4s; }
    .mbcoCard .mc-unset-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgba(245,158,11,.12); color: #b45309; border: 0.5px solid rgba(245,158,11,.3); }
    .mbcoCard .mc-reason { font-size: 10px; color: var(--text-3); margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mbcoWarnBar { padding: 8px 14px; margin-bottom: 10px; background: rgba(245,158,11,.06); border: 0.5px solid rgba(245,158,11,.2); border-radius: var(--r); font-size: 12px; color: #b45309; }
    .mbcoWarnBar a { color: #b45309; font-weight: 700; }

    @media (max-width:1100px) { .mbcoGrid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width:700px)  { .mbcoGrid { grid-template-columns: 1fr 1fr; } }

    /* ── Bottom 2-col ── */
    .bottomGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .panelCard { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); overflow: hidden; }
    .panelHead { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 0.5px solid var(--border); }
    .panelHead h3 { font-size: 14px; font-weight: 700; color: var(--text); }
    .panelHead a  { font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 600; }
    .panelHead a:hover { text-decoration: underline; }
    .panelBody { padding: 12px 0; }

    .riskRow { display: flex; align-items: center; gap: 10px; padding: 8px 18px; }
    .riskRow:hover { background: var(--surface-hover); }
    .riskRank { font-size: 11px; font-weight: 700; color: var(--text-3); min-width: 18px; text-align: center; flex-shrink: 0; }
    .riskInfo { flex: 1; min-width: 0; }
    .riskName { font-size: 13px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .riskMeta { font-size: 11px; color: var(--text-3); margin-top: 1px; }
    .riskScore { font-size: 13px; font-weight: 700; font-family: "SF Mono","Consolas",monospace; padding: 2px 8px; border-radius: 5px; border: 0.5px solid; white-space: nowrap; flex-shrink: 0; }
    .riskScore.hi  { background:rgba(239,68,68,.08); color:#dc2626; border-color:rgba(239,68,68,.25); }
    .riskScore.mid { background:rgba(245,158,11,.08); color:#b45309; border-color:rgba(245,158,11,.25); }
    .riskScore.lo  { background:rgba(34,197,94,.08);  color:#16a34a; border-color:rgba(34,197,94,.25); }

    .actRow { display: flex; align-items: flex-start; gap: 10px; padding: 9px 18px; }
    .actRow:hover { background: var(--surface-hover); }
    .actIcon { width: 28px; height: 28px; border-radius: 6px; border: 0.5px solid var(--border-strong); background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
    .actInfo { flex: 1; min-width: 0; }
    .actTitle { font-size: 13px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .actMeta  { font-size: 11px; color: var(--text-3); margin-top: 1px; }

    .empty { padding: 24px 18px; text-align: center; color: var(--text-3); font-size: 13px; }

    @keyframes countUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .kpiCard .v { animation: countUp .3s ease; }

    @media (max-width:1100px) { .actionGrid { grid-template-columns: 1fr; } .kpiGrid { grid-template-columns: repeat(2,1fr); } .flowSteps { grid-template-columns: repeat(3,1fr); } .flowStep:nth-child(3)::after, .flowStep:nth-child(6)::after { display: none; } }
    @media (max-width:700px) { .bottomGrid { grid-template-columns: 1fr; } .kpiGrid { grid-template-columns: 1fr 1fr; } .flowSteps { grid-template-columns: repeat(2,1fr); } }
  </style>
</head>
<body>
  <aside id="sidebarMount"></aside>
  <main class="main">
    <div class="wrap">

      <!-- ── Header ── -->
      <div class="dashHeader">
        <div class="dashHeaderLeft">
          <div class="dashTitle">
            BCMS 대시보드
          </div>
          <div class="dashSubtitle" id="dashSubtitle">지금 무엇을 먼저 할지 한눈에 확인하세요.</div>
        </div>
        <div class="dashHeaderRight">
          <span class="headerChip industry" id="industryChip">업종 로딩중</span>
          <span class="headerChip" id="dateChip">날짜</span>
          <span class="certBadge early" id="certBadge">인증준비 초기</span>
        </div>
      </div>

      <!-- ── 지금 할 일 TOP 3 ── -->
      <div class="sectionTitle">⚡ 지금 당장 할 일 TOP 3</div>
      <div class="actionGrid" id="actionGrid">
        <div class="actionCard"><div class="actionDesc empty" style="padding:0">데이터 분석 중...</div></div>
        <div class="actionCard"><div class="actionDesc empty" style="padding:0">데이터 분석 중...</div></div>
        <div class="actionCard"><div class="actionDesc empty" style="padding:0">데이터 분석 중...</div></div>
      </div>

      <!-- ── BCMS 진행 흐름 ── -->
      <div class="sectionTitle">🔄 BCMS 진행 흐름</div>
      <div class="flowWrap">
        <div class="flowSteps" id="flowSteps"></div>
      </div>

      <!-- ── KPI Cards ── -->
      <div class="sectionTitle">📊 핵심 지표</div>
      <div class="kpiGrid" id="kpiGrid">
        <!-- JS-generated -->
      </div>

      <!-- ── MBCO 현황 ── -->
      <div class="sectionTitle">🎯 MBCO (최소운영수준) 현황</div>
      <div id="mbcoSection"><!-- JS-generated --></div>

      <!-- ── Bottom 2-col ── -->
      <div class="bottomGrid">
        <div class="panelCard">
          <div class="panelHead">
            <h3>🔥 리스크 TOP 5</h3>
            <a href="risk-bia/risk.html">전체 보기 →</a>
          </div>
          <div class="panelBody" id="riskTop5"></div>
        </div>
        <div class="panelCard">
          <div class="panelHead">
            <h3>📋 최근 활동</h3>
            <a href="audit/index.html">CAPA 관리 →</a>
          </div>
          <div class="panelBody" id="recentActivity"></div>
        </div>
      </div>

    </div><!-- .wrap -->
  </main>

  <button class="theme-toggle" id="themeToggle" title="다크모드 전환">🌙</button>

  <script src="assets/sidebar.js"></script>
  <script src="assets/demo-seed.js"></script>
  <script src="assets/onboarding.js"></script>
  <script>
  'use strict';

  /* ── Theme ── */
  {
    const root = document.documentElement;
    const tog = document.getElementById('themeToggle');
    const saved = localStorage.getItem('bcmsTheme') || 'light';
    root.setAttribute('data-theme', saved);
    if (tog) { tog.textContent = saved === 'dark' ? '☀️' : '🌙'; }
    if (tog) tog.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      tog.textContent = next === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('bcmsTheme', next);
    });
  }

  /* ── Utils ── */
  const esc = s => String(s ?? '').replace(/[&<>"']/g,
    m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const loadJ = (k, fb) => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch { return fb; } };
  const todayStr = () => new Date().toISOString().slice(0, 10);
  const thisYear = String(new Date().getFullYear());

  /* ── Data loaders ── */
  const getBIA       = () => loadJ('bcmsBIAData', []);
  const getCore      = () => loadJ('bcmsCoreFunctions', []);
  const getRisks     = () => loadJ('bcmsRiskList', []);
  const getBCP       = () => loadJ('bcmsBCP', []);
  const getTraining  = () => loadJ('bcmsTrainingData', []);
  const getPriorityConfirmed = () => loadJ('bcmsPriorityConfirmed', {});
  const bcpAllStrategies = () => getBCP().flatMap(t => Array.isArray(t.strategies) ? t.strategies : []);
  const getCapas     = () => loadJ('bcmsCapaItems', []);
  const getEduProg   = () => loadJ('bcmsEducationProgress', { stagesPassed: [false,false,false,false,false], quizScores: [null,null,null,null,null] });
  const getGap       = () => loadJ('bcmsGapAnalysis', {});
  const getDR        = () => loadJ('bcmsDisasterReduction', {});
  const getAudits    = () => loadJ('bcmsAuditData', []);

  /* ── Derived counts ── */
  const biaFunctions = () => {
    const bia = getBIA();
    return bia.flatMap(t => Array.isArray(t.functions) ? t.functions : []);
  };
  const coreFunctions = () => {
    const core = getCore();
    return core.flatMap(t => Array.isArray(t.functions) ? t.functions : []);
  };

  const isoPct = () => {
    const gap = getGap();
    const entries = Object.values(gap);
    if (!entries.length) return 0;
    const done = entries.filter(e => e.status === '완료').length;
    const na   = entries.filter(e => e.status === '해당없음').length;
    const eff  = entries.length - na;
    return eff > 0 ? Math.round(done / eff * 100) : 0;
  };

  const drTotal = () => {
    const dr = getDR();
    const DR_FIELDS = [
      { id: '1-1', max: 10 }, { id: '1-2', max: 10 }, { id: '1-3', max: 10 },
      { id: '2-1', max: 15 }, { id: '2-2', max: 15 },
      { id: '3-1', max: 15 }, { id: '3-2', max: 15 }, { id: '3-3', max: 10 },
    ];
    return DR_FIELDS.reduce((s, f) => s + Math.min(Number((dr[f.id] || {}).score || 0), f.max), 0);
  };

  const openCapas = () => getCapas().filter(c => c.status !== '완료').length;

  const lateCapas = () => {
    const td = todayStr();
    return getCapas().filter(c => c.status !== '완료' && c.targetDate && c.targetDate < td).length;
  };

  const trainYear = () => {
    const t = getTraining();
    const yr = thisYear;
    const plans = t.filter(x => (x.planDate || '').startsWith(yr));
    const done  = plans.filter(x => x.status === '완료');
    return { total: plans.length, done: done.length };
  };

  const nextAuditDday = () => {
    const audits = getAudits();
    const td = todayStr();
    const fut = audits.filter(a => (a.planDate || '') >= td && a.status !== '완료')
      .sort((a, b) => a.planDate.localeCompare(b.planDate));
    if (!fut.length) return null;
    const diff = Math.ceil((new Date(fut[0].planDate) - new Date()) / 86400000);
    return { date: fut[0].planDate, diff };
  };

  const confirmedBCP = () => {
    const strats = bcpAllStrategies();
    if (!strats.length) return { done: 0, total: 0 };
    return { done: strats.filter(s => s.status === '확정').length, total: strats.length };
  };

  /* ── Header ── */
  const renderHeader = () => {
    const industry = localStorage.getItem('bcmsIndustry') || '';
    const now = new Date();
    const dateStr = now.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'short' });

    document.getElementById('industryChip').textContent = industry ? `🏭 ${industry}` : '업종 미설정';
    document.getElementById('dateChip').textContent = dateStr;

    const pct = isoPct();
    const certEl = document.getElementById('certBadge');
    if (pct <= 30) { certEl.className = 'certBadge early'; certEl.textContent = '인증준비 초기'; }
    else if (pct <= 60) { certEl.className = 'certBadge prep'; certEl.textContent = '인증준비중'; }
    else if (pct <= 90) { certEl.className = 'certBadge ready'; certEl.textContent = '심사준비완료'; }
    else { certEl.className = 'certBadge cert'; certEl.textContent = '✓ 인증취득'; }
  };

  /* ── Action TOP 3 ── */
  const buildActions = () => {
    const actions = [];
    const biaFns  = biaFunctions();
    const coreFns = coreFunctions();
    const risks   = getRisks();
    const tr      = trainYear();
    const gap     = getGap();
    const late    = lateCapas();
    const open    = openCapas();

    /* 1. BIA 미등록 */
    const biaCount  = biaFns.length;
    const coreCount = coreFns.length;
    if (coreCount > biaCount) {
      actions.push({ urg: 1, icon: '📊', title: `BIA 등록 필요`, desc: `핵심업무 ${coreCount}개 중 ${coreCount - biaCount}개 BIA 미입력. 업무연속성 분석의 첫 단계입니다.`, href: 'risk-bia/bia.html', urgLabel: '중요' });
    }

    /* 2. 우선순위 미확정 */
    const noFinal = biaFns.filter(f => !f.coreFinal).length;
    if (noFinal > 0) {
      actions.push({ urg: 1, icon: '🏆', title: `우선순위 확정 필요`, desc: `${noFinal}개 업무의 핵심업무 여부가 미확정입니다. BIA 기반 우선순위를 확정하세요.`, href: 'risk-bia/priority.html', urgLabel: '중요' });
    }

    /* 3. BCP 전략 미완료 */
    const bcpStrats = bcpAllStrategies();
    const bcpTotal  = bcpStrats.length;
    const bcpDone   = bcpStrats.filter(s => s.status === '확정').length;
    if (bcpTotal > 0 && bcpDone < bcpTotal) {
      actions.push({ urg: 1, icon: '🛡️', title: `BCP 전략 수립 필요`, desc: `${bcpTotal - bcpDone}개 전략이 미확정 상태입니다. 핵심업무별 복구 전략을 확정하세요.`, href: 'strategy-plans/index.html', urgLabel: '중요' });
    } else if (bcpTotal === 0 && biaFns.length > 0) {
      actions.push({ urg: 1, icon: '🛡️', title: `BCP 전략 미수립`, desc: `BIA 데이터는 있으나 BCP 전략이 없습니다. 전략·계획 메뉴에서 수립하세요.`, href: 'strategy-plans/index.html', urgLabel: '중요' });
    }

    /* 4. 훈련 계획 없음 */
    if (tr.total === 0) {
      actions.push({ urg: 1, icon: '🎯', title: `올해 훈련 계획 미수립`, desc: `${thisYear}년 훈련 계획이 없습니다. ISO 22301은 연 1회 이상 훈련을 요구합니다.`, href: 'training/index.html', urgLabel: '중요' });
    }

    /* 5. CAPA 지연 */
    if (late > 0) {
      actions.push({ urg: 0, icon: '🚨', title: `지연된 CAPA: ${late}개`, desc: `목표 완료일이 지난 CAPA가 ${late}개 있습니다. 즉시 조치 또는 일정을 재조정하세요.`, href: 'audit/index.html', urgLabel: '긴급' });
    }

    /* 6. ISO 갭분석 미착수 */
    const gapEntries = Object.values(gap);
    const notStarted = gapEntries.filter(e => e.status === '미착수').length;
    const totalReqs  = 37;
    const noDataReqs = totalReqs - gapEntries.length;
    const remaining  = notStarted + noDataReqs;
    if (remaining > 0) {
      actions.push({ urg: 2, icon: '📋', title: `갭분석 미착수: ${remaining}개 요구사항`, desc: `ISO 22301 ${remaining}개 요구사항이 미확인 상태입니다. 갭분석을 완성하세요.`, href: 'audit/index.html', urgLabel: '권고' });
    }

    /* 7. 리스크 없음 */
    if (risks.length === 0) {
      actions.push({ urg: 1, icon: '⚠️', title: `리스크 평가 미등록`, desc: `등록된 리스크가 없습니다. 리스크 식별 및 평가를 먼저 수행하세요.`, href: 'risk-bia/risk.html', urgLabel: '중요' });
    }

    /* 정렬: 긴급=0, 중요=1, 권고=2 */
    actions.sort((a, b) => a.urg - b.urg);
    return actions.slice(0, 3);
  };

  const renderActions = () => {
    const actions = buildActions();
    const grid = document.getElementById('actionGrid');

    if (!actions.length) {
      grid.innerHTML = `<div class="actionCard suggest" style="grid-column:1/-1">
        <div class="actionIcon">✅</div>
        <div class="actionTitle">모든 주요 항목이 완료되었습니다!</div>
        <div class="actionDesc">BCMS 운영 상태가 양호합니다. 지속적인 모니터링과 개선을 이어가세요.</div>
      </div>`;
      return;
    }

    /* 3개 미만이면 빈 카드로 채움 */
    while (actions.length < 3) {
      actions.push({ urg: 2, icon: '💡', title: '권고 없음', desc: '현재 분석할 추가 항목이 없습니다.', href: '#', urgLabel: '권고' });
    }

    grid.innerHTML = actions.map(a => {
      const cls = a.urgLabel === '긴급' ? 'urgent' : a.urgLabel === '중요' ? 'important' : 'suggest';
      return `<div class="actionCard ${cls}">
        <div class="actionCardTop">
          <span class="actionIcon">${a.icon}</span>
          <span class="urgBadge ${a.urgLabel}">${a.urgLabel}</span>
        </div>
        <div class="actionTitle">${esc(a.title)}</div>
        <div class="actionDesc">${esc(a.desc)}</div>
        <a class="actionLink" href="${esc(a.href)}">바로가기 →</a>
      </div>`;
    }).join('');
  };

  /* ── BCMS Flow ── */
  const pctColor = pct => pct >= 80 ? '#16a34a' : pct >= 40 ? '#0070f3' : pct === 0 ? '#9ca3af' : '#f59e0b';
  const pctNumCls = pct => pct >= 80 ? 'done' : pct >= 40 ? 'prog' : 'none';

  const renderFlow = () => {
    const biaFns  = biaFunctions();
    const coreFns = coreFunctions();
    const risks   = getRisks();
    const tr      = trainYear();

    /* Step completion % */
    const biaPct = coreFns.length > 0
      ? Math.min(100, Math.round(biaFns.length / coreFns.length * 100))
      : biaFns.length > 0 ? 100 : 0;

    const riskPct = risks.length > 0 ? Math.min(100, Math.round(risks.length / Math.max(biaFns.length, 1) * 100)) : 0;

    const confirmed  = getPriorityConfirmed();
    const cfCount    = Object.values(confirmed).filter(v => v === true).length;
    const coreFinal  = cfCount > 0 ? cfCount : biaFns.filter(f => f.coreFinal).length;
    const priorPct   = biaFns.length > 0 ? Math.round(coreFinal / biaFns.length * 100) : 0;

    const bcpStrats  = bcpAllStrategies();
    const bcpDone    = bcpStrats.filter(s => s.status === '확정').length;
    const bcpPct     = bcpStrats.length > 0 ? Math.round(bcpDone / bcpStrats.length * 100) : 0;

    const trainPct  = tr.total > 0 ? Math.round(tr.done / tr.total * 100) : 0;

    const auditPct  = isoPct();

    const steps = [
      { num: 1, name: 'BIA',      pct: biaPct,   href: 'risk-bia/bia.html' },
      { num: 2, name: '리스크평가', pct: riskPct,  href: 'risk-bia/risk.html' },
      { num: 3, name: '우선순위',  pct: priorPct, href: 'risk-bia/priority.html' },
      { num: 4, name: 'BCP전략',  pct: bcpPct,   href: 'strategy-plans/index.html' },
      { num: 5, name: '훈련',      pct: trainPct, href: 'training/index.html' },
      { num: 6, name: '심사',      pct: auditPct, href: 'audit/index.html' },
    ];

    document.getElementById('flowSteps').innerHTML = steps.map(s => `
      <a class="flowStep" href="${esc(s.href)}" title="${s.pct}% 완료">
        <div class="flowStepNum ${pctNumCls(s.pct)}">${s.num}</div>
        <div class="flowStepName">${esc(s.name)}</div>
        <div class="flowPctBar">
          <div class="flowPctFill" style="width:${s.pct}%;background:${pctColor(s.pct)}"></div>
        </div>
        <div class="flowPct">${s.pct}%</div>
      </a>`
    ).join('');
  };

  /* ── KPI Cards ── */
  const renderKPI = () => {
    const biaFns   = biaFunctions();
    const risks     = getRisks();
    const bcpStrats = bcpAllStrategies();
    const tr        = trainYear();
    const open      = openCapas();
    const dr        = drTotal();
    const nd        = nextAuditDday();
    const pct       = isoPct();
    const bcpConf   = bcpStrats.filter(s => s.status === '확정').length;

    const cards = [
      /* Row 1 */
      { k: '등록된 핵심업무',   v: biaFns.length,  cls: 'accent', m: 'bcmsBIAData 기준',           href: 'risk-bia/bia.html' },
      { k: '등록된 리스크',     v: risks.length,   cls: risks.length ? 'accent' : 'warn', m: 'bcmsRiskList 기준', href: 'risk-bia/risk.html' },
      { k: 'BCP 전략 확정',    v: bcpConf,        cls: bcpConf ? 'ok' : 'warn', m: `전체 ${bcpStrats.length}개 중`, href: 'strategy-plans/index.html' },
      { k: 'ISO 22301 충족률', v: `${pct}%`,      cls: 'accent', m: '갭분석 기준', word: true,      href: 'audit/index.html' },
      /* divider inserted via JS */
      /* Row 2 */
      { k: '올해 훈련 완료',   v: tr.done,        cls: tr.done ? 'ok' : 'warn', m: `계획 ${tr.total}건`, href: 'training/index.html' },
      { k: '미완료 CAPA',     v: open,           cls: open ? 'warn' : 'ok', m: 'bcmsCapaItems 기준', href: 'audit/index.html' },
      { k: '재해경감 자가평가', v: `${dr}점`,      cls: dr >= 80 ? 'ok' : dr >= 60 ? 'accent' : 'warn', m: '/ 100점', word: true, href: 'audit/index.html' },
      { k: '다음 심사 D-day', v: nd ? `D-${nd.diff}` : '미정', cls: nd && nd.diff <= 30 ? 'warn' : 'accent', m: nd ? nd.date : '심사 예정 없음', word: !nd || nd.diff > 999, href: 'audit/index.html' },
      /* divider2 */
      /* Row 3 */
      { k: '교육 완료율',   v: (() => { const ep = getEduProg(); const n = ep.stagesPassed.filter(Boolean).length; return `${Math.round(n/5*100)}%`; })(), cls: (() => { const ep = getEduProg(); const n = ep.stagesPassed.filter(Boolean).length; return n === 5 ? 'ok' : n > 0 ? 'accent' : 'warn'; })(), m: (() => { const ep = getEduProg(); const n = ep.stagesPassed.filter(Boolean).length; return `${n}/5단계 완료`; })(), word: true, href: 'education/index.html' },
      { k: '현재 교육 단계', v: (() => { const ep = getEduProg(); const names = ['BCM 기초','ISO 22301','실습 가이드','업종별 사례','인증 준비']; const n = ep.stagesPassed.filter(Boolean).length; return n >= 5 ? '전 과정 완료' : names[n]; })(), cls: 'accent', m: (() => { const ep = getEduProg(); const n = ep.stagesPassed.filter(Boolean).length; return n >= 5 ? '🎉 수료' : `${n+1}단계 진행 중`; })(), word: true, href: 'education/index.html' },
    ];

    const grid = document.getElementById('kpiGrid');
    let html = '';
    cards.forEach((c, i) => {
      if (i === 4) html += `<div class="kpiDivider"></div>`;
      if (i === 8) html += `<div class="kpiDivider"></div>`;
      const valCls = c.word ? `v word ${c.cls}` : `v ${c.cls}`;
      const isNum = !c.word && typeof c.v === 'number';
      html += `<a class="kpiCard" href="${esc(c.href)}" style="text-decoration:none">
        <div class="k">${esc(c.k)}</div>
        <div class="${valCls}"${isNum ? ` data-target="${c.v}"` : ''}>${isNum ? '0' : esc(String(c.v))}</div>
        <div class="m">${esc(c.m)}</div>
      </a>`;
    });
    grid.innerHTML = html;
    grid.querySelectorAll('.v[data-target]').forEach(el => {
      const target = +el.dataset.target;
      if (!target) { el.textContent = '0'; return; }
      const dur = 900, start = performance.now();
      const tick = now => {
        const p = Math.min(1, (now - start) / dur);
        const ease = 1 - (1 - p) ** 3;
        el.textContent = String(Math.round(ease * target));
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  };

  /* ── Risk TOP 5 ── */
  const renderRiskTop5 = () => {
    const risks = getRisks();
    const el = document.getElementById('riskTop5');
    if (!risks.length) {
      el.innerHTML = `<div class="empty">리스크 데이터 없음<br><a href="risk-bia/risk.html" style="color:var(--accent)">등록하러 가기 →</a></div>`;
      return;
    }
    const sorted = [...risks].sort((a, b) => Number(b.riskScore || 0) - Number(a.riskScore || 0)).slice(0, 5);
    el.innerHTML = sorted.map((r, i) => {
      const score = Number(r.riskScore || 0);
      const scCls = score >= 15 ? 'hi' : score >= 9 ? 'mid' : 'lo';
      const name  = r.riskName || r.risk || r.name || '리스크명 없음';
      const type  = r.riskType || '';
      const treat = r.treatment || '';
      return `<div class="riskRow">
        <span class="riskRank">${i + 1}</span>
        <div class="riskInfo">
          <div class="riskName" title="${esc(name)}">${esc(name)}</div>
          <div class="riskMeta">${esc(type)}${treat ? ` · ${esc(treat)}` : ''}</div>
        </div>
        <span class="riskScore ${scCls}">${score}</span>
      </div>`;
    }).join('');
  };

  /* ── Recent Activity ── */
  const renderActivity = () => {
    const activities = [];

    /* CAPA items */
    getCapas().forEach(c => {
      if (c.createdAt) activities.push({ date: c.createdAt, icon: '🛠️', title: `CAPA: ${c.title || c.id}`, meta: `${c.source || ''} · ${c.status || '미착수'}` });
    });

    /* Completed trainings */
    getTraining().forEach(t => {
      const d = t.actualDate || t.planDate;
      if (d && t.status === '완료') activities.push({ date: d, icon: '🎯', title: `훈련 완료: ${t.name || t.id}`, meta: `${t.type || ''} · ${t.actualDate || t.planDate}` });
    });

    /* Audit records */
    getAudits().forEach(a => {
      const d = a.actualDate || a.planDate;
      if (d) activities.push({ date: d, icon: '🔍', title: `심사: ${a.name || a.id}`, meta: `${a.type || ''} · ${a.status || '예정'}` });
    });

    activities.sort((a, b) => b.date.localeCompare(a.date));
    const top5 = activities.slice(0, 5);

    const el = document.getElementById('recentActivity');
    if (!top5.length) {
      el.innerHTML = `<div class="empty">활동 기록이 없습니다.<br>훈련, CAPA, 심사를 등록하면 표시됩니다.</div>`;
      return;
    }
    el.innerHTML = top5.map(a => `
      <div class="actRow">
        <div class="actIcon">${a.icon}</div>
        <div class="actInfo">
          <div class="actTitle" title="${esc(a.title)}">${esc(a.title)}</div>
          <div class="actMeta">${esc(a.meta)} · ${esc(a.date)}</div>
        </div>
      </div>`).join('');
  };

  /* ── MBCO Dashboard ── */
  const getMBCOStore = () => loadJ('bcmsMBCOData', {});

  const renderMbcoDashboard = () => {
    const section = document.getElementById('mbcoSection');
    const biaData = getBIA();
    const mbcoStore = getMBCOStore();

    const allFns = biaData.flatMap(row =>
      (row.functions || []).map(fn => ({ ...fn, _team: row.team || row.teamName || '' }))
    ).filter(fn => fn.name);

    if (!allFns.length) {
      section.innerHTML = `<div class="panelCard" style="margin-bottom:20px"><div class="empty">BIA 데이터가 없습니다. <a href="risk-bia/bia.html" style="color:var(--accent)">BIA 등록 →</a></div></div>`;
      return;
    }

    const orderMap = { '핵심': 0, '중요': 1, '일반': 2 };
    const sorted = [...allFns].sort((a, b) =>
      (orderMap[a.importance] ?? 2) - (orderMap[b.importance] ?? 2)
    );
    const top = sorted.slice(0, 8);
    const unsetCount = allFns.filter(fn => fn.mbco == null).length;

    const mbcoColor = v => v >= 70 ? '#0070f3' : v >= 40 ? '#f59e0b' : '#dc2626';

    let cardsHtml = top.map(fn => {
      const rec   = mbcoStore[fn.biaId || fn.id] || {};
      const mbco  = fn.mbco != null ? Number(fn.mbco) : (rec.mbco != null ? Number(rec.mbco) : null);
      const reason = rec.mbcoReason || '';
      if (mbco === null) {
        return `<a class="mbcoCard unset" href="risk-bia/bia.html">
          <div class="mc-name" title="${esc(fn.name)}">${esc(fn.name)}</div>
          <div class="mc-team">${esc(fn._team)}</div>
          <span class="mc-unset-badge">미설정</span>
          <div class="mc-bar"><div class="mc-fill" style="width:0%;background:#d1d5db"></div></div>
        </a>`;
      }
      const col = mbcoColor(mbco);
      return `<a class="mbcoCard" href="risk-bia/bia.html">
        <div class="mc-name" title="${esc(fn.name)}">${esc(fn.name)}</div>
        <div class="mc-team">${esc(fn._team)}</div>
        <div class="mc-val" style="color:${col}">${mbco}%</div>
        <div class="mc-bar"><div class="mc-fill" style="width:${mbco}%;background:${col}"></div></div>
        ${reason ? `<div class="mc-reason" title="${esc(reason)}">${esc(reason)}</div>` : ''}
      </a>`;
    }).join('');

    if (allFns.length > 8) {
      cardsHtml += `<a class="mbcoCard" href="risk-bia/bia.html" style="display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--accent)">+${allFns.length - 8}개 더보기 →</a>`;
    }

    const warnBar = unsetCount > 0
      ? `<div class="mbcoWarnBar">⚠ ${unsetCount}개 업무의 MBCO가 미설정입니다. <a href="risk-bia/bia.html">BIA 페이지에서 설정 →</a></div>`
      : '';

    section.innerHTML = warnBar + `<div class="mbcoGrid">${cardsHtml}</div>`;
  };

  /* ── Demo seed ── */
  const initDemoBanner = () => {
    if (!window.BCMSDemoSeed) return;
    BCMSDemoSeed.ensureDemoIfEmpty();
    BCMSDemoSeed.mountBanner('.wrap');
    const banner = document.querySelector('.wrap > div:first-child');
    if (banner && banner.style.background) {
      banner.style.cssText = '';
      banner.style.cssText = 'margin-bottom:12px;padding:6px 14px;border:0.5px solid rgba(0,112,243,.18);background:rgba(0,112,243,.04);border-radius:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--text-2)';
      const msgEl = banner.querySelector('span');
      if (msgEl) msgEl.textContent = '샘플 데이터가 로드되어 있습니다. 실제 데이터 입력 후 샘플을 제거하세요.';
    }
  };

  /* ── Init ── */
  const render = () => {
    renderHeader();
    renderActions();
    renderFlow();
    renderKPI();
    renderMbcoDashboard();
    renderRiskTop5();
    renderActivity();
  };

  initDemoBanner();
  render();
  window.addEventListener('focus',   render);
  window.addEventListener('storage', render);
  </script>
</body>
</html>
