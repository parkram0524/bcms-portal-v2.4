<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>BCMS Portal - 교육센터</title>
  <link rel="stylesheet" href="../assets/style.css"/>
  <style>
    .wrap { max-width: 1280px; margin: 0 auto; }

    /* ── Header ── */
    .eduHeader {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--r); padding: 20px 24px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .eduTitle {
      font-size: 26px; font-weight: 800; letter-spacing: -.03em;
      background: linear-gradient(135deg, #0070f3 0%, #00bcd4 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .eduSubtitle { font-size: 13px; color: var(--text-2); margin-top: 4px; }

    .overallProg { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .overallProgInfo { font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px; }
    .overallProgBar { width: 160px; height: 8px; background: var(--bg); border-radius: 999px; border: 0.5px solid var(--border); overflow: hidden; }
    .overallProgFill { height: 100%; border-radius: 999px; background: var(--accent); transition: width .5s ease; }
    .overallProgLabel { font-size: 22px; font-weight: 800; color: var(--accent); font-family: "SF Mono","Consolas",monospace; }

    /* ── Stage Navigation ── */
    .sectionTitle { font-size: 12px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .stageNav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
    .stageNavItem {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--r); padding: 16px 12px; cursor: pointer;
      transition: all .15s; position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center;
    }
    .stageNavItem.active { border-color: var(--accent); background: var(--accent-subtle); }
    .stageNavItem.done { border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.04); }
    .stageNavItem.locked { opacity: .52; cursor: not-allowed; }
    .stageNavItem:not(.locked):hover { background: var(--surface-hover); box-shadow: var(--shadow-sm); }
    .stageNavItem.active:hover { background: var(--accent-subtle); }
    .stageIcon { font-size: 26px; line-height: 1; }
    .stageNum { font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
    .stageTitle { font-size: 13px; font-weight: 700; color: var(--text); word-break: keep-all; }
    .stageSub { font-size: 11px; color: var(--text-2); word-break: keep-all; line-height: 1.4; }
    .stageLockBadge { position: absolute; top: 8px; right: 8px; font-size: 13px; }
    .stageDoneBadge {
      position: absolute; top: 7px; right: 7px;
      background: rgba(34,197,94,.1); color: #16a34a;
      border: 0.5px solid rgba(34,197,94,.3);
      border-radius: 999px; font-size: 10px; font-weight: 700; padding: 1px 6px;
    }

    /* ── Content Panel ── */
    .contentPanel { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 16px; }
    .contentHead {
      display: flex; align-items: flex-start; gap: 14px; padding: 18px 24px;
      border-bottom: 0.5px solid var(--border); background: var(--surface-hover);
    }
    .contentHeadIcon { font-size: 28px; line-height: 1; flex-shrink: 0; }
    .contentHeadText h2 { font-size: 16px; font-weight: 700; color: var(--text); }
    .contentHeadText p { font-size: 13px; color: var(--text-2); margin-top: 3px; }
    .contentBody { padding: 24px; }

    /* ── Glossary ── */
    .glossaryGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
    .termCard {
      background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--r-sm);
      padding: 16px; cursor: pointer; transition: all .15s; text-decoration: none; display: block;
    }
    .termCard:hover { border-color: var(--accent); background: var(--accent-subtle); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .termAbr { font-size: 19px; font-weight: 800; color: var(--accent); font-family: "SF Mono","Consolas",monospace; }
    .termKr { font-size: 11.5px; color: var(--text-2); margin: 3px 0 8px; line-height: 1.4; }
    .termDef { font-size: 12.5px; color: var(--text); line-height: 1.65; word-break: keep-all; }
    .termLink { font-size: 11px; color: var(--accent); margin-top: 10px; font-weight: 600; display: flex; align-items: center; gap: 4px; }

    /* ── ISO Clauses ── */
    .clauseList { display: flex; flex-direction: column; gap: 8px; }
    .clauseItem { border: 0.5px solid var(--border); border-radius: var(--r-sm); overflow: hidden; background: var(--bg); }
    .clauseHead { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; user-select: none; transition: background .12s; }
    .clauseHead:hover { background: var(--surface-hover); }
    .clauseNum { font-size: 13px; font-weight: 800; color: var(--accent); font-family: "SF Mono","Consolas",monospace; min-width: 32px; flex-shrink: 0; }
    .clauseTitleText { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; }
    .clauseArrow { font-size: 11px; color: var(--text-3); transition: transform .2s; flex-shrink: 0; }
    .clauseItem.open .clauseArrow { transform: rotate(90deg); }
    .clauseBody { display: none; padding: 0 16px 16px 60px; }
    .clauseItem.open .clauseBody { display: block; }
    .clauseDesc { font-size: 13px; color: var(--text-2); line-height: 1.75; word-break: keep-all; }
    .clauseKey { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .clauseKeyItem { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--accent-subtle); color: var(--accent); border: 0.5px solid var(--accent-border); font-weight: 600; }
    .clausePortalLink { display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: none; padding: 5px 12px; border: 0.5px solid var(--accent-border); border-radius: 6px; background: var(--accent-subtle); transition: background .12s; }
    .clausePortalLink:hover { background: rgba(0,112,243,.14); }

    /* ── Practice Guide ── */
    .practiceSteps { display: flex; flex-direction: column; gap: 16px; }
    .practiceStep { display: flex; gap: 18px; align-items: flex-start; background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--r-sm); padding: 18px; }
    .practiceStepNum { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; flex-shrink: 0; font-family: "SF Mono","Consolas",monospace; }
    .practiceStepContent { flex: 1; }
    .practiceStepTitle { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .practiceStepDesc { font-size: 13px; color: var(--text-2); line-height: 1.7; word-break: keep-all; }
    .practiceStepTips { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
    .practiceStepTip { font-size: 12px; color: var(--text-2); padding-left: 14px; position: relative; line-height: 1.6; }
    .practiceStepTip::before { content: '•'; position: absolute; left: 0; color: var(--accent); font-weight: 700; }
    .practiceStepLink { display: inline-flex; align-items: center; gap: 4px; margin-top: 12px; font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: none; padding: 6px 14px; border: 0.5px solid var(--accent-border); border-radius: 6px; background: var(--accent-subtle); transition: background .12s; }
    .practiceStepLink:hover { background: rgba(0,112,243,.14); }

    /* ── Case Studies ── */
    .caseGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .caseCard { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--r-sm); padding: 20px; }
    .caseIndustry { font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 5px; }
    .caseTitle { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
    .caseSituation { font-size: 13px; color: var(--text-2); line-height: 1.65; margin-bottom: 12px; word-break: keep-all; }
    .caseLessons { display: flex; flex-direction: column; gap: 5px; }
    .caseLesson { font-size: 12px; color: var(--text); padding: 6px 10px; background: var(--surface); border: 0.5px solid var(--border); border-radius: 5px; line-height: 1.5; word-break: keep-all; }

    /* ── Certification ── */
    .certSection { margin-bottom: 28px; }
    .certSectionTitle { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 0.5px solid var(--border); }
    .processFlow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-bottom: 8px; background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--r-sm); overflow: hidden; }
    .processStep { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 18px 12px; position: relative; }
    .processStep:not(:last-child)::after { content: '→'; position: absolute; right: -8px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--text-3); pointer-events: none; }
    .processStepNum { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; margin-bottom: 8px; }
    .processStepTitle { font-size: 13px; font-weight: 700; color: var(--text); word-break: keep-all; }
    .processStepDesc { font-size: 11px; color: var(--text-2); margin-top: 4px; word-break: keep-all; line-height: 1.5; }
    .certChecklist { display: flex; flex-direction: column; gap: 7px; }
    .certCheckItem { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--r-sm); }
    .certCheckIcon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .certCheckText { flex: 1; }
    .certCheckTitle { font-size: 13px; font-weight: 600; color: var(--text); }
    .certCheckDesc { font-size: 12px; color: var(--text-2); margin-top: 2px; line-height: 1.5; word-break: keep-all; }
    .certCheckLink { font-size: 11px; color: var(--accent); font-weight: 700; white-space: nowrap; text-decoration: none; flex-shrink: 0; padding: 4px 10px; border: 0.5px solid var(--accent-border); border-radius: 5px; background: var(--accent-subtle); }
    .certCheckLink:hover { background: rgba(0,112,243,.14); }

    /* ── Lock Overlay ── */
    .lockOverlay { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 64px 24px; gap: 12px; }
    .lockIcon { font-size: 52px; }
    .lockTitle { font-size: 17px; font-weight: 700; color: var(--text); }
    .lockDesc { font-size: 13px; color: var(--text-2); text-align: center; line-height: 1.6; }

    /* ── Quiz ── */
    .quizPanel { background: #ffffff; border: 0.5px solid var(--border); border-radius: var(--r); overflow: hidden; }
    [data-theme="dark"] .quizPanel { background: #111111; }
    .quizHead { padding: 16px 24px; border-bottom: 0.5px solid var(--border); background: var(--surface-hover); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .quizHead h3 { font-size: 15px; font-weight: 700; color: var(--text); }
    .quizPassBadge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
    .quizPassBadge.pass    { background: rgba(34,197,94,.1);  color: #16a34a; border: 0.5px solid rgba(34,197,94,.3); }
    .quizPassBadge.fail    { background: rgba(239,68,68,.1);  color: #dc2626; border: 0.5px solid rgba(239,68,68,.3); }
    .quizPassBadge.pending { background: rgba(99,102,241,.1); color: #4338ca; border: 0.5px solid rgba(99,102,241,.3); }
    .quizBody { padding: 24px; }
    .quizQ { margin-bottom: 22px; }
    .quizQNum { font-size: 11px; font-weight: 700; color: var(--text-3); margin-bottom: 5px; }
    .quizQText { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 10px; line-height: 1.55; word-break: keep-all; }
    .quizOptions { display: flex; flex-direction: column; gap: 6px; }
    .quizOption {
      display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px;
      border: 1.5px solid #d1d5db; border-radius: var(--r-sm);
      cursor: pointer; transition: all .12s; background: #f8fafc;
    }
    [data-theme="dark"] .quizOption { border-color: rgba(255,255,255,.13); background: #1a1a2e; }
    .quizOption:hover:not(.no-hover) { border-color: #2563eb; background: rgba(37,99,235,.05); }
    .quizOption.selected { border-color: #2563eb; background: rgba(37,99,235,.07); }
    .quizOption.correct  { border-color: rgba(34,197,94,.6);  background: rgba(34,197,94,.08); cursor: default; }
    .quizOption.wrong    { border-color: rgba(239,68,68,.6);   background: rgba(239,68,68,.08);  cursor: default; }
    .quizOptLetter {
      width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #9ca3af;
      background: #ffffff; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #374151; flex-shrink: 0;
      transition: all .12s; font-family: "SF Mono","Consolas",monospace;
    }
    [data-theme="dark"] .quizOptLetter { border-color: rgba(255,255,255,.3); background: #222; color: #ccc; }
    .quizOption.selected .quizOptLetter { background: #2563eb; color: #fff !important; border-color: #2563eb; }
    .quizOption.correct  .quizOptLetter { background: #16a34a; color: #fff !important; border-color: #16a34a; }
    .quizOption.wrong    .quizOptLetter { background: #dc2626; color: #fff !important; border-color: #dc2626; }
    .quizOptText { font-size: 13px; color: #111111 !important; line-height: 1.45; word-break: keep-all; flex: 1; }
    [data-theme="dark"] .quizOptText { color: #ededed !important; }
    .quizOption.selected .quizOptText { color: #1d4ed8 !important; font-weight: 600; }
    [data-theme="dark"] .quizOption.selected .quizOptText { color: #93c5fd !important; }
    .quizFooter { display: flex; align-items: center; justify-content: space-between; padding-top: 16px; border-top: 0.5px solid var(--border); flex-wrap: wrap; gap: 10px; }
    .quizResult { font-size: 14px; font-weight: 700; }
    .quizResult.pass { color: #16a34a; }
    .quizResult.fail { color: #dc2626; }
    .quizLockedMsg { padding: 20px 24px; text-align: center; color: var(--text-3); font-size: 13px; }

    /* ── Quiz 전용 버튼 (전역 style.css !important 우선순위 회피) ── */
    .quizBtnPrimary {
      display: inline-flex; align-items: center; gap: 5px;
      background: #2563eb !important; color: #ffffff !important;
      border: none !important; border-radius: 8px;
      font-size: 13px; font-weight: 700; padding: 9px 20px;
      cursor: pointer; transition: background .12s, transform .08s; font-family: inherit;
    }
    .quizBtnPrimary:hover:not([disabled]) { background: #1d4ed8 !important; }
    .quizBtnPrimary:active:not([disabled]) { transform: scale(.98); }
    .quizBtnPrimary[disabled] { opacity: .42; cursor: not-allowed; }
    .quizBtnPrimary.lg { font-size: 14px; padding: 11px 36px; }
    .quizBtnSecondary {
      display: inline-flex; align-items: center; gap: 5px;
      background: #64748b !important; color: #ffffff !important;
      border: none !important; border-radius: 8px;
      font-size: 13px; font-weight: 600; padding: 9px 20px;
      cursor: pointer; transition: background .12s, transform .08s; font-family: inherit;
    }
    .quizBtnSecondary:hover { background: #475569 !important; }
    .quizBtnSecondary:active { transform: scale(.98); }

    /* ── Buttons ── */
    .btn { font-size: 13px; font-weight: 600; padding: 8px 18px; border-radius: 8px; border: 0.5px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer; transition: all .12s; font-family: inherit; }
    .btn:hover { background: var(--surface-hover); }
    .btn-primary { background: var(--accent); color: #fff !important; border-color: transparent; }
    .btn-primary:hover { background: var(--accent-hover); }

    @media (max-width: 1000px) {
      .stageNav { grid-template-columns: repeat(3, 1fr); }
      .processFlow { grid-template-columns: repeat(2, 1fr); }
      .processStep:nth-child(2n)::after { display: none; }
    }
    @media (max-width: 640px) {
      .stageNav { grid-template-columns: repeat(2, 1fr); }
      .glossaryGrid { grid-template-columns: 1fr; }
      .caseGrid { grid-template-columns: 1fr; }
      .processFlow { grid-template-columns: 1fr; }
      .processStep::after { display: none !important; }
      .practiceStep { flex-direction: column; }
    }
  </style>
</head>
<body>
  <aside id="sidebarMount"></aside>
  <main class="main">
    <div class="wrap">

      <!-- ── Header ── -->
      <div class="eduHeader">
        <div>
          <div class="eduTitle">📚 교육센터</div>
          <div class="eduSubtitle">BCM 기초부터 ISO 22301 인증 준비까지 — 5단계 학습 프로그램</div>
        </div>
        <div class="overallProg">
          <div>
            <div class="overallProgInfo">전체 완료율</div>
            <div class="overallProgBar">
              <div class="overallProgFill" id="overallFill" style="width:0%"></div>
            </div>
          </div>
          <div class="overallProgLabel" id="overallLabel">0%</div>
        </div>
      </div>

      <!-- ── Stage Nav ── -->
      <div class="sectionTitle">📍 학습 단계 선택</div>
      <div class="stageNav" id="stageNav"></div>

      <!-- ── Content ── -->
      <div class="contentPanel" id="contentPanel"></div>

      <!-- ── Quiz ── -->
      <div class="sectionTitle" style="margin-top:4px;">📝 단계 퀴즈</div>
      <div class="quizPanel" id="quizPanel"></div>

    </div>
  </main>

  <button class="theme-toggle" id="themeToggle" title="다크모드 전환">🌙</button>

  <script src="../assets/sidebar.js"></script>
  <script>
  'use strict';

  /* ── Theme ── */
  {
    const root = document.documentElement;
    const tog  = document.getElementById('themeToggle');
    const saved = localStorage.getItem('bcmsTheme') || 'light';
    root.setAttribute('data-theme', saved);
    if (tog) tog.textContent = saved === 'dark' ? '☀️' : '🌙';
    if (tog) tog.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      tog.textContent = next === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('bcmsTheme', next);
    });
  }

  /* ── BASE prefix ── */
  const _p = window.location.pathname || '/';
  const _bm = _p.match(/^(\/[^\/]+)(?=\/education\/)/);
  const BASE = _bm ? _bm[1] : '';
  const H = p => `${BASE}${p}`;

  /* ── Progress ── */
  const STORAGE_KEY = 'bcmsEducationProgress';

  function loadProg() {
    try {
      const d = localStorage.getItem(STORAGE_KEY);
      if (d) {
        const p = JSON.parse(d);
        if (Array.isArray(p.stagesPassed) && p.stagesPassed.length === 5) return p;
      }
    } catch (e) {}
    return { stagesPassed: [false, false, false, false, false], quizScores: [null, null, null, null, null] };
  }

  function saveProg(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }

  /* ── Data ── */
  const STAGES = [
    { id: 0, icon: '📖', title: 'BCM 기초',      sub: '용어사전 & 핵심 개념' },
    { id: 1, icon: '📋', title: 'ISO 22301',      sub: '조항별 쉬운 해설' },
    { id: 2, icon: '✏️', title: '실습 가이드',    sub: 'BIA → RTO/RPO 작성법' },
    { id: 3, icon: '🏢', title: '업종별 사례',    sub: '5개 업종 BCM 케이스' },
    { id: 4, icon: '🏆', title: '인증 준비',      sub: '심사 프로세스 & 체크리스트' },
  ];

  const GLOSSARY = [
    { abr:'BCMS', kr:'업무연속성 관리 시스템 (Business Continuity Management System)', def:'조직이 업무 중단에 대비해 연속성을 유지·관리하기 위한 전체 관리 체계. ISO 22301이 국제 표준입니다.', href:H('/index.html') },
    { abr:'BIA',  kr:'업무영향분석 (Business Impact Analysis)', def:'업무 중단 시 조직에 미치는 영향을 분석하여 핵심업무를 식별하고 복구 우선순위를 결정하는 분석 활동. BCMS의 출발점입니다.', href:H('/risk-bia/bia.html') },
    { abr:'MBCO', kr:'최소 업무연속성 목표 (Minimum Business Continuity Objective)', def:'위기 상황에서 조직이 수용 가능한 최소한의 업무 서비스 수준. 예: "콜센터 처리량의 30% 이상 유지". BIA에서 팀별로 정의합니다.', href:H('/risk-bia/bia.html') },

    return Math.round(prog.stagesPassed.filter(Boolean).length / STAGES.length * 100);

      const done     = prog.stagesPassed[s.id];
      const active   = s.id === currentStage;
      let cls = 'stageNavItem';
      if (active) cls += ' active';
      else if (done) cls += ' done';
      if (!unlocked) cls += ' locked';
      const badge = !unlocked
        ? '<span class="stageLockBadge">🔒</span>'
        : done ? '<span class="stageDoneBadge">✓ 완료</span>' : '';

      ? `<span class="quizPassBadge pass">✓ 통과 (${score}점)</span>`

        <div class="quizBody">
          <div style="text-align:center;padding:24px 0 22px;border-bottom:0.5px solid var(--border);margin-bottom:24px;">
            <div style="font-size:44px;line-height:1;margin-bottom:12px;">${ok ? '🎉' : '😓'}</div>
            <div class="quizResult ${ok ? 'pass' : 'fail'}" style="font-size:20px;margin-bottom:8px;">
              ${ok ? '✓ 통과! 다음 단계 잠금 해제' : '✗ 미통과'} — ${correct}/${qs.length} 정답 (${scoreVal}점)
            </div>
            <div style="font-size:13px;color:var(--text-2);">${ok ? '다음 단계로 이동하거나 내용을 다시 복습해보세요.' : '70점 이상이 필요합니다. 내용을 복습 후 재도전해보세요.'}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px;">
              <button class="quizBtnSecondary" onclick="retryQuiz()">재응시하기</button>
              ${ok && !isLast ? `<button class="quizBtnPrimary" onclick="goNextStage()">다음 단계로 →</button>` : ''}
              ${ok && isLast  ? `<button class="quizBtnPrimary" onclick="alert('🎉 전 과정 완료! 수고하셨습니다.')">완료 축하 🎉</button>` : ''}
            </div>
          </div>
          <div style="font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;">📋 정답 해설</div>
          ${reviewHTML}
        </div>`;
      return;
    }

    /* ── 응시 중: 한 문제씩 ── */
    const qi      = quizState.currentQ;
    const q       = qs[qi];
    const ua      = quizState.answers[qi];
    const isLastQ = qi === qs.length - 1;

    const dotsHTML = qs.map((_, i) => {
      let s = 'width:10px;height:10px;border-radius:50%;flex-shrink:0;transition:background .15s;';
      s += i < qi ? 'background:#16a34a;' : i === qi ? 'background:var(--accent);' : 'background:var(--border-strong);';
      return `<div style="${s}"></div>`;
    }).join('');

    const canProceed = ua !== undefined;
    const actionBtn  = isLastQ
      ? `<button class="quizBtnPrimary" ${canProceed ? `onclick="submitQuiz()"` : `disabled`}>제출하기</button>`
      : `<button class="quizBtnPrimary" ${canProceed ? `onclick="nextQuestion()"` : `disabled`}>다음 문제 →</button>`;

    el.innerHTML = head + `
      <div class="quizBody">
        <div class="quizQ">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
            <div style="display:flex;gap:6px;align-items:center;">${dotsHTML}</div>
            <div class="quizQNum" style="margin-bottom:0;">문제 ${qi + 1} / ${qs.length}</div>
          </div>
          <div class="quizQText">${esc(q.q)}</div>
          <div class="quizOptions">
            ${q.opts.map((opt, oi) => {
              const cls = oi === ua ? 'quizOption selected' : 'quizOption';
              const letter = String.fromCharCode(65 + oi);
              return `<div class="${cls}" onclick="selectAnswer(${qi},${oi})">
                <div class="quizOptLetter">${letter}</div>
                <div class="quizOptText">${esc(opt)}</div>
              </div>`;
            }).join('')}
          </div>
        </div>
        <div class="quizFooter">
          <div style="font-size:12px;color:var(--text-3);">${canProceed ? '' : '선택지를 골라주세요'}</div>
          ${actionBtn}
        </div>
      </div>`;
  }

  /* ── Actions ── */
  window.selectStage = function(id) {
    if (!isUnlocked(id)) return;
    currentStage = id;
    quizState = { answers: {}, submitted: false, started: false, currentQ: 0 };
    renderAll();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.selectAnswer = function(qi, oi) {
    if (quizState.submitted) return;
    quizState.answers[qi] = oi;
    renderQuiz();
  };

  window.startQuiz = function() {
    quizState.started  = true;
    quizState.currentQ = 0;
    renderQuiz();
    document.getElementById('quizPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  window.nextQuestion = function() {
    const qs = QUIZZES[currentStage];
    if (quizState.currentQ < qs.length - 1) {
      quizState.currentQ++;
      renderQuiz();
    }
  };

  window.submitQuiz = function() {
    const qs      = QUIZZES[currentStage];
    const correct = qs.filter((q, i) => quizState.answers[i] === q.ans).length;
    const score   = Math.round(correct / qs.length * 100);
    quizState.submitted = true;
    prog.quizScores[currentStage] = score;
    if (score >= 70) prog.stagesPassed[currentStage] = true;
    saveProg(prog);
    renderAll();
  };

  window.retryQuiz = function() {
    quizState = { answers: {}, submitted: false, started: false, currentQ: 0 };
    renderQuiz();
  };

  window.goNextStage = function() {
    if (currentStage < STAGES.length - 1) selectStage(currentStage + 1);
  };

  function renderAll() {
    renderOverall();
    renderStageNav();
    renderContent();
    renderQuiz();
  }

  renderAll();
  </script>
</body>
</html>
