<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>비상대응 조직도 | BCMS Portal v2</title>
  <link rel="stylesheet" href="../assets/style.css"/>
  <style>
    /* ===== 페이지 기본 레이아웃 ===== */
    .main { padding: 18px 20px 28px; }
    .wrap { width: 100%; max-width: 1280px; }

    .topBar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .navBtn {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      border: 1px solid var(--lineStrong);
      background: #fff;
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .navBtn:hover { background: rgba(15, 23, 42, .04); }
    .navBtn.active { background: #0f172a; color: #fff; border-color: #0f172a; }

    .overviewCard {
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      box-shadow: var(--shadowSm);
      padding: 14px 16px;
    }
    .overviewTitle {
      margin: 0;
      font-size: 21px;
      font-weight: 900;
      color: #0f172a;
    }
    .overviewDesc {
      margin: 7px 0 0;
      font-size: 13px;
      color: #475569;
      line-height: 1.5;
    }

    .incidentContext {
      margin-bottom: 12px;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      background: #eff6ff;
      padding: 11px 13px;
    }
    .incidentContext h3 {
      margin: 0;
      font-size: 13px;
      font-weight: 900;
      color: #1e3a8a;
    }
    .incidentContext p {
      margin: 6px 0 0;
      font-size: 12px;
      color: #1e40af;
      line-height: 1.5;
    }

    .hierarchy {
      display: grid;
      gap: 14px;
    }

    /* ===== 재난대책본부 ===== */
    .hqWrap {
      display: flex;
      justify-content: center;
    }
    .hqCard {
      width: min(100%, 620px);
      border: 1px solid #cfd8e3;
      border-radius: 16px;
      background: #fff;
      box-shadow: var(--shadowSm);
      overflow: hidden;
    }
    .hqHead {
      background: #0f172a;
      color: #fff;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .01em;
    }
    .hqBody {
      padding: 14px 16px 16px;
      background: #f8fafc;
    }
    .hqBody .company {
      font-size: 20px;
      color: #0f172a;
      font-weight: 900;
    }
    .hqBody .leader {
      margin-top: 6px;
      font-size: 14px;
      color: #334155;
      font-weight: 800;
    }

    /* ===== 기본 대응 조직 ===== */
    .sectionPanel {
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      background: #f8fafc;
      padding: 14px;
    }
    .sectionHeader {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .sectionHeader h2 {
      margin: 0;
      font-size: 15px;
      color: #0f172a;
      font-weight: 900;
    }
    .sectionBadge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #334155;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 9px;
    }

    .roleGrid {
      width: min(100%, 1060px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .roleCard {
      border: 1px solid #d7deea;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(15, 23, 42, .04);
      overflow: hidden;
      min-height: 150px;
    }
    .roleCard.incidentHighlight,
    .teamCard.incidentHighlight {
      border-color: rgba(37, 99, 235, .42);
      background: #f7fbff;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, .12);
    }
    .roleCardHead {
      border-top: 3px solid #1d4f89;
      padding: 10px 11px 8px;
      font-size: 14px;
      color: #0f172a;
      font-weight: 900;
    }
    .roleCardBody {
      padding: 8px 10px 12px;
    }

    /* ===== 전환 단계 ===== */
    .transitionWrap {
      display: flex;
      justify-content: center;
    }
    .transitionCard {
      width: min(100%, 760px);
      border: 1px solid rgba(245, 158, 11, .42);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255, 251, 235, .95), rgba(255, 247, 237, .95));
      box-shadow: 0 5px 14px rgba(180, 83, 9, .10);
      padding: 14px 16px;
      text-align: center;
    }
    .transitionTitle {
      margin: 0;
      color: #9a3412;
      font-size: 17px;
      font-weight: 900;
    }
    .transitionDesc {
      margin: 6px 0 0;
      color: #9a3412;
      font-size: 12px;
      font-weight: 700;
    }

    /* ===== BCP 운영 조직 ===== */
    .bcpPanel {
      border: 1px solid #d4ece8;
      border-radius: 14px;
      background: #f4fbfa;
      padding: 14px;
    }
    .bcpMainCard {
      border: 1px solid #9fd4cb;
      border-radius: 13px;
      background: #fff;
      box-shadow: 0 2px 7px rgba(15, 23, 42, .05);
      overflow: hidden;
      width: min(100%, 1060px);
      margin: 0 auto;
    }
    .bcpMainHead {
      padding: 11px 13px;
      border-top: 3px solid #0f766e;
      font-size: 15px;
      color: #0f172a;
      font-weight: 900;
      background: #f8fffd;
    }
    .bcpMainBody {
      padding: 8px 10px 12px;
    }

    .teamGrid {
      width: min(100%, 1060px);
      margin: 12px auto 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(280px, 1fr));
      gap: 10px;
    }
    .teamCard {
      border: 1px solid #d4e0ef;
      border-radius: 12px;
      background: #fff;
      padding: 10px;
      min-height: 170px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, .04);
    }
    .teamTitle {
      margin: 0;
      font-size: 14px;
      font-weight: 900;
      color: #0f172a;
    }
    .subLabel {
      margin: 9px 0 6px;
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
    }

    /* ===== 공통 칩 ===== */
    .chipWrap {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: flex-start;
      min-height: 28px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid #cfd8e3;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 700;
      color: #1e293b;
      background: #fff;
      max-width: 100%;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }
    .chip.highlight {
      border-color: rgba(37, 99, 235, .38);
      background: rgba(37, 99, 235, .10);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, .10);
      font-weight: 900;
    }
    .chip.composed {
      border-color: rgba(13, 148, 136, .38);
      background: rgba(20, 184, 166, .10);
    }
    .chip.support {
      border-color: rgba(245, 158, 11, .45);
      background: rgba(251, 191, 36, .15);
    }

    .stateBadge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      border: 1px solid rgba(13, 148, 136, .45);
      background: rgba(20, 184, 166, .13);
      color: #0f766e;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 7px;
      margin-left: 6px;
    }

    @media (max-width: 1040px) {
      .roleGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .roleGrid, .teamGrid { grid-template-columns: 1fr; }
      .teamGrid { margin-top: 10px; }
    }
  </style>
</head>
<body>
  <aside id="sidebarMount"></aside>
  <main class="main"><div class="wrap">
    <div class="topBar">
      <a class="navBtn" href="./org-registry.html">조직 관리</a>
      <a class="navBtn" href="./org.html">평상시 조직도</a>
      <a class="navBtn active" href="./eop-org-chart.html">비상대응 조직도</a>
      <a class="navBtn" href="./index.html">거버넌스 홈</a>
      <button id="modePre" class="navBtn" type="button">BCP 가동 전</button>
      <button id="modePost" class="navBtn" type="button">BCP 가동 후</button>
    </div>

    <section class="overviewCard">
      <h1 class="overviewTitle">비상대응 조직도</h1>
      <p class="overviewDesc">사고 발생 시 기본 대응조직과 재난선포 이후 BCP 가동으로 확장되는 운영조직을 함께 보여줍니다.</p>
    </section>

    <article class="card">
      <div id="incidentContextMount"></div>
      <div id="treeMount" class="hierarchy"></div>
    </article>
  </div></main>

  <script src="../assets/sidebar.js"></script>
  <script src="../assets/data-store.js"></script>
  <script>
    (() => {
      // ===== 저장 키 =====
      const ORG_KEY = (window.DataStore && DataStore.KEY_ORG_REGISTRY) || 'bcms_org_registry_v1';
      const MAP_KEY = (window.DataStore && DataStore.KEY_EOP_ROLE_MAPPING) || 'bcms_eop_role_mapping_v1';
      const MODE_KEY = (window.DataStore && DataStore.KEY_BCP_MODE) || 'bcms_bcp_mode';
      const SELECTED_ORG_KEY = 'bcms_selected_org';
      const INCIDENT_KEY = (window.DataStore && DataStore.KEY_INCIDENTS) || 'bcms_incidents_v1';
      const INCIDENT_UNIFIED_KEY = 'bcmsIncidents';
      const INCIDENT_EXEC_KEY = 'bcmsIncidentExecution';
      const SELECTED_INCIDENT_KEY = 'bcms_selected_incident';
      const SELECTED_INCIDENT_ID_KEY = 'bcmsSelectedIncidentId';
      const FOCUS_TARGET_KEY = 'bcmsFocusTarget';
      const CURRENT_INCIDENT_ID_KEY = 'bcmsCurrentIncidentId';
      const CURRENT_INCIDENT_KEY = 'bcmsCurrentIncident';

      const TEAM_ROLE_MAP = {
        'DC운영(NOC/관제)팀': ['상황관리', '업무환경팀'],
        'SRE/플랫폼운영팀': ['기술복구', '업무환경팀'],
        '애플리케이션운영팀': ['기술복구'],
        '데이터/DB운영팀': ['기술복구'],
        '네트워크운영팀': ['기술복구'],
        '전기팀': ['시설지원(IDC)'],
        '기계(냉각)팀': ['시설지원(IDC)'],
        '방재·소방팀': ['시설지원(IDC)'],
        '정보보호팀': ['보안대응'],
        '고객지원팀': ['대외커뮤니케이션'],
        '서비스품질팀': ['대외커뮤니케이션'],
        '감사·컴플라이언스팀': ['기록·증적'],
        '재난안전(BCM)팀': ['기록·증적'],
        '인사총무팀': ['인력지원팀', '총무지원팀'],
        '구매·자산관리팀': ['물자·구매지원팀']
      };

      const store = (window.DataStore && DataStore.get && DataStore.set) ? DataStore : {
        get: (k, f) => {
          try {
            const raw = localStorage.getItem(k);
            return raw ? JSON.parse(raw) : f;
          } catch {
            return f;
          }
        },
        set: (k, v) => localStorage.setItem(k, JSON.stringify(v))
      };

      // ===== 기본 데이터 정의 =====
      const defaultMapping = {
        basicRoles: {
          situation: ['DC운영(NOC/관제)팀'],
          techRecovery: ['SRE/플랫폼운영팀', '애플리케이션운영팀', '데이터/DB운영팀', '네트워크운영팀'],
          facility: ['전기팀', '기계(냉각)팀', '방재·소방팀'],
          security: ['정보보호팀'],
          communication: ['고객지원팀', '서비스품질팀'],
          record: ['감사·컴플라이언스팀', '재난안전(BCM)팀']
        },
        bcpTeams: {
          workEnv: {
            composed: ['SRE/플랫폼운영팀', 'DC운영(NOC/관제)팀'],
            support: []
          },
          people: {
            composed: ['인사총무팀'],
            support: []
          },
          supply: {
            composed: ['구매·자산관리팀'],
            support: []
          },
          admin: {
            composed: ['인사총무팀'],
            support: []
          }
        }
      };

      const roleDefs = [
        { key: 'situation', label: '상황관리' },
        { key: 'techRecovery', label: '기술복구' },
        { key: 'facility', label: '시설지원(IDC)' },
        { key: 'security', label: '보안대응' },
        { key: 'communication', label: '대외커뮤니케이션' },
        { key: 'record', label: '기록·증적' }
      ];

      const bcpDefs = [
        { key: 'workEnv', label: '업무환경팀' },
        { key: 'people', label: '인력지원팀' },
        { key: 'supply', label: '물자·구매지원팀' },
        { key: 'admin', label: '총무지원팀' }
      ];

      const treeMount = document.getElementById('treeMount');
      const incidentContextMount = document.getElementById('incidentContextMount');
      const modePreBtn = document.getElementById('modePre');
      const modePostBtn = document.getElementById('modePost');
      const query = new URLSearchParams(location.search);

      let focused = false;

      const readSelectedOrg = () => {
        const fromQuery = (query.get('team') || '').trim();
        let fromStorage = '';
        try {
          const parsed = JSON.parse(localStorage.getItem(SELECTED_ORG_KEY) || 'null');
          fromStorage = (parsed?.teamName || '').trim();
        } catch {
          fromStorage = '';
        }
        localStorage.removeItem(SELECTED_ORG_KEY);
        return fromQuery || fromStorage;
      };

      const selectedTeamName = readSelectedOrg();

      const safeParse = (raw, fallback = null) => {
        try { return raw ? JSON.parse(raw) : fallback; } catch { return fallback; }
      };

      const toTeamName = (orgUnit) => {
        if (!orgUnit) return '';
        if (typeof orgUnit === 'string') return orgUnit.trim();
        if (typeof orgUnit === 'object') return String(orgUnit.teamName || orgUnit.name || '').trim();
        return '';
      };
      const uniq = (arr) => [...new Set((arr || []).filter(Boolean))];
      const hasValue = (v) => v !== null && v !== undefined && String(v).trim() !== '';
      const asText = (v) => String(v || '').trim();
      const norm = (v) => asText(v).toLowerCase();
      const toMillis = (v) => {
        if (!hasValue(v)) return 0;
        const ts = new Date(v).getTime();
        return Number.isFinite(ts) ? ts : 0;
      };

      const TEAM_ALIAS_MAP = {
        'noc': 'DC운영(NOC/관제)팀',
        '관제': 'DC운영(NOC/관제)팀',
        'dc운영': 'DC운영(NOC/관제)팀',
        'dc운영팀': 'DC운영(NOC/관제)팀',
        'sre': 'SRE/플랫폼운영팀',
        '플랫폼운영': 'SRE/플랫폼운영팀',
        'db운영': '데이터/DB운영팀',
        '데이터운영': '데이터/DB운영팀',
        'dba': '데이터/DB운영팀',
        '네트워크': '네트워크운영팀',
        '앱운영': '애플리케이션운영팀',
        '애플리케이션': '애플리케이션운영팀',
        'bcm': '재난안전(BCM)팀',
        '재난안전': '재난안전(BCM)팀',
        '컴플라이언스': '감사·컴플라이언스팀',
        '감사': '감사·컴플라이언스팀'
      };

      const canonicalTeamName = (name) => {
        const src = asText(name);
        if (!src) return '';
        const lower = src.toLowerCase();
        if (TEAM_ROLE_MAP[src]) return src;
        if (TEAM_ALIAS_MAP[lower]) return TEAM_ALIAS_MAP[lower];
        const fuzzyKey = Object.keys(TEAM_ALIAS_MAP).find((k) => lower.includes(k));
        return fuzzyKey ? TEAM_ALIAS_MAP[fuzzyKey] : src;
      };

      const normalizeOrgUnits = (orgUnits) => uniq((orgUnits || []).map(toTeamName).filter(Boolean));
      const normalizeTeams = (values) => uniq((Array.isArray(values) ? values : []).map(toTeamName).map(canonicalTeamName).filter(Boolean));
      const deriveResponseRolesFromOrgUnits = (orgUnits) => {
        const roles = normalizeTeams(normalizeOrgUnits(orgUnits)).flatMap((teamName) => TEAM_ROLE_MAP[teamName] || []);
        return uniq(roles);
      };

      const pickFirst = (obj, keys, fallback = '') => {
        for (const key of keys) {
          if (hasValue(obj?.[key])) return obj[key];
        }
        return fallback;
      };

      const normalizeStringList = (value) => {
        if (Array.isArray(value)) return uniq(value.map((x) => asText(x?.teamName || x?.name || x)).filter(Boolean));
        if (typeof value === 'string') return uniq(value.split(',').map((x) => x.trim()).filter(Boolean));
        return [];
      };

      const normalizeIncident = (row = {}, idx = 0) => {
        const incidentId = asText(pickFirst(row, ['incidentId', 'id', 'incidentID', 'incidentRef', 'incidentCode'], `INC-${idx + 1}`));
        const status = asText(pickFirst(row, ['status', 'currentStatus', 'state'], '-'));
        const severity = asText(pickFirst(row, ['severity', 'level'], '-'));
        const currentStage = asText(pickFirst(row, ['currentStage', 'responseStage', 'phase', 'step'], status || '-'));
        const startedAt = pickFirst(row, ['startedAt', 'startTime', 'createdAt', 'incidentStartTime', 'openedAt'], null);
        const endedAt = pickFirst(row, ['endedAt', 'endTime', 'closedAt', 'resolvedAt'], null);

        const affectedRaw = row.affectedServices ?? row.services ?? row.impactedServices ?? row.selectedServices ?? row.serviceNames;
        const relatedRaw = row.relatedTeams ?? row.relatedOrgs ?? row.responseTeams ?? row.selectedTeams ?? row.organizations ?? row.relatedOrgUnits;
        const affectedServices = normalizeStringList(affectedRaw);
        const relatedTeams = normalizeTeams(normalizeStringList(relatedRaw));
        const lowered = status.toLowerCase();
        const isClosed = hasValue(endedAt) || ['종료', '종료됨', 'closed', 'resolved', '종결', '복구 완료'].includes(lowered);

        return { incidentId, status, severity, affectedServices, relatedTeams, currentStage, startedAt, endedAt, isClosed, raw: row };
      };

      const resolveSelectedIncidentId = () => {
        const params = new URLSearchParams(location.search);
        const fromQueryId = asText(params.get('incidentId'));
        const fromQueryRef = asText(params.get('incidentRef'));
        const fromSelectedId = asText(localStorage.getItem(SELECTED_INCIDENT_ID_KEY));
        const selectedObj = safeParse(localStorage.getItem(SELECTED_INCIDENT_KEY), {});
        const focus = safeParse(localStorage.getItem(FOCUS_TARGET_KEY), {});
        return [
          fromQueryId,
          fromQueryRef,
          fromSelectedId,
          asText(selectedObj?.incidentId),
          asText(selectedObj?.incidentRef),
          focus?.type === 'incident' ? asText(focus?.id) : ''
        ].find(Boolean) || null;
      };

      const collectIncidentRows = () => {
        let rows = [];
        const unified = safeParse(localStorage.getItem(INCIDENT_UNIFIED_KEY), null);
        if (Array.isArray(unified)) rows = rows.concat(unified);
        if (unified && typeof unified === 'object') {
          if (unified.currentIncident && typeof unified.currentIncident === 'object') rows.push(unified.currentIncident);
          if (Array.isArray(unified.logs)) rows = rows.concat(unified.logs);
        }

        const legacy = store.get(INCIDENT_KEY, null);
        if (Array.isArray(legacy)) rows = rows.concat(legacy);
        if (legacy && typeof legacy === 'object') {
          if (legacy.currentIncident && typeof legacy.currentIncident === 'object') rows.push(legacy.currentIncident);
          if (Array.isArray(legacy.logs)) rows = rows.concat(legacy.logs);
        }

        const execRows = store.get(INCIDENT_EXEC_KEY, []);
        if (Array.isArray(execRows)) {
          execRows.forEach((row) => {
            rows.push({
              incidentId: row?.incidentId || row?.id || '',
              status: row?.status || row?.currentStatus || '',
              severity: row?.severity || row?.level || '',
              currentStage: row?.currentStage || row?.phase || '',
              startedAt: row?.startedAt || row?.createdAt || '',
              endedAt: row?.endedAt || '',
              relatedTeams: row?.relatedTeams || row?.relatedOrgs || row?.relatedOrgUnits || [],
              affectedServices: row?.affectedServices || row?.services || row?.serviceNames || []
            });
          });
        }

        const normalized = rows.map(normalizeIncident).filter((x) => x.incidentId);
        const byId = new Map();
        normalized.forEach((item) => {
          const prev = byId.get(item.incidentId);
          if (!prev) {
            byId.set(item.incidentId, item);
            return;
          }
          byId.set(item.incidentId, {
            ...prev,
            ...item,
            relatedTeams: item.relatedTeams.length ? item.relatedTeams : prev.relatedTeams,
            affectedServices: item.affectedServices.length ? item.affectedServices : prev.affectedServices,
            startedAt: hasValue(item.startedAt) ? item.startedAt : prev.startedAt,
            endedAt: hasValue(item.endedAt) ? item.endedAt : prev.endedAt,
            isClosed: item.isClosed || prev.isClosed
          });
        });
        return [...byId.values()];
      };

      const inferTeamsFromIncident = (incident) => {
        const text = `${incident?.status || ''} ${incident?.currentStage || ''} ${(incident?.affectedServices || []).join(' ')}`.toLowerCase();
        const inferred = [];
        if (/security|침해|랜섬웨어|보안/.test(text)) inferred.push('정보보호팀');
        if (/db|database|데이터베이스|sql/.test(text)) inferred.push('데이터/DB운영팀');
        if (/network|네트워크/.test(text)) inferred.push('네트워크운영팀');
        if (/전원|정전|냉각|화재|소방/.test(text)) inferred.push('전기팀', '기계(냉각)팀', '방재·소방팀');
        if (/고객|공지|커뮤니케이션|대외/.test(text)) inferred.push('고객지원팀', '서비스품질팀');
        return uniq(inferred);
      };

      const findSelectedIncident = () => {
        const selectedId = resolveSelectedIncidentId();
        const incidents = collectIncidentRows();
        if (!incidents.length) return null;
        if (selectedId) {
          const key = norm(selectedId);
          const matched = incidents.find((x) => norm(x.incidentId) === key)
            || incidents.find((x) => norm(x.raw?.incidentRef) === key)
            || incidents.find((x) => norm(x.raw?.id) === key);
          if (matched) return matched;
        }
        const active = incidents.filter((x) => !x.isClosed).sort((a, b) => toMillis(b.startedAt) - toMillis(a.startedAt));
        if (active.length) return active[0];
        const latest = [...incidents].sort((a, b) => toMillis(b.startedAt) - toMillis(a.startedAt));
        return latest[0] || null;
      };

      const getCurrentIncident = () => {
        const selected = findSelectedIncident();
        if (!selected) return null;

        const merged = {
          ...(selected.raw || {}),
          incidentId: selected.incidentId,
          status: selected.status,
          severity: selected.severity,
          currentStage: selected.currentStage,
          relatedOrgUnits: selected.relatedTeams,
          impactedServiceNames: selected.affectedServices,
          startTime: selected.startedAt || '-',
          endTime: selected.endedAt || '-'
        };

        const incidentId = asText(merged.incidentId);
        if (incidentId) {
          localStorage.setItem(SELECTED_INCIDENT_KEY, JSON.stringify({ incidentId, incidentRef: incidentId }));
          localStorage.setItem(SELECTED_INCIDENT_ID_KEY, incidentId);
          localStorage.setItem(CURRENT_INCIDENT_ID_KEY, incidentId);
          localStorage.setItem(FOCUS_TARGET_KEY, JSON.stringify({ type: 'incident', id: incidentId }));
          const params = new URLSearchParams(location.search);
          params.set('incidentId', incidentId);
          history.replaceState(null, '', `${location.pathname}?${params.toString()}${location.hash || ''}`);
        }

        return merged;
      };

      const renderIncidentContextBanner = (incident) => {
        if (!incident || typeof incident !== 'object') {
          incidentContextMount.innerHTML = '<section class="incidentContext"><h3>현재 사고 연계 조직</h3><p>현재 선택된 사고가 없어 기본 조직도로 표시합니다.</p></section>';
          return;
        }

        const relatedOrgUnits = normalizeTeams(normalizeOrgUnits(incident.relatedOrgUnits || []));
        const inferredTeams = inferTeamsFromIncident(incident);
        const allTeams = uniq([...relatedOrgUnits, ...inferredTeams]);
        const relatedRoles = uniq((incident.relatedResponseRoles || []).length
          ? incident.relatedResponseRoles
          : deriveResponseRolesFromOrgUnits(allTeams));

        incidentContextMount.innerHTML = `
          <section class="incidentContext">
            <h3>현재 사고 기준 관련 대응조직이 강조되어 있습니다.</h3>
            <p>Incident: ${incident.incidentId || '-'} / 상태: ${incident.status || '-'} / 심각도: ${incident.severity || '-'} / 단계: ${incident.currentStage || '-'}</p>
            <p>영향 서비스: ${incident.serviceName || incident.impactedServiceNames?.[0] || '확인 필요'}</p>
            <p>관련 조직: ${allTeams.length ? allTeams.join(', ') : '연계 조직 없음'} (${allTeams.length}개)</p>
            <p>관련 대응 역할: ${relatedRoles.length ? relatedRoles.join(', ') : '연계 역할 없음'}</p>
          </section>
        `;
      };

      const availableTeams = () => {
        const data = store.get(ORG_KEY, { divisions: [] });
        return new Set(
          (data.divisions || [])
            .flatMap((division) => division.teams || [])
            .map((team) => team.name)
        );
      };

      const normalizeMapping = (rawMap) => {
        const merged = { ...defaultMapping };

        // 기존 키 구조와의 호환
        merged.basicRoles = {
          situation: rawMap?.situation || defaultMapping.basicRoles.situation,
          techRecovery: rawMap?.techRecovery || defaultMapping.basicRoles.techRecovery,
          facility: rawMap?.facility || defaultMapping.basicRoles.facility,
          security: rawMap?.security || defaultMapping.basicRoles.security,
          communication: rawMap?.communication || defaultMapping.basicRoles.communication,
          record: rawMap?.record || defaultMapping.basicRoles.record
        };

        merged.bcpTeams = {
          workEnv: {
            composed: rawMap?.bcpWorkEnv || defaultMapping.bcpTeams.workEnv.composed,
            support: ['SRE/플랫폼운영팀', 'DC운영(NOC/관제)팀']
          },
          people: {
            composed: rawMap?.bcpPeople || defaultMapping.bcpTeams.people.composed,
            support: []
          },
          supply: {
            composed: rawMap?.bcpSupply || defaultMapping.bcpTeams.supply.composed,
            support: []
          },
          admin: {
            composed: rawMap?.bcpAdmin || defaultMapping.bcpTeams.admin.composed,
            support: []
          }
        };

        return merged;
      };

      const renderChips = ({ names, kind, available, mode, incidentOrgSet }) => {
        if (!names.length) return '<div class="chipWrap"></div>';

        return `<div class="chipWrap">${names.map((name) => {
          const classes = ['chip'];
          if (kind === 'composed') classes.push('composed');
          if (kind === 'support') classes.push('support');
          if ((selectedTeamName && selectedTeamName === name) || incidentOrgSet.has(name)) classes.push('highlight');

          const activeBadge = mode === 'post' && (kind === 'composed' || kind === 'support')
            ? '<span class="stateBadge">BCP 편성</span>'
            : '';

          return `<span class="${classes.join(' ')}" data-team-name="${name}" title="${available.has(name) ? '' : '조직 관리에서 팀 등록 필요'}">${name}${activeBadge}</span>`;
        }).join('')}</div>`;
      };

      const render = () => {
        const mapData = normalizeMapping(store.get(MAP_KEY, {}) || {});
        const mode = store.get(MODE_KEY, 'pre');
        const available = availableTeams();
        const currentIncident = getCurrentIncident();
        const incidentOrgUnits = normalizeTeams(normalizeOrgUnits(currentIncident?.relatedOrgUnits || []));
        const inferredTeams = inferTeamsFromIncident(currentIncident || {});
        const incidentTeamNames = uniq([...incidentOrgUnits, ...inferredTeams]);
        const incidentRoleNames = uniq((currentIncident?.relatedResponseRoles || []).length
          ? currentIncident.relatedResponseRoles
          : deriveResponseRolesFromOrgUnits(incidentTeamNames));
        const incidentOrgSet = new Set(incidentTeamNames);
        const incidentRoleSet = new Set(incidentRoleNames);

        renderIncidentContextBanner(currentIncident);

        modePreBtn.classList.toggle('active', mode === 'pre');
        modePostBtn.classList.toggle('active', mode === 'post');

        const basicRoleCards = roleDefs.map((role) => {
          const teams = mapData.basicRoles[role.key] || [];
          const cardClass = incidentRoleSet.has(role.label) ? 'roleCard incidentHighlight' : 'roleCard';
          return `
            <section class="${cardClass}" data-team-role="${role.label}">
              <h3 class="roleCardHead">${role.label}</h3>
              <div class="roleCardBody">
                ${renderChips({ names: teams, kind: 'default', available, mode, incidentOrgSet })}
              </div>
            </section>
          `;
        }).join('');

        const bcpTeamCards = bcpDefs.map((team) => {
          const teamData = mapData.bcpTeams[team.key] || { composed: [], support: [] };
          const supportNames = team.key === 'workEnv' ? ['SRE/플랫폼운영팀', 'DC운영(NOC/관제)팀'] : teamData.support;
          const cardClass = incidentRoleSet.has(team.label) ? 'teamCard incidentHighlight' : 'teamCard';

          return `
            <section class="${cardClass}" data-team-role="${team.label}">
              <h4 class="teamTitle">${team.label}</h4>
              <p class="subLabel">편성 조직</p>
              ${renderChips({ names: teamData.composed, kind: 'composed', available, mode, incidentOrgSet })}
              <p class="subLabel">지원 조직</p>
              ${renderChips({ names: supportNames, kind: 'support', available, mode, incidentOrgSet })}
            </section>
          `;
        }).join('');

        treeMount.innerHTML = `
          <section class="hqWrap">
            <section class="hqCard">
              <div class="hqHead">재난대책본부</div>
              <div class="hqBody">
                <div class="company">SJ Digital</div>
                <div class="leader">본부장: 대표이사 박성준</div>
              </div>
            </section>
          </section>

          <section class="sectionPanel">
            <header class="sectionHeader">
              <h2>기본 대응 조직</h2>
              <span class="sectionBadge">1단계</span>
            </header>
            <div class="roleGrid">${basicRoleCards}</div>
          </section>

          <section class="transitionWrap">
            <section class="transitionCard">
              <h2 class="transitionTitle">재난선포 / BCP 가동</h2>
              <p class="transitionDesc">현재 상태: ${mode === 'post' ? '가동' : '대기'} · 기본 대응조직을 유지한 채 BCP 운영조직으로 확장합니다.</p>
            </section>
          </section>

          <section class="bcpPanel">
            <header class="sectionHeader">
              <h2>BCP 운영조직</h2>
              <span class="sectionBadge">3~4단계</span>
            </header>

            <section class="bcpMainCard">
              <div class="bcpMainHead">BCP 운영조직 (확장 운영)</div>
              <div class="bcpMainBody">
                <div class="chipWrap">
                  <span class="chip composed">원 조직은 유지되며, BCP 가동 시 각 팀이 운영 역할로 편성됩니다.</span>
                </div>
              </div>
            </section>

            <div class="teamGrid">${bcpTeamCards}</div>
          </section>
        `;

        if (!focused && selectedTeamName) {
          const target = treeMount.querySelector(`[data-team-name="${CSS.escape(selectedTeamName)}"]`);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            focused = true;
          }
        }
      };

      modePreBtn.addEventListener('click', () => { store.set(MODE_KEY, 'pre'); render(); });
      modePostBtn.addEventListener('click', () => { store.set(MODE_KEY, 'post'); render(); });
      treeMount.addEventListener('click', (e) => {
        const node = e.target.closest('[data-team-name]');
        if (!node) return;
        const current = getCurrentIncident();
        const incidentId = asText(current?.incidentId);
        if (!incidentId) return;
        location.href = `../op-center/incident-dashboard.html?incidentId=${encodeURIComponent(incidentId)}`;
      });
      window.addEventListener('storage', (e) => {
        if ([ORG_KEY, MAP_KEY, MODE_KEY, INCIDENT_KEY, INCIDENT_UNIFIED_KEY, INCIDENT_EXEC_KEY, CURRENT_INCIDENT_KEY, CURRENT_INCIDENT_ID_KEY, SELECTED_INCIDENT_KEY, SELECTED_INCIDENT_ID_KEY, FOCUS_TARGET_KEY].includes(e.key)) render();
      });
      window.addEventListener('focus', render);
      document.addEventListener('DOMContentLoaded', render);

      setInterval(render, 3000);
      render();
    })();
  </script>
</body>
</html>
