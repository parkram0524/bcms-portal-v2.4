<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ISO 22301 요구사항 대응 현황 | BCMS</title>
  <link rel="stylesheet" href="../assets/style.css"/>
  <style>
    html, body{ height:auto !important; min-height:100% !important; }
    .layout{ display:flex !important; min-height:100vh !important; }
    .main{ flex:1 1 auto !important; min-height:100vh !important; }

    :root{
      --line: rgba(15,23,42,.12);
      --textSub: rgba(15,23,42,.66);
      --okBg: rgba(22,163,74,.12);
      --okFg: #166534;
      --partBg: rgba(217,119,6,.14);
      --partFg: #9a3412;
      --gapBg: rgba(148,163,184,.18);
      --gapFg: #334155;
      --accentBg: rgba(37,99,235,.10);
      --accentBd: rgba(37,99,235,.35);
    }

    .wrap{ max-width:1200px; margin:0 auto; padding:24px 18px 60px; }

    .pageHeader h1{ margin:0; font-size:24px; letter-spacing:-.02em; }
    .pageHeader p{ margin:10px 0 0; font-size:15px; line-height:1.7; color:var(--textSub); }

    .tabs{ margin-top:16px; display:flex; gap:8px; flex-wrap:wrap; }
    .tabBtn{
      border:1px solid var(--line);
      background:#fff;
      border-radius:999px;
      padding:9px 14px;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
      color:#0f172a;
    }
    .tabBtn.active{
      border-color:var(--accentBd);
      background:var(--accentBg);
      color:#1d4ed8;
      box-shadow:0 0 0 1px rgba(37,99,235,.08) inset;
    }

    .layer{ margin-top:14px; }
    .layer[hidden]{ display:none; }

    .summaryRow{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      margin-bottom:14px;
    }
    .summaryCard{
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      padding:13px;
    }
    .summaryCard .k{ font-size:14px; font-weight:800; color:var(--textSub); }
    .summaryCard .v{ margin-top:7px; font-size:26px; font-weight:950; }

    .isoGrid{ display:grid; grid-template-columns:350px 1fr; gap:12px; }
    .panel{ border:1px solid var(--line); background:#fff; border-radius:16px; padding:12px; }

    .searchRow{ display:flex; gap:8px; align-items:center; margin-bottom:10px; }
    .searchRow input{
      width:100%; border:1px solid var(--line); border-radius:10px;
      padding:10px 11px; font-size:15px;
    }
    .searchRow span{ font-size:14px; color:var(--textSub); font-weight:700; }

    .clauseList{ display:flex; flex-direction:column; gap:8px; max-height:620px; overflow:auto; }
    .clauseItem{
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      padding:10px;
      cursor:pointer;
    }
    .clauseItem.active{ border-color:var(--accentBd); background:#f8fbff; }
    .clauseHead{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
    .clauseHead strong{ font-size:16px; }
    .clauseItem p{ margin:6px 0 0; font-size:14px; line-height:1.5; color:var(--textSub); }

    .statusBadge{
      display:inline-flex; align-items:center; border-radius:999px; padding:4px 10px;
      border:1px solid transparent; font-size:12px; font-weight:900; white-space:nowrap;
    }
    .status-ok{ background:var(--okBg); border-color:rgba(22,163,74,.28); color:var(--okFg); }
    .status-partial{ background:var(--partBg); border-color:rgba(217,119,6,.34); color:var(--partFg); }
    .status-gap{ background:var(--gapBg); border-color:rgba(100,116,139,.34); color:var(--gapFg); }

    .detailHead{ border-bottom:1px solid rgba(15,23,42,.08); padding-bottom:10px; margin-bottom:12px; }
    .detailHead h2{ margin:0; font-size:18px; }
    .detailHead p{ margin:8px 0 0; font-size:15px; line-height:1.65; color:var(--textSub); }

    .block{ border:1px solid var(--line); border-radius:12px; background:#fff; padding:11px; margin-top:10px; }
    .block h3{ margin:0 0 8px; font-size:16px; }
    .row{ border:1px solid rgba(15,23,42,.1); border-radius:10px; padding:10px; margin-top:8px; }
    .row b{ font-size:15px; }
    .row p{ margin:6px 0 0; font-size:14px; line-height:1.55; color:var(--textSub); }
    .linkBtn{
      display:inline-flex; align-items:center; margin-top:7px; border:1px solid var(--line);
      border-radius:10px; background:#fff; padding:6px 10px; text-decoration:none;
      color:#0f172a; font-size:13px; font-weight:800;
    }

    .opsHeader{ border:1px solid var(--line); border-radius:14px; background:#fff; padding:12px; margin-bottom:12px; }
    .opsHeader p{ margin:0; font-size:15px; color:var(--textSub); line-height:1.65; }

    .opsGroup{ margin-top:12px; }
    .opsGroup h3{ margin:0 0 8px; font-size:18px; }
    .opsCards{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .opsCard{ border:1px solid var(--line); border-radius:14px; background:#fff; padding:12px; }
    .opsId{ font-size:13px; font-weight:900; color:#1e40af; }
    .opsDesc{ margin-top:7px; font-size:16px; line-height:1.55; }
    .chips{ margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
    .chip{ border:1px solid rgba(15,23,42,.14); border-radius:999px; padding:4px 10px; font-size:13px; background:#fff; }
    .subTitle{ margin-top:10px; font-size:14px; font-weight:800; color:var(--textSub); }

    @media (max-width:980px){
      .isoGrid{ grid-template-columns:1fr; }
      .opsCards{ grid-template-columns:1fr; }
      .summaryRow{ grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside id="sidebarMount"></aside>
    <main class="main">
      <div class="wrap">
        <section class="pageHeader">
          <h1>ISO 22301 요구사항 대응 현황</h1>
          <p>BCMS Portal은 ISO 22301 요구사항과 실제 운영 요구사항을 함께 관리합니다. ISO 요구사항은 감사 대응을 위한 구조이며, 운영 요구사항은 실제 BCMS 운영 규칙을 정의합니다.</p>
        </section>

        <div class="tabs">
          <button class="tabBtn active" id="tabIso" type="button">ISO 요구사항</button>
          <button class="tabBtn" id="tabOps" type="button">운영 요구사항</button>
        </div>

        <section id="layerIso" class="layer">
          <div class="summaryRow" id="isoSummary"></div>
          <div class="isoGrid">
            <aside class="panel">
              <div class="searchRow">
                <input id="q" placeholder="조항 검색 (예: 8.4, 내부심사, 리스크)"/>
                <span id="cnt">0</span>
              </div>
              <div class="clauseList" id="clauseList"></div>
            </aside>
            <section class="panel" id="detail"></section>
          </div>
        </section>

        <section id="layerOps" class="layer" hidden>
          <article class="opsHeader">
            <p>운영 요구사항은 실제 BCMS 운영 시 지켜야 할 규칙입니다. 사고 대응, 증적 관리, 복구 활동이 누락되지 않도록 핵심 항목만 간결하게 관리합니다.</p>
          </article>
          <div id="opsMount"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="../assets/sidebar.js"></script>
  <script>
    (() => {
      const statusLabel = {
        ok: '구현 완료',
        partial: '일부 구현',
        gap: '추가 설계 필요'
      };
      const statusClass = {
        ok: 'status-ok',
        partial: 'status-partial',
        gap: 'status-gap'
      };

      const clauses = [
        {
          id: '4',
          title: '4. 조직 상황',
          desc: '조직 이해관계자 / 적용 범위 / BCMS 목표 정의',
          status: 'partial',
          intent: '조직의 내부·외부 이슈와 이해관계자를 반영해 BCMS 적용 범위를 유지합니다.',
          links: [
            { name: '정책·범위 관리', desc: 'BCMS 정책/범위/목표 관리', href: './policy.html' },
            { name: '시스템 등록', desc: '핵심 서비스 범위 확인', href: './system-registry.html' }
          ],
          gaps: ['이해관계자 요구사항 정기 검토 템플릿 보강']
        },
        {
          id: '5',
          title: '5. 리더십',
          desc: '경영진 책임 / 정책 승인 / 역할 위임',
          status: 'ok',
          intent: '경영진의 책임과 지원 체계가 운영 절차와 연결되어야 합니다.',
          links: [
            { name: '조직도', desc: '역할·책임 체계 점검', href: './org.html' },
            { name: '비상대응 조직도', desc: '비상시 지휘체계 확인', href: './eop-org-chart.html' }
          ],
          gaps: []
        },
        {
          id: '6',
          title: '6. 계획',
          desc: '리스크 대응 / 목표 수립 / 변경 계획',
          status: 'partial',
          intent: '리스크·기회 기반으로 BCMS 목표와 실행 계획을 관리합니다.',
          links: [
            { name: 'Risk/BIA', desc: '업무영향 및 우선순위 분석', href: '../risk-bia/index.html' },
            { name: '전략/계획', desc: 'BCP·DR 계획 관리', href: '../strategy-plans/index.html' }
          ],
          gaps: ['변경관리 이력과 목표 추적 지표 보강']
        },
        {
          id: '7',
          title: '7. 지원',
          desc: '역량 / 인식 / 의사소통 / 문서화',
          status: 'partial',
          intent: '운영 인력 역량과 커뮤니케이션, 문서화 관리가 일관되어야 합니다.',
          links: [
            { name: '증적 관리', desc: '운영 기록/Evidence 관리', href: '../audit/evidence.html' },
            { name: '개선조치', desc: '지적사항 후속 조치 관리', href: '../audit/capa.html' }
          ],
          gaps: ['역량 평가 이력과 교육 추적 기능 연동']
        },
        {
          id: '8',
          title: '8. 운영',
          desc: '사고 대응 / BCP 실행 / 복구 절차 운영',
          status: 'ok',
          intent: '사고 대응과 복구 실행, 기록 관리가 운영 흐름에 반영되어야 합니다.',
          links: [
            { name: 'Incident Dashboard', desc: '사고 등록/대응/종료', href: '../op-center/incident-dashboard.html' },
            { name: '운영 현황', desc: '미처리 항목 모니터링', href: '../op-center/ops-status.html' }
          ],
          gaps: []
        },
        {
          id: '9',
          title: '9. 성과 평가',
          desc: '모니터링 / 내부심사 / 경영검토',
          status: 'partial',
          intent: '내부심사와 모니터링 결과를 개선조치로 연결해야 합니다.',
          links: [
            { name: '감사 화면', desc: '심사 및 점검 결과 확인', href: '../audit/index.html' },
            { name: '개선조치', desc: '후속 조치 추적', href: '../audit/capa.html' }
          ],
          gaps: ['경영검토 회의록 자동 연결 강화']
        },
        {
          id: '10',
          title: '10. 개선',
          desc: '시정조치 / 지속 개선 / 재발 방지',
          status: 'ok',
          intent: '사고 종료 후 시정·예방 조치가 닫히는 흐름을 유지해야 합니다.',
          links: [
            { name: '개선조치', desc: '조치 상태 관리', href: '../audit/capa.html' },
            { name: '운영 현황', desc: '미완료 조치 집중 모니터링', href: '../op-center/ops-status.html' }
          ],
          gaps: []
        }
      ];

      const operationRequirements = [
        { id:'REQ-SVC-001', category:'서비스', description:'서비스 장애 발생 시 15분 내 상황 공유', links:['Incident Dashboard','Evidence'], orgUnits:['서비스품질팀','고객지원팀'] },
        { id:'REQ-INC-001', category:'사고 대응', description:'모든 사고는 Incident Dashboard에 등록', links:['Incident Dashboard','Evidence'], orgUnits:['재난안전(BCM)팀'] },
        { id:'REQ-LOG-001', category:'기록 / Evidence', description:'모든 사고 대응 기록은 Evidence로 저장', links:['Evidence','Audit'], orgUnits:['감사·컴플라이언스팀'] },
        { id:'REQ-DR-001', category:'복구 / DR', description:'DR 전환 목표시간 1시간', links:['BIA','DR Plan'], orgUnits:['SRE/플랫폼운영팀','DC운영(NOC/관제)팀'] }
      ];

      const q = document.getElementById('q');
      const cnt = document.getElementById('cnt');
      const clauseList = document.getElementById('clauseList');
      const detail = document.getElementById('detail');
      const isoSummary = document.getElementById('isoSummary');
      const opsMount = document.getElementById('opsMount');
      const tabIso = document.getElementById('tabIso');
      const tabOps = document.getElementById('tabOps');
      const layerIso = document.getElementById('layerIso');
      const layerOps = document.getElementById('layerOps');

      let selectedId = clauses[0].id;

      const renderSummary = (list) => {
        const total = list.length;
        const ok = list.filter((c) => c.status === 'ok').length;
        const partial = list.filter((c) => c.status === 'partial').length;
        const gap = list.filter((c) => c.status === 'gap').length;
        isoSummary.innerHTML = `
          <article class="summaryCard"><div class="k">전체 조항</div><div class="v">${total}</div></article>
          <article class="summaryCard"><div class="k">구현 완료</div><div class="v">${ok}</div></article>
          <article class="summaryCard"><div class="k">일부 구현</div><div class="v">${partial}</div></article>
          <article class="summaryCard"><div class="k">추가 설계 필요</div><div class="v">${gap}</div></article>
        `;
      };

      const renderList = () => {
        const keyword = (q.value || '').trim().toLowerCase();
        const filtered = clauses.filter((item) => {
          const t = `${item.id} ${item.title} ${item.desc} ${item.intent}`.toLowerCase();
          return !keyword || t.includes(keyword);
        });
        if (!filtered.some((item) => item.id === selectedId)) {
          selectedId = filtered[0] ? filtered[0].id : clauses[0].id;
        }
        cnt.textContent = `${filtered.length}건`;
        clauseList.innerHTML = filtered.map((item) => `
          <article class="clauseItem ${item.id === selectedId ? 'active' : ''}" data-id="${item.id}">
            <div class="clauseHead">
              <strong>${item.title}</strong>
              <span class="statusBadge ${statusClass[item.status]}">${statusLabel[item.status]}</span>
            </div>
            <p>${item.desc}</p>
          </article>
        `).join('') || '<div class="row"><b>검색 결과 없음</b><p>다른 검색어로 확인해 주세요.</p></div>';
      };

      const renderDetail = () => {
        const item = clauses.find((c) => c.id === selectedId) || clauses[0];
        detail.innerHTML = `
          <section class="detailHead">
            <h2>${item.title}</h2>
            <p>${item.intent}</p>
            <div style="margin-top:10px;"><span class="statusBadge ${statusClass[item.status]}">${statusLabel[item.status]}</span></div>
          </section>

          <section class="block">
            <h3>현재 대응 기능</h3>
            ${item.links.map((link) => `
              <article class="row">
                <b>${link.name}</b>
                <p>${link.desc}</p>
                <a class="linkBtn" href="${link.href}">바로가기</a>
              </article>
            `).join('')}
          </section>

          <section class="block">
            <h3>보완 필요 사항</h3>
            ${item.gaps.length
              ? item.gaps.map((g) => `<article class="row"><b>검토 항목</b><p>${g}</p></article>`).join('')
              : '<article class="row"><b>현재 상태</b><p>추가 설계 필요 항목이 없습니다.</p></article>'}
          </section>
        `;
      };

      const renderOps = () => {
        const categories = ['서비스', '사고 대응', '기록 / Evidence', '복구 / DR'];
        opsMount.innerHTML = categories.map((category) => {
          const items = operationRequirements.filter((req) => req.category === category);
          return `
            <section class="opsGroup">
              <h3>${category}</h3>
              <div class="opsCards">
                ${items.map((item) => `
                  <article class="opsCard">
                    <div class="opsId">${item.id}</div>
                    <div class="opsDesc">${item.description}</div>
                    <div class="subTitle">연결 기능</div>
                    <div class="chips">${item.links.map((v) => `<span class="chip">${v}</span>`).join('')}</div>
                    ${item.orgUnits?.length ? `<div class="subTitle">관련 조직</div><div class="chips">${item.orgUnits.map((v) => `<span class="chip">${v}</span>`).join('')}</div>` : ''}
                  </article>
                `).join('')}
              </div>
            </section>
          `;
        }).join('');
      };

      const switchLayer = (mode) => {
        const iso = mode === 'iso';
        tabIso.classList.toggle('active', iso);
        tabOps.classList.toggle('active', !iso);
        layerIso.hidden = !iso;
        layerOps.hidden = iso;
      };

      q.addEventListener('input', () => {
        renderList();
        renderDetail();
      });
      clauseList.addEventListener('click', (e) => {
        const card = e.target.closest('.clauseItem[data-id]');
        if (!card) return;
        selectedId = card.dataset.id;
        renderList();
        renderDetail();
      });
      tabIso.addEventListener('click', () => switchLayer('iso'));
      tabOps.addEventListener('click', () => switchLayer('ops'));

      renderSummary(clauses);
      renderList();
      renderDetail();
      renderOps();
      switchLayer('iso');
    })();
  </script>
</body>
</html>
