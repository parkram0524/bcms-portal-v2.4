<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Service Registry (서비스 레지스트리) | Governance</title>
  <link rel="stylesheet" href="../assets/style.css"/>
  <style>
    .layout-grid{ display:grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap:14px; }
    .form-card{ grid-column: span 12; }
    .list-card{ grid-column: span 12; }

    .form-grid{ display:grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap:12px; }
    .col-6{ grid-column: span 6; }
    .col-4{ grid-column: span 4; }
    .col-3{ grid-column: span 3; }
    .col-12{ grid-column: span 12; }

    .field label{ display:block; font-size:13px; font-weight:800; margin-bottom:6px; }
    .field input, .field select, .field textarea{ width:100%; padding:10px 12px; }
    .field textarea{ min-height:88px; resize:vertical; }

    .inline-split{ display:grid; grid-template-columns: 1fr 110px; gap:8px; }
    .actions-row{ display:flex; flex-wrap:wrap; gap:8px; }
    .hint-line{ margin-top:8px; font-size:13px; }

    .dept-picker{ display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
    .org-warning{ margin-top:8px; padding:10px 12px; border:1px solid var(--lineStrong); border-radius:10px; background:#f8fafc; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .org-warning strong{ font-size:13px; color:var(--mutedStrong); }

    .toolbar{ display:grid; grid-template-columns: 1fr 220px; gap:10px; margin-bottom:12px; }
    .tableWrap{ overflow:auto; }
    table{ width:100%; min-width:980px; }
    th, td{ padding:10px 12px; font-size:14px; text-align:left; }

    .ownerCell{ line-height:1.3; }
    .ownerCell .division{ font-size:12px; color:var(--mutedStrong); font-weight:700; }
    .ownerCell .team{ font-size:13px; color:var(--ink); font-weight:800; }
    .ownerCell .deleted{ color:#991b1b; }

    .importance{ display:inline-flex; align-items:center; border-radius:999px; padding:4px 10px; border:1px solid var(--lineStrong); font-size:12px; font-weight:800; }
    .imp-low{ background:rgba(34,197,94,.10); color:#166534; border-color:rgba(34,197,94,.32); }
    .imp-mid{ background:rgba(234,179,8,.16); color:#854d0e; border-color:rgba(234,179,8,.34); }
    .imp-high{ background:rgba(249,115,22,.14); color:#9a3412; border-color:rgba(249,115,22,.34); }
    .imp-critical{ background:rgba(239,68,68,.12); color:#991b1b; border-color:rgba(239,68,68,.34); }

    .table-actions{ display:flex; gap:6px; }
    .empty{ padding:16px 12px; text-align:center; color:var(--muted); }
    .focusRow td{ background:rgba(37,99,235,.08); }
    .focusName{ display:inline-flex; align-items:center; gap:6px; font-weight:900; }
    .focusBadge{ display:inline-flex; align-items:center; border-radius:999px; border:1px solid rgba(37,99,235,.35); background:rgba(37,99,235,.12); color:#1d4ed8; font-size:11px; font-weight:900; padding:3px 8px; }

    @media (max-width: 980px){
      .toolbar{ grid-template-columns: 1fr; }
      .dept-picker{ grid-template-columns: 1fr; }
      .col-6, .col-4, .col-3{ grid-column: span 12; }
      .inline-split{ grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <aside id="sidebarMount"></aside>

  <main class="main">
    <div class="wrap">
      <h1 class="page-title">🗂️ Service Registry (서비스 레지스트리)</h1>

      <section class="layout-grid">
        <article class="card form-card">
          <h3>서비스 등록 / 수정</h3>
          <p class="hint">BCMS 관리 대상 서비스를 등록하고 RTO/RPO를 유지 관리합니다.</p>

          <form id="serviceForm" class="form-grid">
            <input type="hidden" id="serviceId"/>

            <div class="field col-6">
              <label for="serviceName">서비스명 *</label>
              <input id="serviceName" type="text" required placeholder="예: 결제 API"/>
            </div>

            <div class="field col-6">
              <label for="divisionSelect">담당부서 *</label>
              <div class="dept-picker">
                <select id="divisionSelect" required>
                  <option value="">본부 선택</option>
                </select>
                <select id="teamSelect" required>
                  <option value="">팀 선택</option>
                </select>
              </div>
              <div id="orgWarning" class="org-warning" hidden>
                <strong>조직 정보가 없습니다. 거버넌스 &gt; 조직 관리에서 먼저 등록해 주세요.</strong>
                <a class="btn" href="./org-registry.html">조직 관리로 이동</a>
              </div>
            </div>

            <div class="field col-4">
              <label for="importance">중요도 *</label>
              <select id="importance" required>
                <option value="낮음">낮음</option>
                <option value="보통" selected>보통</option>
                <option value="높음">높음</option>
                <option value="매우높음">매우높음</option>
              </select>
            </div>

            <div class="field col-4">
              <label for="rtoValue">RTO (복구목표시간)</label>
              <div class="inline-split">
                <input id="rtoValue" type="number" min="0" step="1" placeholder="예: 4"/>
                <select id="rtoUnit">
                  <option value="분">분</option>
                  <option value="시간" selected>시간</option>
                </select>
              </div>
            </div>

            <div class="field col-4">
              <label for="rpoValue">RPO (복구목표시점)</label>
              <div class="inline-split">
                <input id="rpoValue" type="number" min="0" step="1" placeholder="예: 30"/>
                <select id="rpoUnit">
                  <option value="분" selected>분</option>
                  <option value="시간">시간</option>
                </select>
              </div>
            </div>

            <div class="field col-12">
              <label for="note">비고</label>
              <textarea id="note" placeholder="선택 입력"></textarea>
            </div>

            <div class="col-12 actions-row">
              <button class="btn" id="saveBtn" type="submit">저장</button>
              <button class="btn" id="cancelEditBtn" type="button">입력 초기화</button>
            </div>
          </form>
          <p class="hint-line">저장 키: <strong>bcms_service_registry_v1</strong></p>
        </article>

        <article class="card list-card">
          <h3>서비스 목록</h3>
          <div class="toolbar">
            <input id="searchInput" type="search" placeholder="서비스명/담당부서 검색"/>
            <select id="importanceFilter">
              <option value="전체">전체 중요도</option>
              <option value="낮음">낮음</option>
              <option value="보통">보통</option>
              <option value="높음">높음</option>
              <option value="매우높음">매우높음</option>
            </select>
          </div>

          <div class="tableWrap">
            <table>
              <thead>
                <tr>
                  <th>서비스명</th>
                  <th>담당부서</th>
                  <th>중요도</th>
                  <th>RTO</th>
                  <th>RPO</th>
                  <th>수정일시</th>
                  <th>관리</th>
                </tr>
              </thead>
              <tbody id="registryBody"></tbody>
            </table>
          </div>
        </article>
      </section>
    </div>
  </main>

  <script src="../assets/sidebar.js"></script>
  <script src="../assets/data-store.js"></script>
  <script>
    (() => {
      const STORAGE_KEY = (window.DataStore && DataStore.KEY_SERVICE_REGISTRY) || 'bcms_service_registry_v1';
      const ORG_KEY = (window.DataStore && DataStore.KEY_ORG_REGISTRY) || 'bcms_org_registry_v1';
      const SELECTED_SERVICE_KEY = 'bcms_selected_service';

      const fallbackStore = {
        get:(k, fallback)=>{ try{ const raw = localStorage.getItem(k); return raw ? JSON.parse(raw) : fallback; } catch { return fallback; } },
        set:(k, value)=>localStorage.setItem(k, JSON.stringify(value)),
        update:(k, updater)=>{ const next = updater(fallbackStore.get(k, null)); fallbackStore.set(k, next); return next; },
        uid:()=>`svc_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
        nowISO:()=>new Date().toISOString(),
      };
      const store = (window.DataStore && DataStore.get && DataStore.set && DataStore.update) ? DataStore : fallbackStore;

      const makeUid = () => (store.uid ? store.uid('svc') : fallbackStore.uid());
      const nowISO = () => (store.nowISO ? store.nowISO() : fallbackStore.nowISO());

      const serviceForm = document.getElementById('serviceForm');
      const serviceId = document.getElementById('serviceId');
      const serviceName = document.getElementById('serviceName');
      const divisionSelect = document.getElementById('divisionSelect');
      const teamSelect = document.getElementById('teamSelect');
      const orgWarning = document.getElementById('orgWarning');
      const importance = document.getElementById('importance');
      const rtoValue = document.getElementById('rtoValue');
      const rtoUnit = document.getElementById('rtoUnit');
      const rpoValue = document.getElementById('rpoValue');
      const rpoUnit = document.getElementById('rpoUnit');
      const note = document.getElementById('note');
      const searchInput = document.getElementById('searchInput');
      const importanceFilter = document.getElementById('importanceFilter');
      const registryBody = document.getElementById('registryBody');
      const query = new URLSearchParams(location.search);

      const readSelectedService = () => {
        const fromQuery = (query.get('q') || '').trim();
        let fromStorage = '';
        try {
          const parsed = JSON.parse(localStorage.getItem(SELECTED_SERVICE_KEY) || 'null');
          fromStorage = (parsed?.serviceName || '').trim();
        } catch {
          fromStorage = '';
        }
        localStorage.removeItem(SELECTED_SERVICE_KEY);
        return fromQuery || fromStorage;
      };
      const selectedServiceName = readSelectedService();
      let focusDone = false;

      const toDisplayDate = (isoString) => {
        if (!isoString) return '-';
        const d = new Date(isoString);
        if (Number.isNaN(d.getTime())) return '-';
        return d.toLocaleString('ko-KR', { hour12: false });
      };

      const formatObjective = (value, unit) => {
        if (value === '' || value === null || value === undefined) return '-';
        return `${value}${unit || ''}`;
      };

      const importanceClass = (level) => {
        if (level === '낮음') return 'imp-low';
        if (level === '높음') return 'imp-high';
        if (level === '매우높음') return 'imp-critical';
        return 'imp-mid';
      };

      const sampleData = () => ([
        { id: makeUid(), name: '결제 API', divisionId: 'it', divisionName: 'IT서비스운영본부', teamId: 'app', teamName: '애플리케이션운영팀', dept: 'IT서비스운영본부 / 애플리케이션운영팀', importance: '매우높음', rtoValue: 1, rtoUnit: '시간', rpoValue: 10, rpoUnit: '분', note: 'PG 연동 핵심', updatedAt: nowISO() },
        { id: makeUid(), name: '인증 서비스', divisionId: 'risk', divisionName: '리스크·컴플라이언스본부', teamId: 'security', teamName: '정보보호팀', dept: '리스크·컴플라이언스본부 / 정보보호팀', importance: '매우높음', rtoValue: 30, rtoUnit: '분', rpoValue: 5, rpoUnit: '분', note: 'SSO/OAuth', updatedAt: nowISO() },
        { id: makeUid(), name: '모니터링', divisionId: 'it', divisionName: 'IT서비스운영본부', teamId: 'sre', teamName: 'SRE/플랫폼운영팀', dept: 'IT서비스운영본부 / SRE/플랫폼운영팀', importance: '높음', rtoValue: 2, rtoUnit: '시간', rpoValue: 15, rpoUnit: '분', note: '관제 대시보드', updatedAt: nowISO() },
      ]);

      const getOrgDivisions = () => {
        const org = store.get(ORG_KEY, { divisions: [] });
        return Array.isArray(org?.divisions) ? org.divisions : [];
      };

      const buildOrgIndex = () => {
        if (window.DataStore && DataStore.getAllTeams) {
          const teams = DataStore.getAllTeams();
          const divisionMap = new Map();
          const teamMap = new Map();
          teams.forEach((team) => {
            const divisionId = String(team.division || '기타');
            if (!divisionMap.has(divisionId)) divisionMap.set(divisionId, { id: divisionId, name: team.division || '기타', teams: [] });
            const division = divisionMap.get(divisionId);
            const safeTeam = { id: team.id, name: team.name, divisionId, divisionName: division.name };
            division.teams.push(safeTeam);
            teamMap.set(safeTeam.id, safeTeam);
          });
          return { divisions: [...divisionMap.values()], divisionMap, teamMap };
        }
        const divisions = getOrgDivisions();
        const divisionMap = new Map();
        const teamMap = new Map();
        divisions.forEach((division) => {
          if (!division || !division.id) return;
          const safeDivision = {
            id: division.id,
            name: division.name || '미지정 본부',
            teams: Array.isArray(division.teams) ? division.teams : [],
          };
          divisionMap.set(safeDivision.id, safeDivision);
          safeDivision.teams.forEach((team) => {
            if (!team || !team.id) return;
            teamMap.set(team.id, {
              id: team.id,
              name: team.name || '미지정 팀',
              divisionId: safeDivision.id,
              divisionName: safeDivision.name,
            });
          });
        });
        return { divisions, divisionMap, teamMap };
      };

      const loadItems = () => {
        if (window.DataStore && DataStore.getAllServices) {
          const rows = DataStore.getAllServices();
          if (rows.length) {
            return rows.map((item) => ({
              id: item.id,
              name: item.name,
              divisionId: '',
              divisionName: '',
              teamId: item.ownerTeamId || '',
              teamName: item.ownerTeamName || '',
              dept: item.ownerTeamName || '',
              importance: item.criticality || '보통',
              rtoValue: '',
              rtoUnit: '시간',
              rpoValue: '',
              rpoUnit: '분',
              note: item.description || '',
              active: item.active !== false,
              updatedAt: item.updatedAt || nowISO()
            }));
          }
        }
        const items = store.get(STORAGE_KEY, null);
        if (!Array.isArray(items) || !items.length) {
          const seeds = sampleData();
          store.set(STORAGE_KEY, seeds);
          return seeds;
        }
        return items;
      };

      let rows = loadItems();
      let currentOrg = buildOrgIndex();

      const hasOrgData = () => currentOrg.divisions.some((d) => Array.isArray(d.teams) && d.teams.length);

      const setOrgWarning = () => {
        const empty = !hasOrgData();
        orgWarning.hidden = !empty;
        divisionSelect.disabled = empty;
        teamSelect.disabled = empty;
      };

      const renderDivisionOptions = () => {
        const previous = divisionSelect.value;
        divisionSelect.innerHTML = '<option value="">본부 선택</option>';
        currentOrg.divisions.forEach((division) => {
          const opt = document.createElement('option');
          opt.value = division.id;
          opt.textContent = division.name || '미지정 본부';
          divisionSelect.appendChild(opt);
        });
        if (previous && currentOrg.divisionMap.has(previous)) divisionSelect.value = previous;
      };

      const renderTeamOptions = (divisionId, preferredTeamId = '') => {
        teamSelect.innerHTML = '<option value="">팀 선택</option>';
        if (!divisionId || !currentOrg.divisionMap.has(divisionId)) return;
        const division = currentOrg.divisionMap.get(divisionId);
        (division.teams || []).forEach((team) => {
          const opt = document.createElement('option');
          opt.value = team.id;
          opt.textContent = team.name || '미지정 팀';
          teamSelect.appendChild(opt);
        });
        if (preferredTeamId && currentOrg.teamMap.has(preferredTeamId)) {
          teamSelect.value = preferredTeamId;
        }
      };

      const resolveOwner = (item) => {
        if (item.teamId && currentOrg.teamMap.has(item.teamId)) {
          const team = currentOrg.teamMap.get(item.teamId);
          return {
            divisionName: team.divisionName,
            teamName: team.name,
            status: 'active',
          };
        }

        if (item.teamId) {
          return {
            divisionName: item.divisionName || '삭제된 조직',
            teamName: item.teamName || '삭제된 조직',
            status: 'deleted',
          };
        }

        if (item.dept) {
          return {
            divisionName: item.dept,
            teamName: '-',
            status: 'legacy',
          };
        }

        return {
          divisionName: '미지정',
          teamName: '미지정',
          status: 'deleted',
        };
      };

      const ownerSearchText = (item) => {
        const owner = resolveOwner(item);
        return `${owner.divisionName} ${owner.teamName}`.toLowerCase();
      };

      const reconcileRowsWithOrg = () => {
        let changed = false;
        rows = rows.map((item) => {
          if (!item.teamId || !currentOrg.teamMap.has(item.teamId)) return item;
          const team = currentOrg.teamMap.get(item.teamId);
          const next = {
            ...item,
            divisionId: team.divisionId,
            divisionName: team.divisionName,
            teamName: team.name,
            dept: `${team.divisionName} / ${team.name}`,
          };
          if (next.divisionName !== item.divisionName || next.teamName !== item.teamName || next.dept !== item.dept || next.divisionId !== item.divisionId) {
            changed = true;
          }
          return next;
        });
        if (changed) saveRows();
      };

      const resetForm = () => {
        serviceForm.reset();
        serviceId.value = '';
        importance.value = '보통';
        rtoUnit.value = '시간';
        rpoUnit.value = '분';
        renderDivisionOptions();
        renderTeamOptions(divisionSelect.value);
      };

      const saveRows = () => {
        if (window.DataStore && DataStore.writeServices) {
          DataStore.writeServices(rows.map((item) => ({
            id: item.id,
            name: item.name,
            ownerTeamId: item.teamId,
            ownerTeamName: item.teamName,
            criticality: item.importance,
            description: item.note,
            active: item.active !== false,
            updatedAt: item.updatedAt || nowISO()
          })));
          rows = loadItems();
          return;
        }
        rows = store.update(STORAGE_KEY, () => rows);
      };

      const filteredRows = () => {
        const q = (searchInput.value || '').trim().toLowerCase();
        const filter = importanceFilter.value;
        return rows.filter((item) => {
          const name = (item.name || '').toLowerCase();
          const dept = ownerSearchText(item);
          const matchKeyword = !q || name.includes(q) || dept.includes(q);
          const matchImportance = filter === '전체' || item.importance === filter;
          return matchKeyword && matchImportance;
        });
      };

      const renderTable = () => {
        const view = filteredRows();
        registryBody.innerHTML = '';

        if (!view.length) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td class="empty" colspan="7">조건에 맞는 서비스가 없습니다.</td>';
          registryBody.appendChild(tr);
          return;
        }

        view.forEach((item) => {
          const owner = resolveOwner(item);
          const ownerDeletedClass = owner.status === 'deleted' ? 'deleted' : '';

          const tr = document.createElement('tr');
          const isFocus = selectedServiceName && item.name === selectedServiceName;
          tr.dataset.serviceName = item.name || '';
          if (isFocus) tr.classList.add('focusRow');
          tr.innerHTML = `
            <td><span class="focusName">${item.name}${isFocus ? '<span class="focusBadge">선택됨</span>' : ''}</span></td>
            <td>
              <div class="ownerCell ${ownerDeletedClass}">
                <div class="division">${owner.divisionName}</div>
                <div class="team ${ownerDeletedClass}">${owner.teamName}</div>
              </div>
            </td>
            <td><span class="importance ${importanceClass(item.importance)}">${item.importance}</span></td>
            <td>${formatObjective(item.rtoValue, item.rtoUnit)}</td>
            <td>${formatObjective(item.rpoValue, item.rpoUnit)}</td>
            <td>${toDisplayDate(item.updatedAt)}</td>
            <td>
              <div class="table-actions">
                <button type="button" class="btn" data-edit="${item.id}">수정</button>
                <button type="button" class="btn" data-delete="${item.id}">삭제</button>
              </div>
            </td>
          `;
          registryBody.appendChild(tr);
        });

        if (selectedServiceName && !focusDone) {
          const row = registryBody.querySelector(`tr[data-service-name="${CSS.escape(selectedServiceName)}"]`);
          if (row) {
            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
            focusDone = true;
          }
        }
      };

      serviceForm.addEventListener('submit', (e) => {
        e.preventDefault();

        if (!hasOrgData()) {
          window.alert('조직 정보가 없습니다. 거버넌스 > 조직 관리에서 먼저 등록해 주세요.');
          return;
        }

        const divisionId = divisionSelect.value;
        const teamId = teamSelect.value;
        if (!divisionId || !teamId || !currentOrg.teamMap.has(teamId)) {
          window.alert('담당 본부/팀을 선택해 주세요.');
          return;
        }

        const team = currentOrg.teamMap.get(teamId);

        const payload = {
          id: serviceId.value || makeUid(),
          name: serviceName.value.trim(),
          divisionId,
          divisionName: team.divisionName,
          teamId,
          teamName: team.name,
          dept: `${team.divisionName} / ${team.name}`,
          importance: importance.value,
          rtoValue: rtoValue.value === '' ? '' : Number(rtoValue.value),
          rtoUnit: rtoUnit.value,
          rpoValue: rpoValue.value === '' ? '' : Number(rpoValue.value),
          rpoUnit: rpoUnit.value,
          note: note.value.trim(),
          updatedAt: nowISO(),
        };

        if (!payload.name) {
          window.alert('서비스명은 필수 입력입니다.');
          return;
        }

        const idx = rows.findIndex((item) => item.id === payload.id);
        if (idx >= 0) rows[idx] = payload;
        else rows.unshift(payload);

        saveRows();
        resetForm();
        renderTable();
      });

      document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

      divisionSelect.addEventListener('change', () => {
        renderTeamOptions(divisionSelect.value);
      });

      registryBody.addEventListener('click', (e) => {
        const editId = e.target.getAttribute('data-edit');
        const deleteId = e.target.getAttribute('data-delete');

        if (editId) {
          const found = rows.find((item) => item.id === editId);
          if (!found) return;

          serviceId.value = found.id;
          serviceName.value = found.name;
          const editableDivisionId = currentOrg.divisionMap.has(found.divisionId) ? found.divisionId : '';
          const editableTeamId = currentOrg.teamMap.has(found.teamId) ? found.teamId : '';
          divisionSelect.value = editableDivisionId;
          renderTeamOptions(editableDivisionId, editableTeamId);
          importance.value = found.importance;
          rtoValue.value = found.rtoValue;
          rtoUnit.value = found.rtoUnit || '시간';
          rpoValue.value = found.rpoValue;
          rpoUnit.value = found.rpoUnit || '분';
          note.value = found.note || '';

          if (!editableTeamId && found.teamId) {
            window.alert('이 서비스에 연결된 팀이 조직 레지스트리에서 삭제되었습니다. 담당부서를 다시 지정해 주세요.');
          }

          serviceName.focus();
          return;
        }

        if (deleteId) {
          const target = rows.find((item) => item.id === deleteId);
          if (!target) return;
          if (!window.confirm(`'${target.name}' 서비스를 삭제하시겠습니까?`)) return;

          rows = rows.filter((item) => item.id !== deleteId);
          saveRows();
          renderTable();
        }
      });

      const refreshOrgBindings = () => {
        currentOrg = buildOrgIndex();
        setOrgWarning();
        renderDivisionOptions();
        renderTeamOptions(divisionSelect.value, teamSelect.value);
        reconcileRowsWithOrg();
        renderTable();
      };

      searchInput.addEventListener('input', renderTable);
      importanceFilter.addEventListener('change', renderTable);
      window.addEventListener('storage', (e) => {
        if (e.key === ORG_KEY) refreshOrgBindings();
      });

      resetForm();
      if (selectedServiceName && !searchInput.value.trim()) searchInput.value = selectedServiceName;
      refreshOrgBindings();
    })();
  </script>
</body>
</html>
