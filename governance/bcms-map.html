<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BCMS 체계 맵 | BCMS Portal</title>
<link rel="stylesheet" href="../assets/style.css"/>
<style>
/* ── Page Header ── */
.page-title{font-size:1.5rem;font-weight:700;color:var(--text);margin:0 0 .25rem}
.page-sub{font-size:.875rem;color:var(--text-2);margin:0 0 1.5rem}

/* ── Tabs ── */
.tab-bar{display:flex;gap:.375rem;border-bottom:2px solid var(--border);margin-bottom:1.5rem}
.tab-btn{padding:.5rem 1.125rem;border:none;background:none;cursor:pointer;
  font-size:.9375rem;font-weight:500;color:var(--text-2);
  border-bottom:2.5px solid transparent;margin-bottom:-2px;
  border-radius:var(--r-sm) var(--r-sm) 0 0;transition:color .15s,border-color .15s}
.tab-btn:hover{color:var(--accent)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-pane{display:none}.tab-pane.active{display:block}

/* ── Summary Gauge Row ── */
.gauge-row{display:flex;align-items:center;gap:1.75rem;
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:1.25rem 1.5rem;
  margin-bottom:1.5rem;box-shadow:var(--shadow)}
.gauge-wrap{position:relative;width:96px;height:96px;flex-shrink:0}
.gauge-svg{width:100%;height:100%;transform:rotate(-90deg)}
.g-track{fill:none;stroke:var(--border-strong);stroke-width:8}
.g-fill{fill:none;stroke-width:8;stroke-linecap:round;
  stroke-dasharray:87.96 87.96;stroke-dashoffset:87.96;
  transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1),stroke .4s}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0}
.gauge-pct{font-size:1.375rem;font-weight:700;color:var(--text);line-height:1}
.gauge-unit{font-size:.6875rem;color:var(--text-2);margin-top:2px}
.gauge-info{flex:1;min-width:0}
.gauge-title{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:.2rem}
.gauge-desc{font-size:.8125rem;color:var(--text-2);line-height:1.5;margin-bottom:.5rem}
.maturity-badge{display:inline-block;padding:.2rem .7rem;border-radius:99px;
  font-size:.75rem;font-weight:600}

/* ── PDCA Flow Strip ── */
.pdca-flow{display:flex;align-items:center;justify-content:center;
  gap:.5rem;margin-bottom:1.125rem;flex-wrap:wrap}
.pf-item{display:flex;align-items:center;gap:.375rem;
  padding:.35rem .75rem;border-radius:8px;font-size:.8125rem;font-weight:600}
.pf-dot{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.pf-arrow{font-size:1rem;color:var(--text-2);flex-shrink:0}
.pf-plan{background:#eff6ff;color:#1d4ed8}
.pf-plan .pf-dot{background:#dbeafe;color:#1d4ed8}
.pf-do{background:#f0fdf4;color:#15803d}
.pf-do .pf-dot{background:#dcfce7;color:#15803d}
.pf-check{background:#fefce8;color:#a16207}
.pf-check .pf-dot{background:#fef9c3;color:#a16207}
.pf-act{background:#fdf2f8;color:#9d174d}
.pf-act .pf-dot{background:#fce7f3;color:#9d174d}
[data-theme=dark] .pf-plan{background:#1e3a5f;color:#93c5fd}
[data-theme=dark] .pf-plan .pf-dot{background:#1e3a5f;color:#93c5fd}
[data-theme=dark] .pf-do{background:#052e16;color:#86efac}
[data-theme=dark] .pf-do .pf-dot{background:#14532d;color:#86efac}
[data-theme=dark] .pf-check{background:#422006;color:#fde68a}
[data-theme=dark] .pf-check .pf-dot{background:#451a03;color:#fde68a}
[data-theme=dark] .pf-act{background:#500724;color:#fbcfe8}
[data-theme=dark] .pf-act .pf-dot{background:#4c0519;color:#fbcfe8}

/* ── PDCA Cards ── */
.pdca-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:.75rem}
.pdca-card{background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:1.25rem 1.375rem;box-shadow:var(--shadow);
  transition:transform .15s,box-shadow .15s;border-top:3px solid transparent}
.pdca-card:hover{transform:translateY(-2px);box-shadow:0 4px 18px rgba(0,0,0,.1)}
.pdca-card.plan-card{border-top-color:#3b82f6}
.pdca-card.do-card{border-top-color:#22c55e}
.pdca-card.check-card{border-top-color:#eab308}
.pdca-card.act-card{border-top-color:#ec4899}

.pdca-hd{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:1rem}
.pdca-icon{width:44px;height:44px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.25rem;flex-shrink:0}
.pdca-icon.plan{background:#dbeafe;color:#1d4ed8}
.pdca-icon.do{background:#dcfce7;color:#15803d}
.pdca-icon.check{background:#fef9c3;color:#a16207}
.pdca-icon.act{background:#fce7f3;color:#9d174d}
[data-theme=dark] .pdca-icon.plan{background:#1e3a5f;color:#93c5fd}
[data-theme=dark] .pdca-icon.do{background:#14532d;color:#86efac}
[data-theme=dark] .pdca-icon.check{background:#422006;color:#fde68a}
[data-theme=dark] .pdca-icon.act{background:#4c0519;color:#fbcfe8}

.pdca-names{flex:1;min-width:0}
.pdca-phase{font-size:1rem;font-weight:700;color:var(--text)}
.pdca-phase-ko{font-size:.6875rem;color:var(--text-2);margin-top:1px}
.pdca-desc{font-size:.75rem;color:var(--text-2);line-height:1.45;margin-top:3px}

/* Progress */
.prog-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.375rem}
.prog-lbl{font-size:.8125rem;font-weight:500;color:var(--text-2)}
.prog-val{font-size:1.25rem;font-weight:700;color:var(--text)}
.prog-val.na{font-size:.875rem;color:var(--text-2)}
.prog-track{height:9px;background:var(--border-strong);border-radius:99px;overflow:hidden;margin-bottom:.875rem}
.prog-bar{height:100%;border-radius:99px;transition:width .6s ease;min-width:0}
.prog-bar.plan{background:linear-gradient(90deg,#60a5fa,#1d4ed8)}
.prog-bar.do{background:linear-gradient(90deg,#4ade80,#15803d)}
.prog-bar.check{background:linear-gradient(90deg,#fde047,#a16207)}
.prog-bar.act{background:linear-gradient(90deg,#f472b6,#9d174d)}

/* Sub-metrics */
.sub-metrics{display:flex;flex-direction:column;gap:.3rem}
.sub-row{display:flex;justify-content:space-between;align-items:center;
  padding:.3125rem .5rem;background:var(--bg);border-radius:6px;font-size:.8125rem}
.sub-name{color:var(--text-2)}
.sub-val{font-weight:600;color:var(--text)}
.sub-val.na{color:var(--text-2);font-weight:400;font-size:.75rem}

.no-data-note{font-size:.75rem;color:var(--text-2);font-style:italic;
  margin:.5rem 0 0;padding:.375rem .5rem;background:var(--bg);border-radius:6px}
.source-link{display:inline-block;margin-top:.625rem;font-size:.75rem;
  color:var(--accent);text-decoration:none}
.source-link:hover{text-decoration:underline}

/* ── ISO 22301 Cards ── */
.iso-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:1rem}
.iso-card{background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:1.125rem 1.25rem;box-shadow:var(--shadow);
  cursor:pointer;transition:transform .15s,box-shadow .15s;
  display:flex;flex-direction:column;gap:.625rem}
.iso-card:hover{transform:translateY(-2px);box-shadow:0 4px 18px rgba(0,0,0,.1)}
.iso-card-top{display:flex;align-items:flex-start;gap:.625rem}
.iso-num-badge{width:38px;height:38px;border-radius:9px;display:flex;
  align-items:center;justify-content:center;font-size:.9375rem;font-weight:800;
  flex-shrink:0;background:var(--border-strong);color:var(--text)}
.iso-meta{flex:1;min-width:0}
.iso-clause-lbl{font-size:.6875rem;font-weight:600;color:var(--text-2);margin-bottom:2px}
.iso-clause-name{font-size:.9375rem;font-weight:700;color:var(--text);line-height:1.25}
.iso-clause-en{font-size:.6875rem;color:var(--text-2)}
.iso-prog-hd{display:flex;justify-content:space-between;align-items:baseline}
.iso-prog-lbl{font-size:.75rem;color:var(--text-2)}
.iso-prog-pct{font-size:.9375rem;font-weight:700;color:var(--text)}
.iso-track{height:7px;background:var(--border-strong);border-radius:99px;overflow:hidden}
.iso-fill{height:100%;border-radius:99px;transition:width .6s ease}
.iso-bottom{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.25rem}
.iso-status-badge{display:inline-block;padding:.175rem .55rem;border-radius:99px;
  font-size:.6875rem;font-weight:600}
.iso-items{font-size:.6875rem;color:var(--text-2)}

/* Status / fill color tokens */
.s-none{color:#6b7280;background:#f3f4f6}
.s-bad {color:#dc2626;background:#fef2f2}
.s-warn{color:#d97706;background:#fffbeb}
.s-good{color:#16a34a;background:#f0fdf4}
.f-none{background:#d1d5db}
.f-bad {background:linear-gradient(90deg,#ef4444,#dc2626)}
.f-warn{background:linear-gradient(90deg,#f59e0b,#d97706)}
.f-good{background:linear-gradient(90deg,#22c55e,#16a34a)}
[data-theme=dark] .s-none{color:#9ca3af;background:#1f2937}
[data-theme=dark] .s-bad {color:#f87171;background:#450a0a}
[data-theme=dark] .s-warn{color:#fcd34d;background:#422006}
[data-theme=dark] .s-good{color:#86efac;background:#052e16}

/* ── Footer ── */
.map-footer{display:flex;justify-content:space-between;align-items:center;
  margin-top:1.25rem;padding-top:.75rem;border-top:1px solid var(--border)}
.footer-note{font-size:.75rem;color:var(--text-2)}
.refresh-btn{padding:.375rem .875rem;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-2);cursor:pointer;font-size:.8125rem;
  transition:background .15s,color .15s}
.refresh-btn:hover{background:var(--surface-hover);color:var(--text)}

/* ── Responsive ── */
@media(max-width:640px){
  .pdca-grid{grid-template-columns:1fr}
  .gauge-row{flex-direction:column;text-align:center;gap:1rem}
  .iso-grid{grid-template-columns:1fr}
  .pdca-flow{justify-content:center}
  .map-footer{flex-direction:column;gap:.5rem;text-align:center}
}
</style>
</head>
<body>
<aside id="sidebarMount"></aside>
<main class="main">
<div class="wrap">

  <h2 class="page-title">BCMS 체계 맵</h2>
  <p class="page-sub">ISO 22301 기반 BCMS 운영 현황 — PDCA 사이클 · 조항별 이행율 실시간 대시보드</p>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="pdca">📊 PDCA 대시보드</button>
    <button class="tab-btn" data-tab="iso">📋 ISO 22301 체계</button>
  </div>

  <!-- ══════════════════ Tab 1: PDCA ══════════════════ -->
  <div id="tab-pdca" class="tab-pane active">

    <div class="gauge-row">
      <div class="gauge-wrap">
        <svg class="gauge-svg" viewBox="0 0 36 36" aria-hidden="true">
          <circle class="g-track" cx="18" cy="18" r="14"/>
          <circle class="g-fill" id="gaugePDCA" cx="18" cy="18" r="14" stroke="#3b82f6"/>
        </svg>
        <div class="gauge-center">
          <span class="gauge-pct" id="pdcaPct">—</span>
          <span class="gauge-unit">성숙도</span>
        </div>
      </div>
      <div class="gauge-info">
        <div class="gauge-title">BCMS 전체 운영 성숙도</div>
        <div class="gauge-desc">PDCA 4단계 평균 진행률 기반 · ISO 22301 준수 체계</div>
        <span class="maturity-badge s-none" id="maturityBadge">데이터 없음</span>
      </div>
    </div>

    <!-- PDCA Flow Indicator -->
    <div class="pdca-flow">
      <div class="pf-item pf-plan"><div class="pf-dot">P</div>PLAN</div>
      <span class="pf-arrow">→</span>
      <div class="pf-item pf-do"><div class="pf-dot">D</div>DO</div>
      <span class="pf-arrow">→</span>
      <div class="pf-item pf-check"><div class="pf-dot">C</div>CHECK</div>
      <span class="pf-arrow">→</span>
      <div class="pf-item pf-act"><div class="pf-dot">A</div>ACT</div>
      <span class="pf-arrow" style="color:var(--accent);font-weight:700" title="ACT 결과가 PLAN으로 환류됩니다">↩</span>
    </div>

    <!-- PDCA Cards -->
    <div class="pdca-grid" id="pdcaGrid"></div>

    <div class="map-footer">
      <span class="footer-note" id="pdcaUpdated">마지막 갱신: —</span>
      <button class="refresh-btn" id="pdcaRefreshBtn">↻ 새로고침</button>
    </div>
  </div>

  <!-- ══════════════════ Tab 2: ISO 22301 ══════════════════ -->
  <div id="tab-iso" class="tab-pane">

    <div class="gauge-row">
      <div class="gauge-wrap">
        <svg class="gauge-svg" viewBox="0 0 36 36" aria-hidden="true">
          <circle class="g-track" cx="18" cy="18" r="14"/>
          <circle class="g-fill" id="gaugeISO" cx="18" cy="18" r="14" stroke="#16a34a"/>
        </svg>
        <div class="gauge-center">
          <span class="gauge-pct" id="isoPct">—</span>
          <span class="gauge-unit">이행율</span>
        </div>
      </div>
      <div class="gauge-info">
        <div class="gauge-title">ISO 22301 전체 이행율</div>
        <div class="gauge-desc">갭분석(Gap Analysis) 기반 · 조항 4–10 이행 현황<br>
          <span style="font-size:.75rem">갭분석 데이터는
            <a href="/audit/index.html" style="color:var(--accent)">감사 페이지</a>에서 관리합니다.</span>
        </div>
        <span class="maturity-badge s-none" id="isoBadge">데이터 없음</span>
      </div>
    </div>

    <div class="iso-grid" id="isoGrid"></div>

    <div class="map-footer">
      <span class="footer-note" id="isoUpdated">마지막 갱신: —</span>
      <button class="refresh-btn" id="isoRefreshBtn">↻ 새로고침</button>
    </div>
  </div>

</div><!-- .wrap -->
</main>
<script src="../assets/sidebar.js"></script>
<script>
(function () {
'use strict';

/* ─── Tab switching ─────────────────────────────────────────── */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'tab-' + t));
  });
});

/* ─── Storage helpers ───────────────────────────────────────── */
function loadJ(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; }
}

function toArr(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v;
  if (v.items && Array.isArray(v.items)) return v.items;
  if (v.rows  && Array.isArray(v.rows))  return v.rows;
  if (typeof v === 'object') return Object.values(v).filter(x => x && typeof x === 'object');
  return [];
}

/* ─── Rate helpers ──────────────────────────────────────────── */
const DONE    = ['완료','등록완료','done','completed','closed','pass','승인','이행','compliant'];
const PARTIAL = ['부분이행','partial','진행중','in_progress','일부'];

function clamp(n) { return Math.round(Math.min(Math.max(n, 0), 100)); }

function statusRate(arr) {
  if (!arr.length) return null;
  const scored = arr.filter(x => x.status || x.state);
  if (!scored.length) return clamp(Math.min(arr.length / 5, 1) * 100);
  let score = 0;
  scored.forEach(x => {
    const st = (x.status || x.state || '').toLowerCase();
    if (DONE.some(v => st.includes(v)))    score += 1;
    else if (PARTIAL.some(v => st.includes(v))) score += 0.5;
  });
  return clamp((score / scored.length) * 100);
}

function gapRate(items) {
  if (!items.length) return null;
  let score = 0;
  items.forEach(x => {
    const st = x.status || x.state || '';
    if (st === '이행'   || st === 'compliant') score += 1;
    else if (st === '부분이행' || st === 'partial')  score += 0.5;
  });
  return clamp((score / items.length) * 100);
}

function avg(...vals) {
  const valid = vals.filter(v => v !== null);
  if (!valid.length) return null;
  return clamp(valid.reduce((a, b) => a + b, 0) / valid.length);
}

function fmtPct(v) { return v === null ? '—' : v + '%'; }

function statusCls(v) {
  if (v === null) return { bar: 'f-none', badge: 's-none', label: '데이터 없음' };
  if (v < 30)    return { bar: 'f-bad',  badge: 's-bad',  label: '미이행' };
  if (v < 65)    return { bar: 'f-warn', badge: 's-warn', label: '부분이행' };
  return              { bar: 'f-good', badge: 's-good', label: '이행' };
}

function maturityLbl(v) {
  if (v === null) return { label: '데이터 없음', cls: 's-none' };
  if (v < 20)    return { label: '1단계: 초기',     cls: 's-bad' };
  if (v < 40)    return { label: '2단계: 관리됨',   cls: 's-bad' };
  if (v < 60)    return { label: '3단계: 정의됨',   cls: 's-warn' };
  if (v < 80)    return { label: '4단계: 정량관리', cls: 's-warn' };
  return              { label: '5단계: 최적화',   cls: 's-good' };
}

function setGauge(circleId, pctId, v, color) {
  const circ = 87.96;
  const el = document.getElementById(circleId);
  const pt = document.getElementById(pctId);
  if (!el || !pt) return;
  el.style.strokeDashoffset = circ * (1 - (v === null ? 0 : v) / 100);
  el.style.stroke = color;
  pt.textContent = v === null ? '—' : v + '%';
}

function nowStr() { return new Date().toLocaleString('ko-KR', { hour12: false }); }

/* ─── Data sources ──────────────────────────────────────────── */
function calcBIA()      { return statusRate(toArr(loadJ('bcmsBIAData', null))); }
function calcRisk()     { return statusRate(toArr(loadJ('bcmsRiskAssessment', null) || loadJ('bcmsRiskList', null))); }
function calcBCP()      { return statusRate(toArr(loadJ('bcmsBCPStrategy', null))); }
function calcTraining() { return statusRate(toArr(loadJ('bcmsTrainingData', null))); }

function calcGapAll() {
  const arr = toArr(loadJ('bcmsGapAnalysis', null));
  return { rate: gapRate(arr), arr };
}

function calcCAPA() {
  const arr = toArr(loadJ('bcmsCapaItems', null));
  if (!arr.length) return null;
  let done = 0;
  arr.forEach(x => {
    const st = (x.status || x.state || '').toLowerCase();
    if (DONE.some(v => st.includes(v))) done++;
  });
  return clamp((done / arr.length) * 100);
}

/* ─── PDCA phase definitions ────────────────────────────────── */
const PHASES = [
  {
    id: 'plan', label: 'PLAN', labelKo: '계획', cls: 'plan-card', iconCls: 'plan', emoji: '📐',
    desc: '업무영향분석·리스크 평가를 통해 BCMS 범위와 목표를 수립합니다.',
    sources: [
      { name: 'BIA 등록률',    fn: calcBIA,  link: '../risk-bia/bia.html' },
      { name: '리스크 등록률', fn: calcRisk, link: '../risk-bia/risk.html' },
    ],
    avgFn: () => avg(calcBIA(), calcRisk()),
    mainLink: '../risk-bia/index.html',
    mainLinkLabel: 'BIA·리스크 페이지로 →',
  },
  {
    id: 'do', label: 'DO', labelKo: '실행', cls: 'do-card', iconCls: 'do', emoji: '⚙️',
    desc: 'BCP 전략을 수립하고 훈련·연습을 통해 계획을 실행합니다.',
    sources: [
      { name: 'BCP전략 완료율', fn: calcBCP,      link: '../strategy-plans/bcp.html' },
      { name: '훈련 완료율',    fn: calcTraining, link: '../training/index.html' },
    ],
    avgFn: () => avg(calcBCP(), calcTraining()),
    mainLink: '../strategy-plans/index.html',
    mainLinkLabel: '전략·훈련 페이지로 →',
  },
  {
    id: 'check', label: 'CHECK', labelKo: '점검', cls: 'check-card', iconCls: 'check', emoji: '🔍',
    desc: '갭분석을 통해 BCMS 이행 수준과 ISO 22301 준수 현황을 평가합니다.',
    sources: [
      { name: '갭분석 이행율', fn: () => calcGapAll().rate, link: '../audit/index.html' },
    ],
    avgFn: () => calcGapAll().rate,
    mainLink: '../audit/index.html',
    mainLinkLabel: '감사·갭분석으로 →',
  },
  {
    id: 'act', label: 'ACT', labelKo: '개선', cls: 'act-card', iconCls: 'act', emoji: '✅',
    desc: 'CAPA를 통해 부적합 사항을 시정하고 BCMS를 지속적으로 개선합니다.',
    sources: [
      { name: 'CAPA 완료율', fn: calcCAPA, link: '../audit/capa.html' },
    ],
    avgFn: () => calcCAPA(),
    mainLink: '../audit/capa.html',
    mainLinkLabel: 'CAPA 관리로 →',
  },
];

/* ─── Render PDCA ───────────────────────────────────────────── */
function renderPDCA() {
  const phaseVals = PHASES.map(p => p.avgFn());
  const overall   = avg(...phaseVals);
  const gc = overall === null ? '#6b7280' : overall >= 80 ? '#16a34a' : overall >= 50 ? '#d97706' : '#dc2626';

  setGauge('gaugePDCA', 'pdcaPct', overall, gc);

  const mb = document.getElementById('maturityBadge');
  if (mb) {
    const m = maturityLbl(overall);
    mb.textContent  = m.label;
    mb.className    = 'maturity-badge ' + m.cls;
  }

  const grid = document.getElementById('pdcaGrid');
  if (!grid) return;

  grid.innerHTML = PHASES.map((p, i) => {
    const v   = phaseVals[i];
    const sc  = statusCls(v);
    const barW = v === null ? 0 : v;

    const subRows = p.sources.map(s => {
      const sv = s.fn();
      return `<div class="sub-row">
        <span class="sub-name">${s.name}</span>
        <span class="sub-val${sv === null ? ' na' : ''}">${fmtPct(sv)}</span>
      </div>`;
    }).join('');

    return `<div class="pdca-card ${p.cls}">
      <div class="pdca-hd">
        <div class="pdca-icon ${p.iconCls}">${p.emoji}</div>
        <div class="pdca-names">
          <div class="pdca-phase">${p.label} <span style="font-size:.6875rem;color:var(--text-2);font-weight:400">(${p.labelKo})</span></div>
          <div class="pdca-desc">${p.desc}</div>
        </div>
      </div>
      <div class="prog-hd">
        <span class="prog-lbl">전체 진행률</span>
        <span class="prog-val${v === null ? ' na' : ''}">${fmtPct(v)}</span>
      </div>
      <div class="prog-track">
        <div class="prog-bar ${p.id}" style="width:${barW}%"></div>
      </div>
      <div class="sub-metrics">${subRows}</div>
      ${v === null ? '<p class="no-data-note">데이터가 없습니다. 해당 페이지에서 항목을 등록해 주세요.</p>' : ''}
      <a class="source-link" href="${p.mainLink}">${p.mainLinkLabel}</a>
    </div>`;
  }).join('');

  const upd = document.getElementById('pdcaUpdated');
  if (upd) upd.textContent = '마지막 갱신: ' + nowStr();
}

/* ─── ISO 22301 Clause definitions ─────────────────────────── */
const ISO_CLAUSES = [
  { num:'4',  name:'조직의 맥락',  en:'Context of the Organization', icon:'🏢',  link:'../governance/requirements.html' },
  { num:'5',  name:'리더십',       en:'Leadership',                  icon:'👔',  link:'../governance/policy.html' },
  { num:'6',  name:'기획',         en:'Planning',                    icon:'📐',  link:'../risk-bia/index.html' },
  { num:'7',  name:'지원',         en:'Support',                     icon:'🔧',  link:'../governance/docs.html' },
  { num:'8',  name:'운영',         en:'Operation',                   icon:'⚙️', link:'../op-center/index.html' },
  { num:'9',  name:'성과 평가',    en:'Performance Evaluation',      icon:'📊',  link:'../audit/index.html' },
  { num:'10', name:'개선',         en:'Improvement',                 icon:'🔄',  link:'../audit/capa.html' },
];

function clauseItems(gapArr, num) {
  return gapArr.filter(x => {
    const c = String(x.clause || x.section || x.clauseNum || x.ref || '');
    return c === num || c.startsWith(num + '.') || c.startsWith('ISO ' + num);
  });
}

function gapCounts(items) {
  let ok = 0, part = 0, no = 0;
  items.forEach(x => {
    const st = x.status || x.state || '';
    if (st === '이행' || st === 'compliant')    ok++;
    else if (st === '부분이행' || st === 'partial') part++;
    else no++;
  });
  return { ok, part, no };
}

/* ─── Render ISO 22301 ──────────────────────────────────────── */
function renderISO() {
  const { rate: isoOverall, arr: gapArr } = calcGapAll();
  const gc = isoOverall === null ? '#6b7280' : isoOverall >= 80 ? '#16a34a' : isoOverall >= 50 ? '#d97706' : '#dc2626';

  setGauge('gaugeISO', 'isoPct', isoOverall, gc);

  const ib = document.getElementById('isoBadge');
  if (ib) {
    const sc = statusCls(isoOverall);
    ib.textContent = sc.label;
    ib.className   = 'maturity-badge ' + sc.badge;
  }

  const grid = document.getElementById('isoGrid');
  if (!grid) return;

  if (!gapArr.length) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:2.5rem 1rem;color:var(--text-2);font-size:.875rem;line-height:1.75">
      갭분석 데이터가 없습니다.<br>
      <a href="../audit/index.html" style="color:var(--accent)">감사 페이지에서 갭분석 항목을 등록해 주세요 →</a>
    </div>`;
  } else {
    grid.innerHTML = ISO_CLAUSES.map(cl => {
      const items  = clauseItems(gapArr, cl.num);
      const v      = gapRate(items);
      const sc     = statusCls(v);
      const barW   = v === null ? 0 : v;
      const cnt    = gapCounts(items);
      const hasSub = items.length > 0;
      const cntStr = hasSub
        ? `이행 ${cnt.ok} · 부분 ${cnt.part} · 미이행 ${cnt.no}`
        : '등록된 항목 없음';

      return `<div class="iso-card" onclick="location.href='${cl.link}'"
               role="button" tabindex="0" aria-label="조항 ${cl.num} ${cl.name} 상세보기">
        <div class="iso-card-top">
          <div class="iso-num-badge">${cl.num}</div>
          <div class="iso-meta">
            <div class="iso-clause-lbl">ISO 22301 조항 ${cl.num}</div>
            <div class="iso-clause-name">${cl.icon} ${cl.name}</div>
            <div class="iso-clause-en">${cl.en}</div>
          </div>
        </div>
        <div>
          <div class="iso-prog-hd">
            <span class="iso-prog-lbl">갭분석 이행율</span>
            <span class="iso-prog-pct">${fmtPct(v)}</span>
          </div>
          <div class="iso-track">
            <div class="iso-fill ${sc.bar}" style="width:${barW}%"></div>
          </div>
        </div>
        <div class="iso-bottom">
          <span class="iso-status-badge ${sc.badge}">${sc.label}</span>
          <span class="iso-items">${cntStr}</span>
        </div>
      </div>`;
    }).join('');
  }

  const upd = document.getElementById('isoUpdated');
  if (upd) upd.textContent = '마지막 갱신: ' + nowStr();
}

/* ─── Keyboard support for ISO cards ───────────────────────── */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('iso-card')) e.target.click();
});

/* ─── Refresh buttons ───────────────────────────────────────── */
document.getElementById('pdcaRefreshBtn')?.addEventListener('click', renderPDCA);
document.getElementById('isoRefreshBtn')?.addEventListener('click', renderISO);

/* ─── Init ──────────────────────────────────────────────────── */
renderPDCA();
renderISO();

})();
</script>
