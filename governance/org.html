<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>평상시 조직도 | BCMS Portal v2</title>
  <link rel="stylesheet" href="../assets/style.css"/>
  <style>
    .treeCard{ padding:20px; }
    .orgRoot{ font-size:18px; font-weight:900; margin-bottom:10px; }
    .orgTree{ list-style:none; padding-left:0; margin:0; }
    .orgTree li{ margin:6px 0; }
    .line{ color:var(--muted); margin-right:6px; }
    .company{ font-weight:900; }
    .division{ font-weight:800; }
    .team{ color:var(--mutedStrong); }
    .empty{ color:var(--muted); }
    .actions{ margin-top:12px; display:flex; gap:8px; }
  </style>
</head>
<body>
  <aside id="sidebarMount"></aside>
  <main class="main"><div class="wrap">
    <h1 class="page-title">🏛️ 평상시 조직도</h1>

    <article class="card treeCard">
      <h3>조직 레지스트리 기반 조직도</h3>
      <p class="hint">조직 관리 페이지에서 변경한 본부/팀 구성이 자동 반영됩니다.</p>
      <div id="orgView"></div>
      <div class="actions">
        <a class="btn" href="./org-registry.html">조직 관리 페이지로 이동</a>
        <a class="btn" href="./eop-org-chart.html">비상대응 조직도 보기</a>
      </div>
    </article>
  </div></main>

  <script src="../assets/sidebar.js"></script>
  <script src="../assets/data-store.js"></script>
  <script>
    (() => {
      const KEY = (window.DataStore && DataStore.KEY_ORG_REGISTRY) || 'bcms_org_registry_v1';
      const store = (window.DataStore && DataStore.get) ? DataStore : {
        get:(k,f)=>{ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):f; } catch { return f; } }
      };
      const mount = document.getElementById('orgView');

      const render = () => {
        const data = store.get(KEY, null);
        if (!data || !Array.isArray(data.divisions) || !data.divisions.length) {
          mount.innerHTML = '<p class="empty">조직 레지스트리 데이터가 없습니다. 조직 관리 페이지에서 기본 템플릿을 초기화해 주세요.</p>';
          return;
        }

        const html = data.divisions.map((d) => {
          const teams = (d.teams || []).map((t) => `<li><span class="line">│ ├</span><span class="team">${t.name}</span></li>`).join('');
          return `<li><span class="line">├</span><span class="division">${d.name}</span><ul class="orgTree">${teams || '<li class="empty">팀 없음</li>'}</ul></li>`;
        }).join('');

        mount.innerHTML = `
          <div class="orgRoot company">대표이사 / ${data.companyName || '회사명 미설정'}</div>
          <ul class="orgTree">${html}</ul>
        `;
      };

      window.addEventListener('storage', (e) => { if (e.key === KEY) render(); });
      setInterval(render, 3000);
      render();
    })();
  </script>
</body>
</html>
