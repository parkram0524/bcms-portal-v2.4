<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BCMS Portal - 조직도</title>
<link rel="stylesheet" href="../assets/style.css"/>
<style>
  .wrap { max-width: 1280px; margin: 0 auto; }

  /* ── Top bar ── */
  .topBar {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; margin-bottom: 22px; flex-wrap: wrap;
  }
  .heroTitle { font-size: 20px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  .heroDesc  { font-size: 13px; color: var(--text-2); margin-top: 5px; }

  /* ── Mode toggle pill ── */
  .modeToggle {
    display: inline-flex; align-items: center;
    background: var(--surface); border: 0.5px solid var(--border-strong);
    border-radius: 999px; padding: 3px; gap: 2px;
  }
  .modeBtn {
    font-size: 13px; font-weight: 600; padding: 7px 20px; border-radius: 999px;
    border: none; cursor: pointer; transition: background .2s, color .2s;
    background: transparent; color: var(--text-2);
  }
  .modeBtn.normal.active  { background: #2563eb; color: #fff; }
  .modeBtn.emergency.active { background: #dc2626; color: #fff; }

  /* ── Action buttons ── */
  .actions { display: flex; gap: 8px; align-items: center; }
  .btn {
    font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: var(--r-sm);
    border: 0.5px solid var(--border-strong); background: var(--surface);
    color: var(--text); cursor: pointer; transition: background .15s;
  }
  .btn:hover { background: var(--surface-hover); }
  .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.danger  { background: #dc2626; color: #fff; border-color: transparent; }
  .btn.danger:hover { background: #b91c1c; }

  /* ── View panels ── */
  .orgView { animation: fadeIn .2s ease; }
  .orgView.hidden { display: none !important; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ── Industry badge ── */
  .indBadge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 5px;
    background: var(--accent-subtle); color: var(--accent);
    border: 0.5px solid var(--accent-border); margin-bottom: 14px;
  }

  /* ── CEO card ── */
  .ceoRow { display: flex; justify-content: center; margin-bottom: 6px; }
  .ceoConnector { display: flex; justify-content: center; height: 20px; }
  .ceoConnector::after { content:''; width:2px; background: var(--border-strong); }
  .ceoCard {
    background: #0f172a; color: #fff; border-radius: var(--r);
    padding: 14px 36px; text-align: center; min-width: 240px;
  }
  [data-theme="dark"] .ceoCard { background: #1e293b; border: 0.5px solid var(--border-strong); }
  .ceoLabel { font-size: 10px; font-weight: 600; opacity: .55; text-transform: uppercase; letter-spacing: .07em; }
  .ceoName  { font-size: 16px; font-weight: 700; margin-top: 5px; }
  .ceoTitle { font-size: 13px; opacity: .75; margin-top: 2px; }

  /* ── Division grid ── */
  .divGrid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 10px;
  }
  .divCard {
    border: 0.5px solid var(--border-strong); border-radius: var(--r);
    overflow: hidden; background: var(--surface);
  }
  .divHeader {
    background: #1d4f89; color: #fff; padding: 10px 12px;
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  [data-theme="dark"] .divHeader { background: #1e3a5f; }
  .divBody  { padding: 8px; background: rgba(37,99,235,.04); min-height: 42px; }
  [data-theme="dark"] .divBody { background: rgba(37,99,235,.07); }

  .teamRow {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--r-sm); padding: 6px 10px;
    margin-bottom: 5px; font-size: 13px;
  }
  .teamRow:last-of-type { margin-bottom: 0; }

  /* ── BIA warning ── */
  .biaWarn {
    margin-top: 14px; padding: 10px 14px; border-radius: var(--r);
    background: rgba(245,158,11,.07); border: 0.5px solid rgba(245,158,11,.3);
    color: #b45309; font-size: 13px; font-weight: 600; line-height: 2;
  }
  .biaTag {
    display: inline-flex; align-items: center;
    background: rgba(245,158,11,.1); border: 0.5px solid rgba(245,158,11,.3);
    color: #b45309; border-radius: 999px; font-size: 12px; font-weight: 700;
    padding: 2px 10px; margin: 2px 4px 2px 0;
  }

  /* ── Emergency org ── */
  .eopTopRow   { display: flex; justify-content: center; margin-bottom: 6px; }
  .eopTeamRow  { display: flex; justify-content: center; margin-bottom: 10px; }
  .eopTopCard  {
    background: #7f1d1d; color: #fff; border-radius: var(--r);
    padding: 14px 32px; text-align: center; min-width: 220px;
  }
  .eopTeamCard {
    background: #991b1b; color: #fff; border-radius: var(--r);
    padding: 12px 28px; text-align: center; min-width: 200px;
  }
  [data-theme="dark"] .eopTopCard  { border: 0.5px solid var(--border); }
  [data-theme="dark"] .eopTeamCard { border: 0.5px solid var(--border); }
  .eopTopLabel { font-size: 10px; opacity: .6; text-transform: uppercase; letter-spacing: .07em; }
  .eopTopName  { font-size: 15px; font-weight: 700; margin-top: 5px; }
  .eopTopRole  { font-size: 12px; opacity: .8; margin-top: 2px; }
  .eopPhone    { font-size: 12px; opacity: .75; margin-top: 4px; display: none; }
  body.editMode .eopPhone { display: block; }

  .eopGrid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
  }
  .eopCard {
    border: 0.5px solid var(--border-strong); border-radius: var(--r);
    background: var(--surface); overflow: hidden;
  }
  .eopHead {
    background: #b91c1c; color: #fff; padding: 10px 14px;
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: space-between;
  }
  [data-theme="dark"] .eopHead { background: #7f1d1d; }
  .eopBody { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .eopField { display: flex; flex-direction: column; gap: 2px; }
  .eopFieldLabel { font-size: 10px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; }
  .eopFieldVal   { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.5; }
  .contactField  { display: none; }
  body.editMode .contactField { display: flex; }

  /* ── Inline editing ── */
  .ei, .eil {
    outline: none; min-width: 20px; display: inline-block;
    border-bottom: 1px dashed transparent;
  }
  .ei:empty::before  { content: attr(data-ph); opacity: .4; }
  .eil:empty::before { content: attr(data-ph); opacity: .4; }
  body.editMode .ei  { border-bottom-color: rgba(255,255,255,.45); }
  body.editMode .ei:focus  { border-bottom-color: rgba(255,255,255,.9); }
  body.editMode .eil { border-bottom-color: var(--border-strong); }
  body.editMode .eil:focus { border-bottom-color: var(--accent); }

  /* ── Delete / add buttons ── */
  .delBtn {
    font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px;
    border: 0.5px solid rgba(220,38,38,.35); background: rgba(220,38,38,.14);
    color: #dc2626; cursor: pointer; flex-shrink: 0; line-height: 1.5;
    display: none;
  }
  body.editMode .delBtn { display: inline-flex; align-items: center; }

  .addTeamBtn {
    width: 100%; font-size: 12px; font-weight: 700; padding: 5px 8px;
    border-radius: var(--r-sm); border: 0.5px dashed var(--border-strong);
    background: transparent; color: var(--text-2); cursor: pointer;
    margin-top: 6px; display: none; transition: all .15s;
  }
  .addTeamBtn:hover { background: var(--surface-hover); color: var(--text); }
  body.editMode .addTeamBtn { display: block; }

  .addDivCard {
    display: none; align-items: center; justify-content: center;
    border: 1px dashed var(--border-strong); border-radius: var(--r);
    min-height: 80px; cursor: pointer; font-size: 13px; font-weight: 600;
    color: var(--text-2); background: transparent; transition: all .15s;
  }
  .addDivCard:hover { background: var(--surface-hover); color: var(--text); }
  body.editMode .addDivCard { display: flex; }

  .addUnitCard {
    display: none; align-items: center; justify-content: center;
    border: 1px dashed var(--border-strong); border-radius: var(--r);
    min-height: 80px; cursor: pointer; font-size: 13px; font-weight: 600;
    color: var(--text-2); background: transparent; transition: all .15s;
  }
  .addUnitCard:hover { background: var(--surface-hover); color: var(--text); }
  body.editMode .addUnitCard { display: flex; }

  /* ── Edit mode banner ── */
  .editBanner {
    display: none; align-items: center; gap: 8px;
    background: rgba(245,158,11,.08); border: 0.5px solid rgba(245,158,11,.3);
    border-radius: var(--r-sm); padding: 8px 14px; margin-bottom: 14px;
    font-size: 13px; font-weight: 600; color: #b45309;
  }
  body.editMode .editBanner { display: flex; }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(40px);
    background: #0f172a; color: #fff; font-size: 13px; font-weight: 600;
    padding: 10px 22px; border-radius: 999px; opacity: 0;
    transition: all .25s; pointer-events: none; z-index: 9999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  [data-theme="dark"] .toast { background: #f8fafc; color: #0f172a; }

  @media (max-width: 900px) {
    .divGrid  { grid-template-columns: repeat(2, 1fr); }
    .eopGrid  { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .divGrid  { grid-template-columns: 1fr; }
    .eopGrid  { grid-template-columns: 1fr; }
    .topBar   { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<aside id="sidebarMount"></aside>
<main class="main">
<div class="wrap">

  <div class="topBar">
    <div>
      <h1 class="heroTitle" id="heroTitle">평상시 조직도</h1>
      <p class="heroDesc"  id="heroDesc">bcmsIndustry 기반 샘플 자동 로드 · 저장된 데이터 우선 적용</p>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <div class="modeToggle">
        <button class="modeBtn normal active"    id="btnNormal"    onclick="ORG.switchMode('normal')">평상시 조직</button>
        <button class="modeBtn emergency"        id="btnEmergency" onclick="ORG.switchMode('emergency')">비상대응 조직</button>
      </div>
      <div class="actions">
        <button class="btn"         id="btnEdit" onclick="ORG.toggleEdit()">편집 모드</button>
        <button class="btn primary" id="btnSave" onclick="ORG.saveAll()" style="display:none">저장</button>
      </div>
    </div>
  </div>

  <div class="editBanner">✏️ 편집 모드 — 항목을 클릭해 직접 수정하세요. 저장 버튼으로 확정합니다.</div>

  <!-- Normal org -->
  <div class="orgView" id="viewNormal">
    <div id="normalOrg"></div>
  </div>

  <!-- Emergency org -->
  <div class="orgView hidden" id="viewEmergency">
    <div id="emergencyOrg"></div>
  </div>

</div>
</main>

<div class="toast" id="toast"></div>

<script src="../assets/sidebar.js"></script>
<script src="../assets/demo-seed.js"></script>
<script>
window.ORG = (() => {
  'use strict';

  /* ─── Constants ─────────────────────────────────────────────────── */
  const KEY_ORG = 'bcmsOrgChart';
  const KEY_EOP = 'bcmsEOPOrg';
  const KEY_IND = 'bcmsIndustry';
  const KEY_BIA = 'bcmsBIAData';

  /* ─── Industry sample data ──────────────────────────────────────── */
  const SAMPLES = {
    '제조업': {
      ceoTitle: '대표이사', companyName: '(주)회사명',
      divisions: [
        { id:'mfg-prod',  name:'생산본부',    teams:['생산팀','품질팀','생산관리팀'] },
        { id:'mfg-tech',  name:'기술본부',    teams:['설비유지팀','기술개발팀'] },
        { id:'mfg-mgmt',  name:'경영지원본부', teams:['구매팀','물류팀','인사팀','재무팀'] },
        { id:'mfg-it',    name:'IT본부',      teams:['IT인프라팀','시스템운영팀'] },
        { id:'mfg-sales', name:'영업본부',    teams:['영업팀','고객관리팀'] },
      ]
    },
    '금융': {
      ceoTitle: '대표이사/행장', companyName: '(주)금융회사',
      divisions: [
        { id:'fin-it',    name:'IT본부',      teams:['IT인프라팀','시스템운영팀','정보보호팀'] },
        { id:'fin-sales', name:'영업본부',    teams:['수신팀','여신팀','고객서비스팀'] },
        { id:'fin-fund',  name:'자금본부',    teams:['자금팀','결제팀'] },
        { id:'fin-compl', name:'준법감시본부', teams:['준법감시팀','감사팀'] },
        { id:'fin-mgmt',  name:'경영지원본부', teams:['인사팀','재무팀'] },
      ]
    },
    '공공기관': {
      ceoTitle: '기관장', companyName: '(공공기관명)',
      divisions: [
        { id:'pub-plan',  name:'기획조정실',    teams:['기획팀','예산팀'] },
        { id:'pub-admin', name:'행정지원본부',   teams:['행정팀','인사팀','재무회계팀'] },
        { id:'pub-it',    name:'IT본부',        teams:['정보화팀','정보보호팀'] },
        { id:'pub-civil', name:'민원서비스본부', teams:['민원팀','대민서비스팀'] },
        { id:'pub-audit', name:'감사실',        teams:['감사팀','컴플라이언스팀'] },
      ]
    },
    '고속도로': {
      ceoTitle: '사장/본부장', companyName: '(고속도로운영사)',
      divisions: [
        { id:'hwy-ctrl',  name:'관제본부',    teams:['교통관제팀','CCTV운영팀'] },
        { id:'hwy-facil', name:'시설본부',    teams:['전기팀','기계(냉각)팀','방재·소방팀'] },
        { id:'hwy-it',    name:'IT본부',      teams:['IT인프라팀','ETC운영팀','네트워크팀'] },
        { id:'hwy-ops',   name:'운영본부',    teams:['순찰팀','유지보수팀','DC운영(NOC/관제)팀'] },
        { id:'hwy-mgmt',  name:'경영지원본부', teams:['인사팀','재무팀','고객지원팀'] },
      ]
    },
    '통신': {
      ceoTitle: '대표이사', companyName: '(통신회사)',
      divisions: [
        { id:'tel-net',  name:'네트워크본부',  teams:['코어네트워크팀','무선팀','교환팀'] },
        { id:'tel-it',   name:'IT본부',       teams:['IT인프라팀','시스템운영팀'] },
        { id:'tel-svc',  name:'서비스본부',   teams:['인터넷서비스팀','기업서비스팀'] },
        { id:'tel-cs',   name:'고객지원본부', teams:['고객센터팀','장애접수팀'] },
        { id:'tel-mgmt', name:'경영지원본부', teams:['인사팀','재무팀'] },
      ]
    },
    'IDC': {
      ceoTitle: '대표이사/센터장', companyName: '(IDC운영사)',
      divisions: [
        { id:'idc-facil', name:'시설본부',    teams:['전기팀','기계(냉각)팀','방재·소방팀'] },
        { id:'idc-it',    name:'IT운영본부',  teams:['서버운영팀','네트워크팀','스토리지팀'] },
        { id:'idc-sec',   name:'보안본부',    teams:['물리보안팀','정보보호팀'] },
        { id:'idc-svc',   name:'서비스본부',  teams:['고객지원팀','서비스품질팀'] },
        { id:'idc-mgmt',  name:'경영지원본부', teams:['인사총무팀','재무회계팀','구매·자산관리팀'] },
      ]
    }
  };

  const EOP_SAMPLE = {
    commander: { name:'대표이사', role:'비상대응 총괄', contact:'010-0000-0001' },
    leader:    { name:'BCMS 담당임원', role:'비상대응팀장', contact:'010-0000-0002' },
    units: [
      { id:'u-cmd', name:'지휘통제반', leader:'반장 성명', contact:'010-0000-0011', duty:'전체 대응 지휘·통제, 상황 보고' },
      { id:'u-it',  name:'IT복구반',  leader:'반장 성명', contact:'010-0000-0012', duty:'IT 시스템 복구, 데이터 복원' },
      { id:'u-biz', name:'업무복구반', leader:'반장 성명', contact:'010-0000-0013', duty:'핵심업무 대체 수행·복구' },
      { id:'u-ext', name:'대외협력반', leader:'반장 성명', contact:'010-0000-0014', duty:'언론 대응, 관계기관 협조' },
      { id:'u-adm', name:'행정지원반', leader:'반장 성명', contact:'010-0000-0015', duty:'인원 파악, 물자·예산 지원' },
    ]
  };

  /* ─── State ─────────────────────────────────────────────────────── */
  let mode     = 'normal';
  let editMode = false;
  let orgData  = null;
  let eopData  = null;

  /* ─── Utilities ─────────────────────────────────────────────────── */
  const loadJ = (k, fb) => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch { return fb; } };
  const saveJ = (k, v) => localStorage.setItem(k, JSON.stringify(v));
  const esc   = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid   = () => `id-${Date.now()}-${Math.random().toString(36).slice(2,6)}`;

  function toast(msg, ms = 2200) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), ms);
  }

  /* ─── Data loading ───────────────────────────────────────────────── */
  function getIndustry() {
    const v = (localStorage.getItem(KEY_IND) || '').trim();
    return SAMPLES[v] ? v : '제조업';
  }

  function loadOrgData() {
    const saved = loadJ(KEY_ORG, null);
    if (saved && Array.isArray(saved.divisions) && saved.divisions.length) return saved;
    const ind = getIndustry();
    const s = SAMPLES[ind];
    return { ceoTitle: s.ceoTitle, companyName: s.companyName,
             divisions: s.divisions.map(d => ({ ...d, teams: [...d.teams] })) };
  }

  function loadEOPData() {
    const saved = loadJ(KEY_EOP, null);
    if (saved && Array.isArray(saved.units) && saved.units.length) return saved;
    return JSON.parse(JSON.stringify(EOP_SAMPLE));
  }

  function getBiaTeams() {
    const bia = loadJ(KEY_BIA, []);
    const teams = new Set();
    for (const block of (Array.isArray(bia) ? bia : [])) {
      if (block.team) teams.add(block.team.trim());
    }
    return teams;
  }

  function getMissingBiaTeams(od) {
    const biaTeams = getBiaTeams();
    if (!biaTeams.size) return [];
    const orgTeams = new Set();
    for (const div of (od.divisions || [])) {
      for (const t of (div.teams || [])) orgTeams.add(String(t).trim());
    }
    return [...biaTeams].filter(t => !orgTeams.has(t));
  }

  /* ─── Mode & edit toggle ─────────────────────────────────────────── */
  function switchMode(m) {
    if (editMode) { toast('저장 또는 편집 취소 후 전환하세요'); return; }
    mode = m;
    document.getElementById('viewNormal').classList.toggle('hidden', m !== 'normal');
    document.getElementById('viewEmergency').classList.toggle('hidden', m !== 'emergency');
    document.getElementById('btnNormal').classList.toggle('active', m === 'normal');
    document.getElementById('btnEmergency').classList.toggle('active', m === 'emergency');
    document.getElementById('heroTitle').textContent = m === 'normal' ? '평상시 조직도' : '비상대응 조직도';
    document.getElementById('heroDesc').textContent  = m === 'normal'
      ? 'bcmsIndustry 기반 샘플 자동 로드 · 저장된 데이터 우선 적용'
      : '비상 상황 발생 시 적용되는 지휘 체계 · bcmsEOPOrg 저장';
  }

  function toggleEdit() {
    if (editMode) {
      editMode = false;
      document.body.classList.remove('editMode');
      document.getElementById('btnEdit').textContent = '편집 모드';
      document.getElementById('btnEdit').classList.remove('danger');
      document.getElementById('btnSave').style.display = 'none';
      renderAll(); // discard changes
    } else {
      editMode = true;
      document.body.classList.add('editMode');
      document.getElementById('btnEdit').textContent = '편집 취소';
      document.getElementById('btnEdit').classList.add('danger');
      document.getElementById('btnSave').style.display = '';
      renderCurrent();
    }
  }

  function saveAll() {
    if (mode === 'normal')    saveNormal();
    else                      saveEmergency();
    editMode = false;
    document.body.classList.remove('editMode');
    document.getElementById('btnEdit').textContent = '편집 모드';
    document.getElementById('btnEdit').classList.remove('danger');
    document.getElementById('btnSave').style.display = 'none';
    renderAll();
    toast('저장되었습니다 ✓');
  }

  /* ─── Normal org render ──────────────────────────────────────────── */
  function renderNormal() {
    orgData = loadOrgData();
    const missing = getMissingBiaTeams(orgData);
    const industry = getIndustry();
    const ed = editMode;

    const indBadge = `<div><span class="indBadge">업종: ${esc(industry)}</span></div>`;

    const ceoHtml = `
      <div class="ceoRow">
        <div class="ceoCard">
          <div class="ceoLabel">최상위</div>
          <div class="ceoName"
               id="ceoCompany"
               ${ed ? 'contenteditable="true"' : ''}
               class="ceoName ei"
               data-ph="회사명">${esc(orgData.companyName)}</div>
          <div id="ceoTitleEl"
               ${ed ? 'contenteditable="true"' : ''}
               class="ceoTitle ei"
               data-ph="직위">${esc(orgData.ceoTitle)}</div>
        </div>
      </div>
      <div class="ceoConnector"></div>`;

    const divsHtml = orgData.divisions.map((div, di) => {
      const teamsHtml = (div.teams || []).map((team, ti) => `
        <div class="teamRow">
          <span class="eil teamName"
                data-di="${di}" data-ti="${ti}"
                ${ed ? 'contenteditable="true"' : ''}
                data-ph="팀명">${esc(String(team))}</span>
          <button class="delBtn" onclick="ORG.delTeam(${di},${ti})">×</button>
        </div>`).join('');

      return `
        <div class="divCard" data-di="${di}">
          <div class="divHeader">
            <span class="ei divName"
                  data-di="${di}"
                  ${ed ? 'contenteditable="true"' : ''}
                  data-ph="본부명">${esc(div.name)}</span>
            <button class="delBtn" onclick="ORG.delDiv(${di})">×</button>
          </div>
          <div class="divBody">
            ${teamsHtml}
            <button class="addTeamBtn" onclick="ORG.addTeam(${di})">+ 팀 추가</button>
          </div>
        </div>`;
    }).join('');

    const missingHtml = missing.length ? `
      <div class="biaWarn">
        ⚠ BIA에 등록된 팀이지만 조직도에 없음:
        ${missing.map(t => `<span class="biaTag">${esc(t)}</span>`).join('')}
      </div>` : '';

    document.getElementById('normalOrg').innerHTML = `
      ${indBadge}
      ${ceoHtml}
      <div class="divGrid" id="divGrid">
        ${divsHtml}
        <button class="addDivCard" onclick="ORG.addDiv()">+ 본부 추가</button>
      </div>
      ${missingHtml}`;
  }

  function collectNormalFromDOM() {
    const res = { ...orgData };
    const cn = document.getElementById('ceoCompany');
    const ct = document.getElementById('ceoTitleEl');
    if (cn) res.companyName = cn.textContent.trim();
    if (ct) res.ceoTitle    = ct.textContent.trim();

    res.divisions = [];
    document.querySelectorAll('#divGrid .divCard').forEach((card, di) => {
      const nameEl = card.querySelector('.divName');
      const name   = nameEl ? nameEl.textContent.trim() : `본부${di+1}`;
      const teams  = [...card.querySelectorAll('.teamName')].map(e => e.textContent.trim()).filter(Boolean);
      const orig   = (orgData.divisions || [])[di] || {};
      res.divisions.push({ id: orig.id || uid(), name, teams });
    });
    return res;
  }

  function saveNormal() {
    orgData = collectNormalFromDOM();
    saveJ(KEY_ORG, orgData);
  }

  /* ─── Normal CRUD ────────────────────────────────────────────────── */
  function addDiv() {
    orgData = collectNormalFromDOM();
    orgData.divisions.push({ id: uid(), name: '신규 본부', teams: ['신규 팀'] });
    renderNormal();
  }
  function delDiv(di) {
    orgData = collectNormalFromDOM();
    orgData.divisions.splice(di, 1);
    renderNormal();
  }
  function addTeam(di) {
    orgData = collectNormalFromDOM();
    if (orgData.divisions[di]) orgData.divisions[di].teams.push('신규 팀');
    renderNormal();
  }
  function delTeam(di, ti) {
    orgData = collectNormalFromDOM();
    if (orgData.divisions[di]) orgData.divisions[di].teams.splice(ti, 1);
    renderNormal();
  }

  /* ─── Emergency org render ───────────────────────────────────────── */
  function renderEmergency() {
    eopData = loadEOPData();
    const ed = editMode;

    const topHtml = `
      <div class="eopTopRow">
        <div class="eopTopCard">
          <div class="eopTopLabel">비상대응 총괄</div>
          <div class="eopTopName"><span class="ei eopCmdName" ${ed?'contenteditable="true"':''} data-ph="성명">${esc(eopData.commander.name)}</span></div>
          <div class="eopTopRole"><span class="ei eopCmdRole" ${ed?'contenteditable="true"':''} data-ph="직위">${esc(eopData.commander.role)}</span></div>
          <div class="eopPhone">📞 <span class="ei eopCmdContact" ${ed?'contenteditable="true"':''} data-ph="010-0000-0000">${esc(eopData.commander.contact)}</span></div>
        </div>
      </div>
      <div class="eopTeamRow">
        <div class="eopTeamCard">
          <div class="eopTopLabel">비상대응팀장</div>
          <div class="eopTopName"><span class="ei eopLdrName" ${ed?'contenteditable="true"':''} data-ph="성명">${esc(eopData.leader.name)}</span></div>
          <div class="eopTopRole"><span class="ei eopLdrRole" ${ed?'contenteditable="true"':''} data-ph="직위">${esc(eopData.leader.role)}</span></div>
          <div class="eopPhone">📞 <span class="ei eopLdrContact" ${ed?'contenteditable="true"':''} data-ph="010-0000-0000">${esc(eopData.leader.contact)}</span></div>
        </div>
      </div>`;

    const unitsHtml = (eopData.units || []).map((u, ui) => `
      <div class="eopCard" data-ui="${ui}">
        <div class="eopHead">
          <span class="ei eopUnitName" data-ui="${ui}" ${ed?'contenteditable="true"':''} data-ph="반 이름">${esc(u.name)}</span>
          <button class="delBtn" onclick="ORG.delUnit(${ui})">×</button>
        </div>
        <div class="eopBody">
          <div class="eopField">
            <span class="eopFieldLabel">반장</span>
            <span class="eopFieldVal eil eopUnitLeader" data-ui="${ui}" ${ed?'contenteditable="true"':''} data-ph="반장 성명">${esc(u.leader)}</span>
          </div>
          <div class="eopField contactField">
            <span class="eopFieldLabel">비상연락처</span>
            <span class="eopFieldVal eil eopUnitContact" data-ui="${ui}" ${ed?'contenteditable="true"':''} data-ph="010-0000-0000" style="font-family:monospace;">${esc(u.contact)}</span>
          </div>
          <div class="eopField">
            <span class="eopFieldLabel">담당업무</span>
            <span class="eopFieldVal eil eopUnitDuty" data-ui="${ui}" ${ed?'contenteditable="true"':''} data-ph="담당 업무 설명" style="font-size:12px;line-height:1.5;">${esc(u.duty)}</span>
          </div>
        </div>
      </div>`).join('');

    document.getElementById('emergencyOrg').innerHTML = `
      ${topHtml}
      <div class="eopGrid" id="eopGrid">
        ${unitsHtml}
        <button class="addUnitCard" onclick="ORG.addUnit()">+ 반 추가</button>
      </div>`;
  }

  function collectEOPFromDOM() {
    const res = JSON.parse(JSON.stringify(eopData));
    const g = sel => { const e = document.querySelector(sel); return e ? e.textContent.trim() : ''; };
    res.commander.name    = g('.eopCmdName');
    res.commander.role    = g('.eopCmdRole');
    res.commander.contact = g('.eopCmdContact');
    res.leader.name       = g('.eopLdrName');
    res.leader.role       = g('.eopLdrRole');
    res.leader.contact    = g('.eopLdrContact');

    res.units = [];
    document.querySelectorAll('#eopGrid .eopCard').forEach((card, ui) => {
      const orig = (eopData.units || [])[ui] || {};
      const t = sel => { const e = card.querySelector(sel); return e ? e.textContent.trim() : ''; };
      res.units.push({
        id:      orig.id || uid(),
        name:    t('.eopUnitName'),
        leader:  t('.eopUnitLeader'),
        contact: t('.eopUnitContact'),
        duty:    t('.eopUnitDuty'),
      });
    });
    return res;
  }

  function saveEmergency() {
    eopData = collectEOPFromDOM();
    saveJ(KEY_EOP, eopData);
  }

  /* ─── Emergency CRUD ─────────────────────────────────────────────── */
  function addUnit() {
    eopData = collectEOPFromDOM();
    eopData.units.push({ id: uid(), name:'신규 반', leader:'반장 성명', contact:'010-0000-0000', duty:'담당 업무 입력' });
    renderEmergency();
  }
  function delUnit(ui) {
    eopData = collectEOPFromDOM();
    eopData.units.splice(ui, 1);
    renderEmergency();
  }

  /* ─── Render helpers ─────────────────────────────────────────────── */
  function renderCurrent() {
    if (mode === 'normal') renderNormal();
    else                   renderEmergency();
  }
  function renderAll() {
    renderNormal();
    renderEmergency();
  }

  /* ─── Init ───────────────────────────────────────────────────────── */
  function init() {
    if (window.BCMSDemoSeed) {
      window.BCMSDemoSeed.ensureDemoIfEmpty();
      window.BCMSDemoSeed.mountBanner('.wrap');
    }
    // URL hash: #emergency → start in emergency mode
    if (location.hash === '#emergency') switchMode('emergency');
    renderAll();
  }

  // Expose public API
  return { switchMode, toggleEdit, saveAll, addDiv, delDiv, addTeam, delTeam, addUnit, delUnit, init };
})();

ORG.init();
</script>
<button class="theme-toggle" id="themeToggle" title="다크모드 전환">🌙</button>
<script>(function(){const r=document.documentElement,t=document.getElementById('themeToggle'),s=localStorage.getItem('bcmsTheme')||'light';r.setAttribute('data-theme',s);if(t){t.textContent=s==='dark'?'☀️':'🌙';t.addEventListener('click',()=>{const n=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',n);t.textContent=n==='dark'?'☀️':'🌙';localStorage.setItem('bcmsTheme',n);});}})();</script>
</body>
</html>
