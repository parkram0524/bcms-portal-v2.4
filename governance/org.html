<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>평상시 조직도 | BCMS Portal v2</title>
  <link rel="stylesheet" href="../assets/style.css"/>
  <style>
    body{ display:flex; }
    .main{ padding:20px; }
    .wrap{ max-width:100%; }

    .topBar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .navBtn{
      display:inline-flex;
      align-items:center;
      text-decoration:none;
      border:1px solid var(--lineStrong);
      background:#fff;
      color:var(--ink);
      border-radius:10px;
      padding:8px 12px;
      font-size:13px;
      font-weight:800;
    }
    .navBtn:hover{ background:rgba(15,23,42,.04); }
    .navBtn.active{ background:#0f172a; color:#fff; border-color:#0f172a; }

    .orgView{ display:flex; flex-direction:column; gap:14px; min-height:calc(100vh - 160px); }
    .ceoRow{ display:flex; justify-content:center; }
    .ceoNode{ width:min(420px, 100%); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadowSm); overflow:hidden; }
    .ceoNode h4{ margin:0; padding:10px 12px; background:#0f172a; color:#fff; font-size:14px; font-weight:900; }
    .ceoNode p{ margin:0; padding:12px; background:#f8fafc; text-align:center; font-weight:800; color:var(--ink); }

    .divisionGrid{ display:grid; grid-template-columns: repeat(5, minmax(180px, 1fr)); gap:10px; }
    .divisionCard{ border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadowSm); background:var(--panel); }
    .divisionCard h4{ margin:0; padding:9px 10px; background:#1d4f89; color:#fff; font-size:13px; font-weight:900; }
    .divisionBody{ padding:8px; background:#eef4ff; }

    .teamGrid{ display:grid; grid-template-columns: 1fr; gap:6px; }
    .teamCard{ border:1px solid var(--lineStrong); border-radius:10px; background:#fff; padding:7px 9px; font-size:12px; color:var(--ink); }
    .empty{ color:var(--muted); font-size:13px; }

    @media (max-width:1200px){ .divisionGrid{ grid-template-columns:repeat(3,minmax(170px,1fr)); } }
    @media (max-width:900px){ .divisionGrid{ grid-template-columns:repeat(2,minmax(160px,1fr)); } }
    @media (max-width:680px){ .divisionGrid{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <aside id="sidebarMount"></aside>
  <main class="main"><div class="wrap">
    <h1 class="page-title">🏛️ 평상시 조직도</h1>
    <div class="topBar">
      <a class="navBtn" href="./org-registry.html">조직 관리 페이지로 이동</a>
      <a class="navBtn" href="./eop-org-chart.html">비상대응 조직도 보기</a>
      <a class="navBtn active" href="./org.html">평상시 조직도</a>
      <a class="navBtn" href="./index.html">거버넌스 홈</a>
    </div>

    <article class="card">
      <h3>조직 레지스트리 기반 조직도 (계층형)</h3>
      <p class="hint">대표이사 → 본부(부모 카드) → 팀(하위 카드) 구조로 표시됩니다.</p>
      <div id="orgView" class="orgView"></div>
    </article>
  </div></main>

  <script src="../assets/sidebar.js"></script>
  <script src="../assets/data-store.js"></script>
  <script>
    (() => {
      const KEY = (window.DataStore && DataStore.KEY_ORG_REGISTRY) || 'bcms_org_registry_v1';
      const store = (window.DataStore && DataStore.get) ? DataStore : {
        get:(k,f)=>{ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):f; } catch { return f; } }
      };
      const mount = document.getElementById('orgView');

      const baseTemplate = {
        companyName: 'SJ Digital',
        divisions: [
          { id:'risk', name:'리스크·컴플라이언스본부', teams:[{id:'bcm',name:'재난안전(BCM)팀'},{id:'security',name:'정보보호팀'},{id:'audit',name:'감사·컴플라이언스팀'}]},
          { id:'it', name:'IT서비스운영본부', teams:[{id:'sre',name:'SRE/플랫폼운영팀'},{id:'app',name:'애플리케이션운영팀'},{id:'db',name:'데이터/DB운영팀'},{id:'network',name:'네트워크운영팀'}]},
          { id:'dc', name:'IDC운영본부', teams:[{id:'power',name:'전기팀'},{id:'hvac',name:'기계(냉각)팀'},{id:'fire',name:'방재·소방팀'},{id:'noc',name:'DC운영(NOC/관제)팀'}]},
          { id:'customer', name:'고객서비스본부', teams:[{id:'cs',name:'고객지원팀'},{id:'quality',name:'서비스품질팀'}]},
          { id:'management', name:'경영지원본부', teams:[{id:'hr',name:'인사총무팀'},{id:'finance',name:'재무회계팀'},{id:'procurement',name:'구매·자산관리팀'}]},
        ]
      };

      const normalizeOrgData = (raw) => {
        const current = raw && Array.isArray(raw.divisions) ? raw : { companyName: baseTemplate.companyName, divisions: [] };
        const currentMap = new Map((current.divisions || []).map((d) => [d.id, d]));
        const mergedDivisions = baseTemplate.divisions.map((tpl) => {
          const hit = currentMap.get(tpl.id);
          if (!hit) return tpl;
          return {
            id: hit.id || tpl.id,
            name: hit.name || tpl.name,
            teams: Array.isArray(hit.teams) && hit.teams.length ? hit.teams : tpl.teams,
          };
        });

        return {
          companyName: current.companyName || baseTemplate.companyName,
          divisions: mergedDivisions,
        };
      };

      const render = () => {
        const data = normalizeOrgData(store.get(KEY, null));
        store.set && store.set(KEY, data);
        if (!Array.isArray(data.divisions) || !data.divisions.length) {
          mount.innerHTML = '<p class="empty">조직 레지스트리 데이터가 없습니다. 조직 관리 페이지에서 기본 템플릿을 초기화해 주세요.</p>';
          return;
        }

        const divisionCards = data.divisions.map((division) => {
          const teams = (division.teams || []).length
            ? `<div class="teamGrid">${(division.teams || []).map((team) => `<div class="teamCard">${team.name}</div>`).join('')}</div>`
            : '<p class="empty">등록된 팀이 없습니다.</p>';

          return `
            <section class="divisionCard">
              <h4>${division.name}</h4>
              <div class="divisionBody">${teams}</div>
            </section>
          `;
        }).join('');

        mount.innerHTML = `
          <section class="ceoRow">
            <section class="ceoNode">
              <h4>SJ Digital</h4>
              <p>대표이사 박성준</p>
            </section>
          </section>
          <section class="divisionGrid">${divisionCards}</section>
        `;
      };

      window.addEventListener('storage', (e) => { if (e.key === KEY) render(); });
      setInterval(render, 3000);
      render();
    })();
  </script>
</body>
</html>
