<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BCMS Portal - 조직도</title>
<link rel="stylesheet" href="../assets/style.css"/>
<style>
  body { overflow: hidden; }

  .pageWrap {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    height: 100vh; overflow: hidden;
  }

  /* ── Controls bar ── */
  .ctrlBar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; gap: 8px;
    border-bottom: 0.5px solid var(--border);
    background: var(--surface);
    flex-shrink: 0; height: 50px;
  }
  .ctrlLeft { display: flex; align-items: stretch; gap: 0; }
  .ctrlRight { display: flex; align-items: center; gap: 6px; }

  /* ── Tab bar ── */
  .tabBar { display: flex; align-items: stretch; height: 100%; }
  .tabBtn {
    font-size: 13px; font-weight: 600; padding: 0 18px;
    border: none; background: transparent; cursor: pointer;
    color: var(--text-2); border-bottom: 2.5px solid transparent;
    display: flex; align-items: center; gap: 6px;
    transition: color .15s, border-color .15s, background .15s;
    white-space: nowrap; position: relative;
  }
  .tabBtn:hover { background: rgba(0,0,0,.04); color: var(--text); }
  [data-theme="dark"] .tabBtn:hover { background: rgba(255,255,255,.05); }
  .tabBtn.normal.active    { color: #2563eb; border-bottom-color: #2563eb; font-weight: 700; }
  .tabBtn.emergency.active { color: #dc2626; border-bottom-color: #dc2626; font-weight: 700; }

  .cBtn {
    font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: var(--r-sm);
    border: 0.5px solid var(--border-strong); background: var(--surface);
    color: var(--text); cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .cBtn:hover    { background: var(--surface-hover); }
  .cBtn.active   { background: var(--accent); color: #fff; border-color: transparent; }
  .cBtn.danger   { background: #dc2626; color: #fff; border-color: transparent; }
  .cBtn.success  { background: #16a34a; color: #fff; border-color: transparent; }
  .cBtn.locked   { background: #7c3aed; color: #fff; border-color: transparent; }
  .cBtn.warn     { background: #d97706; color: #fff; border-color: transparent; }

  /* ── Canvas ── */
  .canvasWrap { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  #cy { width: 100%; height: 100%; }
  .edgeModeCursor #cy { cursor: crosshair !important; }

  /* ── Canvas badges ── */
  .canvasBadge {
    position: absolute; top: 10px; left: 10px; z-index: 50;
    border-radius: 999px; padding: 4px 12px;
    font-size: 12px; font-weight: 600; display: none; pointer-events: none;
  }
  .editBadge { background: rgba(245,158,11,.1); border: 0.5px solid rgba(245,158,11,.35); color: #b45309; }
  .edgeBadge { background: rgba(37,99,235,.1); border: 0.5px solid rgba(37,99,235,.35); color: #1d4ed8; }
  body.isEditMode .editBadge { display: block; }
  body.isEdgeMode .edgeBadge { display: block; top: 38px; }

  /* ── Inline label editor ── */
  #lblEditor {
    position: absolute; display: none; z-index: 300;
    text-align: center; border: 2px solid var(--accent); border-radius: 6px;
    outline: none; resize: none; overflow: hidden;
    font-family: inherit; background: var(--surface); color: var(--text);
    padding: 4px; line-height: 1.4; font-weight: 600;
  }
  #lblEditor.show { display: block; }

  /* ── Detail panel ── */
  #panel {
    position: absolute; right: 0; top: 0; bottom: 0; width: 290px;
    background: var(--surface); border-left: 0.5px solid var(--border);
    transform: translateX(100%); transition: transform .25s ease;
    z-index: 200; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 11px;
  }
  #panel.open { transform: translateX(0); }

  .pHead {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .pTitle { font-size: 14px; font-weight: 700; color: var(--text); margin: 0; flex: 1; min-width: 0; word-break: break-all; }
  .pClose { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--text-2); line-height: 1; padding: 2px; }
  .pClose:hover { color: var(--text); }

  .pField { display: flex; flex-direction: column; gap: 4px; }
  .pLbl {
    font-size: 10px; font-weight: 600; color: var(--text-2);
    text-transform: uppercase; letter-spacing: .05em;
  }
  .pInp, .pSel, .pTxt {
    font-size: 13px; padding: 7px 9px;
    border: 0.5px solid var(--border-strong); border-radius: var(--r-sm);
    background: var(--surface); color: var(--text); width: 100%; outline: none;
    font-family: inherit;
  }
  .pInp:focus, .pSel:focus, .pTxt:focus { border-color: var(--accent); }
  .pTxt { resize: vertical; min-height: 70px; line-height: 1.5; }
  .pContactRow { display: none; }
  body.isEditMode .pContactRow { display: flex; }
  .pBtns { display: flex; gap: 8px; }
  .pBtn { flex: 1; font-size: 12px; font-weight: 600; padding: 7px; border-radius: var(--r-sm); border: 0.5px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer; }
  .pBtn.primary { background: var(--accent); color: #fff; border-color: transparent; }

  .colorGridWrap { display: flex; flex-direction: column; gap: 6px; }
  .colorGrid { display: grid; grid-template-columns: repeat(6, 26px); gap: 4px; }
  .colorSwatch {
    width: 26px; height: 26px; border-radius: 5px; cursor: pointer;
    border: 1.5px solid var(--border); transition: transform .1s;
  }
  .colorSwatch:hover { transform: scale(1.2); border-color: var(--text); }

  /* ── Context menu ── */
  #ctxMenu {
    position: fixed; z-index: 9999; display: none;
    background: var(--surface); border: 0.5px solid var(--border-strong);
    border-radius: var(--r-sm); box-shadow: var(--shadow); min-width: 164px; overflow: hidden;
  }
  #ctxMenu.show { display: block; }
  .ctxItem {
    padding: 8px 13px; font-size: 13px; font-weight: 500; color: var(--text);
    cursor: pointer; display: flex; align-items: center; gap: 8px; user-select: none;
  }
  .ctxItem:hover { background: var(--surface-hover); }
  .ctxItem.del { color: #dc2626; }
  .ctxSep { height: 0.5px; background: var(--border); margin: 2px 0; }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(40px);
    background: #0f172a; color: #fff; font-size: 13px; font-weight: 600;
    padding: 9px 20px; border-radius: 999px; opacity: 0;
    transition: all .25s; pointer-events: none; z-index: 9999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  [data-theme="dark"] .toast { background: #f8fafc; color: #0f172a; }
</style>
</head>
<body>
<aside id="sidebarMount"></aside>

<div class="pageWrap">
  <!-- Controls -->
  <div class="ctrlBar">
    <div class="ctrlLeft">
      <div class="tabBar">
        <button class="tabBtn normal active" id="btnNormal"    onclick="ORG.switchMode('normal')">📋 평상시 조직</button>
        <button class="tabBtn emergency"     id="btnEmergency" onclick="ORG.switchMode('emergency')">🚨 비상대응 조직</button>
      </div>
    </div>
    <div class="ctrlRight">
      <button class="cBtn"         id="btnAddNode"  onclick="ORG.addNode()">+ 노드 추가</button>
      <button class="cBtn"         id="btnAddEdge"  onclick="ORG.toggleEdgeMode()">연결선 추가</button>
      <button class="cBtn danger"  id="btnDel"      onclick="ORG.deleteSelected()">선택 삭제</button>
      <button class="cBtn"         id="btnLayout"   onclick="ORG.autoLayout()">자동 정렬</button>
      <button class="cBtn success" id="btnSave"     onclick="ORG.save()">저장</button>
      <button class="cBtn warn"    id="btnReset"    onclick="ORG.resetToSample()">초기화</button>
      <button class="cBtn"         id="btnLock"     onclick="ORG.toggleLock()">편집 잠금</button>
    </div>
  </div>

  <!-- Canvas -->
  <div class="canvasWrap" id="canvasWrap">
    <div id="cy"></div>
    <div class="canvasBadge editBadge">✏️ 편집 모드</div>
    <div class="canvasBadge edgeBadge">🔗 연결할 대상 노드를 클릭하세요</div>
    <textarea id="lblEditor" rows="2"></textarea>

    <!-- Detail panel -->
    <div id="panel">
      <div class="pHead">
        <p class="pTitle" id="pTitle">노드 정보</p>
        <button class="pClose" onclick="ORG.closePanel()">×</button>
      </div>
      <div class="pField">
        <label class="pLbl">노드명</label>
        <textarea class="pTxt" id="pName" rows="2" placeholder="노드 이름 (여러 줄 가능)"></textarea>
      </div>
      <div class="pField">
        <label class="pLbl">유형</label>
        <select class="pSel" id="pType">
          <option value="ceo">최상위 (CEO / 기관장)</option>
          <option value="division">본부 / 실 / 부</option>
          <option value="team">팀 / 센터</option>
          <option value="eop-root">비상대응 총괄 본부</option>
          <option value="eop-stage">비상대응 2단계 본부</option>
          <option value="eop-unit">반 (EOP 단위 조직)</option>
        </select>
      </div>
      <div class="pField">
        <label class="pLbl">담당자 / 반장</label>
        <input class="pInp" id="pPerson" type="text" placeholder="담당자 성명"/>
      </div>
      <div class="pField">
        <label class="pLbl">직책 / 평시 소속</label>
        <input class="pInp" id="pTitle2" type="text" placeholder="직책 또는 평시 소속"/>
      </div>
      <div class="pField pContactRow">
        <label class="pLbl">🔒 비상연락처 (편집 모드)</label>
        <input class="pInp" id="pContact" type="text" placeholder="010-0000-0000"/>
      </div>
      <div class="pField">
        <label class="pLbl">주요 역할 / 담당업무</label>
        <textarea class="pTxt" id="pRole" rows="3" placeholder="주요 역할 또는 담당업무..."></textarea>
      </div>
      <div class="pBtns">
        <button class="pBtn primary" onclick="ORG.savePanel()">저장</button>
        <button class="pBtn"         onclick="ORG.closePanel()">닫기</button>
      </div>
      <div class="colorGridWrap">
        <span class="pLbl">노드 색상</span>
        <div class="colorGrid" id="panelColors"></div>
      </div>
    </div>
  </div>
</div>

<!-- Context menu -->
<div id="ctxMenu">
  <div class="ctxItem" id="ctx-edit"     onclick="ORG.ctxEdit()">✏️ 이름 편집</div>
  <div class="ctxItem" id="ctx-child"    onclick="ORG.ctxAddChild()">➕ 하위 노드 추가</div>
  <div class="ctxItem" id="ctx-edge"     onclick="ORG.ctxStartEdge()">🔗 연결선 추가</div>
  <div class="ctxSep"></div>
  <div class="ctxItem" id="ctx-color"    onclick="ORG.ctxColorPanel()">🎨 색상 변경</div>
  <div class="ctxSep"></div>
  <div class="ctxItem del" id="ctx-del"  onclick="ORG.ctxDelete()">🗑 삭제</div>
</div>

<div class="toast" id="toast"></div>

<script src="../assets/sidebar.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script>
'use strict';
window.ORG = (() => {

  /* ── Constants ────────────────────────────────────────────────── */
  const KEY_ORG = 'bcmsOrgChart';
  const KEY_EOP = 'bcmsEOPOrg';
  const KEY_IND = 'bcmsIndustry';

  const COLORS = [
    {bg:'#0f172a',fg:'#fff'},{bg:'#1e40af',fg:'#fff'},{bg:'#2563eb',fg:'#fff'},
    {bg:'#0891b2',fg:'#fff'},{bg:'#047857',fg:'#fff'},{bg:'#d97706',fg:'#fff'},
    {bg:'#dc2626',fg:'#fff'},{bg:'#7c3aed',fg:'#fff'},{bg:'#be185d',fg:'#fff'},
    {bg:'#f1f5f9',fg:'#0f172a'},{bg:'#fef3c7',fg:'#92400e'},{bg:'#d1fae5',fg:'#065f46'},
  ];

  /* ── Industry samples ─────────────────────────────────────────── */
  const SAMPLES = {
    '제조업':  { root:'대표이사', company:'(주)회사명', divs:[
      {n:'생산본부',   t:['생산팀','품질팀','생산관리팀']},
      {n:'기술본부',   t:['설비유지팀','기술개발팀']},
      {n:'경영지원본부',t:['구매팀','물류팀','인사팀','재무팀']},
      {n:'IT본부',     t:['IT인프라팀','시스템운영팀']},
      {n:'영업본부',   t:['영업팀','고객관리팀']},
    ]},
    '금융': { root:'대표이사/행장', company:'(주)금융회사', divs:[
      {n:'IT본부',      t:['IT인프라팀','시스템운영팀','정보보호팀']},
      {n:'영업본부',    t:['수신팀','여신팀','고객서비스팀']},
      {n:'자금본부',    t:['자금팀','결제팀']},
      {n:'준법감시본부', t:['준법감시팀','감사팀']},
      {n:'경영지원본부', t:['인사팀','재무팀']},
    ]},
    '공공기관': { root:'기관장', company:'(공공기관명)', divs:[
      {n:'기획조정실',    t:['기획팀','예산팀']},
      {n:'행정지원본부',  t:['행정팀','인사팀','재무회계팀']},
      {n:'IT본부',        t:['정보화팀','정보보호팀']},
      {n:'민원서비스본부', t:['민원팀','대민서비스팀']},
      {n:'감사실',        t:['감사팀','컴플라이언스팀']},
    ]},
    '고속도로': { root:'사장/본부장', company:'(고속도로운영사)', divs:[
      {n:'관제본부',    t:['교통관제팀','CCTV운영팀']},
      {n:'시설본부',    t:['전기팀','기계(냉각)팀','방재·소방팀']},
      {n:'IT본부',      t:['IT인프라팀','ETC운영팀','네트워크팀']},
      {n:'운영본부',    t:['순찰팀','유지보수팀','DC운영(NOC)팀']},
      {n:'경영지원본부', t:['인사팀','재무팀','고객지원팀']},
    ]},
    '통신': { root:'대표이사', company:'(통신회사)', divs:[
      {n:'네트워크본부',  t:['코어네트워크팀','무선팀','교환팀']},
      {n:'IT본부',        t:['IT인프라팀','시스템운영팀']},
      {n:'서비스본부',    t:['인터넷서비스팀','기업서비스팀']},
      {n:'고객지원본부',  t:['고객센터팀','장애접수팀']},
      {n:'경영지원본부',  t:['인사팀','재무팀']},
    ]},
    'IDC': { root:'대표이사/센터장', company:'(IDC운영사)', divs:[
      {n:'시설본부',    t:['전기팀','기계(냉각)팀','방재·소방팀']},
      {n:'IT운영본부',  t:['서버운영팀','네트워크팀','스토리지팀']},
      {n:'보안본부',    t:['물리보안팀','정보보호팀']},
      {n:'서비스본부',  t:['고객지원팀','서비스품질팀']},
      {n:'경영지원본부', t:['인사총무팀','재무회계팀','구매·자산관리팀']},
    ]},
  };

  /* ── Element builders ─────────────────────────────────────────── */
  function buildNormal(ind) {
    const s = SAMPLES[ind];
    if (!s) {
      // Default: hardcoded 공공기관 sample with exact IDs
      return [
        { data: { id:'ceo',  label:'(공공기관명)\n기관장',  type:'ceo'      } },
        { data: { id:'div1', label:'기획조정실',            type:'division' } },
        { data: { id:'div2', label:'행정지원본부',          type:'division' } },
        { data: { id:'div3', label:'IT본부',                type:'division' } },
        { data: { id:'div4', label:'민원서비스본부',        type:'division' } },
        { data: { id:'t1',   label:'기획팀',                type:'team'     } },
        { data: { id:'t2',   label:'예산팀',                type:'team'     } },
        { data: { id:'t3',   label:'행정팀',                type:'team'     } },
        { data: { id:'t4',   label:'인사팀',                type:'team'     } },
        { data: { id:'t5',   label:'정보화팀',              type:'team'     } },
        { data: { id:'t6',   label:'정보보호팀',            type:'team'     } },
        { data: { id:'t7',   label:'민원팀',                type:'team'     } },
        { data: { id:'t8',   label:'대민서비스팀',          type:'team'     } },
        { data: { id:'e-ceo-div1', source:'ceo',  target:'div1' } },
        { data: { id:'e-ceo-div2', source:'ceo',  target:'div2' } },
        { data: { id:'e-ceo-div3', source:'ceo',  target:'div3' } },
        { data: { id:'e-ceo-div4', source:'ceo',  target:'div4' } },
        { data: { id:'e-div1-t1',  source:'div1', target:'t1'   } },
        { data: { id:'e-div1-t2',  source:'div1', target:'t2'   } },
        { data: { id:'e-div2-t3',  source:'div2', target:'t3'   } },
        { data: { id:'e-div2-t4',  source:'div2', target:'t4'   } },
        { data: { id:'e-div3-t5',  source:'div3', target:'t5'   } },
        { data: { id:'e-div3-t6',  source:'div3', target:'t6'   } },
        { data: { id:'e-div4-t7',  source:'div4', target:'t7'   } },
        { data: { id:'e-div4-t8',  source:'div4', target:'t8'   } },
      ];
    }
    const els = [];
    els.push({ data: { id:'ceo', label:`${s.company}\n${s.root}`, type:'ceo' } });
    s.divs.forEach((d, di) => {
      const did = `d${di}`;
      els.push({ data: { id:did, label:d.n, type:'division' } });
      els.push({ data: { id:`e-c-${did}`, source:'ceo', target:did } });
      d.t.forEach((t, ti) => {
        const tid = `t${di}-${ti}`;
        els.push({ data: { id:tid, label:t, type:'team' } });
        els.push({ data: { id:`e-${did}-${tid}`, source:did, target:tid } });
      });
    });
    return els;
  }

  function buildEOP() {
    // Preset positions: explicit coordinates so nodes don't collapse into a line
    return [
      // ── Root ──
      { data: { id:'eop-root', label:'재난대책본부\n(본부장/CEO)', type:'eop-root' },
        position: { x:400, y:100 } },

      // ── Stage-1: 재난대책본부 산하 4개 반 ──
      { data: { id:'s1u0', label:'재난상황반', type:'eop-unit' }, position: { x:100, y:280 } },
      { data: { id:'s1u1', label:'초동대응반', type:'eop-unit' }, position: { x:280, y:280 } },
      { data: { id:'s1u2', label:'복구지원반', type:'eop-unit' }, position: { x:460, y:280 } },
      { data: { id:'s1u3', label:'대외협력반', type:'eop-unit' }, position: { x:640, y:280 } },

      // ── BCP root (조건부 가동) ──
      { data: { id:'bcp-root', label:'업무연속성대응본부\n(BCP대응본부)', type:'eop-stage' },
        position: { x:900, y:280 } },

      // ── Stage-2: BCP 대응본부 산하 5개 반 ──
      { data: { id:'s2u0', label:'업무환경반',   type:'eop-unit' }, position: { x:680,  y:460 } },
      { data: { id:'s2u1', label:'IT복구반',     type:'eop-unit' }, position: { x:820,  y:460 } },
      { data: { id:'s2u2', label:'업무재개반',   type:'eop-unit' }, position: { x:960,  y:460 } },
      { data: { id:'s2u3', label:'자원지원반',   type:'eop-unit' }, position: { x:1100, y:460 } },
      { data: { id:'s2u4', label:'대내외소통반', type:'eop-unit' }, position: { x:1240, y:460 } },

      // ── Edges ──
      { data: { id:'es1-s1u0', source:'eop-root', target:'s1u0' } },
      { data: { id:'es1-s1u1', source:'eop-root', target:'s1u1' } },
      { data: { id:'es1-s1u2', source:'eop-root', target:'s1u2' } },
      { data: { id:'es1-s1u3', source:'eop-root', target:'s1u3' } },
      { data: { id:'e-bcp',    source:'eop-root', target:'bcp-root',
        label:'업무중단 발생 시 가동', dashed:true } },
      { data: { id:'es2-s2u0', source:'bcp-root', target:'s2u0' } },
      { data: { id:'es2-s2u1', source:'bcp-root', target:'s2u1' } },
      { data: { id:'es2-s2u2', source:'bcp-root', target:'s2u2' } },
      { data: { id:'es2-s2u3', source:'bcp-root', target:'s2u3' } },
      { data: { id:'es2-s2u4', source:'bcp-root', target:'s2u4' } },
    ];
  }

  /* ── Cytoscape style ──────────────────────────────────────────── */
  function mkStyle() {
    const dk = document.documentElement.getAttribute('data-theme') === 'dark';
    const surf  = dk ? '#111' : '#fff';
    const txt   = dk ? '#ededed' : '#0f172a';
    const edge  = dk ? 'rgba(255,255,255,.22)' : 'rgba(15,23,42,.22)';
    const bord  = dk ? 'rgba(255,255,255,.18)' : 'rgba(15,23,42,.18)';
    const blue  = 'rgba(37,99,235,.38)';
    const red   = 'rgba(220,38,38,.38)';

    return [
      { selector:'node', style:{
          label:'data(label)', 'text-valign':'center', 'text-halign':'center',
          'font-family':'"Pretendard","Inter",system-ui,sans-serif',
          'font-size':'13px', 'font-weight':'600',
          'text-wrap':'wrap', 'text-max-width':'110px',
          shape:'round-rectangle',
          'background-color': surf, color: txt,
          'border-color': bord, 'border-width':'1.5px',
          width:'120px', height:'44px',
      }},
      { selector:'node[type="ceo"]', style:{
          'background-color':'#0f172a', color:'#fff',
          'border-width':'0', width:'160px', height:'60px',
          'font-size':'16px', 'font-weight':'700',
          'text-max-width':'145px',
      }},
      { selector:'node[type="division"]', style:{
          'background-color':'#1d4f89', color:'#fff',
          'border-width':'0', width:'140px', height:'50px',
          'font-size':'14px', 'text-max-width':'125px',
      }},
      { selector:'node[type="team"]', style:{
          'background-color': surf, color: txt,
          'border-color': blue, 'border-width':'1.5px',
          width:'120px', height:'44px', 'font-size':'13px',
      }},
      { selector:'node[type="eop-root"]', style:{
          'background-color':'#7f1d1d', color:'#fff',
          'border-width':'0', width:'160px', height:'60px',
          'font-size':'16px', 'font-weight':'700', 'text-max-width':'145px',
      }},
      { selector:'node[type="eop-stage"]', style:{
          'background-color':'#92400e', color:'#fff',
          'border-color':'rgba(251,191,36,.7)', 'border-width':'2.5px', 'border-style':'dashed',
          width:'140px', height:'50px',
          'font-size':'14px', 'font-weight':'700', 'text-max-width':'125px',
      }},
      { selector:'node[type="eop-unit"]', style:{
          'background-color': surf, color: txt,
          'border-color': red, 'border-width':'1.5px',
          width:'120px', height:'44px', 'font-size':'13px',
      }},
      // Custom color override
      { selector:'node[bgColor]', style:{
          'background-color':'data(bgColor)', color:'data(fgColor)',
      }},
      { selector:'node:selected', style:{
          'border-color':'#0070f3', 'border-width':'2.5px',
          'overlay-color':'#0070f3', 'overlay-padding':'3px', 'overlay-opacity':0.08,
      }},
      { selector:'.edgeSrc', style:{
          'border-color':'#f59e0b', 'border-width':'3px',
          'overlay-color':'#f59e0b', 'overlay-padding':'4px', 'overlay-opacity':0.15,
      }},
      // Edges
      { selector:'edge', style:{
          'curve-style':'bezier',
          'target-arrow-shape':'triangle',
          'arrow-scale':1.0,
          'line-color': edge, 'target-arrow-color': edge, width:1.5,
      }},
      { selector:'edge[?dashed]', style:{
          'line-style':'dashed', 'line-dash-pattern':[8,4],
          'line-color':'rgba(245,158,11,.5)', 'target-arrow-color':'rgba(245,158,11,.5)',
          width:2.0, 'curve-style':'straight',
          label:'data(label)',
          'font-size':'11px', 'font-weight':'600', color:'#b45309',
          'text-background-opacity':1, 'text-background-color': surf,
          'text-background-padding':'4px', 'text-background-shape':'roundrectangle',
          'text-border-opacity':0.3, 'text-border-width':0.5, 'text-border-color':'rgba(245,158,11,.4)',
      }},
      { selector:'edge:selected', style:{
          'line-color':'#0070f3', 'target-arrow-color':'#0070f3',
      }},
    ];
  }

  /* ── State ────────────────────────────────────────────────────── */
  let cy        = null;
  let mode      = 'normal';
  let editMode  = true;
  let edgeMode  = false;
  let edgeSrc   = null;
  let ctxTarget = null;
  let panelNode = null;
  const uid = () => `n${Date.now()}${Math.random().toString(36).slice(2,5)}`;

  /* ── Utilities ────────────────────────────────────────────────── */
  const loadJ = (k,fb) => { try{const r=localStorage.getItem(k);return r?JSON.parse(r):fb;}catch{return fb;} };
  const saveJ = (k,v) => localStorage.setItem(k, JSON.stringify(v));

  function toast(msg, ms=2200) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), ms);
  }

  /* ── Init Cytoscape ───────────────────────────────────────────── */
  function initCy(elements) {
    if (cy) { cy.destroy(); cy = null; }

    // Create instance with no elements; add explicitly so layout call is separate
    cy = cytoscape({
      container: document.getElementById('cy'),
      elements: [],
      style: mkStyle(),
      minZoom: 0.15, maxZoom: 3,
      wheelSensitivity: 0.3,
    });

    const addEls = (elements && elements.length)
      ? elements
      : [{ data: { id:'ceo', label:'기관장', type:'ceo' } }];

    cy.add(addEls);

    const hasPos = addEls.some(e => e.position && e.position.x != null);
    if (hasPos) {
      cy.layout({ name:'preset', fit:true, padding:60 }).run();
    } else {
      const roots = cy.nodes().filter(n =>
        n.data('type') === 'ceo' || n.data('type') === 'eop-root'
      );
      cy.layout({
        name:'breadthfirst', directed:true, padding:50, spacingFactor:1.35, fit:true,
        roots: roots.length ? roots : undefined,
      }).run();
    }
    cy.fit(undefined, 50);

    bindCyEvents();
    applyLockState();
  }

  function bindCyEvents() {
    cy.on('dblclick', 'node', e => { if (editMode) startLabelEdit(e.target); });

    cy.on('tap', 'node', e => {
      hideCtxMenu();
      if (edgeMode) { handleEdgeTap(e.target); return; }
      openPanel(e.target);
    });

    cy.on('tap', e => {
      if (e.target === cy) { hideCtxMenu(); }
    });

    cy.on('cxttap', 'node', e => {
      if (!editMode) return;
      ctxTarget = e.target;
      document.getElementById('ctx-edit').style.display  = '';
      document.getElementById('ctx-child').style.display = '';
      document.getElementById('ctx-edge').style.display  = '';
      document.getElementById('ctx-color').style.display = '';
      document.getElementById('ctx-del').textContent = '🗑 노드 삭제';
      const oe = e.originalEvent;
      showCtxMenu(oe.clientX, oe.clientY);
    });

    cy.on('cxttap', 'edge', e => {
      if (!editMode) return;
      ctxTarget = e.target;
      document.getElementById('ctx-edit').style.display  = 'none';
      document.getElementById('ctx-child').style.display = 'none';
      document.getElementById('ctx-edge').style.display  = 'none';
      document.getElementById('ctx-color').style.display = 'none';
      document.getElementById('ctx-del').textContent = '🗑 연결선 삭제';
      const oe = e.originalEvent;
      showCtxMenu(oe.clientX, oe.clientY);
    });

    cy.on('cxttap', e => { if (e.target === cy) hideCtxMenu(); });
  }

  /* ── Label editor ─────────────────────────────────────────────── */
  const lblEd = document.getElementById('lblEditor');
  let lblNode = null;

  function startLabelEdit(node) {
    lblNode = node;
    const rp = node.renderedPosition();
    const rw = node.renderedWidth();
    const rh = node.renderedHeight();
    lblEd.value = node.data('label');
    lblEd.style.left      = `${rp.x - rw/2}px`;
    lblEd.style.top       = `${rp.y - rh/2}px`;
    lblEd.style.width     = `${rw}px`;
    lblEd.style.minHeight = `${rh}px`;
    lblEd.style.fontSize  = `${node.numericStyle('font-size')}px`;
    lblEd.classList.add('show');
    lblEd.focus(); lblEd.select();
  }
  function finishLabelEdit() {
    if (!lblNode) return;
    const v = lblEd.value.trim();
    if (v) { lblNode.data('label', v); if (panelNode && panelNode.id() === lblNode.id()) document.getElementById('pName').value = v; }
    lblEd.classList.remove('show'); lblNode = null;
  }
  lblEd.addEventListener('blur', finishLabelEdit);
  lblEd.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); finishLabelEdit(); }
    if (e.key === 'Escape') { lblEd.classList.remove('show'); lblNode = null; }
  });

  /* ── Edge mode ────────────────────────────────────────────────── */
  function handleEdgeTap(node) {
    if (!edgeSrc) {
      edgeSrc = node; node.addClass('edgeSrc');
    } else {
      if (node.id() !== edgeSrc.id()) {
        cy.add({ group:'edges', data:{ id:`e${uid()}`, source:edgeSrc.id(), target:node.id() } });
      }
      edgeSrc.removeClass('edgeSrc'); edgeSrc = null;
      setEdgeMode(false);
    }
  }

  function setEdgeMode(on) {
    edgeMode = on;
    if (!on && edgeSrc) { edgeSrc.removeClass('edgeSrc'); edgeSrc = null; }
    document.getElementById('btnAddEdge').classList.toggle('active', on);
    document.getElementById('canvasWrap').classList.toggle('edgeModeCursor', on);
    document.body.classList.toggle('isEdgeMode', on);
    cy.userPanningEnabled(!on);
  }

  /* ── Context menu ─────────────────────────────────────────────── */
  const ctxMenu = document.getElementById('ctxMenu');

  function showCtxMenu(x, y) {
    ctxMenu.style.left = `${Math.min(x, window.innerWidth  - 175)}px`;
    ctxMenu.style.top  = `${Math.min(y, window.innerHeight - 200)}px`;
    ctxMenu.classList.add('show');
  }
  function hideCtxMenu() { ctxMenu.classList.remove('show'); }

  document.addEventListener('click', e => {
    if (!ctxMenu.contains(e.target)) hideCtxMenu();
  });

  function ctxEdit() {
    hideCtxMenu();
    if (ctxTarget && ctxTarget.isNode()) startLabelEdit(ctxTarget);
  }
  function ctxAddChild() {
    hideCtxMenu();
    if (!ctxTarget || !ctxTarget.isNode()) return;
    const pt = ctxTarget.data('type');
    const ct = pt === 'ceo' ? 'division' : (pt === 'eop-root' || pt === 'eop-stage') ? 'eop-unit' : 'team';
    const id  = uid();
    const pp  = ctxTarget.position();
    cy.add([
      { group:'nodes', data:{ id, label:'신규 노드', type:ct }, position:{ x:pp.x+20, y:pp.y+120 } },
      { group:'edges', data:{ id:'e'+uid(), source:ctxTarget.id(), target:id } },
    ]);
    toast('하위 노드가 추가되었습니다');
  }
  function ctxStartEdge() {
    hideCtxMenu();
    if (!ctxTarget || !ctxTarget.isNode()) return;
    edgeSrc = ctxTarget; ctxTarget.addClass('edgeSrc');
    setEdgeMode(true);
  }
  function ctxColorPanel() {
    hideCtxMenu();
    if (ctxTarget && ctxTarget.isNode()) openPanel(ctxTarget);
  }
  function ctxDelete() {
    hideCtxMenu();
    if (!ctxTarget) return;
    cy.remove(ctxTarget);
    if (panelNode && ctxTarget.isNode() && panelNode.id() === ctxTarget.id()) closePanel();
  }

  /* ── Detail panel ─────────────────────────────────────────────── */
  function openPanel(node) {
    panelNode = node;
    document.getElementById('pTitle').textContent  = node.data('label').replace(/\n/g,' ');
    document.getElementById('pName').value         = node.data('label');
    document.getElementById('pType').value         = node.data('type') || 'team';
    document.getElementById('pPerson').value       = node.data('person') || '';
    document.getElementById('pTitle2').value       = node.data('jobTitle') || '';
    document.getElementById('pContact').value      = node.data('contact') || '';
    document.getElementById('pRole').value         = node.data('role') || '';
    document.getElementById('panel').classList.add('open');
  }
  function savePanel() {
    if (!panelNode) return;
    const lbl = document.getElementById('pName').value.trim();
    if (lbl) { panelNode.data('label', lbl); document.getElementById('pTitle').textContent = lbl.replace(/\n/g,' '); }
    panelNode.data('type',     document.getElementById('pType').value);
    panelNode.data('person',   document.getElementById('pPerson').value.trim());
    panelNode.data('jobTitle', document.getElementById('pTitle2').value.trim());
    panelNode.data('contact',  document.getElementById('pContact').value.trim());
    panelNode.data('role',     document.getElementById('pRole').value.trim());
    toast('저장되었습니다 ✓');
  }
  function closePanel() {
    document.getElementById('panel').classList.remove('open');
    panelNode = null;
  }

  /* ── Color swatches ───────────────────────────────────────────── */
  function buildSwatches() {
    document.getElementById('panelColors').innerHTML = COLORS.map(c =>
      `<div class="colorSwatch" style="background:${c.bg};border-color:${c.bg === '#f1f5f9' || c.bg === '#fef3c7' || c.bg === '#d1fae5' ? '#ccc' : c.bg};"
            onclick="ORG.applyColor('${c.bg}','${c.fg}')"></div>`
    ).join('');
  }
  function applyColor(bg, fg) {
    if (!panelNode) return;
    panelNode.data('bgColor', bg); panelNode.data('fgColor', fg);
    toast('색상이 변경되었습니다');
  }

  /* ── Mode switch ──────────────────────────────────────────────── */
  function switchMode(m) {
    if (m === mode) return;
    if (edgeMode) setEdgeMode(false);
    mode = m;
    document.getElementById('btnNormal').classList.toggle('active',    m === 'normal');
    document.getElementById('btnEmergency').classList.toggle('active', m === 'emergency');
    closePanel();
    loadMode();
  }

  /* ── Lock ─────────────────────────────────────────────────────── */
  function toggleLock() {
    editMode = !editMode;
    applyLockState();
    if (!editMode && edgeMode) setEdgeMode(false);
  }
  function applyLockState() {
    document.body.classList.toggle('isEditMode', editMode);
    cy.autoungrabify(!editMode);
    const btn = document.getElementById('btnLock');
    btn.textContent = editMode ? '편집 잠금' : '🔒 잠금 해제';
    btn.className   = editMode ? 'cBtn' : 'cBtn locked';
  }

  /* ── Toolbar actions ──────────────────────────────────────────── */
  function addNode() {
    if (!editMode) { toast('편집 모드를 활성화하세요'); return; }
    const id  = uid();
    const ext = cy.extent();
    const cx  = (ext.x1 + ext.x2) / 2;
    const cy2 = (ext.y1 + ext.y2) / 2;
    const t   = mode === 'emergency' ? 'eop-unit' : 'team';
    cy.add({ group:'nodes', data:{ id, label:'신규 노드', type:t }, position:{ x:cx, y:cy2 } });
    cy.getElementById(id).select();
    toast('노드가 추가되었습니다');
  }

  function toggleEdgeMode() {
    if (!editMode) { toast('편집 모드를 활성화하세요'); return; }
    setEdgeMode(!edgeMode);
    if (edgeMode) toast('첫 번째 노드를 클릭하세요');
  }

  function deleteSelected() {
    if (!editMode) return;
    const sel = cy.$(':selected');
    if (!sel.length) { toast('삭제할 항목을 선택하세요'); return; }
    if (panelNode && sel.some(e => e.isNode() && e.id() === panelNode.id())) closePanel();
    cy.remove(sel);
  }

  function autoLayout() {
    if (mode === 'emergency') {
      // Reset to hardcoded preset positions
      const presetEls = buildEOP();
      const positions = {};
      presetEls.forEach(el => {
        if (el.position && el.data && el.data.id) positions[el.data.id] = el.position;
      });
      cy.layout({
        name: 'preset',
        positions: (node) => positions[node.id()] || undefined,
        fit: true, padding: 60,
        animate: true, animationDuration: 500,
      }).run();
      return;
    }
    cy.layout({
      name: 'breadthfirst', directed: true, padding: 55, spacingFactor: 1.35,
      animate: true, animationDuration: 500,
      roots: cy.nodes().filter(n => n.indegree() === 0),
    }).run();
  }

  /* ── Save / Load ──────────────────────────────────────────────── */
  function save() {
    const key = mode === 'normal' ? KEY_ORG : KEY_EOP;
    saveJ(key, cy.json().elements);
    toast('저장되었습니다 ✓');
  }

  function loadMode() {
    if (mode === 'normal') {
      // Accept saved data only when it contains >= 2 nodes; a single-node save
      // (leftover from an earlier broken session) is treated as empty.
      const raw = loadJ(KEY_ORG, null);
      let els = null;
      if (raw) {
        const arr = Array.isArray(raw) ? raw : [...(raw.nodes||[]), ...(raw.edges||[])];
        const nodeCount = arr.filter(e => e.data && !e.data.source).length;
        if (nodeCount >= 2) els = arr;
      }
      if (!els) {
        const ind = (localStorage.getItem(KEY_IND)||'').trim();
        els = buildNormal(ind);   // returns hardcoded 공공기관 when ind is unknown
      }
      initCy(els);
    } else {
      const raw = loadJ(KEY_EOP, null);
      let els = null;
      if (raw) {
        const arr = Array.isArray(raw) ? raw : [...(raw.nodes||[]), ...(raw.edges||[])];
        if (arr.length) els = arr;
      }
      initCy(els || buildEOP());
    }
  }

  function resetToSample() {
    if (!confirm('샘플 데이터로 초기화하시겠습니까? 현재 레이아웃이 삭제됩니다.')) return;
    const key = mode === 'normal' ? KEY_ORG : KEY_EOP;
    localStorage.removeItem(key);
    loadMode();
    closePanel();
    toast('초기화되었습니다');
  }

  /* ── Dark mode sync ───────────────────────────────────────────── */
  new MutationObserver(() => { if (cy) cy.style(mkStyle()); })
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });

  /* ── Init ─────────────────────────────────────────────────────── */
  function init() {
    buildSwatches();

    // Set initial mode from URL hash
    const startMode = location.hash === '#emergency' ? 'emergency' : 'normal';
    if (startMode !== mode) {
      mode = startMode;
      document.getElementById('btnNormal').classList.toggle('active',    mode === 'normal');
      document.getElementById('btnEmergency').classList.toggle('active', mode === 'emergency');
    }

    // Handle sidebar clicks when already on this page (only hash changes, no reload)
    window.addEventListener('hashchange', () => {
      const newMode = location.hash === '#emergency' ? 'emergency' : 'normal';
      if (newMode !== mode) switchMode(newMode);
    });

    // Defer Cytoscape init by two animation frames to guarantee container
    // has non-zero computed dimensions from CSS flexbox layout
    requestAnimationFrame(() => requestAnimationFrame(() => loadMode()));
  }

  return {
    switchMode, toggleLock, addNode, toggleEdgeMode, deleteSelected,
    autoLayout, save, resetToSample,
    savePanel, closePanel, applyColor,
    ctxEdit, ctxAddChild, ctxStartEdge, ctxColorPanel, ctxDelete,
    init,
  };
})();

ORG.init();
</script>
<button class="theme-toggle" id="themeToggle" title="다크모드 전환">🌙</button>
<script>(function(){const r=document.documentElement,t=document.getElementById('themeToggle'),s=localStorage.getItem('bcmsTheme')||'light';r.setAttribute('data-theme',s);if(t){t.textContent=s==='dark'?'☀️':'🌙';t.addEventListener('click',()=>{const n=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',n);t.textContent=n==='dark'?'☀️':'🌙';localStorage.setItem('bcmsTheme',n);});}})();</script>
