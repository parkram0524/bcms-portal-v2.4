<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>BCMS Executive Summary | BCMS Portal v2</title>
  <link rel="stylesheet" href="../assets/style.css"/>
  <style>
    .main{ padding:20px; background:#f6f7fb; }
    .wrap{ max-width:1280px; margin:0 auto; }
    .head{ border:1px solid rgba(15,23,42,.12); border-radius:16px; background:#fff; padding:14px; margin-bottom:12px; }
    .title{ margin:0; font-size:26px; font-weight:950; color:#0f172a; }
    .desc{ margin:6px 0 0; color:#475569; font-size:13px; }
    .meta{ margin-top:8px; color:#64748b; font-size:12px; }
    .actions{ margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
    .btn{ border:1px solid rgba(15,23,42,.16); border-radius:10px; background:#fff; color:#0f172a; padding:8px 12px; font-size:13px; font-weight:900; text-decoration:none; cursor:pointer; }

    .grid{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:12px; }
    .kpi{ grid-column:span 3; border:1px solid rgba(15,23,42,.12); border-radius:14px; background:#fff; padding:12px; }
    .k{ font-size:12px; color:#64748b; font-weight:900; }
    .v{ margin-top:8px; font-size:30px; font-weight:950; color:#0f172a; }
    .h{ margin-top:4px; font-size:12px; color:#64748b; }

    .panel{ grid-column:span 6; border:1px solid rgba(15,23,42,.12); border-radius:14px; background:#fff; padding:12px; }
    .panel.full{ grid-column:span 12; }
    .panel h3{ margin:0 0 10px; font-size:16px; }
    .list{ display:grid; gap:8px; }
    .row{ border:1px solid rgba(15,23,42,.10); border-radius:10px; padding:9px; display:flex; justify-content:space-between; gap:10px; }
    .muted{ color:#64748b; font-size:12px; }
    .badge{ border:1px solid rgba(15,23,42,.12); border-radius:999px; padding:4px 9px; font-size:11px; font-weight:900; white-space:nowrap; }
    .barList{ display:grid; gap:7px; }
    .bar{ display:grid; grid-template-columns:140px 1fr 46px; gap:8px; align-items:center; }
    .track{ height:8px; background:rgba(15,23,42,.08); border-radius:999px; overflow:hidden; }
    .fill{ height:100%; background:rgba(37,99,235,.55); }

    @media (max-width:1080px){ .kpi{ grid-column:span 4; } .panel{ grid-column:span 12; } }
    @media (max-width:760px){ .kpi{ grid-column:span 6; } }
    @media (max-width:520px){ .kpi{ grid-column:span 12; } }

    @media print {
      body{ background:#fff; }
      .main{ padding:0; background:#fff; }
      .actions, #sidebarMount{ display:none !important; }
      .wrap{ max-width:100%; }
      .head, .kpi, .panel, .row{ box-shadow:none !important; }
      .head, .kpi, .panel, .row{ break-inside:avoid; }
      @page { size: A4 portrait; margin: 12mm; }
    }
  </style>
</head>
<body>
  <aside id="sidebarMount"></aside>
  <main class="main">
    <div class="wrap">
      <section class="head">
        <h1 class="title">BCMS Executive Summary</h1>
        <p class="desc">SJ Digital · 운영형 BCMS 현황 요약 / Incident, Risk, Continuity 상태 포함</p>
        <div class="meta" id="reportTime">기준 시각: -</div>
        <div class="actions">
          <button class="btn" id="btnPrint" type="button">인쇄 / PDF 저장</button>
          <a class="btn" href="../index.html">메인 대시보드</a>
          <a class="btn" href="../op-center/ops-status.html">Ops Status</a>
        </div>
      </section>

      <section class="grid" id="kpiGrid"></section>

      <section class="grid" style="margin-top:12px;">
        <article class="panel">
          <h3>운영 리스크 요약</h3>
          <div id="riskTop" class="list"></div>
          <div class="muted" style="margin-top:8px; font-weight:900;">리스크 집중 팀 TOP 3</div>
          <div id="riskTeamTop" class="barList"></div>
        </article>

        <article class="panel">
          <h3>Incident / 복구 요약</h3>
          <div id="incidentSummary" class="list"></div>
        </article>

        <article class="panel">
          <h3>핵심업무 / BIA 요약</h3>
          <div id="coreBiaSummary" class="list"></div>
        </article>

        <article class="panel">
          <h3>Evidence / CAPA 요약</h3>
          <div id="opsSummary" class="list"></div>
        </article>

        <article class="panel full">
          <h3>BCP / 연속성 요약</h3>
          <div id="bcpSummary" class="list"></div>
        </article>

        <article class="panel full">
          <h3>자동 인사이트</h3>
          <div id="insightList" class="list"></div>
        </article>
      </section>
    </div>
  </main>

  <script src="../assets/sidebar.js"></script>
  <script src="../assets/data-store.js"></script>
  <script>
    (() => {
      const safeParse = (raw, fallback = null) => { try { return raw ? JSON.parse(raw) : fallback; } catch { return fallback; } };
      const asText = (v) => String(v || '').trim();
      const asLower = (v) => asText(v).toLowerCase();
      const hasValue = (v) => v !== null && v !== undefined && String(v).trim() !== '';
      const toTime = (v) => { const t = new Date(v).getTime(); return Number.isFinite(t) ? t : 0; };
      const uniq = (arr) => [...new Set((Array.isArray(arr) ? arr : []).filter(Boolean))];
      const toNum = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
      const pickFirst = (obj, keys, fallback = null) => { for (const k of keys) { if (hasValue(obj?.[k])) return obj[k]; } return fallback; };
      const fmt = (n) => Number(n || 0).toLocaleString('ko-KR');
      const readArrayByKeys = (keys) => {
        for (const key of keys) {
          const parsed = safeParse(localStorage.getItem(key), null);
          if (Array.isArray(parsed)) return parsed;
        }
        return [];
      };
      const parseHours = (value) => {
        if (!hasValue(value)) return null;
        if (typeof value === 'number' && Number.isFinite(value)) return value;
        const s = String(value).trim().toLowerCase();
        const m = s.match(/[0-9]+(?:\.[0-9]+)?/);
        const n = m ? Number(m[0]) : NaN;
        if (!Number.isFinite(n)) return null;
        if (s.includes('일') || /\bd\b/.test(s)) return n * 24;
        if (s.includes('시간') || s.includes('hour') || /\bh\b/.test(s)) return n;
        if (s.includes('분') || s.includes('min')) return n / 60;
        return n;
      };

      const collectCore = () => {
        const rows = readArrayByKeys(['bcmsCoreFunctions']);
        const functions = rows.flatMap((r) => (Array.isArray(r?.functions) ? r.functions.map((f) => ({ ...f, team: r.team || '팀 미지정' })) : []));
        const confirmed = functions.filter((f) => f?.coreFinal === true);
        return { rows, functions, confirmed, teamTop: topCount(functions, (x) => x.team, 5) };
      };

      const collectBia = () => {
        const rows = readArrayByKeys(['bcmsBIAData']);
        const impacts = rows.map((r) => toNum(r?.impactScore ?? r?.impact ?? r?.overallImpact)).filter((n) => n > 0);
        const avgImpact = impacts.length ? impacts.reduce((a, b) => a + b, 0) / impacts.length : 0;
        const rto4h = rows.filter((r) => {
          const h = parseHours(r?.rto || r?.rtoHours || r?.rtoTarget);
          return h !== null && h <= 4;
        }).length;
        const highImpact = [...rows].sort((a,b)=> toNum(b?.impactScore ?? b?.impact ?? b?.overallImpact) - toNum(a?.impactScore ?? a?.impact ?? a?.overallImpact)).slice(0,5);
        return { rows, avgImpact, rto4h, teamTop: topCount(rows, (x)=> x.team || x.ownerTeam || '팀 미지정', 5), highImpact };
      };

      const collectRisk = () => {
        const rows = readArrayByKeys(['bcmsRiskAssessment']).map((r) => {
          const riskScore = hasValue(r?.riskScore) ? toNum(r.riskScore) : toNum(r?.impact) * toNum(r?.likelihood);
          const isPriority = riskScore >= 13 || r?.critical === true || r?.isPriority === true;
          return {
            team: asText(r?.team || '팀 미지정'),
            functionName: asText(r?.functionName || r?.function || '-'),
            threat: asText(r?.threat || r?.risk || r?.riskName || '-'),
            riskScore,
            isPriority
          };
        });
        const top5 = [...rows].sort((a,b)=> b.riskScore - a.riskScore).slice(0,5);
        const highByTeam = topCount(rows.filter((r)=>r.isPriority), (x)=>x.team, 3);
        return { rows, top5, highByTeam, priorityCount: rows.filter((r)=>r.isPriority).length, maxScore: rows.length ? Math.max(...rows.map((r)=>r.riskScore)) : 0 };
      };

      const collectIncidents = () => {
        let raw = [];
        const unified = safeParse(localStorage.getItem('bcmsIncidents'), null);
        if (Array.isArray(unified)) raw = raw.concat(unified);
        if (unified && typeof unified === 'object') {
          if (unified.currentIncident && typeof unified.currentIncident === 'object') raw.push(unified.currentIncident);
          if (Array.isArray(unified.logs)) raw = raw.concat(unified.logs);
        }
        const legacy = safeParse(localStorage.getItem('bcms_incidents_v1'), null);
        if (Array.isArray(legacy)) raw = raw.concat(legacy);
        if (legacy && typeof legacy === 'object') {
          if (legacy.currentIncident && typeof legacy.currentIncident === 'object') raw.push(legacy.currentIncident);
          if (Array.isArray(legacy.logs)) raw = raw.concat(legacy.logs);
        }
        const execRows = readArrayByKeys(['bcmsIncidentExecution']);
        execRows.forEach((r)=>{
          const incidentId = asText(r?.incidentId || r?.id);
          if(!incidentId) return;
          raw.push({ incidentId, status:r?.status || '', severity:r?.severity || '', startedAt:r?.startedAt || r?.createdAt || '', endedAt:r?.endedAt || '', currentStage:r?.currentStage || r?.phase || '', relatedTeams:r?.relatedTeams || r?.relatedOrgUnits || [], affectedServices:r?.affectedServices || r?.services || [] });
        });

        const normalized = raw.map((row, idx) => {
          const incidentId = asText(pickFirst(row, ['incidentId','id','incidentID','incidentRef','incidentCode'], `INC-${idx+1}`));
          const status = asText(pickFirst(row, ['status','currentStatus','state'], '-'));
          const statusLower = asLower(status);
          const severity = asText(pickFirst(row, ['severity','level'], '-'));
          const startedAt = pickFirst(row, ['startedAt','startTime','createdAt','incidentStartTime','openedAt'], null);
          const endedAt = pickFirst(row, ['endedAt','endTime','closedAt','resolvedAt'], null);
          const closedTokens = ['종료','종료됨','closed','resolved','종결','복구 완료'];
          const isClosed = hasValue(endedAt) || closedTokens.some((token) => statusLower.includes(token));
          return {
            incidentId,
            status,
            severity,
            affectedServices: uniq((Array.isArray(row?.affectedServices) ? row.affectedServices : (typeof row?.affectedServices === 'string' ? row.affectedServices.split(',') : row?.services || row?.serviceNames || []))).map(asText).filter(Boolean),
            relatedTeams: uniq((Array.isArray(row?.relatedTeams) ? row.relatedTeams : (typeof row?.relatedTeams === 'string' ? row.relatedTeams.split(',') : row?.relatedOrgs || row?.relatedOrgUnits || []))).map(asText).filter(Boolean),
            currentStage: asText(pickFirst(row, ['currentStage','responseStage','phase','step'], '-')),
            startedAt,
            endedAt,
            isClosed
          };
        }).filter((x)=>x.incidentId);

        const byId = new Map();
        normalized.forEach((x)=> {
          const p = byId.get(x.incidentId);
          if (!p) { byId.set(x.incidentId, x); return; }
          byId.set(x.incidentId, { ...p, ...x, affectedServices: x.affectedServices.length ? x.affectedServices : p.affectedServices, relatedTeams: x.relatedTeams.length ? x.relatedTeams : p.relatedTeams, startedAt: hasValue(x.startedAt) ? x.startedAt : p.startedAt, endedAt: hasValue(x.endedAt) ? x.endedAt : p.endedAt, isClosed: x.isClosed || p.isClosed });
        });

        const rows = [...byId.values()];
        const active = rows.filter((x)=>!x.isClosed).sort((a,b)=>toTime(b.startedAt)-toTime(a.startedAt));
        const closed = rows.filter((x)=>x.isClosed).sort((a,b)=>toTime(b.endedAt)-toTime(a.endedAt));
        const recent30 = rows.filter((x)=>toTime(x.startedAt) >= Date.now() - 30*24*60*60*1000);
        const severeHigh = rows.filter((x)=>/심각|높음|critical|high/i.test(x.severity));
        const mttrSamples = closed.filter((x)=>toTime(x.endedAt) && toTime(x.startedAt)).map((x)=>(toTime(x.endedAt)-toTime(x.startedAt))/3600000);
        const mttr = mttrSamples.length ? (mttrSamples.reduce((a,b)=>a+b,0)/mttrSamples.length) : null;
        return { rows, active, closed, recent30, severeHigh, mttr, teamTop: topCount(rows.flatMap((r)=>(r.relatedTeams||[]).map((t)=>({team:t}))), (x)=>x.team, 5) };
      };

      const collectEvidence = () => {
        const rows = readArrayByKeys(['bcmsEvidenceItems','bcms_audit_evidence_v1']);
        const pending = rows.filter((x)=> /미확인|pending|in\s*review/i.test(asText(x?.status)));
        const latest5 = [...rows].sort((a,b)=>toTime(b?.createdAt || b?.updatedAt)-toTime(a?.createdAt || a?.updatedAt)).slice(0,5);
        return { rows, pending, latest5 };
      };

      const collectCapa = () => {
        const rows = readArrayByKeys(['bcmsActionItems','bcmsCapaItems','bcms_capa_v1']);
        const open = rows.filter((x)=> !/완료|종료|종결|closed|done|resolved|complete/i.test(asText(x?.status)));
        const urgent = open.filter((x)=> {
          const due = toTime(x?.dueDate || x?.deadline || x?.targetDate);
          return due > 0 && due <= Date.now() + 7*24*60*60*1000;
        });
        const latest5 = [...rows].sort((a,b)=>toTime(b?.updatedAt || b?.createdAt)-toTime(a?.updatedAt || a?.createdAt)).slice(0,5);
        return { rows, open, urgent, latest5 };
      };

      const collectBcp = () => {
        const rows = readArrayByKeys(['bcmsBcpAssessments']);
        const std = rows.map((r)=>({ ...r, status: asText(r?.status).toLowerCase() || 'none' }));
        const review = std.filter((x)=>x.status === 'review');
        const recommended = std.filter((x)=>x.status === 'recommended');
        const activated = std.filter((x)=>x.status === 'activated');
        return { rows: std, review, recommended, activated };
      };

      function topCount(rows, keyFn, limit){
        const m = new Map();
        rows.forEach((r)=>{ const k = asText(keyFn(r)); if(!k) return; m.set(k, (m.get(k)||0)+1); });
        return [...m.entries()].map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value).slice(0,limit);
      }

      function renderBars(el, items){
        if (!items.length) { el.innerHTML = '<div class="muted">데이터 없음</div>'; return; }
        const max = Math.max(...items.map((x)=>x.value), 1);
        el.innerHTML = items.map((x)=>`
          <div class="bar">
            <div class="muted">${x.name}</div>
            <div class="track"><div class="fill" style="width:${Math.round((x.value/max)*100)}%"></div></div>
            <div class="muted" style="text-align:right; font-weight:900;">${fmt(x.value)}</div>
          </div>`).join('');
      }

      function buildInsights(ctx){
        const out = [];
        out.push(`현재 진행중 Incident ${fmt(ctx.inc.active.length)}건, 심각/높음 Incident ${fmt(ctx.inc.severeHigh.length)}건입니다.`);
        if (ctx.risk.highByTeam.length) out.push(`중점관리 리스크는 ${ctx.risk.highByTeam.slice(0,2).map((x)=>x.name).join(', ')}에 집중되어 있습니다.`);
        out.push(`BCP 가동 권고 ${fmt(ctx.bcp.recommended.length)}건, BCP 가동 중 ${fmt(ctx.bcp.activated.length)}건입니다.`);
        out.push(`미확인 증적 ${fmt(ctx.evd.pending.length)}건, 미완료 개선조치 ${fmt(ctx.capa.open.length)}건입니다.`);
        if (ctx.inc.mttr !== null) out.push(`최근 종료 Incident 기준 평균 복구시간(MTTR)은 ${ctx.inc.mttr.toFixed(1)}시간입니다.`);
        return out.slice(0,5);
      }

      function render(){
        document.getElementById('reportTime').textContent = `기준 시각: ${new Date().toLocaleString('ko-KR', { hour12:false })}`;

        const core = collectCore();
        const bia = collectBia();
        const risk = collectRisk();
        const inc = collectIncidents();
        const evd = collectEvidence();
        const capa = collectCapa();
        const bcp = collectBcp();

        const kpis = [
          ['확정 핵심업무 수', core.confirmed.length, 'coreFinal=true'],
          ['BIA 등록 수', bia.rows.length, '영향 분석 등록'],
          ['중점관리 리스크 수', risk.priorityCount, 'riskScore≥13/critical'],
          ['진행중 Incident 수', inc.active.length, '종료 제외'],
          ['최근 30일 Incident 수', inc.recent30.length, '발생일 기준'],
          ['미확인 증적 수', evd.pending.length, '확인 필요'],
          ['미완료 개선조치 수', capa.open.length, '완료 제외'],
          ['BCP 권고/가동', `${fmt(bcp.recommended.length)} / ${fmt(bcp.activated.length)}`, 'recommended / activated']
        ];
        document.getElementById('kpiGrid').innerHTML = kpis.map(([k,v,h])=>`
          <article class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="h">${h}</div></article>
        `).join('');

        const riskTop = document.getElementById('riskTop');
        riskTop.innerHTML = risk.top5.length
          ? risk.top5.map((r)=>`<div class="row"><div><b>${r.team}</b> / ${r.functionName}<div class="muted">${r.threat}</div></div><span class="badge">${fmt(r.riskScore)}</span></div>`).join('')
          : '<div class="muted">리스크 데이터가 없습니다.</div>';
        renderBars(document.getElementById('riskTeamTop'), risk.highByTeam);

        const incidentSummary = document.getElementById('incidentSummary');
        incidentSummary.innerHTML = `
          ${inc.active.length ? inc.active.slice(0,5).map((x)=>`<div class="row"><div><b>${x.incidentId}</b><div class="muted">${x.status} / ${x.severity} / ${x.currentStage || '-'}</div></div><span class="badge">진행중</span></div>`).join('') : '<div class="muted">진행중 Incident 없음</div>'}
          <div class="row"><div><b>최근 종료 Incident</b><div class="muted">${inc.closed.slice(0,3).map((x)=>x.incidentId).join(', ') || '-'}</div></div><span class="badge">MTTR ${inc.mttr === null ? '-' : `${inc.mttr.toFixed(1)}h`}</span></div>
          <div class="row"><div><b>심각/높음 비중</b><div class="muted">전체 ${fmt(inc.rows.length)}건 중 ${fmt(inc.severeHigh.length)}건</div></div><span class="badge">${inc.rows.length ? Math.round((inc.severeHigh.length/inc.rows.length)*100) : 0}%</span></div>
        `;

        const coreBia = document.getElementById('coreBiaSummary');
        coreBia.innerHTML = `
          <div class="row"><div><b>팀별 확정 핵심업무</b><div class="muted">${core.teamTop.map((x)=>`${x.name} ${x.value}`).join(' · ') || '-'}</div></div><span class="badge">${fmt(core.confirmed.length)}건</span></div>
          <div class="row"><div><b>팀별 BIA 등록</b><div class="muted">${bia.teamTop.map((x)=>`${x.name} ${x.value}`).join(' · ') || '-'}</div></div><span class="badge">${fmt(bia.rows.length)}건</span></div>
          <div class="row"><div><b>RTO 4시간 이하 핵심업무</b><div class="muted">평균 영향도 ${bia.avgImpact.toFixed(1)}</div></div><span class="badge">${fmt(bia.rto4h)}건</span></div>
          ${bia.highImpact.slice(0,3).map((x)=>`<div class="row"><div><b>${x.team || x.ownerTeam || '팀 미지정'}</b><div class="muted">${x.functionName || x.name || '핵심업무'} / 영향도 ${toNum(x.impactScore ?? x.impact ?? x.overallImpact)}</div></div><span class="badge">상위</span></div>`).join('') || ''}
        `;

        const ops = document.getElementById('opsSummary');
        ops.innerHTML = `
          <div class="row"><div><b>미확인 증적 5건</b><div class="muted">${evd.pending.slice(0,5).map((x)=>x.title || x.name || '증적').join(' · ') || '-'}</div></div><span class="badge">${fmt(evd.pending.length)}건</span></div>
          <div class="row"><div><b>미완료 개선조치 5건</b><div class="muted">${capa.open.slice(0,5).map((x)=>x.title || x.actionName || '개선조치').join(' · ') || '-'}</div></div><span class="badge">${fmt(capa.open.length)}건</span></div>
          <div class="row"><div><b>기한 임박 개선조치</b><div class="muted">7일 이내 마감 건수</div></div><span class="badge">${fmt(capa.urgent.length)}건</span></div>
          <div class="row"><div><b>감사 대응 상태</b><div class="muted">증적 정리와 CAPA 이행 현황을 기준으로 평가</div></div><span class="badge">${(evd.pending.length + capa.open.length) > 0 ? '추가 정리 필요' : '양호'}</span></div>
        `;

        const bcpSummary = document.getElementById('bcpSummary');
        const continuityText = bcp.activated.length > 0
          ? '일부 Incident는 현재 BCP 가동 상태입니다.'
          : bcp.recommended.length > 0
            ? 'BCP 가동 권고 Incident가 존재합니다.'
            : bcp.review.length > 0
              ? 'BCP 검토 대상 Incident가 있습니다.'
              : '현재 continuity risk 신호는 제한적입니다.';
        bcpSummary.innerHTML = `
          <div class="row"><div><b>BCP 검토 필요</b><div class="muted">status=review</div></div><span class="badge">${fmt(bcp.review.length)}건</span></div>
          <div class="row"><div><b>BCP 가동 권고</b><div class="muted">status=recommended</div></div><span class="badge">${fmt(bcp.recommended.length)}건</span></div>
          <div class="row"><div><b>BCP 가동 중</b><div class="muted">status=activated</div></div><span class="badge">${fmt(bcp.activated.length)}건</span></div>
          <div class="row"><div><b>Continuity Risk 요약</b><div class="muted">${continuityText}</div></div><span class="badge">요약</span></div>
        `;

        const insights = buildInsights({ core, bia, risk, inc, evd, capa, bcp });
        const insightList = document.getElementById('insightList');
        insightList.innerHTML = insights.length
          ? insights.map((s)=>`<div class="row"><div>${s}</div></div>`).join('')
          : '<div class="muted">현재 표시할 인사이트가 없습니다.</div>';
      }

      document.getElementById('btnPrint').addEventListener('click', () => window.print());
      document.addEventListener('DOMContentLoaded', render);
      window.addEventListener('focus', render);
      window.addEventListener('storage', render);
      render();
    })();
  </script>
</body>
</html>
