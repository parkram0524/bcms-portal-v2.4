<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BCMS 경영 현황 보고서</title>
<link rel="stylesheet" href="../assets/style.css"/>
<style>
  html, body { overflow-x: hidden; max-width: 100%; }
  .main { overflow-x: hidden; min-width: 0; }
  .wrap { max-width: 1200px; margin: 0 auto; overflow-x: hidden; }

  /* ── 헤더 ── */
  .pageHeader {
    display: flex; align-items: flex-start; justify-content: space-between;
    flex-wrap: wrap; gap: 14px; margin-bottom: 22px;
  }
  .headerLeft { display: flex; flex-direction: column; gap: 4px; }
  .companyInput {
    font-size: 13px; font-weight: 600; color: var(--text-2);
    border: none; border-bottom: 1px dashed var(--border);
    background: transparent; outline: none; padding: 2px 0;
    width: 220px; font-family: inherit;
  }
  .companyInput:focus { border-bottom-color: var(--accent, #0070f3); color: var(--text); }
  .pageHeader h1 { font-size: 22px; font-weight: 800; margin: 0; }
  .pageHeader .sub { font-size: 13px; color: var(--text-2); margin: 2px 0 0 0; }
  .headerRight { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn {
    padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); text-decoration: none; white-space: nowrap; transition: background .15s;
  }
  .btn:hover { background: var(--surface-hover); }

  /* ── 종합 현황 요약 바 ── */
  .summaryBar {
    display: flex; flex-wrap: wrap; gap: 0;
    border: 0.5px solid rgba(0,112,243,.2); border-radius: 12px;
    background: rgba(0,112,243,.04); padding: 18px 0;
    margin-bottom: 20px;
  }
  .sumItem {
    flex: 1; min-width: 140px; text-align: center;
    padding: 0 20px; border-right: 1px solid rgba(0,112,243,.15);
  }
  .sumItem:last-child { border-right: none; }
  .sumLabel { font-size: 11px; color: var(--text-2); font-weight: 600; margin: 0 0 5px 0; }
  .sumVal   { font-size: 24px; font-weight: 900; margin: 0; color: var(--accent, #0070f3); }
  .sumSub   { font-size: 11px; color: var(--text-2); margin: 3px 0 0 0; }

  /* ── KPI 그리드 ── */
  .kpiGrid {
    display: grid; grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 10px; margin-bottom: 20px;
  }
  @media (max-width: 960px) { .kpiGrid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) { .kpiGrid { grid-template-columns: 1fr; } }

  .kpiCard {
    border: 0.5px solid var(--border); border-radius: 12px;
    background: var(--surface); padding: 14px 16px;
  }
  .kpiCard .kTop { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .kpiCard .kIco { font-size: 16px; }
  .kpiCard .kLabel { font-size: 12px; color: var(--text-2); font-weight: 600; }
  .kpiCard .kVal { font-size: 26px; font-weight: 900; margin: 0 0 8px 0; line-height: 1; }
  .kpiCard .kDesc { font-size: 11px; color: var(--text-2); margin: 4px 0 0 0; }
  .pBar { height: 5px; border-radius: 999px; background: var(--border); overflow: hidden; margin-bottom: 4px; }
  .pBar > b { display: block; height: 100%; border-radius: 999px; transition: width .4s; }
  .fg-green  { background: #16a34a; }
  .fg-yellow { background: #d97706; }
  .fg-red    { background: #dc2626; }
  .fg-blue   { background: var(--accent, #0070f3); }
  .tx-green  { color: #16a34a; }
  .tx-yellow { color: #d97706; }
  .tx-red    { color: #dc2626; }
  .tx-blue   { color: var(--accent, #0070f3); }

  /* ── 섹션 제목 ── */
  .secTitle {
    font-size: 13px; font-weight: 700; color: var(--text);
    margin: 0 0 10px 0; padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }

  /* ── 2열 그리드 ── */
  .dualGrid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 16px; margin-bottom: 20px;
  }
  @media (max-width: 960px) { .dualGrid { grid-template-columns: 1fr; } }

  .card {
    border: 0.5px solid var(--border); border-radius: 12px;
    background: var(--surface); padding: 18px 20px;
  }
  .card + .card { margin-top: 14px; }

  /* ── 테이블 ── */
  .tableWrap { overflow-x: auto; }
  table.rep {
    width: 100%; border-collapse: collapse; font-size: 13px; min-width: 380px;
  }
  table.rep th {
    text-align: left; font-size: 11px; font-weight: 700; color: var(--text-2);
    padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.rep td {
    padding: 8px 10px; border-bottom: 1px solid var(--border);
    color: var(--text); vertical-align: middle; line-height: 1.4;
  }
  table.rep tr:last-child td { border-bottom: none; }
  table.rep tr:hover td { background: var(--surface-hover); }
  .emptyRow td { text-align: center; color: var(--text-2); padding: 18px !important; }

  /* ── 배지 ── */
  .badge {
    display: inline-block; padding: 2px 6px; border-radius: 4px;
    font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  .badge.red    { background: #fef2f2; color: #dc2626; }
  .badge.yellow { background: #fffbeb; color: #d97706; }
  .badge.gray   { background: rgba(0,0,0,.07); color: var(--text-2); }
  .badge.green  { background: #f0fdf4; color: #16a34a; }
  .badge.blue   { background: rgba(0,112,243,.1); color: #0070f3; }
  [data-theme="dark"] .badge.red    { background: #2a0000; }
  [data-theme="dark"] .badge.yellow { background: #1c1400; }
  [data-theme="dark"] .badge.gray   { background: rgba(255,255,255,.1); }
  [data-theme="dark"] .badge.green  { background: #052e16; }
  [data-theme="dark"] .badge.blue   { background: #001c3a; }

  .ynTag { display:inline-block; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:700; }
  .ynTag.y { background:#f0fdf4; color:#16a34a; }
  .ynTag.n { background:rgba(0,0,0,.06); color:var(--text-2); }
  [data-theme="dark"] .ynTag.y { background:#052e16; }
  [data-theme="dark"] .ynTag.n { background:rgba(255,255,255,.1); }

  /* ── 훈련 실적 ── */
  .trainTypeRow { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  .trainTypeChip {
    padding:4px 10px; border-radius:6px; font-size:12px; font-weight:600;
    border:1px solid var(--border); color:var(--text-2);
  }
  .recentList { list-style:none; margin:10px 0 0 0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .recentList li { display:flex; align-items:center; gap:8px; font-size:12px; }
  .recentList li .rDate { color:var(--text-2); min-width:80px; }
  .recentList li .rName { color:var(--text); font-weight:600; }

  /* ── 누적 가로 바 ── */
  .stackBar {
    display:flex; height:10px; border-radius:999px; overflow:hidden;
    background:var(--border); margin:10px 0;
  }
  .stackBar > span { display:block; height:100%; transition:width .4s; }

  .gapStatRow { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:8px; }
  .gapStat { font-size:12px; }
  .gapStat .gsVal { font-size:18px; font-weight:900; display:block; }
  .gapUnmet { margin-top:8px; }
  .gapUnmet li { font-size:12px; color:var(--text-2); padding:3px 0; border-bottom:1px solid var(--border); }
  .gapUnmet li:last-child { border-bottom:none; }

  /* ── CAPA 요약 ── */
  .capaStatRow { display:flex; gap:12px; flex-wrap:wrap; margin:0 0 10px 0; }
  .capaStat { font-size:12px; text-align:center; }
  .capaStat .csVal { font-size:20px; font-weight:900; display:block; }
  .capaUpcoming { display:flex; flex-direction:column; gap:5px; margin-top:8px; }
  .capaUpItem { display:flex; align-items:center; gap:8px; font-size:12px;
    padding:5px 8px; border-radius:6px; border:1px solid var(--border); }
  .capaUpItem .cuDate { color:var(--text-2); min-width:80px; }
  .capaUpItem .cuTitle { flex:1; font-weight:600; color:var(--text); }

  /* ── 경영진 코멘트 ── */
  .commentCard {
    border: 0.5px solid var(--border); border-radius: 12px;
    background: var(--surface); padding: 18px 20px; margin-bottom: 20px;
  }
  .commentCard textarea {
    width: 100%; box-sizing: border-box; padding: 10px 12px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 13px; font-family: inherit;
    resize: vertical; outline: none; line-height: 1.6;
  }
  .commentCard textarea:focus { border-color: var(--accent, #0070f3); }
  .commentBtns { display:flex; gap:8px; margin-top:10px; justify-content:flex-end; }

  /* ── 푸터 ── */
  .reportFooter {
    text-align: center; padding: 20px 0 10px;
    border-top: 1px solid var(--border); color: var(--text-2); font-size: 12px;
    line-height: 1.8;
  }

  /* ── 인쇄 스타일 ── */
  @media print {
    aside, .btn, #themeToggle, .headerRight, .commentBtns { display: none !important; }
    html, body { background: #fff !important; color: #000 !important; overflow: visible !important; }
    .main { padding: 0 !important; }
    .wrap { max-width: 100% !important; padding: 0 12px !important; }
    .dualGrid { grid-template-columns: 1fr 1fr !important; }
    .kpiGrid  { grid-template-columns: repeat(4, 1fr) !important; }
    .card, .kpiCard, .summaryBar, .commentCard {
      background: #fff !important; border-color: #ccc !important;
      box-shadow: none !important; break-inside: avoid;
    }
    .dualGrid { page-break-before: auto; }
    .commentTextarea { display: none !important; }
    .commentPrint { display: block !important; font-size: 13px; line-height:1.6; }
    [data-theme="dark"] * { background: #fff !important; color: #000 !important; }
  }
  .commentPrint { display: none; }

  @media (max-width: 640px) {
    .pageHeader { flex-direction: column; }
    .summaryBar { flex-direction: column; gap: 12px; padding: 14px 20px; }
    .sumItem { border-right: none; border-bottom: 1px solid rgba(0,112,243,.15); padding: 8px 0; text-align: left; }
    .sumItem:last-child { border-bottom: none; }
  }
</style>
</head>
<body>
<aside id="sidebarMount"></aside>
<main class="main">
<div class="wrap">

  <!-- 헤더 -->
  <div class="pageHeader">
    <div class="headerLeft">
      <input class="companyInput" id="companyInput" type="text" placeholder="회사명 입력" maxlength="60"/>
      <h1>BCMS 경영 현황 보고서</h1>
      <p class="sub" id="reportSub"></p>
    </div>
    <div class="headerRight">
      <button class="btn" onclick="window.print()">🖨️ 인쇄</button>
      <a href="../op-center/index.html" class="btn">운영센터 →</a>
      <button id="themeToggle" class="btn">🌙 다크모드</button>
    </div>
  </div>

  <!-- 종합 현황 요약 바 -->
  <div class="summaryBar" id="summaryBar"></div>

  <!-- KPI 8개 -->
  <div class="kpiGrid" id="kpiGrid"></div>

  <!-- 2열: 핵심업무·리스크 / 훈련·갭분석·CAPA -->
  <div class="dualGrid">

    <!-- 왼쪽 -->
    <div>
      <div class="card">
        <p class="secTitle">📋 핵심업무 BIA 현황 (팀별)</p>
        <div class="tableWrap">
          <table class="rep" id="biaTable">
            <thead><tr><th>팀명</th><th>BIA등록</th><th>핵심업무</th><th>BCP수립</th></tr></thead>
            <tbody id="biaTbody"></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <p class="secTitle">⚠️ 중점관리 리스크 TOP 5</p>
        <div class="tableWrap">
          <table class="rep" id="riskTable">
            <thead><tr><th>리스크명</th><th>위험도</th><th>팀</th><th>BCP수립</th></tr></thead>
            <tbody id="riskTbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 오른쪽 -->
    <div>
      <div class="card">
        <p class="secTitle">🎯 훈련 실적 요약</p>
        <div id="trainSummary"></div>
      </div>
      <div class="card">
        <p class="secTitle">📊 ISO 22301 갭분석 현황</p>
        <div id="gapSummary"></div>
      </div>
      <div class="card">
        <p class="secTitle">🔧 CAPA 개선조치 현황</p>
        <div id="capaSummary"></div>
      </div>
    </div>

  </div>

  <!-- 경영진 코멘트 -->
  <div class="commentCard">
    <p class="secTitle">💬 경영진 코멘트</p>
    <textarea class="commentTextarea" id="execComment" rows="4"
      placeholder="이번 분기 BCMS 운영 현황에 대한 경영진 의견"></textarea>
    <div class="commentPrint" id="execCommentPrint"></div>
    <div class="commentBtns">
      <button class="btn" id="btnSaveComment">저장</button>
    </div>
  </div>

  <!-- 푸터 -->
  <div class="reportFooter" id="reportFooter"></div>

</div>
</main>

<script src="../assets/demo-seed.js"></script>
<script src="../assets/sidebar.js"></script>
<script>
(function () {
  'use strict';

  /* ── 유틸 ── */
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const clamp = n => Math.max(0, Math.min(100, Math.round(n || 0)));

  function load(key, def) {
    try {
      const v = localStorage.getItem(key);
      if (!v) return def;
      const p = JSON.parse(v);
      return (p !== null && p !== undefined) ? p : def;
    } catch { return def; }
  }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
  function arr(v) { return Array.isArray(v) ? v : []; }

  /* ── 날짜 ── */
  const DAYS = ['일','월','화','수','목','금','토'];
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = today.toISOString().split('T')[0];
  document.getElementById('reportSub').textContent =
    today.getFullYear() + '년 ' + (today.getMonth()+1) + '월 ' + today.getDate() + '일 (' + DAYS[today.getDay()] + ') 기준  ·  ISO 22301 기반 업무연속성관리체계 운영 현황';
  document.getElementById('reportFooter').innerHTML =
    `작성기준일: ${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일 &nbsp;|&nbsp; 작성부서: BCMS 담당부서 &nbsp;|&nbsp; 준거: ISO 22301:2019`;

  /* ── 데이터 로드 ── */
  const biaData      = arr(load('bcmsBIAData', []));
  const riskData     = arr(load('bcmsRiskList', null) ?? load('bcmsRiskAssessment', []));
  const bcpRaw       = load('bcmsBCP', null) ?? load('bcmsBCPStrategy', []);
  const bcpTeamsArr  = arr(Array.isArray(bcpRaw) ? bcpRaw : (bcpRaw && typeof bcpRaw === 'object' ? Object.values(bcpRaw) : []));
  const bcpData      = bcpTeamsArr.flatMap(t => arr(t && t.strategies));
  const confirmedRaw = load('bcmsPriorityConfirmed', {});
  const trainData    = arr(load('bcmsTrainingData', []));
  const capaData  = arr(load('bcmsCapaItems', []));
  const gapData   = arr(load('bcmsGapAnalysis', []));
  const docsData  = arr(load('bcmsDocuments', []));
  const policyData   = load('bcmsPolicyData', null);
  const objectives   = arr(load('bcmsObjectives', []));
  const meta         = load('bcmsReportMeta', {});

  /* ── 메타 (회사명/코멘트) ── */
  const companyEl = document.getElementById('companyInput');
  const commentEl = document.getElementById('execComment');
  const commentPrintEl = document.getElementById('execCommentPrint');
  companyEl.value = meta.companyName ?? '';
  commentEl.value = meta.executiveComment ?? '';
  commentPrintEl.textContent = meta.executiveComment ?? '';

  companyEl.addEventListener('input', () => {
    const m = load('bcmsReportMeta', {});
    m.companyName = companyEl.value.trim();
    save('bcmsReportMeta', m);
  });
  document.getElementById('btnSaveComment').addEventListener('click', () => {
    const m = load('bcmsReportMeta', {});
    m.executiveComment = commentEl.value.trim();
    commentPrintEl.textContent = m.executiveComment;
    save('bcmsReportMeta', m);
    const btn = document.getElementById('btnSaveComment');
    btn.textContent = '✓ 저장됨';
    setTimeout(() => { btn.textContent = '저장'; }, 1500);
  });

  /* ── KPI 계산 ── */
  function pctClass(p) { return p >= 70 ? 'green' : p >= 50 ? 'yellow' : 'red'; }

  // ① BIA 등록 수 (팀별 functions 합산, 없으면 팀 수)
  const biaCnt = biaData.reduce((s, r) => s + (r ? arr(r.functions).length : 0), 0) || biaData.length;

  // ② 핵심업무 확정률 ({key:true} 객체에서 true인 항목 수)
  const confirmedCnt = (confirmedRaw && typeof confirmedRaw === 'object' && !Array.isArray(confirmedRaw))
    ? Object.values(confirmedRaw).filter(v => v === true).length
    : arr(confirmedRaw).length;
  const confirmPct   = biaCnt > 0 ? clamp(confirmedCnt / biaCnt * 100) : 0;

  // ③ 중점관리 리스크
  const critRisks = riskData.filter(r => r && ((r.riskScore ?? r.score ?? 0) >= 15 || r.critical === true));
  const critCnt   = critRisks.length;

  // ④ BCP 수립률
  const bcpWritten = bcpData.filter(b => b && (b.strategyText || b.strategyType || b.strategy || b.done)).length;
  const bcpPct     = confirmedCnt > 0 ? clamp(bcpWritten / confirmedCnt * 100) : 0;

  // ⑤ 훈련 이행률
  const trainTotal = trainData.length;
  const trainDone  = trainData.filter(t => t && (String(t.status ?? '') === '완료' || t.done === true || t.completed === true)).length;
  const trainPct   = trainTotal > 0 ? clamp(trainDone / trainTotal * 100) : 0;

  // ⑥ ISO 갭분석 충족률
  const gapTotal = gapData.length;
  const gapMet   = gapData.filter(g => { if (!g) return false; const s = String(g.status ?? '').toLowerCase(); return s === '충족' || s === 'yes' || s === 'y' || g.met === true; }).length;
  const gapPct   = gapTotal > 0 ? clamp(gapMet / gapTotal * 100) : 0;

  // ⑦ CAPA 완료율
  const capaTotal = capaData.length;
  const capaDone  = capaData.filter(c => c && (String(c.status ?? '').includes('완료') || String(c.status ?? '').toLowerCase() === 'closed')).length;
  const capaPct   = capaTotal > 0 ? clamp(capaDone / capaTotal * 100) : 0;

  // ⑧ 문서 최신화율
  const docsTotal = docsData.length;
  const docsCurrent = docsData.filter(d => {
    if (!d) return false;
    const raw = d.expiryDate ?? d.reviewDate ?? '';
    if (!raw) return true;
    const dt = new Date(raw);
    return isNaN(dt) || dt >= today;
  }).length;
  const docsPct = docsTotal > 0 ? clamp(docsCurrent / docsTotal * 100) : 100;

  /* ── 종합 요약 바 ── */
  document.getElementById('summaryBar').innerHTML = [
    { label: '핵심업무 확정', val: confirmedCnt + '건', sub: 'BIA 등록 ' + biaCnt + '건 中' },
    { label: 'BCP 수립률', val: bcpPct + '%', sub: confirmedCnt + '건 中 ' + bcpWritten + '건 수립' },
    { label: '중점관리 리스크', val: critCnt + '건', sub: '위험도 15점 이상' },
    { label: '훈련 이행률', val: trainPct + '%', sub: trainTotal + '건 中 ' + trainDone + '건 완료' },
    { label: 'ISO 22301 충족률', val: gapPct + '%', sub: gapTotal + '항목 中 ' + gapMet + '항목 충족' },
  ].map(s => `
    <div class="sumItem">
      <p class="sumLabel">${esc(s.label)}</p>
      <p class="sumVal">${esc(s.val)}</p>
      <p class="sumSub">${esc(s.sub)}</p>
    </div>`
  ).join('');

  /* ── KPI 카드 렌더 ── */
  function kpiCard({ ico, label, val, pct, desc, noBar, valClass }) {
    const cls = valClass ?? ('tx-' + pctClass(pct));
    const barHtml = noBar ? '' :
      `<div class="pBar"><b class="fg-${pctClass(pct)}" style="width:${pct}%"></b></div>`;
    return `<div class="kpiCard">
      <div class="kTop"><span class="kIco">${ico}</span><span class="kLabel">${esc(label)}</span></div>
      <div class="kVal ${cls}">${esc(val)}</div>
      ${barHtml}
      <p class="kDesc">${desc}</p>
    </div>`;
  }

  document.getElementById('kpiGrid').innerHTML = [
    { ico:'📋', label:'BIA 등록 업무 수', val: biaCnt + '건',
      pct: 100, noBar: true, desc:'전체 등록 업무 수' },
    { ico:'✅', label:'핵심업무 확정률', val: confirmPct + '%',
      pct: confirmPct, desc:`전체 ${biaCnt}건 중 ${confirmedCnt}건 확정` },
    { ico:'⚠️', label:'중점관리 리스크 수', val: critCnt + '건',
      pct: critCnt === 0 ? 100 : 0, noBar: true,
      valClass: critCnt === 0 ? 'tx-green' : 'tx-red',
      desc: critCnt === 0 ? '이상 없음' : '전략 수립 확인 필요' },
    { ico:'🛡️', label:'BCP 전략 수립률', val: bcpPct + '%',
      pct: bcpPct, desc:`확정 ${confirmedCnt}건 중 ${bcpWritten}건 수립` },
    { ico:'🎯', label:'훈련 이행률', val: trainPct + '%',
      pct: trainPct, desc:`전체 ${trainTotal}건 중 ${trainDone}건 완료` },
    { ico:'📊', label:'ISO 갭분석 충족률', val: gapPct + '%',
      pct: gapPct, desc:`${gapTotal}항목 중 ${gapMet}항목 충족` },
    { ico:'🔧', label:'CAPA 완료율', val: capaPct + '%',
      pct: capaPct, desc:`전체 ${capaTotal}건 중 ${capaDone}건 완료` },
    { ico:'📄', label:'문서 최신화율', val: docsPct + '%',
      pct: docsPct, desc:`전체 ${docsTotal}건 중 ${docsCurrent}건 유효` },
  ].map(kpiCard).join('');

  /* ── BIA 팀별 현황 ── */
  const teamMap = {};
  biaData.forEach(row => {
    if (!row) return;
    const team = String(row.team ?? row.dept ?? row.department ?? row['부서'] ?? row.teamName ?? '미지정').trim() || '미지정';
    if (!teamMap[team]) teamMap[team] = { total: 0, confirmed: 0 };
    const fns = arr(row.functions);
    if (fns.length) {
      fns.forEach(fn => {
        if (!fn) return;
        teamMap[team].total++;
        const key1 = `${team}__${String(fn.name ?? fn.function ?? '').trim()}`;
        const key2 = String(fn.biaId ?? fn.id ?? '').trim();
        if (confirmedRaw[key1] === true || (key2 && confirmedRaw[key2] === true)) {
          teamMap[team].confirmed++;
        }
      });
    } else {
      teamMap[team].total++;
    }
  });
  const bcpTeamSet = new Set(bcpTeamsArr.map(t => t && String(t.team ?? t.dept ?? '')).filter(Boolean));

  const teamRows = Object.entries(teamMap).slice(0, 10);
  const biaTbody = document.getElementById('biaTbody');
  if (teamRows.length === 0) {
    biaTbody.innerHTML = `<tr class="emptyRow"><td colspan="4">BIA 데이터가 없습니다</td></tr>`;
  } else {
    biaTbody.innerHTML = teamRows.map(([team, d]) =>
      `<tr>
        <td>${esc(team)}</td>
        <td style="text-align:center">${d.total}</td>
        <td style="text-align:center">${d.confirmed}</td>
        <td style="text-align:center"><span class="ynTag ${bcpTeamSet.has(team) ? 'y' : 'n'}">${bcpTeamSet.has(team) ? 'O' : 'X'}</span></td>
      </tr>`
    ).join('');
  }

  /* ── 리스크 TOP 5 ── */
  const top5 = riskData
    .filter(r => r)
    .sort((a, b) => (b.riskScore ?? b.score ?? 0) - (a.riskScore ?? a.score ?? 0))
    .slice(0, 5);
  function hasBcp(r) { return bcpTeamSet.has(String(r.team ?? r.dept ?? '')); }

  const riskTbody = document.getElementById('riskTbody');
  if (top5.length === 0) {
    riskTbody.innerHTML = `<tr class="emptyRow"><td colspan="4">리스크 데이터가 없습니다</td></tr>`;
  } else {
    riskTbody.innerHTML = top5.map(r => {
      const score = r.riskScore ?? r.score ?? 0;
      const cls   = score >= 15 ? 'red' : score >= 10 ? 'yellow' : 'gray';
      return `<tr>
        <td>${esc(r.name ?? r.riskName ?? r.title ?? '—')}</td>
        <td><span class="badge ${cls}">${score}</span></td>
        <td>${esc(r.team ?? r.dept ?? '—')}</td>
        <td><span class="ynTag ${hasBcp(r) ? 'y' : 'n'}">${hasBcp(r) ? 'O' : 'X'}</span></td>
      </tr>`;
    }).join('');
  }

  /* ── 훈련 실적 ── */
  const typeCount = {};
  trainData.forEach(t => {
    if (!t) return;
    const tp = t.type ?? t.trainingType ?? '기타';
    typeCount[tp] = (typeCount[tp] ?? 0) + 1;
  });
  const recentDone = trainData
    .filter(t => t && (String(t.status ?? '') === '완료' || t.done === true))
    .filter(t => t.date)
    .sort((a, b) => new Date(b.date) - new Date(a.date))
    .slice(0, 3);

  document.getElementById('trainSummary').innerHTML = `
    <div style="font-size:22px;font-weight:900;color:var(--accent,#0070f3)">${trainDone}<span style="font-size:14px;font-weight:600;color:var(--text-2)"> / ${trainTotal}건 완료</span></div>
    <div class="trainTypeRow">
      ${Object.entries(typeCount).map(([t, n]) => `<span class="trainTypeChip">${esc(t)}: ${n}건</span>`).join('') || '<span style="font-size:12px;color:var(--text-2)">훈련 데이터 없음</span>'}
    </div>
    ${recentDone.length > 0 ? `
    <div style="font-size:11px;font-weight:700;color:var(--text-2);margin:8px 0 4px">최근 완료 훈련</div>
    <ul class="recentList">
      ${recentDone.map(t => {
        const d = new Date(t.date);
        const dateStr = !isNaN(d) ? `${d.getMonth()+1}/${d.getDate()}` : t.date;
        return `<li><span class="rDate">${esc(dateStr)}</span><span class="rName">${esc(t.name ?? t.title ?? '훈련')}</span></li>`;
      }).join('')}
    </ul>` : '<p style="font-size:12px;color:var(--text-2);margin-top:8px">완료된 훈련이 없습니다</p>'}`;

  /* ── ISO 갭분석 ── */
  const gapPartial = gapData.filter(g => { if (!g) return false; const s = String(g.status ?? '').toLowerCase(); return s === '부분충족' || s === 'partial'; }).length;
  const gapUnmet   = gapData.filter(g => { if (!g) return false; const s = String(g.status ?? '').toLowerCase(); return s === '미충족' || s === 'no' || s === 'n' || g.met === false; }).length;
  const gapMetW    = gapTotal > 0 ? clamp(gapMet     / gapTotal * 100) : 0;
  const gapPartW   = gapTotal > 0 ? clamp(gapPartial / gapTotal * 100) : 0;
  const gapUnmetW  = gapTotal > 0 ? clamp(gapUnmet   / gapTotal * 100) : 0;

  const unmetItems = gapData
    .filter(g => { if (!g) return false; const s = String(g.status ?? '').toLowerCase(); return s === '미충족' || s === 'no' || s === 'n' || g.met === false; })
    .slice(0, 3);

  document.getElementById('gapSummary').innerHTML = `
    <div class="gapStatRow">
      <div class="gapStat"><span class="gsVal tx-green">${gapMet}</span>충족</div>
      <div class="gapStat"><span class="gsVal tx-yellow">${gapPartial}</span>부분충족</div>
      <div class="gapStat"><span class="gsVal tx-red">${gapUnmet}</span>미충족</div>
      <div class="gapStat"><span class="gsVal" style="color:var(--text-2)">${gapTotal}</span>전체</div>
    </div>
    <div class="stackBar">
      <span style="width:${gapMetW}%;background:#16a34a"></span>
      <span style="width:${gapPartW}%;background:#d97706"></span>
      <span style="width:${gapUnmetW}%;background:#dc2626"></span>
    </div>
    ${unmetItems.length > 0 ? `
    <div style="font-size:11px;font-weight:700;color:var(--text-2);margin:8px 0 4px">미충족 항목</div>
    <ul class="gapUnmet">
      ${unmetItems.map(g => `<li>${esc(g.clause ?? g.requirement ?? g.item ?? g.title ?? '항목')}</li>`).join('')}
    </ul>` : '<p style="font-size:12px;color:var(--text-2);margin-top:6px">미충족 항목 없음</p>'}`;

  /* ── CAPA 현황 ── */
  function isDelayed(c) {
    if (!c || !c.dueDate || String(c.status ?? '').includes('완료')) return false;
    return new Date(c.dueDate) < today;
  }
  const capaWip     = capaData.filter(c => c && String(c.status ?? '').includes('진행')).length;
  const capaPending = capaData.filter(c => c && String(c.status ?? '') === '미시작').length;
  const capaDelayed = capaData.filter(c => isDelayed(c)).length;

  const upcoming = capaData
    .filter(c => c && !String(c.status ?? '').includes('완료') && c.dueDate)
    .sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate))
    .slice(0, 3);

  document.getElementById('capaSummary').innerHTML = `
    <div class="capaStatRow">
      <div class="capaStat"><span class="csVal">${capaTotal}</span>전체</div>
      <div class="capaStat"><span class="csVal tx-green">${capaDone}</span>완료</div>
      <div class="capaStat"><span class="csVal tx-blue">${capaWip}</span>진행중</div>
      <div class="capaStat"><span class="csVal" style="color:var(--text-2)">${capaPending}</span>미시작</div>
      <div class="capaStat"><span class="csVal tx-red">${capaDelayed}</span>지연</div>
    </div>
    ${upcoming.length > 0 ? `
    <div style="font-size:11px;font-weight:700;color:var(--text-2);margin:8px 0 4px">목표일 임박 미완료</div>
    <div class="capaUpcoming">
      ${upcoming.map(c => `
        <div class="capaUpItem">
          <span class="cuDate">${esc(c.dueDate ?? '')}</span>
          <span class="cuTitle">${esc(c.title ?? c.name ?? '—')}</span>
          ${isDelayed(c) ? '<span class="badge red" style="font-size:10px">지연</span>' : ''}
        </div>`).join('')}
    </div>` : '<p style="font-size:12px;color:var(--text-2);margin-top:6px">미완료 CAPA 없음</p>'}`;

  /* ── 다크모드 ── */
  const htmlEl = document.documentElement;
  const themeBtn = document.getElementById('themeToggle');
  function applyTheme(t) {
    htmlEl.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'dark' ? '☀️ 라이트모드' : '🌙 다크모드';
    try { localStorage.setItem('bcmsTheme', t); } catch {}
  }
  try { const s = localStorage.getItem('bcmsTheme'); if (s) applyTheme(s); } catch {}
  themeBtn.addEventListener('click', () =>
    applyTheme(htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark')
  );

})();
</script>
</body>
</html>
