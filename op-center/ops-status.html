<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>운영 현황 | BCMS Portal v2</title>
  <link rel="stylesheet" href="../assets/style.css"/>
  <style>
    .wrap{ max-width:1320px; margin:0 auto; }
    .hero{ margin-bottom:14px; }
    .hero h1{ margin:0; font-size:28px; font-weight:950; }
    .hero p{ margin:8px 0 0; color:rgba(15,23,42,.62); }

    .summaryGrid{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:12px; }
    .summaryCard{ grid-column:span 3; border:1px solid rgba(15,23,42,.1); border-radius:14px; background:#fff; padding:14px; box-shadow:0 2px 6px rgba(15,23,42,.04); }
    .summaryCard .k{ font-size:12px; color:rgba(15,23,42,.58); font-weight:800; }
    .summaryCard .v{ margin-top:8px; font-size:30px; font-weight:950; color:#0f172a; }
    .summaryCard .h{ margin-top:6px; font-size:12px; color:rgba(15,23,42,.56); }
    @media (max-width:1100px){ .summaryCard{ grid-column:span 6; } }
    @media (max-width:760px){ .summaryCard{ grid-column:span 12; } }

    .panel{ margin-top:14px; border:1px solid rgba(15,23,42,.1); border-radius:16px; background:#fff; padding:14px; }
    .panelHead{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    .panelHead h2{ margin:0; font-size:18px; }
    .helper{ font-size:12px; color:rgba(15,23,42,.58); }

    .empty{ border:1px dashed rgba(148,163,184,.45); border-radius:12px; background:#f8fafc; color:#64748b; padding:14px; font-size:13px; }

    .itemList{ display:grid; gap:10px; }
    .itemRow{ border:1px solid #dbe3ef; border-radius:12px; background:#fff; padding:12px; display:grid; grid-template-columns:2fr 1.5fr 2fr 1fr 1fr; gap:10px; align-items:start; }
    .itemRow:hover{ background:#fbfdff; }
    .titleBtn{ border:none; background:transparent; padding:0; text-align:left; color:#1d4ed8; font-weight:900; cursor:pointer; font-size:14px; }
    .titleBtn:hover{ text-decoration:underline; }
    .meta{ font-size:12px; color:#475569; line-height:1.45; }
    .label{ font-size:11px; color:#64748b; font-weight:800; margin-bottom:4px; }
    .cell{ min-width:0; }

    .chipWrap{ display:flex; flex-wrap:wrap; gap:6px; }
    .chip{ display:inline-flex; align-items:center; border:1px solid #cbd5e1; border-radius:999px; padding:4px 9px; font-size:12px; background:#fff; color:#1e293b; }

    .badge{ display:inline-flex; align-items:center; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:900; border:1px solid; }
    .warn{ color:#92400e; background:rgba(245,158,11,.12); border-color:rgba(245,158,11,.3); }
    .progress{ color:#1d4ed8; background:rgba(37,99,235,.12); border-color:rgba(37,99,235,.3); }

    .quickActions{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; }
    .quickBtn{ display:inline-flex; align-items:center; text-decoration:none; border:1px solid rgba(15,23,42,.14); border-radius:999px; padding:8px 12px; color:#0f172a; background:#fff; font-size:12px; font-weight:900; }
    .quickBtn:hover{ background:rgba(15,23,42,.04); }

    @media (max-width:1024px){ .itemRow{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <aside id="sidebarMount"></aside>
  <main class="main">
    <div class="wrap">
      <section class="hero">
        <h1>운영 현황</h1>
        <p>현재 미처리 항목을 확인할 수 있습니다. 사고 종료 결과물이 증적/개선조치로 자동 연결됩니다.</p>
      </section>

      <section class="summaryGrid">
        <article class="summaryCard"><div class="k">진행 중 사고</div><div class="v" id="kIncident">0</div><div class="h">원인 조사/영향 완화/안정화 모니터링</div></article>
        <article class="summaryCard"><div class="k">미확인 증적</div><div class="v" id="kEvidence">0</div><div class="h">확인 필요 항목</div></article>
        <article class="summaryCard"><div class="k">미완료 개선조치</div><div class="v" id="kAction">0</div><div class="h">미완료/미착수/진행중 항목</div></article>
        <article class="summaryCard"><div class="k">최근 종료 사고</div><div class="v" id="kClosed">0</div><div class="h">복구 완료/종료/종결</div></article>
      </section>

      <section class="panel">
        <div class="panelHead"><h2>미확인 증적</h2><span class="helper">항목 클릭 시 증적 관리 화면으로 이동합니다.</span></div>
        <div id="evidenceList" class="itemList"></div>
      </section>

      <section class="panel">
        <div class="panelHead"><h2>미완료 개선조치</h2><span class="helper">항목 클릭 시 개선조치 관리 화면으로 이동합니다.</span></div>
        <div id="actionList" class="itemList"></div>
      </section>

      <section class="panel">
        <div class="panelHead"><h2>빠른 이동</h2></div>
        <div class="quickActions">
          <a class="quickBtn" href="./incident-dashboard.html">사고 대응 대시보드</a>
          <a class="quickBtn" href="../audit/evidence.html">증적 관리</a>
          <a class="quickBtn" href="../audit/capa.html">개선조치 관리</a>
          <a class="quickBtn" href="../governance/eop-org-chart.html">비상대응 조직도</a>
        </div>
      </section>
    </div>
  </main>

  <script src="../assets/sidebar.js"></script>
  <script src="../assets/data-store.js"></script>
  <script>
    (() => {
      const INCIDENT_KEY = DataStore.KEY_INCIDENTS || 'bcms_incidents_v1';
      const EVIDENCE_KEY = DataStore.KEY_EVIDENCE || 'bcms_audit_evidence_v1';
      const CAPA_KEY = DataStore.KEY_CAPA || 'bcms_capa_v1';

      const INCIDENTS_UNIFIED_KEY = 'bcmsIncidents';
      const EVIDENCE_ITEMS_KEY = 'bcmsEvidenceItems';
      const ACTION_ITEMS_KEY = 'bcmsActionItems';
      const CURRENT_INCIDENT_KEY = 'bcmsCurrentIncident';
      const FOCUS_TARGET_KEY = 'bcmsFocusTarget';

      const readSafe = (key, fallback) => {
        try {
          const raw = localStorage.getItem(key);
          if (raw == null) return fallback;
          return JSON.parse(raw);
        } catch {
          return fallback;
        }
      };
      const uniq = (arr) => [...new Set((arr || []).filter(Boolean))];
      const toDate = (iso) => {
        if (!iso) return '-';
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return '-';
        return d.toLocaleString('ko-KR', { hour12:false });
      };
      const toTeamName = (value) => {
        if (!value) return '';
        if (typeof value === 'string') return value.trim();
        if (typeof value === 'object') return String(value.teamName || value.name || '').trim();
        return '';
      };
      const normalizeOrgUnits = (orgUnits, ownerTeam = '') => {
        const names = uniq((orgUnits || []).map(toTeamName).filter(Boolean));
        if (!names.length && ownerTeam) names.push(ownerTeam);
        return uniq(names);
      };

      const getIncidents = () => {
        const modern = readSafe(INCIDENTS_UNIFIED_KEY, null);
        if (modern && typeof modern === 'object') return modern;
        return DataStore.get(INCIDENT_KEY, { currentIncident: {}, logs: [] }) || { currentIncident: {}, logs: [] };
      };
      const saveIncidents = (data) => {
        DataStore.set(INCIDENT_KEY, data);
        localStorage.setItem(INCIDENTS_UNIFIED_KEY, JSON.stringify(data));
      };
      const getEvidenceItems = () => {
        const modern = readSafe(EVIDENCE_ITEMS_KEY, null);
        if (Array.isArray(modern)) return modern;
        const legacy = DataStore.get(EVIDENCE_KEY, []);
        return Array.isArray(legacy) ? legacy : [];
      };
      const saveEvidenceItems = (rows) => {
        const safe = Array.isArray(rows) ? rows : [];
        DataStore.set(EVIDENCE_KEY, safe);
        localStorage.setItem(EVIDENCE_ITEMS_KEY, JSON.stringify(safe));
      };
      const getActionItems = () => {
        const modern = readSafe(ACTION_ITEMS_KEY, null);
        if (Array.isArray(modern)) return modern;
        const legacy = DataStore.get(CAPA_KEY, []);
        return Array.isArray(legacy) ? legacy : [];
      };
      const saveActionItems = (rows) => {
        const safe = Array.isArray(rows) ? rows : [];
        DataStore.set(CAPA_KEY, safe);
        localStorage.setItem(ACTION_ITEMS_KEY, JSON.stringify(safe));
      };

      const createDefaultEvidenceForIncident = () => [];
      const createDefaultActionsForIncident = () => [];
      const syncIncidentOutputs = (incident) => incident;

      const getOpenEvidenceItems = () => getEvidenceItems().filter((item) => ['미확인', '확인필요'].includes(String(item.status || '').trim()));
      const getOpenActionItems = () => getActionItems().filter((item) => ['미완료', '미착수', '진행중', 'OPEN', 'IN_PROGRESS'].includes(String(item.status || '').trim()));

      const setFocusTarget = (type, id) => {
        localStorage.setItem(FOCUS_TARGET_KEY, JSON.stringify({ type, id }));
      };
      const getFocusTarget = () => readSafe(FOCUS_TARGET_KEY, null);
      const clearFocusTarget = () => localStorage.removeItem(FOCUS_TARGET_KEY);

      const incidents = getIncidents();
      saveIncidents(incidents);
      saveEvidenceItems(getEvidenceItems());
      saveActionItems(getActionItems());
      clearFocusTarget();

      const currentIncident = incidents.currentIncident || readSafe(CURRENT_INCIDENT_KEY, {}) || {};
      const status = String(currentIncident.status || '');
      const ongoingStatuses = ['원인 조사', '영향 완화', '안정화 모니터링'];
      const closedStatuses = ['복구 완료', '종료', '종결'];

      const openEvidence = getOpenEvidenceItems().sort((a,b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
      const openActions = getOpenActionItems().sort((a,b) => new Date(a.dueDate || '2999-12-31') - new Date(b.dueDate || '2999-12-31'));

      document.getElementById('kIncident').textContent = ongoingStatuses.includes(status) ? '1' : '0';
      document.getElementById('kEvidence').textContent = String(openEvidence.length);
      document.getElementById('kAction').textContent = String(openActions.length);
      document.getElementById('kClosed').textContent = closedStatuses.includes(status) ? '1' : '0';

      const renderOrgChips = (orgUnits, ownerTeam = '') => {
        const names = normalizeOrgUnits(orgUnits, ownerTeam);
        if (!names.length) return '<span class="chip">관련 조직 확인 필요</span>';
        return names.map((name) => `<span class="chip">${name}</span>`).join('');
      };

      const evidenceList = document.getElementById('evidenceList');
      if (!openEvidence.length) {
        evidenceList.innerHTML = '<div class="empty">미확인 증적이 없습니다.</div>';
      } else {
        evidenceList.innerHTML = openEvidence.map((item) => `
          <article class="itemRow">
            <div class="cell">
              <div class="label">증적명</div>
              <button class="titleBtn" type="button" data-type="evidence" data-id="${item.id}">${item.title || item.description || '증적 항목'}</button>
              <div class="meta">연계 사고: ${item.incidentTitle || item.incidentId || item.incident || '-'}</div>
            </div>
            <div class="cell">
              <div class="label">영향 서비스</div>
              <div class="meta">${item.serviceName || (item.services || []).join(', ') || '-'}</div>
            </div>
            <div class="cell">
              <div class="label">관련 조직</div>
              <div class="chipWrap">${renderOrgChips(item.relatedOrgUnits, item.ownerTeam)}</div>
            </div>
            <div class="cell">
              <div class="label">생성일</div>
              <div class="meta">${toDate(item.createdAt)}</div>
            </div>
            <div class="cell">
              <div class="label">상태</div>
              <span class="badge warn">확인 필요</span>
            </div>
          </article>
        `).join('');
      }

      const actionList = document.getElementById('actionList');
      if (!openActions.length) {
        actionList.innerHTML = '<div class="empty">미완료 개선조치가 없습니다.</div>';
      } else {
        actionList.innerHTML = openActions.map((item) => `
          <article class="itemRow">
            <div class="cell">
              <div class="label">조치명</div>
              <button class="titleBtn" type="button" data-type="action" data-id="${item.id}">${item.title || '개선조치 항목'}</button>
              <div class="meta">연계 사고: ${item.incidentTitle || item.incidentId || item.incident || '-'}</div>
            </div>
            <div class="cell">
              <div class="label">영향 서비스</div>
              <div class="meta">${item.serviceName || item.service || '-'}</div>
            </div>
            <div class="cell">
              <div class="label">관련 조직</div>
              <div class="chipWrap">${renderOrgChips(item.relatedOrgUnits, item.ownerTeam)}</div>
            </div>
            <div class="cell">
              <div class="label">우선순위 / 기한</div>
              <div class="meta">${item.priority || '-'} / ${item.dueDate || '-'}</div>
            </div>
            <div class="cell">
              <div class="label">상태</div>
              <span class="badge progress">조치 필요</span>
            </div>
          </article>
        `).join('');
      }

      document.body.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-type][data-id]');
        if (!btn) return;
        const type = btn.dataset.type;
        const id = btn.dataset.id;
        if (!id) return;
        if (type === 'evidence') {
          setFocusTarget('evidence', id);
          location.href = '../audit/evidence.html?focus=' + encodeURIComponent(id);
          return;
        }
        if (type === 'action') {
          setFocusTarget('action', id);
          location.href = '../audit/capa.html?focus=' + encodeURIComponent(id);
        }
      });

      window.getIncidents = getIncidents;
      window.saveIncidents = saveIncidents;
      window.getEvidenceItems = getEvidenceItems;
      window.saveEvidenceItems = saveEvidenceItems;
      window.getActionItems = getActionItems;
      window.saveActionItems = saveActionItems;
      window.createDefaultEvidenceForIncident = createDefaultEvidenceForIncident;
      window.createDefaultActionsForIncident = createDefaultActionsForIncident;
      window.syncIncidentOutputs = syncIncidentOutputs;
      window.getOpenEvidenceItems = getOpenEvidenceItems;
      window.getOpenActionItems = getOpenActionItems;
      window.setFocusTarget = setFocusTarget;
      window.getFocusTarget = getFocusTarget;
      window.clearFocusTarget = clearFocusTarget;
    })();
  </script>
</body>
</html>
