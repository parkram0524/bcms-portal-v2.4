<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BCMS Portal - 운영센터</title>
<link rel="stylesheet" href="../assets/style.css"/>
<style>
  html, body { overflow-x: hidden; max-width: 100%; }
  .main { overflow-x: hidden; min-width: 0; }
  .wrap { max-width: 1280px; margin: 0 auto; overflow-x: hidden; }

  /* ── 헤더 ── */
  .pageHeader {
    display: flex; align-items: flex-start; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
  }
  .pageHeader h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px 0; }
  .pageHeader .dateLine { font-size: 13px; color: var(--text-2); margin: 0; }
  .pageHeader .rightGroup { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .statusBadge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 700;
    border: 1.5px solid currentColor; white-space: nowrap;
  }
  .badge-green  { color: #16a34a; background: #f0fdf4; }
  .badge-yellow { color: #d97706; background: #fffbeb; }
  .badge-red    { color: #dc2626; background: #fef2f2; }
  [data-theme="dark"] .badge-green  { background: #052e16; }
  [data-theme="dark"] .badge-yellow { background: #1c1400; }
  [data-theme="dark"] .badge-red    { background: #2a0000; }

  .btnNav {
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 13px; font-weight: 600;
    cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s;
  }
  .btnNav:hover { background: var(--surface-hover); }

  /* ── KPI 그리드 ── */
  .kpiGrid {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px; margin-bottom: 20px;
  }
  @media (max-width: 960px) { .kpiGrid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .kpiGrid { grid-template-columns: 1fr; } }

  .kpiCard {
    border: 0.5px solid var(--border); border-radius: 12px;
    background: var(--surface); padding: 16px 18px;
  }
  .kpiCard .kLabel { font-size: 12px; color: var(--text-2); font-weight: 600; margin: 0 0 8px 0; }
  .kpiCard .kValue { font-size: 30px; font-weight: 900; margin: 0 0 10px 0; line-height: 1; }
  .kpiCard .kDesc  { font-size: 12px; color: var(--text-2); margin: 6px 0 0 0; }

  .pBar { height: 5px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .pBar > b { display: block; height: 100%; border-radius: 999px; transition: width .4s; }
  .fg-green  { background: #16a34a; }
  .fg-yellow { background: #d97706; }
  .fg-red    { background: #dc2626; }
  .fg-blue   { background: var(--accent, #0070f3); }
  .tx-green  { color: #16a34a; }
  .tx-yellow { color: #d97706; }
  .tx-red    { color: #dc2626; }

  /* ── 3열 그리드 ── */
  .triGrid {
    display: grid; grid-template-columns: 1fr 1.1fr 0.9fr;
    gap: 14px; margin-bottom: 20px;
  }
  @media (max-width: 960px) { .triGrid { grid-template-columns: 1fr; } }

  .card {
    border: 0.5px solid var(--border); border-radius: 12px;
    background: var(--surface); padding: 18px 20px;
  }
  .card h3 { font-size: 14px; font-weight: 800; margin: 0 0 14px 0; }

  /* ── 할 일 ── */
  .todoList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .todoList li a {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    color: var(--text); text-decoration: none; font-size: 13px; line-height: 1.4;
    transition: background .15s;
  }
  .todoList li a:hover { background: var(--surface-hover); }
  .dot-red    { color: #dc2626; flex-shrink: 0; }
  .dot-yellow { color: #d97706; flex-shrink: 0; }
  .todoAllOk {
    padding: 10px 12px; border-radius: 8px; font-size: 13px;
    color: #16a34a; background: #f0fdf4; font-weight: 600;
  }
  [data-theme="dark"] .todoAllOk { background: #052e16; }

  /* ── PDCA ── */
  .pdcaRows { display: flex; flex-direction: column; gap: 13px; }
  .pdcaItem { }
  .pdcaHead {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; margin-bottom: 5px;
  }
  .pdcaName { font-weight: 700; color: var(--text); }
  .pdcaSub  { font-size: 11px; color: var(--text-2); margin-left: 4px; }
  .pdcaPct  { font-weight: 800; font-size: 13px; }
  .pdcaBarWrap { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; }
  .pdcaBarWrap > span { display: block; height: 100%; border-radius: 4px; transition: width .4s; background: var(--accent, #0070f3); }
  .pdcaFooter {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; font-size: 12px;
  }
  .pdcaFooter .comment { color: var(--text-2); }
  .pdcaFooter .totalPct { font-size: 22px; font-weight: 900; color: var(--accent, #0070f3); }

  /* ── 일정 ── */
  .schedList { display: flex; flex-direction: column; gap: 7px; }
  .schedItem {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px;
  }
  .schedDate { font-size: 11px; color: var(--text-2); white-space: nowrap; padding-top: 2px; min-width: 52px; }
  .schedName { flex: 1; font-weight: 600; color: var(--text); line-height: 1.4; }
  .typeBadge {
    padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 700;
    background: rgba(0,112,243,.1); color: var(--accent, #0070f3); white-space: nowrap;
  }
  .emptyCard { color: var(--text-2); font-size: 13px; }
  .emptyCard a { color: var(--accent, #0070f3); }

  /* ── 2열 하단 ── */
  .dualGrid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 14px; margin-bottom: 20px;
  }
  @media (max-width: 960px) { .dualGrid { grid-template-columns: 1fr; } }

  /* ── 테이블 ── */
  .tableWrap { overflow-x: auto; }
  table.t {
    width: 100%; border-collapse: collapse; font-size: 13px; min-width: 440px;
  }
  table.t th {
    text-align: left; font-size: 11px; font-weight: 700; color: var(--text-2);
    padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.t td {
    padding: 8px 10px; border-bottom: 1px solid var(--border);
    vertical-align: top; color: var(--text); line-height: 1.4;
  }
  table.t tr:last-child td { border-bottom: none; }
  table.t tr:hover td { background: var(--surface-hover); }
  .emptyRow td { text-align: center; color: var(--text-2); padding: 20px !important; }

  .rTag {
    display: inline-block; padding: 2px 6px; border-radius: 4px;
    font-size: 11px; font-weight: 800;
  }
  .rTag.high   { background: #fef2f2; color: #dc2626; }
  .rTag.mid    { background: #fffbeb; color: #d97706; }
  .rTag.low    { background: #f0fdf4; color: #16a34a; }
  [data-theme="dark"] .rTag.high  { background: #2a0000; }
  [data-theme="dark"] .rTag.mid   { background: #1c1400; }
  [data-theme="dark"] .rTag.low   { background: #052e16; }

  .cTag {
    display: inline-block; padding: 2px 7px; border-radius: 4px;
    font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  .cTag.done    { background: #f0fdf4; color: #16a34a; }
  .cTag.wip     { background: rgba(0,112,243,.1); color: #0070f3; }
  .cTag.delayed { background: #fef2f2; color: #dc2626; }
  .cTag.pending { background: rgba(0,0,0,.07); color: var(--text-2); }
  [data-theme="dark"] .cTag.done    { background: #052e16; }
  [data-theme="dark"] .cTag.wip     { background: #001c3a; }
  [data-theme="dark"] .cTag.delayed { background: #2a0000; }
  [data-theme="dark"] .cTag.pending { background: rgba(255,255,255,.1); }

  .ynTag {
    display: inline-block; padding: 2px 6px; border-radius: 4px;
    font-size: 11px; font-weight: 700;
  }
  .ynTag.y { background: #f0fdf4; color: #16a34a; }
  .ynTag.n { background: rgba(0,0,0,.06); color: var(--text-2); }
  [data-theme="dark"] .ynTag.y { background: #052e16; }
  [data-theme="dark"] .ynTag.n { background: rgba(255,255,255,.1); }

  @media (max-width: 640px) {
    .pageHeader { flex-direction: column; }
    .pageHeader .rightGroup { width: 100%; }
  }
</style>
</head>
<body>
<aside id="sidebarMount"></aside>
<main class="main">
<div class="wrap">

  <!-- 헤더 -->
  <div class="pageHeader">
    <div>
      <h1>🎛️ BCMS 운영센터</h1>
      <p class="dateLine" id="dateLineEl"></p>
    </div>
    <div class="rightGroup">
      <span class="statusBadge" id="globalBadge"></span>
      <a href="../training/index.html" class="btnNav">훈련·점검 →</a>
      <a href="../audit/index.html" class="btnNav">평가·감사 →</a>
      <button id="themeToggle" class="btnNav">🌙 다크모드</button>
    </div>
  </div>

  <!-- KPI 6개 -->
  <div class="kpiGrid" id="kpiGrid"></div>

  <!-- 3열 -->
  <div class="triGrid">
    <div class="card">
      <h3>✅ 오늘 할 일</h3>
      <ul class="todoList" id="todoList"></ul>
    </div>
    <div class="card">
      <h3>📋 BCMS PDCA 진행률</h3>
      <div class="pdcaRows" id="pdcaRows"></div>
      <div class="pdcaFooter">
        <span class="comment" id="pdcaComment"></span>
        <span class="totalPct" id="pdcaTotalPct"></span>
      </div>
    </div>
    <div class="card">
      <h3>📅 훈련 일정</h3>
      <div class="schedList" id="schedList"></div>
    </div>
  </div>

  <!-- 하단 2열 -->
  <div class="dualGrid">
    <div class="card">
      <h3>⚠️ 중점관리 리스크</h3>
      <div class="tableWrap">
        <table class="t">
          <thead><tr><th>팀</th><th>리스크명</th><th>위험도</th><th>BCP수립</th></tr></thead>
          <tbody id="riskBody"></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <h3>🔧 CAPA 개선조치</h3>
      <div class="tableWrap">
        <table class="t">
          <thead><tr><th>항목명</th><th>담당자</th><th>목표일</th><th>상태</th></tr></thead>
          <tbody id="capaBody"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
</main>

<script src="../assets/demo-seed.js"></script>
<script src="../assets/sidebar.js"></script>
<script>
(function () {
  'use strict';

  /* ── 유틸 ── */
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const clamp = n => Math.max(0, Math.min(100, Math.round(n || 0)));

  function load(key, def) {
    try {
      const v = localStorage.getItem(key);
      if (!v) return def;
      const p = JSON.parse(v);
      return (p !== null && p !== undefined) ? p : def;
    } catch { return def; }
  }

  function arr(v) { return Array.isArray(v) ? v : []; }

  /* ── 날짜 ── */
  const DAYS = ['일','월','화','수','목','금','토'];
  const today = new Date();
  const todayMs = today.setHours(0,0,0,0) || today.getTime();
  const nowDate = new Date(todayMs);
  document.getElementById('dateLineEl').textContent =
    nowDate.getFullYear() + '년 ' + (nowDate.getMonth()+1) + '월 ' +
    nowDate.getDate() + '일 ' + DAYS[nowDate.getDay()] + '요일';

  /* ── 데이터 로드 ── */
  const biaData   = arr(load('bcmsBIAData', []));
  const riskData  = arr(load('bcmsRiskList', null) ?? load('bcmsRiskAssessment', []));
  const bcpRaw    = load('bcmsBCP', null) ?? load('bcmsBCPStrategy', []);
  const bcpTeams  = arr(Array.isArray(bcpRaw) ? bcpRaw : (bcpRaw && typeof bcpRaw === 'object' ? Object.values(bcpRaw) : []));
  const bcpData   = bcpTeams.flatMap(t => arr(t && t.strategies));
  const confirmedObj = load('bcmsPriorityConfirmed', {});
  const confirmed = (confirmedObj && typeof confirmedObj === 'object' && !Array.isArray(confirmedObj))
    ? Object.values(confirmedObj).filter(v => v === true)
    : arr(confirmedObj);
  const trainData = arr(load('bcmsTrainingData', []));
  const capaData  = arr(load('bcmsCapaItems', []));
  const gapData   = arr(load('bcmsGapAnalysis', []));
  const docsData  = arr(load('bcmsDocuments', []));
  const policyData   = load('bcmsPolicyData', null);
  const objectives   = arr(load('bcmsObjectives', []));
  const requirements = arr(load('bcmsRequirements', []));

  /* ── KPI 계산 ── */

  // ① BCP 수립률
  const confirmedCnt = confirmed.length;
  const bcpWritten   = bcpData.filter(b => b && (b.strategyText || b.strategyType || b.strategy || b.done)).length;
  const bcpPct       = confirmedCnt > 0 ? clamp(bcpWritten / confirmedCnt * 100) : 0;

  // ② 중점관리 리스크
  const critRisks = riskData.filter(r => r && ((r.riskScore ?? r.score ?? 0) >= 15 || r.critical === true));
  const critCnt   = critRisks.length;

  // ③ 훈련 이행률
  const trainTotal = trainData.length;
  const trainDone  = trainData.filter(t => t && (String(t.status ?? '') === '완료' || t.done === true || t.completed === true)).length;
  const trainPct   = trainTotal > 0 ? clamp(trainDone / trainTotal * 100) : 0;

  // ④ CAPA 완료율
  const capaTotal = capaData.length;
  const capaDone  = capaData.filter(c => c && (String(c.status ?? '').includes('완료') || String(c.status ?? '').toLowerCase() === 'closed')).length;
  const capaPct   = capaTotal > 0 ? clamp(capaDone / capaTotal * 100) : 0;

  // ⑤ ISO 갭분석 충족률
  const gapTotal = gapData.length;
  const gapMet   = gapData.filter(g => {
    if (!g) return false;
    const s = String(g.status ?? '').toLowerCase();
    return s === '충족' || s === 'yes' || s === 'y' || g.met === true;
  }).length;
  const gapPct = gapTotal > 0 ? clamp(gapMet / gapTotal * 100) : 0;

  // ⑥ 문서 만료 임박
  const soon = new Date(nowDate); soon.setDate(soon.getDate() + 30);
  const expiringCnt = docsData.filter(d => {
    if (!d) return false;
    const raw = d.expiryDate ?? d.reviewDate ?? '';
    if (!raw) return false;
    const dt = new Date(raw);
    return !isNaN(dt) && dt >= nowDate && dt <= soon;
  }).length;

  /* ── 전체 상태 배지 ── */
  const avgPct = clamp((bcpPct + trainPct + capaPct + gapPct) / 4);
  const badgeEl = document.getElementById('globalBadge');
  if (avgPct >= 70) {
    badgeEl.textContent = '● 정상';
    badgeEl.className = 'statusBadge badge-green';
  } else if (avgPct >= 50) {
    badgeEl.textContent = '● 주의';
    badgeEl.className = 'statusBadge badge-yellow';
  } else {
    badgeEl.textContent = '● 점검필요';
    badgeEl.className = 'statusBadge badge-red';
  }

  /* ── KPI 카드 렌더 ── */
  function pctClass(p) { return p >= 70 ? 'green' : p >= 50 ? 'yellow' : 'red'; }

  function kpiCard(label, valueHtml, pct, descHtml, noBar) {
    const cls = pctClass(pct);
    const barHtml = noBar ? '' :
      `<div class="pBar" style="margin-bottom:6px"><b class="fg-${cls}" style="width:${pct}%"></b></div>`;
    return `
      <div class="kpiCard">
        <p class="kLabel">${label}</p>
        <p class="kValue tx-${cls}">${valueHtml}</p>
        ${barHtml}
        <p class="kDesc">${descHtml}</p>
      </div>`;
  }

  document.getElementById('kpiGrid').innerHTML = [
    kpiCard(
      '📌 BCP 수립률',
      bcpPct + '%',
      bcpPct,
      `확정 핵심업무 ${confirmedCnt}건 중 ${bcpWritten}건 작성`
    ),
    kpiCard(
      '🔴 중점관리 리스크',
      critCnt + '건',
      critCnt === 0 ? 100 : Math.max(0, 100 - critCnt * 10),
      critCnt === 0 ? '<span class="tx-green">이상 없음</span>' : '<span class="tx-red">전략 수립 확인 필요</span>',
      true
    ),
    kpiCard(
      '🎯 훈련 이행률',
      trainPct + '%',
      trainPct,
      `전체 ${trainTotal}건 중 ${trainDone}건 완료`
    ),
    kpiCard(
      '🔧 CAPA 완료율',
      capaPct + '%',
      capaPct,
      `전체 ${capaTotal}건 중 ${capaDone}건 완료`
    ),
    kpiCard(
      '📊 ISO 22301 갭분석 충족률',
      gapPct + '%',
      gapPct,
      `전체 ${gapTotal}항목 중 ${gapMet}항목 충족`
    ),
    kpiCard(
      '📄 문서 만료 임박 (30일)',
      expiringCnt + '건',
      expiringCnt === 0 ? 100 : Math.max(20, 100 - expiringCnt * 20),
      expiringCnt === 0 ? '<span class="tx-green">없음</span>' : `<span class="tx-yellow">${expiringCnt}건 확인 필요</span>`,
      true
    ),
  ].join('');

  /* ── BASE path (사이드바 동일 로직) ── */
  const BASE = (() => {
    const p = window.location.pathname;
    const m = p.match(/^(\/[^\/]+)(?=\/(governance|risk-bia|strategy-plans|op-center|library|training|audit|admin|reports)\/)/);
    return m ? m[1] : '';
  })();
  const H = p => BASE + p;

  /* ── 오늘 할 일 ── */
  const todos = [];
  const bcpMissing = confirmedCnt - bcpWritten;
  if (bcpMissing > 0)
    todos.push({ dot:'red', text:`BCP 전략 ${bcpMissing}건 미작성`, href: H('/strategy-plans/bcp.html') });

  const capaWip = capaTotal - capaDone;
  if (capaWip > 0)
    todos.push({ dot:'red', text:`CAPA 개선조치 ${capaWip}건 진행중`, href: H('/audit/index.html') });

  const gapMissing = gapTotal - gapMet;
  if (gapMissing > 0)
    todos.push({ dot:'yellow', text:`갭분석 미충족 ${gapMissing}항목`, href: H('/audit/index.html') });

  const trainWip = trainTotal - trainDone;
  if (trainWip > 0)
    todos.push({ dot:'yellow', text:`훈련 계획 ${trainWip}건 미이행`, href: H('/training/index.html') });

  if (critCnt > 0)
    todos.push({ dot:'red', text:`중점관리 리스크 ${critCnt}건 전략 확인`, href: H('/strategy-plans/bcp.html') });

  if (expiringCnt > 0)
    todos.push({ dot:'yellow', text:`만료 임박 문서 ${expiringCnt}건`, href: H('/governance/docs.html') });

  const todoEl = document.getElementById('todoList');
  if (todos.length === 0) {
    todoEl.innerHTML = `<li><div class="todoAllOk">✓ 오늘은 모든 항목이 정상입니다</div></li>`;
  } else {
    todoEl.innerHTML = todos.map(t =>
      `<li><a href="${esc(t.href)}">
         <span class="dot-${t.dot}">●</span>${esc(t.text)}
       </a></li>`
    ).join('');
  }

  /* ── PDCA 진행률 ── */
  const planPct = clamp((policyData ? 34 : 0) + (objectives.length > 0 ? 33 : 0) + (requirements.length > 0 ? 33 : 0));
  const doPct   = bcpPct;
  const checkPct = gapPct;
  const actPct   = capaPct;
  const totalPct = clamp((planPct + doPct + checkPct + actPct) / 4);

  const pdcaRows = [
    { name: 'Plan', sub: '정책·목표·요구사항', pct: planPct },
    { name: 'Do',   sub: 'BCP 수립률',         pct: doPct   },
    { name: 'Check', sub: 'ISO 갭분석 충족률', pct: checkPct },
    { name: 'Act',  sub: 'CAPA 완료율',        pct: actPct  },
  ];

  document.getElementById('pdcaRows').innerHTML = pdcaRows.map(r => `
    <div class="pdcaItem">
      <div class="pdcaHead">
        <div>
          <span class="pdcaName">${esc(r.name)}</span>
          <span class="pdcaSub">${esc(r.sub)}</span>
        </div>
        <span class="pdcaPct">${r.pct}%</span>
      </div>
      <div class="pdcaBarWrap"><span style="width:${r.pct}%"></span></div>
    </div>
  `).join('');

  document.getElementById('pdcaTotalPct').textContent = totalPct + '%';
  document.getElementById('pdcaComment').textContent =
    totalPct >= 80 ? 'BCMS 체계가 잘 갖춰져 있습니다' :
    totalPct >= 50 ? '주요 항목을 계속 보완해 주세요' :
                     '핵심 항목부터 우선 수립하세요';

  /* ── 훈련 일정 ── */
  const upcoming = trainData
    .filter(t => t && t.date && String(t.status ?? '') !== '완료' && t.done !== true && t.completed !== true)
    .map(t => ({ ...t, _d: new Date(t.date) }))
    .filter(t => !isNaN(t._d) && t._d >= nowDate)
    .sort((a, b) => a._d - b._d)
    .slice(0, 5);

  const schedEl = document.getElementById('schedList');
  if (upcoming.length === 0) {
    schedEl.innerHTML = `<div class="emptyCard">예정된 훈련이 없습니다<br>
      <a href="${H('/training/index.html')}">→ 훈련 계획 수립하기</a></div>`;
  } else {
    schedEl.innerHTML = upcoming.map(t => {
      const d = t._d;
      const dateStr = (d.getMonth()+1) + '/' + d.getDate() + ' (' + DAYS[d.getDay()] + ')';
      return `<div class="schedItem">
        <span class="schedDate">${esc(dateStr)}</span>
        <span class="schedName">${esc(t.name ?? t.title ?? '훈련')}</span>
        <span class="typeBadge">${esc(t.type ?? t.trainingType ?? '훈련')}</span>
      </div>`;
    }).join('');
  }

  /* ── 리스크 TOP 5 ── */
  const top5 = riskData
    .filter(r => r)
    .sort((a, b) => (b.riskScore ?? b.score ?? 0) - (a.riskScore ?? a.score ?? 0))
    .slice(0, 5);

  const bcpTeamSet = new Set(bcpTeams.map(t => t && String(t.team ?? t.dept ?? '')).filter(Boolean));
  function hasBcp(r) {
    return bcpTeamSet.has(String(r.team ?? r.dept ?? ''));
  }

  const riskBody = document.getElementById('riskBody');
  if (top5.length === 0) {
    riskBody.innerHTML = `<tr class="emptyRow"><td colspan="4">리스크 평가 데이터가 없습니다</td></tr>`;
  } else {
    riskBody.innerHTML = top5.map(r => {
      const score = r.riskScore ?? r.score ?? 0;
      const cls   = score >= 15 ? 'high' : score >= 9 ? 'mid' : 'low';
      const bcp   = hasBcp(r);
      return `<tr>
        <td>${esc(r.team ?? r.dept ?? '—')}</td>
        <td>${esc(r.name ?? r.riskName ?? r.title ?? '—')}</td>
        <td><span class="rTag ${cls}">${esc(score)}</span></td>
        <td><span class="ynTag ${bcp ? 'y' : 'n'}">${bcp ? 'O' : 'X'}</span></td>
      </tr>`;
    }).join('');
  }

  /* ── CAPA 최근 5개 ── */
  const recent5 = [...capaData].reverse().slice(0, 5);

  function capaStatus(c) {
    const s = String(c.status ?? '').toLowerCase();
    if (s.includes('완료') || s === 'closed' || s === 'done') return { label:'완료', cls:'done' };
    const due = c.dueDate ?? c.targetDate ?? '';
    if (due && new Date(due) < nowDate) return { label:'지연', cls:'delayed' };
    if (s.includes('진행') || s === 'wip' || s === 'in progress') return { label:'진행중', cls:'wip' };
    return { label:'미시작', cls:'pending' };
  }

  const capaBody = document.getElementById('capaBody');
  if (recent5.length === 0) {
    capaBody.innerHTML = `<tr class="emptyRow"><td colspan="4">CAPA 항목이 없습니다</td></tr>`;
  } else {
    capaBody.innerHTML = recent5.map(c => {
      const st  = capaStatus(c);
      const due = c.dueDate ?? c.targetDate ?? '—';
      return `<tr>
        <td>${esc(c.title ?? c.name ?? c.item ?? '—')}</td>
        <td>${esc(c.owner ?? c.assignee ?? '—')}</td>
        <td>${esc(due)}</td>
        <td><span class="cTag ${st.cls}">${st.label}</span></td>
      </tr>`;
    }).join('');
  }

  /* ── 다크모드 ── */
  const html = document.documentElement;
  const btn  = document.getElementById('themeToggle');
  function applyTheme(t) {
    html.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☀️ 라이트모드' : '🌙 다크모드';
    try { localStorage.setItem('bcmsTheme', t); } catch {}
  }
  try { const s = localStorage.getItem('bcmsTheme'); if (s) applyTheme(s); } catch {}
  btn.addEventListener('click', () =>
    applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark')
  );

})();
</script>
</body>
</html>
