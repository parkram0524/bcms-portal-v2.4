<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>온보딩 설정 | BCMS Portal</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Pretendard","Inter","Segoe UI",system-ui,sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #555;
      font-size: 14px;
    }
    .logo { font-size: 40px; }
    .title { font-size: 16px; font-weight: 700; color: #111; letter-spacing: -.01em; }
    .sub { font-size: 13px; color: #888; }
    .links { display: flex; gap: 12px; margin-top: 8px; }
    .links a {
      font-size: 13px; font-weight: 600; color: #0070f3;
      text-decoration: none; padding: 8px 16px;
      border: 1px solid rgba(0,112,243,.3); border-radius: 8px;
      background: rgba(0,112,243,.06); transition: background .12s;
    }
    .links a:hover { background: rgba(0,112,243,.12); }
  </style>
</head>
<body>
  <div class="logo">🛡</div>
  <div class="title">BCMS Portal 온보딩</div>
  <div class="sub">초기 설정 팝업이 표시됩니다.</div>
  <div class="links">
    <a href="index.html">대시보드로 이동 →</a>
  </div>

  <script>
    /* 이 페이지는 항상 온보딩 팝업을 강제 표시합니다. */
    window.BCMS_FORCE_ONBOARDING  = true;
    window.BCMS_ONBOARDING_REDIRECT = 'index.html';
  </script>
  <script src="assets/onboarding.js"></script>
</body>
</html>
