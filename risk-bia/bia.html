<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>BIA (업무영향분석) | BCMS Portal v2</title>
  <link rel="stylesheet" href="../assets/style.css"/>
  <style>
    .wrap{ max-width:1320px; margin:0 auto; }
    .hero h1{ margin:0; font-size:24px; font-weight:950; }
    .hero p{ margin:8px 0 0; font-size:16px; color:rgba(15,23,42,.66); line-height:1.65; }

    .panel{ margin-top:14px; border:1px solid rgba(15,23,42,.1); border-radius:14px; background:#fff; padding:14px; }
    .hero{ border:1px solid rgba(15,23,42,.1); border-radius:16px; background:#fff; padding:16px; }
    .sectionTitle{ margin:0; font-size:18px; font-weight:900; color:#0f172a; }
    .sectionDesc{ margin:6px 0 0; font-size:13px; color:#64748b; }
    .kpiGrid{ margin-top:14px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
    .kpiCard{ border:1px solid rgba(15,23,42,.1); border-radius:12px; background:#fff; padding:12px; }
    .kpiCard .k{ font-size:13px; color:#64748b; font-weight:800; }
    .kpiCard .v{ margin-top:7px; font-size:32px; font-weight:950; color:#0f172a; }
    .overviewHead{ display:flex; gap:10px; flex-wrap:wrap; align-items:end; justify-content:space-between; margin-bottom:10px; }
    .overviewFilters{ display:flex; gap:8px; flex-wrap:wrap; }
    .overviewFilters select{ min-width:200px; padding:8px 10px; font-size:14px; }
    .overviewTableWrap{ overflow:auto; }
    .overviewTable{ width:100%; min-width:980px; border-collapse:separate; border-spacing:0; border:1px solid rgba(15,23,42,.1); border-radius:12px; overflow:hidden; }
    .overviewTable th,.overviewTable td{ padding:10px; font-size:14px; border-bottom:1px solid rgba(15,23,42,.08); }
    .overviewTable th{ background:#f8fafc; color:#334155; font-weight:900; }
    .overviewTable tr:last-child td{ border-bottom:none; }
    .clickRow{ cursor:pointer; }
    .clickRow:hover td{ background:rgba(15,23,42,.03); }
    .editSection{ scroll-margin-top:20px; }
    .row{ display:grid; grid-template-columns:1fr 260px auto; gap:10px; align-items:end; }
    .row label{ font-size:14px; font-weight:800; color:#334155; display:block; margin-bottom:6px; }
    .row select, .row input{ width:100%; padding:10px 12px; font-size:16px; }

    .btn{ border:1px solid rgba(15,23,42,.15); border-radius:10px; background:#fff; color:#0f172a; padding:9px 12px; font-size:14px; font-weight:900; cursor:pointer; }
    .btn:hover{ background:rgba(15,23,42,.04); }
    .btn.primary{ border-color:rgba(37,99,235,.35); background:rgba(37,99,235,.08); color:#1d4ed8; }

    .summaryGrid{ margin-top:12px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
    .metric{ border:1px solid rgba(15,23,42,.1); border-radius:12px; background:#fff; padding:11px; }
    .metric .k{ font-size:14px; color:rgba(15,23,42,.62); font-weight:800; }
    .metric .v{ margin-top:7px; font-size:24px; font-weight:950; }

    .tableWrap{ margin-top:12px; overflow:auto; }
    table{ width:100%; min-width:1120px; border-collapse:separate; border-spacing:0; border:1px solid rgba(15,23,42,.1); border-radius:12px; overflow:hidden; }
    th, td{ padding:10px 10px; font-size:16px; border-bottom:1px solid rgba(15,23,42,.08); vertical-align:middle; }
    th{ background:#f8fafc; font-size:14px; font-weight:900; text-align:left; color:#334155; }
    tr:last-child td{ border-bottom:none; }

    .functionName{ font-size:16px; font-weight:800; }
    .muted{ font-size:13px; color:rgba(15,23,42,.62); }
    .smallSelect, .smallInput{ width:100%; padding:8px 10px; font-size:15px; }
    .rtoWrap{ display:flex; gap:6px; }
    .rtoWrap .smallInput{ width:90px; }

    .tag{ display:inline-flex; align-items:center; border-radius:999px; padding:4px 9px; border:1px solid rgba(15,23,42,.18); font-size:12px; font-weight:900; }
    .g-핵심{ color:#991b1b; background:rgba(239,68,68,.12); border-color:rgba(239,68,68,.35); }
    .g-주요{ color:#92400e; background:rgba(245,158,11,.14); border-color:rgba(245,158,11,.35); }
    .g-일반{ color:#166534; background:rgba(34,197,94,.12); border-color:rgba(34,197,94,.35); }

    .detailRow td{ background:#fcfdff; }
    .detailCard{ border:1px solid rgba(15,23,42,.08); border-radius:12px; padding:12px; background:#fff; }
    .detailGrid{ display:grid; grid-template-columns:2fr 1.2fr; gap:12px; }
    .subTitle{ margin:0 0 8px; font-size:14px; font-weight:900; color:#334155; }
    .timeGrid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .timeItem label{ display:block; margin-bottom:5px; font-size:13px; font-weight:800; color:#475569; }
    .timeItem select{ width:100%; padding:8px 9px; font-size:14px; }
    .reasonInput{ width:100%; min-height:90px; resize:vertical; padding:10px; font-size:14px; }
    .resourceGrid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .resourceItem{ display:flex; align-items:center; gap:7px; font-size:14px; }

    .warn{ margin-top:10px; border:1px solid rgba(239,68,68,.35); border-radius:10px; background:rgba(239,68,68,.10); color:#991b1b; padding:9px 10px; font-size:13px; font-weight:800; }

    .scoreGuideInline{ margin-top:10px; border:1px solid rgba(15,23,42,.1); border-radius:12px; background:#f8fafc; padding:10px; }
    .scoreGuideInline h3{ margin:0 0 8px; font-size:14px; font-weight:900; color:#0f172a; }
    .scoreGuideGrid{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
    .scoreItem{ border:1px solid rgba(15,23,42,.08); border-radius:10px; background:#fff; padding:8px; }
    .scoreItem .n{ font-size:13px; font-weight:900; color:#0f172a; }
    .scoreItem ul{ margin:6px 0 0; padding-left:16px; color:rgba(15,23,42,.72); font-size:12px; line-height:1.45; }
    .miniHelp{ margin-top:8px; padding:8px 10px; border:1px solid rgba(15,23,42,.1); border-radius:10px; background:#f8fafc; color:rgba(15,23,42,.72); font-size:12.5px; line-height:1.5; }

    .empty{ margin-top:12px; border:1px dashed rgba(148,163,184,.42); border-radius:12px; background:#f8fafc; color:#64748b; padding:14px; font-size:15px; }

    @media (max-width:980px){
      .row{ grid-template-columns:1fr; }
      .kpiGrid{ grid-template-columns:1fr 1fr; }
      .summaryGrid{ grid-template-columns:1fr 1fr; }
      .detailGrid{ grid-template-columns:1fr; }
      .timeGrid, .resourceGrid{ grid-template-columns:1fr 1fr; }
      .scoreGuideGrid{ grid-template-columns:1fr 1fr; }
      .overviewFilters select{ min-width:150px; }
    }
    @media (max-width:640px){
      .kpiGrid{ grid-template-columns:1fr; }
      .summaryGrid{ grid-template-columns:1fr; }
      .timeGrid, .resourceGrid{ grid-template-columns:1fr; }
      .scoreGuideGrid{ grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <aside id="sidebarMount"></aside>
  <main class="main">
    <div class="wrap">
      <section class="hero">
        <h1>BIA (업무영향분석)</h1>
        <p>핵심업무를 자동 불러와 중요업무 여부, 시간경과 영향평가, MTPD, RTO를 입력합니다. 저장 데이터는 Risk/복구 우선순위 화면과 호환됩니다.</p>
      </section>

      <section class="kpiGrid" id="globalKpi"></section>

      <section class="panel">
        <div class="overviewHead">
          <div>
            <h2 class="sectionTitle">전체 팀 총괄표</h2>
            <p class="sectionDesc">전체 현황을 먼저 확인한 후 팀별 상세 편집으로 이동하세요.</p>
          </div>
          <div class="overviewFilters">
            <div>
              <label for="overviewTeamFilter" class="muted">부서 필터</label>
              <select id="overviewTeamFilter"></select>
            </div>
            <div>
              <label for="overviewSort" class="muted">정렬</label>
              <select id="overviewSort">
                <option value="name">가나다순</option>
                <option value="coreDesc">핵심업무 많은 순</option>
                <option value="importantDesc">중요업무 많은 순</option>
                <option value="rtoAsc">최단 RTO 짧은 순</option>
              </select>
            </div>
          </div>
        </div>
        <div id="overviewTableMount" class="overviewTableWrap"></div>
      </section>

      <section class="panel editSection" id="detailEditor">
        <h2 class="sectionTitle">팀별 BIA 상세 편집</h2>
        <p class="sectionDesc">총괄표에서 팀을 선택하면 아래 편집 영역과 동기화됩니다.</p>
        <div class="row">
          <div>
            <label for="teamSelect">팀 선택</label>
            <select id="teamSelect"></select>
          </div>
          <div>
            <label for="newFunctionName">핵심업무 추가</label>
            <input id="newFunctionName" type="text" placeholder="예: 전력 장애 원인 분석"/>
          </div>
          <button id="addFunctionBtn" class="btn" type="button">업무 추가</button>
        </div>

        <div class="summaryGrid">
          <article class="metric"><div class="k">선택 팀</div><div class="v" id="teamMetric">-</div></article>
          <article class="metric"><div class="k">핵심업무 수</div><div class="v" id="countMetric">0</div></article>
          <article class="metric"><div class="k">중요업무 수</div><div class="v" id="importantMetric">0</div></article>
          <article class="metric"><div class="k">최단 MTPD / 최단 RTO</div><div class="v" id="timeMetric">-</div></article>
        </div>

        <div id="tableMount" class="tableWrap"></div>
        <div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;">
          <button id="saveBtn" class="btn primary" type="button">저장</button>
          <button id="resetBtn" class="btn" type="button">선택 팀 초기화</button>
        </div>
      </section>
    </div>
  </main>

  <script src="../assets/sidebar.js"></script>
  <script src="../assets/data-store.js"></script>
  <script src="../assets/demo-seed.js"></script>
  <script>
    (() => {
      if (window.BCMSDemoSeed) {
        window.BCMSDemoSeed.ensureDemoIfEmpty();
        window.BCMSDemoSeed.mountBanner('.wrap');
      }

      const CORE_KEY = 'bcmsCoreFunctions';
      const BIA_KEY = 'bcmsBIAData';
      const ORG_KEY = (window.DataStore && DataStore.KEY_ORG_REGISTRY) || 'bcms_org_registry_v1';
      const RESOURCE_OPTIONS = ['인력','시스템','데이터','설비','유틸리티','협력업체'];

      const TIME_IMPACT_META = [
        { key:'immediate', label:'즉시', minutes:0, text:'즉시' },
        { key:'min30', label:'30분', minutes:30, text:'30분' },
        { key:'hour1', label:'1시간', minutes:60, text:'1시간' },
        { key:'hour4', label:'4시간', minutes:240, text:'4시간' },
        { key:'day1', label:'1일', minutes:1440, text:'1일' },
        { key:'week1', label:'1주일', minutes:10080, text:'1주일' }
      ];

      const store = (window.DataStore && DataStore.get && DataStore.set) ? DataStore : {
        get: (k, f) => { try { const raw = localStorage.getItem(k); return raw ? JSON.parse(raw) : f; } catch { return f; } },
        set: (k, v) => localStorage.setItem(k, JSON.stringify(v))
      };

      const teamSelect = document.getElementById('teamSelect');
      const overviewTeamFilter = document.getElementById('overviewTeamFilter');
      const overviewSort = document.getElementById('overviewSort');
      const overviewTableMount = document.getElementById('overviewTableMount');
      const globalKpi = document.getElementById('globalKpi');
      const detailEditor = document.getElementById('detailEditor');
      const newFunctionName = document.getElementById('newFunctionName');
      const addFunctionBtn = document.getElementById('addFunctionBtn');
      const tableMount = document.getElementById('tableMount');
      const saveBtn = document.getElementById('saveBtn');
      const resetBtn = document.getElementById('resetBtn');
      const teamMetric = document.getElementById('teamMetric');
      const countMetric = document.getElementById('countMetric');
      const importantMetric = document.getElementById('importantMetric');
      const timeMetric = document.getElementById('timeMetric');

      const impactLabels = { 1:'매우 낮음', 2:'낮음', 3:'보통', 4:'높음', 5:'매우 높음' };

      const uniq = (arr) => [...new Set((arr || []).filter(Boolean))];
      const clamp = (v,min,max) => Math.min(max, Math.max(min, v));
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

      const parseRtoString = (rtoRaw) => {
        const s = String(rtoRaw || '').trim();
        if (!s) return { value:'', unit:'분' };
        const n = Number((s.match(/[0-9]+(?:\.[0-9]+)?/) || [])[0] || '');
        if (!Number.isFinite(n)) return { value:'', unit:'분' };
        if (s.includes('일')) return { value:n, unit:'일' };
        if (s.includes('시간')) return { value:n, unit:'시간' };
        return { value:n, unit:'분' };
      };

      const rtoToMinutes = (val, unit) => {
        const n = Number(val);
        if (!Number.isFinite(n) || n <= 0) return null;
        if (unit === '일') return n * 1440;
        if (unit === '시간') return n * 60;
        return n;
      };

      const TIME_KEYS = TIME_IMPACT_META.map((t) => t.key);

      const normalizeMonotonicTimeImpact = (timeImpact) => {
        const out = {};
        let prev = 1;
        for (const key of TIME_KEYS) {
          const now = clamp(Number(timeImpact?.[key] || 1), 1, 5);
          const fixed = Math.max(prev, now);
          out[key] = fixed;
          prev = fixed;
        }
        return out;
      };

      const enforceMonotonicFrom = (timeImpact, startIdx = 0) => {
        const out = { ...timeImpact };
        const begin = Math.max(0, startIdx);
        if (begin > 0) {
          const prevKey = TIME_KEYS[begin - 1];
          out[TIME_KEYS[begin]] = Math.max(clamp(Number(out[TIME_KEYS[begin]] || 1), 1, 5), clamp(Number(out[prevKey] || 1), 1, 5));
        }
        for (let i = begin + 1; i < TIME_KEYS.length; i++) {
          const k = TIME_KEYS[i];
          const pk = TIME_KEYS[i-1];
          const cur = clamp(Number(out[k] || 1), 1, 5);
          const prev = clamp(Number(out[pk] || 1), 1, 5);
          out[k] = Math.max(cur, prev);
        }
        return out;
      };

      const calcMtpd = (timeImpact) => {
        for (const t of TIME_IMPACT_META) {
          const score = Number(timeImpact?.[t.key] || 1);
          if (score >= 4) return { text: t.text, minutes: t.minutes };
        }
        return { text: '장기 허용', minutes: null };
      };

      const calcGrade = (fn) => {
        const mtpd = calcMtpd(fn.timeImpact);
        const impact = Number(fn.overallImpact || fn.impact || 3);
        const important = fn.importance === '중요';

        if (important && (impact >= 4 || (mtpd.minutes !== null && mtpd.minutes <= 240))) return '핵심';
        if (important && (mtpd.minutes !== null && mtpd.minutes <= 1440)) return '주요';
        return '일반';
      };

      const makeDefaultTimeImpact = (impact) => ({
        immediate: Math.max(1, impact - 2),
        min30: Math.max(1, impact - 1),
        hour1: impact,
        hour4: impact,
        day1: Math.min(5, impact + 1),
        week1: Math.min(5, impact + 1)
      });

      const normalizeFunction = (rawFn) => {
        const name = String(rawFn.name || rawFn.function || '').trim();
        const impact = clamp(Number(rawFn.impact || rawFn.overallImpact || 3), 1, 5);
        const parsedRto = rawFn.rtoValue !== undefined ? { value: rawFn.rtoValue, unit: rawFn.rtoUnit || '분' } : parseRtoString(rawFn.rto);

        const timeImpactRaw = rawFn.timeImpact || {};
        const timeImpactSeed = {};
        for (const t of TIME_IMPACT_META) {
          timeImpactSeed[t.key] = clamp(Number(timeImpactRaw[t.key] || makeDefaultTimeImpact(impact)[t.key]), 1, 5);
        }
        const timeImpact = normalizeMonotonicTimeImpact(timeImpactSeed);

        const mtpd = calcMtpd(timeImpact);
        const fn = {
          name,
          importance: rawFn.importance || (rawFn.coreFinal ? '중요' : '일반'),
          overallImpact: impact,
          impact,
          timeImpact,
          mtpd: mtpd.text,
          mtpdMinutes: mtpd.minutes,
          rtoValue: parsedRto.value === '' ? '' : Number(parsedRto.value),
          rtoUnit: parsedRto.unit || '분',
          rto: parsedRto.value === '' ? '' : `${parsedRto.value}${parsedRto.unit}`,
          rtoReason: String(rawFn.rtoReason || rawFn.rtoBasis || ''),
          grade: rawFn.grade || '일반',
          coreFinal: !!rawFn.coreFinal,
          requiredResources: Array.isArray(rawFn.requiredResources)
            ? rawFn.requiredResources.filter((r) => RESOURCE_OPTIONS.includes(r))
            : []
        };

        fn.grade = calcGrade(fn);
        fn.coreFinal = fn.grade !== '일반';
        return fn;
      };

      const loadCoreFunctions = () => {
        const raw = store.get(CORE_KEY, []);
        const rows = Array.isArray(raw) ? raw : [];
        return rows
          .map((row) => ({
            team: String(row.team || '').trim(),
            functions: uniq((row.functions || []).map((f) => typeof f === 'string' ? f : f?.name).filter(Boolean))
          }))
          .filter((row) => row.team);
      };

      const loadOrgTeams = () => {
        const org = store.get(ORG_KEY, { divisions: [] });
        return uniq((org.divisions || []).flatMap((d) => (d.teams || []).map((t) => t.name)).filter(Boolean));
      };

      const loadBiaData = () => {
        const raw = store.get(BIA_KEY, []);
        const rows = Array.isArray(raw) ? raw : (raw && raw.team ? [raw] : []);
        return rows
          .map((row) => ({
            team: String(row.team || '').trim(),
            functions: (row.functions || []).map(normalizeFunction).filter((f) => f.name)
          }))
          .filter((row) => row.team);
      };

      const saveBiaData = (rows) => {
        store.set(BIA_KEY, rows);
      };

      const ensureTeamRecord = (team, coreMap, rows) => {
        let found = rows.find((r) => r.team === team);
        const coreFns = coreMap.get(team) || [];

        if (!found) {
          found = { team, functions: coreFns.map((name) => normalizeFunction({ name })) };
          rows.push(found);
          return found;
        }

        const byName = new Map((found.functions || []).map((fn) => [fn.name, normalizeFunction(fn)]));
        found.functions = uniq([...(coreFns || []), ...(found.functions || []).map((f) => f.name)])
          .map((name) => byName.get(name) || normalizeFunction({ name }));

        return found;
      };

      const getRtoWarnText = (fn) => {
        const rtoMin = rtoToMinutes(fn.rtoValue, fn.rtoUnit);
        if (rtoMin === null || fn.mtpdMinutes === null) return '';
        if (rtoMin >= fn.mtpdMinutes) return 'RTO는 MTPD보다 짧아야 합니다. 복구목표시간이 최대허용중단시간을 초과합니다.';
        return '';
      };

      const coreRows = loadCoreFunctions();
      const orgTeams = loadOrgTeams();
      const allTeams = uniq([...coreRows.map((r) => r.team), ...orgTeams]);
      const coreMap = new Map(coreRows.map((r) => [r.team, r.functions]));
      let biaRows = loadBiaData();
      const opened = new Set();
      const scoreGuideOpened = new Set();
      const animatedCounts = new Map();

      teamSelect.innerHTML = allTeams.length
        ? allTeams.map((team) => `<option value="${esc(team)}">${esc(team)}</option>`).join('')
        : '<option value="">등록된 팀이 없습니다</option>';


      const toDurationText = (mins) => {
        if (mins === null || mins === undefined) return '-';
        if (mins >= 1440 && mins % 1440 === 0) return `${mins/1440}일`;
        if (mins >= 60 && mins % 60 === 0) return `${mins/60}시간`;
        return `${mins}분`;
      };

      const scoreGuideTemplate = () => `
        <div class="scoreGuideInline" aria-label="영향평가 점수 기준">
          <h3>영향평가 점수 기준</h3>
          <div class="scoreGuideGrid">
            <article class="scoreItem"><div class="n">1 경미함</div><ul><li>서비스 영향 거의 없음</li><li>내부 처리 가능</li><li>대외 영향 없음</li></ul></article>
            <article class="scoreItem"><div class="n">2 작음</div><ul><li>일부 영향 있으나 대부분 수용 가능</li><li>평판/재무 영향 거의 없음</li></ul></article>
            <article class="scoreItem"><div class="n">3 보통</div><ul><li>고객 불편 또는 민원 가능</li><li>제한적 평판 영향</li><li>감내 가능한 재무 영향</li></ul></article>
            <article class="scoreItem"><div class="n">4 큼</div><ul><li>서비스 중단 영향이 큼</li><li>계약/법규/평판 영향 우려</li><li>복구 지연 시 수용 어려움</li></ul></article>
            <article class="scoreItem"><div class="n">5 매우 큼</div><ul><li>핵심 서비스 지속 불가 수준</li><li>중대한 대외 영향</li><li>즉시 복구 필요 수준</li></ul></article>
          </div>
        </div>`;

      const animateCount = (el, target) => {
        const next = Number(target || 0);
        const prev = animatedCounts.get(el.id);
        if (prev === next) return;
        animatedCounts.set(el.id, next);
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          el.textContent = String(next.toLocaleString('ko-KR'));
          return;
        }
        const duration = 450;
        const start = performance.now();
        const from = Number(el.dataset.last || 0);
        const step = (now) => {
          const progress = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - progress, 3);
          const value = Math.round(from + (next - from) * eased);
          el.textContent = value.toLocaleString('ko-KR');
          if (progress < 1) requestAnimationFrame(step);
          else el.dataset.last = String(next);
        };
        requestAnimationFrame(step);
      };

      const computeGlobalMetrics = () => {
        const teamCount = allTeams.length;
        const allFunctions = biaRows.flatMap((r) => r.functions || []);
        const coreCount = allFunctions.length;
        const importantCount = allFunctions.filter((fn) => fn.importance === '중요' || fn.coreFinal).length;
        const biaCount = coreCount;
        return { teamCount, coreCount, importantCount, biaCount };
      };

      const computeOverviewRows = () => allTeams.map((team) => {
        const row = ensureTeamRecord(team, coreMap, biaRows);
        const functions = row.functions || [];
        const impacts = functions.filter((fn) => Number(fn.overallImpact || 0) >= 4).length;
        const mtpd = functions.map((fn) => fn.mtpdMinutes).filter((n) => Number.isFinite(n));
        const rto = functions.map((fn) => rtoToMinutes(fn.rtoValue, fn.rtoUnit)).filter((n) => Number.isFinite(n));
        return {
          team,
          coreCount: functions.length,
          importantCount: functions.filter((fn) => fn.importance === '중요' || fn.coreFinal).length,
          minMtpd: mtpd.length ? Math.min(...mtpd) : null,
          minRto: rto.length ? Math.min(...rto) : null,
          highImpact: impacts
        };
      });

      const renderGlobalMetrics = () => {
        const m = computeGlobalMetrics();
        globalKpi.innerHTML = `
          <article class="kpiCard"><div class="k">전체 부서 수</div><div class="v" id="kpiTeamCount">0</div></article>
          <article class="kpiCard"><div class="k">전체 핵심업무 수</div><div class="v" id="kpiCoreCount">0</div></article>
          <article class="kpiCard"><div class="k">전체 중요업무 수</div><div class="v" id="kpiImportantCount">0</div></article>
          <article class="kpiCard"><div class="k">전체 BIA 등록 업무 수</div><div class="v" id="kpiBiaCount">0</div></article>`;
        animateCount(document.getElementById('kpiTeamCount'), m.teamCount);
        animateCount(document.getElementById('kpiCoreCount'), m.coreCount);
        animateCount(document.getElementById('kpiImportantCount'), m.importantCount);
        animateCount(document.getElementById('kpiBiaCount'), m.biaCount);
      };

      const renderOverviewTable = () => {
        const selectedFilter = overviewTeamFilter.value || '전체';
        const sortBy = overviewSort.value || 'name';
        let rows = computeOverviewRows();
        if (selectedFilter !== '전체') rows = rows.filter((r) => r.team === selectedFilter);
        rows.sort((a,b) => {
          if (sortBy === 'coreDesc') return b.coreCount - a.coreCount || a.team.localeCompare(b.team, 'ko');
          if (sortBy === 'importantDesc') return b.importantCount - a.importantCount || a.team.localeCompare(b.team, 'ko');
          if (sortBy === 'rtoAsc') {
            const ar = a.minRto ?? Number.MAX_SAFE_INTEGER;
            const br = b.minRto ?? Number.MAX_SAFE_INTEGER;
            return ar - br || a.team.localeCompare(b.team, 'ko');
          }
          return a.team.localeCompare(b.team, 'ko');
        });
        overviewTableMount.innerHTML = rows.length ? `
          <table class="overviewTable">
            <thead><tr><th>부서명</th><th>핵심업무 수</th><th>중요업무 수</th><th>최단 MTPD</th><th>최단 RTO</th><th>고영향 업무 수(4↑)</th><th>관리</th></tr></thead>
            <tbody>
              ${rows.map((r) => `
                <tr class="clickRow" data-jump-team="${esc(r.team)}">
                  <td>${esc(r.team)}</td><td>${r.coreCount}</td><td>${r.importantCount}</td><td>${toDurationText(r.minMtpd)}</td><td>${toDurationText(r.minRto)}</td><td>${r.highImpact}</td>
                  <td><button class="btn" type="button" data-jump-team="${esc(r.team)}">상세 편집 보기</button></td>
                </tr>`).join('')}
            </tbody>
          </table>` : '<div class="empty">표시할 팀 데이터가 없습니다.</div>';
      };

      const renderOverviewFilters = () => {
        const teamOpts = ['전체', ...allTeams];
        const prev = overviewTeamFilter.value || '전체';
        overviewTeamFilter.innerHTML = teamOpts.map((t) => `<option value="${esc(t)}" ${prev===t?'selected':''}>${esc(t)}</option>`).join('');
      };

      const renderSummary = (team, functions) => {
        teamMetric.textContent = team || '-';
        countMetric.textContent = String(functions.length);
        importantMetric.textContent = String(functions.filter((f) => f.importance === '중요').length);

        const mtpdMinutes = functions.map((f) => f.mtpdMinutes).filter((v) => v !== null);
        const rtoMinutes = functions.map((f) => rtoToMinutes(f.rtoValue, f.rtoUnit)).filter((v) => v !== null);
        const minMtpd = mtpdMinutes.length ? Math.min(...mtpdMinutes) : null;
        const minRto = rtoMinutes.length ? Math.min(...rtoMinutes) : null;

        const mtpdText = minMtpd === null ? '-' : `${minMtpd >= 60 && minMtpd % 60 === 0 ? `${minMtpd/60}시간` : `${minMtpd}분`}`;
        const rtoText = minRto === null ? '-' : `${minRto >= 60 && minRto % 60 === 0 ? `${minRto/60}시간` : `${minRto}분`}`;
        timeMetric.textContent = `${mtpdText} / ${rtoText}`;
      };

      const render = () => {
        renderGlobalMetrics();
        renderOverviewFilters();
        renderOverviewTable();

        const team = teamSelect.value;
        if (!team) {
          tableMount.innerHTML = '<div class="empty">선택 가능한 팀이 없습니다. 조직 관리 또는 핵심업무 레지스트리를 먼저 확인해 주세요.</div>';
          renderSummary('', []);
          return;
        }

        const row = ensureTeamRecord(team, coreMap, biaRows);
        const functions = row.functions || [];
        renderSummary(team, functions);

        if (!functions.length) {
          tableMount.innerHTML = '<div class="empty">해당 팀의 핵심업무가 없습니다. 아래에서 업무를 추가해 주세요.</div>';
          return;
        }

        tableMount.innerHTML = `
          <table>
            <thead>
              <tr>
                <th style="width:24%;">핵심업무</th>
                <th style="width:11%;">중요업무 여부</th>
                <th style="width:11%;">종합 영향도</th>
                <th style="width:11%;">MTPD</th>
                <th style="width:16%;">RTO</th>
                <th style="width:10%;">업무등급</th>
                <th style="width:17%;">관리</th>
              </tr>
            </thead>
            <tbody>
              ${functions.map((fn, idx) => {
                const key = `${team}__${fn.name}__${idx}`;
                const open = opened.has(key);
                const warn = getRtoWarnText(fn);
                return `
                  <tr data-idx="${idx}">
                    <td>
                      <div class="functionName">${esc(fn.name)}</div>
                      <div class="muted">팀: ${esc(team)}</div>
                    </td>
                    <td>
                      <select class="smallSelect" data-field="importance">
                        <option value="중요" ${fn.importance === '중요' ? 'selected' : ''}>중요</option>
                        <option value="일반" ${fn.importance === '일반' ? 'selected' : ''}>일반</option>
                      </select>
                    </td>
                    <td>
                      <select class="smallSelect" data-field="overallImpact">
                        ${[1,2,3,4,5].map((n)=>`<option value="${n}" ${Number(fn.overallImpact)===n?'selected':''}>${n} ${impactLabels[n]}</option>`).join('')}
                      </select>
                    </td>
                    <td><span class="tag">${esc(fn.mtpd || '장기 허용')}</span></td>
                    <td>
                      <div class="rtoWrap">
                        <input class="smallInput" type="number" min="1" step="1" data-field="rtoValue" value="${fn.rtoValue ?? ''}" placeholder="수치"/>
                        <select class="smallSelect" data-field="rtoUnit">
                          <option value="분" ${fn.rtoUnit === '분' ? 'selected' : ''}>분</option>
                          <option value="시간" ${fn.rtoUnit === '시간' ? 'selected' : ''}>시간</option>
                          <option value="일" ${fn.rtoUnit === '일' ? 'selected' : ''}>일</option>
                        </select>
                      </div>
                    </td>
                    <td><span class="tag g-${fn.grade}">${fn.grade}</span></td>
                    <td>
                      <button class="btn" type="button" data-toggle="${idx}">${open ? '상세 닫기' : '상세 보기'}</button>
                      <button class="btn" type="button" data-delete="${idx}" style="margin-left:6px;">삭제</button>
                    </td>
                  </tr>
                  ${open ? `
                    <tr class="detailRow" data-detail-for="${idx}">
                      <td colspan="7">
                        <div class="detailCard">
                          <div class="detailGrid">
                            <div>
                              <h4 class="subTitle">시간경과 영향평가</h4>
                              <div class="timeGrid">
                                ${TIME_IMPACT_META.map((t, ti) => `
                                  <div class="timeItem">
                                    <label>${t.label}</label>
                                    <select class="smallSelect" data-time-impact="${t.key}" data-idx="${idx}">
                                      ${[1,2,3,4,5].map((n)=>{
                                        const minAllowed = ti===0 ? 1 : Number(fn.timeImpact?.[TIME_KEYS[ti-1]] || 1);
                                        return `<option value="${n}" ${Number(fn.timeImpact?.[t.key])===n?'selected':''} ${n<minAllowed?'disabled':''}>${n} ${impactLabels[n]}</option>`;
                                      }).join('')}
                                    </select>
                                  </div>
                                `).join('')}
                              </div>
                              <button class="btn" type="button" data-guide-toggle="${idx}" style="margin-top:8px;">${scoreGuideOpened.has(key) ? '영향도 기준 닫기' : '영향도 기준 보기'}</button>
                              ${scoreGuideOpened.has(key) ? scoreGuideTemplate() : ''}
                              <div class="miniHelp">- 시간이 경과할수록 영향도는 낮아질 수 없습니다.<br/>- 뒤 시점의 영향도는 앞 시점 이상으로만 설정됩니다.<br/>- 영향도 4 이상이 처음 나타나는 시점을 최대허용중단시간(MTPD)으로 계산합니다.</div>
                              <div class="muted" style="margin-top:8px;">최대허용중단시간(MTPD): <b>${esc(fn.mtpd || '장기 허용')}</b></div>
                            </div>
                            <div>
                              <h4 class="subTitle">RTO 설정 근거</h4>
                              <textarea class="reasonInput" data-field="rtoReason" data-idx="${idx}" placeholder="고객 영향과 서비스 중단 허용시간을 반영\n대체 운영 가능시간 기준\n규제/계약 요구사항 반영">${esc(fn.rtoReason || '')}</textarea>

                              <h4 class="subTitle" style="margin-top:10px;">복구 필요자원(요약)</h4>
                              <div class="resourceGrid">
                                ${RESOURCE_OPTIONS.map((r) => `
                                  <label class="resourceItem">
                                    <input type="checkbox" data-resource="${r}" data-idx="${idx}" ${fn.requiredResources.includes(r) ? 'checked' : ''}/>
                                    <span>${r}</span>
                                  </label>
                                `).join('')}
                              </div>
                            </div>
                          </div>
                          ${warn ? `<div class="warn">${warn}</div>` : ''}
                        </div>
                      </td>
                    </tr>
                  ` : ''}
                `;
              }).join('')}
            </tbody>
          </table>
        `;
      };

      const recalcFunction = (fn) => {
        fn.overallImpact = clamp(Number(fn.overallImpact || 3), 1, 5);
        fn.impact = fn.overallImpact; // Risk 호환 alias
        fn.timeImpact = normalizeMonotonicTimeImpact(fn.timeImpact || {});
        const mtpd = calcMtpd(fn.timeImpact || {});
        fn.mtpd = mtpd.text;
        fn.mtpdMinutes = mtpd.minutes;
        fn.rto = (fn.rtoValue || fn.rtoValue === 0) && fn.rtoValue !== '' ? `${fn.rtoValue}${fn.rtoUnit || '분'}` : '';
        fn.grade = calcGrade(fn);
        fn.coreFinal = fn.grade !== '일반';
      };

      const renderSummaryOnly = () => {
        const team = teamSelect.value;
        if (!team) return;
        const row = ensureTeamRecord(team, coreMap, biaRows);
        renderSummary(team, row.functions || []);
      };


      const refreshTimeImpactControls = (idx) => {
        const team = teamSelect.value;
        const row = ensureTeamRecord(team, coreMap, biaRows);
        const fn = row.functions[idx];
        if (!fn) return;

        const detail = tableMount.querySelector(`tr[data-detail-for="${idx}"]`);
        if (!detail) return;

        const selects = detail.querySelectorAll('select[data-time-impact]');
        selects.forEach((sel, i) => {
          const key = sel.getAttribute('data-time-impact');
          const minAllowed = i === 0 ? 1 : Number(fn.timeImpact[TIME_KEYS[i-1]] || 1);
          sel.value = String(fn.timeImpact[key] || minAllowed);
          [...sel.options].forEach((op) => {
            const n = Number(op.value);
            op.disabled = n < minAllowed;
          });
        });
      };

      const refreshRowCells = (idx) => {
        const team = teamSelect.value;
        const row = ensureTeamRecord(team, coreMap, biaRows);
        const fn = row.functions[idx];
        if (!fn) return;

        const tr = tableMount.querySelector(`tr[data-idx="${idx}"]`);
        if (!tr) return;

        const mtpdTag = tr.children[3]?.querySelector('.tag');
        const gradeTag = tr.children[5]?.querySelector('.tag');
        if (mtpdTag) mtpdTag.textContent = fn.mtpd || '장기 허용';
        if (gradeTag) {
          gradeTag.textContent = fn.grade;
          gradeTag.className = `tag g-${fn.grade}`;
        }

        const detail = tableMount.querySelector(`tr[data-detail-for="${idx}"]`);
        if (detail) {
          const mtpdText = detail.querySelector('.muted b');
          if (mtpdText) mtpdText.textContent = fn.mtpd || '장기 허용';

          const warnText = getRtoWarnText(fn);
          let warnEl = detail.querySelector('.warn');
          if (warnText) {
            if (!warnEl) {
              warnEl = document.createElement('div');
              warnEl.className = 'warn';
              detail.querySelector('.detailCard')?.appendChild(warnEl);
            }
            warnEl.textContent = warnText;
          } else if (warnEl) {
            warnEl.remove();
          }
        }
      };

      const updateFnField = (idx, field, value, opts = {}) => {
        const team = teamSelect.value;
        const row = ensureTeamRecord(team, coreMap, biaRows);
        const fn = row.functions[idx];
        if (!fn) return;

        if (field === 'importance') fn.importance = value === '중요' ? '중요' : '일반';
        if (field === 'overallImpact') fn.overallImpact = clamp(Number(value || 3), 1, 5);
        if (field === 'rtoValue') fn.rtoValue = value === '' ? '' : Number(value);
        if (field === 'rtoUnit') fn.rtoUnit = value;
        if (field === 'rtoReason') fn.rtoReason = String(value || '');

        recalcFunction(fn);
        if (!opts.skipUiUpdate) {
          refreshRowCells(idx);
          renderSummaryOnly();
        }
      };

      let normalizedChanged = false;
      biaRows.forEach((row) => {
        row.functions = (row.functions || []).map((fn) => {
          const before = JSON.stringify(fn.timeImpact || {});
          recalcFunction(fn);
          const after = JSON.stringify(fn.timeImpact || {});
          if (before !== after) normalizedChanged = true;
          return fn;
        });
      });
      if (normalizedChanged) saveBiaData(biaRows);

      teamSelect.addEventListener('change', () => render());
      overviewTeamFilter.addEventListener('change', () => renderOverviewTable());
      overviewSort.addEventListener('change', () => renderOverviewTable());

      overviewTableMount.addEventListener('click', (e) => {
        const team = e.target.closest('[data-jump-team]')?.getAttribute('data-jump-team');
        if (!team) return;
        teamSelect.value = team;
        render();
        detailEditor.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      });

      tableMount.addEventListener('change', (e) => {
        const tr = e.target.closest('tr[data-idx]');
        const idx = tr ? Number(tr.dataset.idx) : Number(e.target.getAttribute('data-idx'));

        if (e.target.hasAttribute('data-field')) {
          updateFnField(idx, e.target.getAttribute('data-field'), e.target.value);
          return;
        }

        const tKey = e.target.getAttribute('data-time-impact');
        if (tKey) {
          const team = teamSelect.value;
          const row = ensureTeamRecord(team, coreMap, biaRows);
          const fn = row.functions[idx];
          if (!fn) return;
            const tIndex = TIME_KEYS.indexOf(tKey);
          fn.timeImpact[tKey] = clamp(Number(e.target.value || 1), 1, 5);
          fn.timeImpact = enforceMonotonicFrom(fn.timeImpact, tIndex);
          recalcFunction(fn);
          refreshTimeImpactControls(idx);
          refreshRowCells(idx);
          renderSummaryOnly();
          return;
        }

        const res = e.target.getAttribute('data-resource');
        if (res) {
          const team = teamSelect.value;
          const row = ensureTeamRecord(team, coreMap, biaRows);
          const fn = row.functions[idx];
          if (!fn) return;
          const set = new Set(fn.requiredResources || []);
          if (e.target.checked) set.add(res);
          else set.delete(res);
          fn.requiredResources = [...set];
        }
      });

      tableMount.addEventListener('input', (e) => {
        const field = e.target.getAttribute('data-field');
        if (field !== 'rtoValue' && field !== 'rtoReason') return;
        const tr = e.target.closest('tr[data-idx]');
        const idx = tr ? Number(tr.dataset.idx) : Number(e.target.getAttribute('data-idx'));
        if (!Number.isFinite(idx)) return;
        updateFnField(idx, field, e.target.value);
      });



      tableMount.addEventListener('click', (e) => {
        const guideIdx = e.target.getAttribute('data-guide-toggle');
        if (guideIdx != null) {
          const team = teamSelect.value;
          const row = ensureTeamRecord(team, coreMap, biaRows);
          const fn = row.functions[Number(guideIdx)];
          if (!fn) return;
          const key = `${team}__${fn.name}__${guideIdx}`;
          if (scoreGuideOpened.has(key)) scoreGuideOpened.delete(key);
          else scoreGuideOpened.add(key);
          render();
          return;
        }

        const toggleIdx = e.target.getAttribute('data-toggle');
        if (toggleIdx != null) {
          const team = teamSelect.value;
          const row = ensureTeamRecord(team, coreMap, biaRows);
          const fn = row.functions[Number(toggleIdx)];
          if (!fn) return;
          const key = `${team}__${fn.name}__${toggleIdx}`;
          if (opened.has(key)) opened.delete(key);
          else opened.add(key);
          render();
          return;
        }

        const del = e.target.getAttribute('data-delete');
        if (del == null) return;
        const team = teamSelect.value;
        const row = ensureTeamRecord(team, coreMap, biaRows);
        row.functions.splice(Number(del), 1);
        render();
      });

      addFunctionBtn.addEventListener('click', () => {
        const team = teamSelect.value;
        const name = String(newFunctionName.value || '').trim();
        if (!team || !name) return;

        const row = ensureTeamRecord(team, coreMap, biaRows);
        if (row.functions.some((fn) => fn.name === name)) {
          alert('이미 등록된 핵심업무입니다.');
          return;
        }
        row.functions.push(normalizeFunction({ name }));
        newFunctionName.value = '';
        render();
      });

      saveBtn.addEventListener('click', () => {
        biaRows = biaRows
          .map((row) => ({
            team: row.team,
            functions: (row.functions || []).map((fn) => {
              recalcFunction(fn);
              return {
                name: fn.name,
                importance: fn.importance,
                overallImpact: fn.overallImpact,
                impact: fn.impact,
                timeImpact: {
                  immediate: Number(fn.timeImpact?.immediate || 1),
                  min30: Number(fn.timeImpact?.min30 || 1),
                  hour1: Number(fn.timeImpact?.hour1 || 1),
                  hour4: Number(fn.timeImpact?.hour4 || 1),
                  day1: Number(fn.timeImpact?.day1 || 1),
                  week1: Number(fn.timeImpact?.week1 || 1)
                },
                mtpd: fn.mtpd,
                mtpdMinutes: fn.mtpdMinutes,
                rtoValue: fn.rtoValue === '' ? '' : Number(fn.rtoValue),
                rtoUnit: fn.rtoUnit || '분',
                rto: fn.rto || '',
                rtoReason: String(fn.rtoReason || ''),
                grade: fn.grade,
                coreFinal: !!fn.coreFinal,
                requiredResources: Array.isArray(fn.requiredResources) ? fn.requiredResources.filter((r)=>RESOURCE_OPTIONS.includes(r)) : []
              };
            }).filter((fn) => fn.name)
          }))
          .filter((row) => row.team);

        saveBiaData(biaRows);
        alert('BIA 데이터가 저장되었습니다.');
        render();
      });

      resetBtn.addEventListener('click', () => {
        const team = teamSelect.value;
        if (!team) return;
        const row = ensureTeamRecord(team, coreMap, biaRows);
        row.functions = (coreMap.get(team) || []).map((name) => normalizeFunction({ name }));
        render();
      });

      render();
    })();
  </script>
</body>
</html>
