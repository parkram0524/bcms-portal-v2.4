<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>BIA (업무영향분석) | BCMS Portal v2</title>
  <link rel="stylesheet" href="../assets/style.css"/>
  <style>
    .wrap{ max-width:1320px; margin:0 auto; }
    .hero h1{ margin:0; font-size:24px; font-weight:950; }
    .hero p{ margin:8px 0 0; font-size:16px; color:rgba(15,23,42,.66); line-height:1.65; }

    .panel{ margin-top:14px; border:1px solid rgba(15,23,42,.1); border-radius:14px; background:#fff; padding:14px; }
    .row{ display:grid; grid-template-columns:1fr 220px auto; gap:10px; align-items:end; }
    .row label{ font-size:14px; font-weight:800; color:#334155; display:block; margin-bottom:6px; }
    .row select, .row input{ width:100%; padding:10px 12px; font-size:16px; }

    .btn{ border:1px solid rgba(15,23,42,.15); border-radius:10px; background:#fff; color:#0f172a; padding:9px 12px; font-size:14px; font-weight:900; cursor:pointer; }
    .btn:hover{ background:rgba(15,23,42,.04); }
    .btn.primary{ border-color:rgba(37,99,235,.35); background:rgba(37,99,235,.08); color:#1d4ed8; }

    .summaryGrid{ margin-top:12px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .metric{ border:1px solid rgba(15,23,42,.1); border-radius:12px; background:#fff; padding:11px; }
    .metric .k{ font-size:14px; color:rgba(15,23,42,.62); font-weight:800; }
    .metric .v{ margin-top:7px; font-size:24px; font-weight:950; }

    .tableWrap{ margin-top:12px; overflow:auto; }
    table{ width:100%; min-width:900px; border-collapse:separate; border-spacing:0; border:1px solid rgba(15,23,42,.1); border-radius:12px; overflow:hidden; }
    th, td{ padding:10px 10px; font-size:16px; border-bottom:1px solid rgba(15,23,42,.08); vertical-align:middle; }
    th{ background:#f8fafc; font-size:14px; font-weight:900; text-align:left; color:#334155; }
    tr:last-child td{ border-bottom:none; }

    .functionName{ font-size:16px; font-weight:800; }
    .muted{ font-size:14px; color:rgba(15,23,42,.62); }

    .rtoRow{ display:flex; gap:8px; }
    .rtoRow input{ width:90px; }

    .impactSelect, .rtoUnit{ font-size:15px; }
    .priorityBadge{ display:inline-flex; align-items:center; border-radius:999px; padding:4px 9px; border:1px solid; font-size:12px; font-weight:900; }
    .p-상{ color:#991b1b; background:rgba(239,68,68,.12); border-color:rgba(239,68,68,.35); }
    .p-중{ color:#92400e; background:rgba(245,158,11,.14); border-color:rgba(245,158,11,.35); }
    .p-하{ color:#166534; background:rgba(34,197,94,.12); border-color:rgba(34,197,94,.35); }

    .empty{ margin-top:12px; border:1px dashed rgba(148,163,184,.42); border-radius:12px; background:#f8fafc; color:#64748b; padding:14px; font-size:15px; }

    @media (max-width:960px){ .row{ grid-template-columns:1fr; } .summaryGrid{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <aside id="sidebarMount"></aside>
  <main class="main">
    <div class="wrap">
      <section class="hero">
        <h1>BIA (업무영향분석)</h1>
        <p>팀을 선택하면 핵심업무 레지스트리의 업무가 자동 표시됩니다. 각 업무별 RTO와 영향도를 입력해 우선순위를 관리하세요.</p>
      </section>

      <section class="panel">
        <div class="row">
          <div>
            <label for="teamSelect">팀 선택</label>
            <select id="teamSelect"></select>
          </div>
          <div>
            <label for="newFunctionName">핵심업무 추가</label>
            <input id="newFunctionName" type="text" placeholder="예: 전력 장애 원인 분석"/>
          </div>
          <button id="addFunctionBtn" class="btn" type="button">업무 추가</button>
        </div>

        <div class="summaryGrid">
          <article class="metric"><div class="k">선택 팀</div><div class="v" id="teamMetric">-</div></article>
          <article class="metric"><div class="k">핵심업무 수</div><div class="v" id="countMetric">0</div></article>
          <article class="metric"><div class="k">MBCO(단순)</div><div class="v" id="mbcoMetric">-</div></article>
        </div>

        <div id="tableMount" class="tableWrap"></div>
        <div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;">
          <button id="saveBtn" class="btn primary" type="button">저장</button>
          <button id="resetBtn" class="btn" type="button">선택 팀 초기화</button>
        </div>
      </section>
    </div>
  </main>

  <script src="../assets/sidebar.js"></script>
  <script src="../assets/data-store.js"></script>
  <script>
    (() => {
      const CORE_KEY = 'bcmsCoreFunctions';
      const BIA_KEY = 'bcmsBIAData';
      const ORG_KEY = (window.DataStore && DataStore.KEY_ORG_REGISTRY) || 'bcms_org_registry_v1';

      const store = (window.DataStore && DataStore.get && DataStore.set) ? DataStore : {
        get: (k, f) => { try { const raw = localStorage.getItem(k); return raw ? JSON.parse(raw) : f; } catch { return f; } },
        set: (k, v) => localStorage.setItem(k, JSON.stringify(v))
      };

      const teamSelect = document.getElementById('teamSelect');
      const newFunctionName = document.getElementById('newFunctionName');
      const addFunctionBtn = document.getElementById('addFunctionBtn');
      const tableMount = document.getElementById('tableMount');
      const saveBtn = document.getElementById('saveBtn');
      const resetBtn = document.getElementById('resetBtn');
      const teamMetric = document.getElementById('teamMetric');
      const countMetric = document.getElementById('countMetric');
      const mbcoMetric = document.getElementById('mbcoMetric');

      const impactLabels = {
        1: '매우 낮음',
        2: '낮음',
        3: '보통',
        4: '높음',
        5: '매우 높음'
      };
      const uniq = (arr) => [...new Set((arr || []).filter(Boolean))];

      const loadCoreFunctions = () => {
        const rows = store.get(CORE_KEY, []);
        return Array.isArray(rows)
          ? rows.map((row) => ({ team: String(row.team || '').trim(), functions: uniq((row.functions || []).map((v) => String(v || '').trim()).filter(Boolean)) })).filter((row) => row.team)
          : [];
      };

      const loadOrgTeams = () => {
        const org = store.get(ORG_KEY, { divisions: [] });
        const names = (org.divisions || []).flatMap((division) => (division.teams || []).map((team) => team.name));
        return uniq(names.map((v) => String(v || '').trim()).filter(Boolean));
      };

      const loadBiaData = () => {
        const raw = store.get(BIA_KEY, []);
        if (Array.isArray(raw)) return raw;
        if (raw && typeof raw === 'object' && raw.team) return [raw];
        return [];
      };
      const saveBiaData = (rows) => store.set(BIA_KEY, rows);

      const parseRtoMinutes = (rtoValue, rtoUnit) => {
        const v = Number(rtoValue || 0);
        if (!Number.isFinite(v) || v <= 0) return 0;
        if (rtoUnit === '시간') return v * 60;
        if (rtoUnit === '일') return v * 1440;
        return v;
      };

      const calcPriority = (impact, rtoValue, rtoUnit) => {
        const score = Number(impact || 1) * 10 + Math.max(1, parseRtoMinutes(rtoValue, rtoUnit) / 30);
        if (score >= 45) return '상';
        if (score >= 25) return '중';
        return '하';
      };

      const calcMBCO = (functions) => {
        if (!functions.length) return '-';
        const highest = functions.reduce((max, fn) => Math.max(max, Number(fn.impact || 0)), 0);
        if (highest >= 5) return '즉시 복구 필요';
        if (highest >= 4) return '우선 복구 대상';
        if (highest >= 3) return '중요 복구 대상';
        return '일반 복구 대상';
      };

      const ensureTeamRecord = (team, coreMap, biaRows) => {
        const found = biaRows.find((row) => row.team === team);
        const defaults = (coreMap.get(team) || []).map((name) => ({
          name,
          rtoValue: '',
          rtoUnit: '시간',
          rto: '',
          impact: 3,
          priority: '중'
        }));

        if (found) {
          const existing = new Map((found.functions || []).map((f) => [f.name, f]));
          found.functions = uniq([...(coreMap.get(team) || []), ...(found.functions || []).map((f) => f.name)])
            .map((name) => {
              const old = existing.get(name);
              return old
                ? {
                    ...old,
                    rtoValue: old.rtoValue || '',
                    rtoUnit: old.rtoUnit || '시간',
                    impact: Number(old.impact || 3),
                    priority: calcPriority(old.impact || 3, old.rtoValue || '', old.rtoUnit || '시간'),
                    rto: `${old.rtoValue || ''}${old.rtoUnit || ''}`
                  }
                : { name, rtoValue: '', rtoUnit: '시간', rto: '', impact: 3, priority: '중' };
            });
          return found;
        }

        const row = { team, functions: defaults };
        biaRows.push(row);
        return row;
      };

      const coreRows = loadCoreFunctions();
      const orgTeams = loadOrgTeams();
      const allTeams = uniq([...coreRows.map((row) => row.team), ...orgTeams]);
      const coreMap = new Map(coreRows.map((row) => [row.team, row.functions]));
      let biaRows = loadBiaData();

      if (!allTeams.length) {
        teamSelect.innerHTML = '<option value="">등록된 팀이 없습니다</option>';
      } else {
        teamSelect.innerHTML = allTeams.map((team) => `<option value="${team}">${team}</option>`).join('');
      }

      const render = () => {
        const team = teamSelect.value;
        if (!team) {
          tableMount.innerHTML = '<div class="empty">선택 가능한 팀이 없습니다. 조직 관리 또는 핵심업무 레지스트리를 먼저 확인해 주세요.</div>';
          teamMetric.textContent = '-';
          countMetric.textContent = '0';
          mbcoMetric.textContent = '-';
          return;
        }

        const row = ensureTeamRecord(team, coreMap, biaRows);
        const functions = row.functions || [];

        teamMetric.textContent = team;
        countMetric.textContent = String(functions.length);
        mbcoMetric.textContent = calcMBCO(functions);

        if (!functions.length) {
          tableMount.innerHTML = '<div class="empty">해당 팀의 핵심업무가 없습니다. 상단에서 업무를 추가해 주세요.</div>';
          return;
        }

        tableMount.innerHTML = `
          <table>
            <thead>
              <tr>
                <th style="width:36%;">핵심업무</th>
                <th style="width:24%;">RTO</th>
                <th style="width:18%;">영향도</th>
                <th style="width:12%;">우선순위</th>
                <th style="width:10%;">관리</th>
              </tr>
            </thead>
            <tbody>
              ${functions.map((fn, idx) => `
                <tr data-idx="${idx}">
                  <td>
                    <div class="functionName">${fn.name}</div>
                    <div class="muted">팀 식별: ${team}</div>
                  </td>
                  <td>
                    <div class="rtoRow">
                      <input type="number" min="1" step="1" data-field="rtoValue" value="${fn.rtoValue || ''}" placeholder="수치"/>
                      <select class="rtoUnit" data-field="rtoUnit">
                        <option ${fn.rtoUnit === '분' ? 'selected' : ''}>분</option>
                        <option ${fn.rtoUnit === '시간' ? 'selected' : ''}>시간</option>
                        <option ${fn.rtoUnit === '일' ? 'selected' : ''}>일</option>
                      </select>
                    </div>
                  </td>
                  <td>
                    <select class="impactSelect" data-field="impact">
                      ${[1,2,3,4,5].map((n) => `<option value="${n}" ${Number(fn.impact || 3) === n ? 'selected' : ''}>${n} ${impactLabels[n]}</option>`).join('')}
                    </select>
                  </td>
                  <td><span class="priorityBadge p-${fn.priority || '중'}">${fn.priority || '중'}</span></td>
                  <td><button class="btn" type="button" data-delete="${idx}">삭제</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      };

      const updateFunction = (idx, field, value) => {
        const team = teamSelect.value;
        const row = ensureTeamRecord(team, coreMap, biaRows);
        const fn = row.functions[idx];
        if (!fn) return;

        if (field === 'impact') fn.impact = Number(value || 3);
        if (field === 'rtoValue') fn.rtoValue = String(value || '');
        if (field === 'rtoUnit') fn.rtoUnit = value;

        fn.rto = `${fn.rtoValue || ''}${fn.rtoUnit || ''}`;
        fn.priority = calcPriority(fn.impact, fn.rtoValue, fn.rtoUnit);
        render();
      };

      teamSelect.addEventListener('change', render);

      tableMount.addEventListener('input', (e) => {
        const tr = e.target.closest('tr[data-idx]');
        if (!tr) return;
        const idx = Number(tr.dataset.idx);
        const field = e.target.getAttribute('data-field');
        if (!field) return;
        updateFunction(idx, field, e.target.value);
      });

      tableMount.addEventListener('change', (e) => {
        const tr = e.target.closest('tr[data-idx]');
        if (!tr) return;
        const idx = Number(tr.dataset.idx);
        const field = e.target.getAttribute('data-field');
        if (!field) return;
        updateFunction(idx, field, e.target.value);
      });

      tableMount.addEventListener('click', (e) => {
        const deleteIdx = e.target.getAttribute('data-delete');
        if (deleteIdx == null) return;
        const team = teamSelect.value;
        const row = ensureTeamRecord(team, coreMap, biaRows);
        row.functions.splice(Number(deleteIdx), 1);
        render();
      });

      addFunctionBtn.addEventListener('click', () => {
        const team = teamSelect.value;
        const name = String(newFunctionName.value || '').trim();
        if (!team || !name) return;

        const row = ensureTeamRecord(team, coreMap, biaRows);
        if (row.functions.some((fn) => fn.name === name)) {
          alert('이미 등록된 핵심업무입니다.');
          return;
        }
        row.functions.push({ name, rtoValue: '', rtoUnit: '시간', rto: '', impact: 3, priority: '중' });
        newFunctionName.value = '';
        render();
      });

      saveBtn.addEventListener('click', () => {
        biaRows = biaRows.map((row) => ({
          team: row.team,
          functions: (row.functions || []).map((fn) => ({
            name: fn.name,
            rtoValue: fn.rtoValue || '',
            rtoUnit: fn.rtoUnit || '시간',
            rto: `${fn.rtoValue || ''}${fn.rtoUnit || ''}`,
            impact: Number(fn.impact || 3),
            priority: calcPriority(Number(fn.impact || 3), fn.rtoValue || '', fn.rtoUnit || '시간')
          }))
        })).filter((row) => row.team);
        saveBiaData(biaRows);
        alert('BIA 데이터가 저장되었습니다.');
        render();
      });

      resetBtn.addEventListener('click', () => {
        const team = teamSelect.value;
        if (!team) return;
        const row = ensureTeamRecord(team, coreMap, biaRows);
        row.functions = (coreMap.get(team) || []).map((name) => ({ name, rtoValue: '', rtoUnit: '시간', rto: '', impact: 3, priority: '중' }));
        render();
      });

      render();
    })();
  </script>
</body>
</html>
