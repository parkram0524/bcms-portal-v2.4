<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>BCMS Portal - 핵심업무 레지스트리</title>
  <link rel="stylesheet" href="../assets/style.css"/>
  <style>
    .wrap{ max-width:1320px; margin:0 auto; }

    .hero{ margin-bottom:14px; }
    .hero h1{ margin:0; font-size:28px; font-weight:950; letter-spacing:-.02em; }
    .hero p{ margin:8px 0 0; color:rgba(15,23,42,.64); font-size:15px; line-height:1.65; }

    .topActions{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      border:1px solid rgba(15,23,42,.15); border-radius:10px;
      background:#fff; color:#0f172a; padding:8px 12px;
      font-size:13px; font-weight:900; cursor:pointer;
    }
    .btn:hover{ background:rgba(15,23,42,.04); }
    .btn.primary{ border-color:rgba(37,99,235,.35); color:#1d4ed8; background:rgba(37,99,235,.08); }

    .summary{ margin-bottom:14px; border:1px solid rgba(15,23,42,.1); border-radius:14px; background:#fff; padding:12px; }
    .summaryGrid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .metric{ border:1px solid rgba(15,23,42,.1); border-radius:12px; background:#fff; padding:10px; }
    .metric .k{ font-size:13px; color:rgba(15,23,42,.62); font-weight:800; }
    .metric .v{ margin-top:6px; font-size:24px; font-weight:950; }

    .controls{ border:1px solid rgba(15,23,42,.1); border-radius:14px; background:#fff; padding:12px; margin-bottom:12px; }
    .controlRow{ display:grid; grid-template-columns:1fr 220px; gap:10px; }
    .controlRow input, .controlRow select{ width:100%; padding:10px 12px; }

    .cardGrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .teamCard{ border:1px solid rgba(15,23,42,.11); border-radius:14px; background:#fff; padding:12px; box-shadow:0 2px 6px rgba(15,23,42,.04); }
    .teamHead{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px; }
    .teamTitle{ margin:0; font-size:18px; font-weight:900; }
    .tag{ display:inline-flex; align-items:center; border-radius:999px; border:1px solid rgba(37,99,235,.35); background:rgba(37,99,235,.10); color:#1d4ed8; font-size:11px; font-weight:900; padding:3px 8px; }
    .tag.tag-bia{ border-color:rgba(124,58,237,.35); background:rgba(124,58,237,.10); color:#6d28d9; }
    .tag.tag-core{ border-color:rgba(22,163,74,.35); background:rgba(22,163,74,.10); color:#15803d; }
    .bia-sourced{ border-color:rgba(124,58,237,.2); }
    .empty a{ color:#1d4ed8; font-weight:700; }
    .empty a:hover{ text-decoration:underline; }

    .functionList{ margin:0; padding-left:18px; display:flex; flex-direction:column; gap:5px; }
    .functionList li{ font-size:15px; line-height:1.55; color:#0f172a; }

    .actions{ margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; }
    .empty{ border:1px dashed rgba(148,163,184,.4); border-radius:12px; background:#f8fafc; padding:14px; font-size:14px; color:#64748b; }

    .modalWrap{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(15,23,42,.35); z-index:80; }
    .modalWrap.open{ display:flex; }
    .modal{ width:min(100%, 720px); border:1px solid rgba(15,23,42,.16); border-radius:14px; background:#fff; padding:14px; }
    .modal h2{ margin:0 0 10px; font-size:20px; }
    .field{ margin-top:8px; }
    .field label{ display:block; margin-bottom:6px; font-size:13px; font-weight:800; color:#334155; }
    .field input, .field textarea, .field select{ width:100%; padding:10px 12px; }
    .field textarea{ min-height:120px; resize:vertical; }
    .help{ margin-top:6px; font-size:12px; color:#64748b; }
    .modalActions{ margin-top:12px; display:flex; gap:8px; justify-content:flex-end; }

    @media (max-width:1024px){ .cardGrid{ grid-template-columns:1fr; } }
    @media (max-width:760px){ .summaryGrid, .controlRow{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <aside id="sidebarMount"></aside>
  <main class="main">
    <div class="wrap">
      <section class="hero">
        <h1>핵심업무 레지스트리</h1>
        <p>각 조직의 핵심업무를 정의하여 BIA 및 BCMS 분석에 활용합니다.</p>
      </section>

      <div class="topActions">
        <button id="addBtn" class="btn primary" type="button">핵심업무 추가</button>
        <a class="btn" href="../risk-bia/bia.html">BIA 페이지로 →</a>
      </div>

      <section class="summary">
        <div class="summaryGrid">
          <article class="metric"><div class="k">등록 팀 수</div><div id="teamCount" class="v">0</div></article>
          <article class="metric"><div class="k">핵심업무 항목 수</div><div id="functionCount" class="v">0</div></article>
          <article class="metric"><div class="k">조직 레지스트리 매칭</div><div id="matchCount" class="v">0</div></article>
        </div>
      </section>

      <section class="controls">
        <div class="controlRow">
          <input id="q" type="search" placeholder="팀명 또는 핵심업무 검색"/>
          <select id="matchFilter">
            <option value="all">전체</option>
            <option value="matched">조직 매칭 완료</option>
            <option value="unmatched">조직 미매칭</option>
          </select>
        </div>
      </section>

      <section id="cards" class="cardGrid"></section>
    </div>
  </main>

  <div id="modalWrap" class="modalWrap" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">핵심업무 추가</h2>
      <div class="field">
        <label for="teamInput">팀명</label>
        <input id="teamInput" list="teamOptions" placeholder="예: SRE/플랫폼운영팀"/>
        <datalist id="teamOptions"></datalist>
      </div>
      <div class="field">
        <label for="functionsInput">핵심업무</label>
        <textarea id="functionsInput" placeholder="한 줄에 하나씩 입력하세요"></textarea>
        <p class="help">예) 플랫폼 서비스 운영</p>
      </div>
      <div class="modalActions">
        <button id="cancelBtn" class="btn" type="button">취소</button>
        <button id="saveBtn" class="btn primary" type="button">저장</button>
      </div>
    </div>
  </div>

  <script src="../assets/sidebar.js"></script>
  <script src="../assets/data-store.js"></script>
  <script>
    (() => {
      'use strict';

      const BIA_KEY  = 'bcmsBIAData';
      const CORE_KEY = 'bcmsCoreFunctions';
      const ORG_KEY  = 'bcmsOrgRegistry';      // new people-based registry
      const ORG_KEY_LEGACY = (window.DataStore && DataStore.KEY_ORG_REGISTRY) || 'bcms_org_registry_v1';

      /* ── Helpers ── */
      const safeParse = (s, fb) => { try { return JSON.parse(s); } catch { return fb; } };
      const normStr   = (s) => String(s || '').trim();
      const uniq      = (arr) => [...new Set((arr || []).filter(Boolean))];
      const normFns   = (arr) => uniq((arr || []).map((v) => normStr(v)).filter(Boolean));
      const escHtml   = (s) => normStr(s).replace(/[&<>"']/g, (c) =>
        ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[c]));

      /* ── DOM refs ── */
      const cards        = document.getElementById('cards');
      const q            = document.getElementById('q');
      const matchFilter  = document.getElementById('matchFilter');
      const teamCount    = document.getElementById('teamCount');
      const functionCount= document.getElementById('functionCount');
      const matchCount   = document.getElementById('matchCount');
      const addBtn       = document.getElementById('addBtn');
      const modalWrap    = document.getElementById('modalWrap');
      const modalTitle   = document.getElementById('modalTitle');
      const teamInput    = document.getElementById('teamInput');
      const functionsInput = document.getElementById('functionsInput');
      const saveBtn      = document.getElementById('saveBtn');
      const cancelBtn    = document.getElementById('cancelBtn');
      const teamOptions  = document.getElementById('teamOptions');

      let editingTeam = '';

      /* ── Data readers ── */

      /* bcmsBIAData → [{team, functions:[string,...], source:'bia'}] */
      const readBIARows = () => {
        const raw = safeParse(localStorage.getItem(BIA_KEY), []);
        if (!Array.isArray(raw)) return [];
        return raw
          .map((row) => ({
            team: normStr(row.team),
            functions: uniq((row.functions || [])
              .map((f) => typeof f === 'string' ? f : normStr(f?.name || f?.functionName))
              .filter(Boolean)),
            source: 'bia',
          }))
          .filter((r) => r.team && r.functions.length);
      };

      /* bcmsCoreFunctions → [{team, functions:[string,...], source:'core'}] */
      const readCoreRows = () => {
        const raw = safeParse(localStorage.getItem(CORE_KEY), []);
        if (!Array.isArray(raw)) return [];
        return raw
          .map((row) => ({
            team: normStr(row.team),
            functions: normFns(row.functions || []),
            source: 'core',
          }))
          .filter((r) => r.team && r.functions.length);
      };

      /* Merge: BIA first, then CORE entries whose team is not already in BIA */
      const mergeRows = () => {
        const biaRows  = readBIARows();
        const coreRows = readCoreRows();
        const biaTeams = new Set(biaRows.map((r) => r.team));
        const extraCore = coreRows.filter((r) => !biaTeams.has(r.team));
        return [...biaRows, ...extraCore];
      };

      /* Teams for "조직 매칭" check – from new people registry (dept field) */
      const readOrgTeams = () => {
        // New org registry: array of people with .dept
        const people = safeParse(localStorage.getItem(ORG_KEY), []);
        if (Array.isArray(people) && people.length) {
          return uniq(people.map((p) => p.dept).filter(Boolean));
        }
        // Legacy fallback: division→team structure
        const org = safeParse(localStorage.getItem(ORG_KEY_LEGACY), { divisions: [] });
        return uniq((org.divisions || [])
          .flatMap((d) => (d.teams || []).map((t) => t.name))
          .filter(Boolean));
      };

      /* ── Persist helpers (CORE_KEY only – BIA data is read-only here) ── */
      const saveCoreRow = (team, functions) => {
        const rows = readCoreRows();
        const idx  = rows.findIndex((r) => r.team === team || r.team === editingTeam);
        const item = { team, functions };
        if (idx >= 0) rows[idx] = item;
        else rows.unshift(item);
        localStorage.setItem(CORE_KEY, JSON.stringify(rows));
      };

      const deleteCoreRow = (team) => {
        const rows = readCoreRows().filter((r) => r.team !== team);
        localStorage.setItem(CORE_KEY, JSON.stringify(rows));
      };

      /* ── Modal ── */
      const openModal = (mode, row = null) => {
        editingTeam = row ? row.team : '';
        modalTitle.textContent = mode === 'edit' ? '핵심업무 수정' : '핵심업무 추가';
        teamInput.value = row ? row.team : '';
        functionsInput.value = row ? row.functions.join('\n') : '';
        modalWrap.classList.add('open');
        teamInput.focus();
      };
      const closeModal = () => {
        modalWrap.classList.remove('open');
        editingTeam = '';
      };

      /* ── Render ── */
      const renderTeamOptions = (orgTeams) => {
        /* datalist includes org teams + BIA teams for convenience */
        const biaTeams = readBIARows().map((r) => r.team);
        const all = uniq([...orgTeams, ...biaTeams]).sort();
        teamOptions.innerHTML = all.map((name) => `<option value="${escHtml(name)}"></option>`).join('');
      };

      const renderMetrics = (allRows, orgTeams) => {
        const totalFns = allRows.reduce((acc, r) => acc + r.functions.length, 0);
        const matched  = allRows.filter((r) => orgTeams.includes(r.team)).length;
        teamCount.textContent    = String(allRows.length);
        functionCount.textContent= String(totalFns);
        matchCount.textContent   = `${matched}/${allRows.length || 0}`;
      };

      const renderCards = () => {
        const orgTeams  = readOrgTeams();
        const allRows   = mergeRows();
        renderTeamOptions(orgTeams);

        const keyword = (q.value || '').trim().toLowerCase();
        const mode    = matchFilter.value;

        const viewRows = allRows.filter((row) => {
          const matched = orgTeams.includes(row.team);
          if (mode === 'matched'   && !matched) return false;
          if (mode === 'unmatched' &&  matched) return false;
          const inText = `${row.team} ${row.functions.join(' ')}`.toLowerCase();
          return !keyword || inText.includes(keyword);
        });

        renderMetrics(allRows, orgTeams);

        /* Empty state: no data at all */
        if (!allRows.length) {
          cards.innerHTML = `
            <div class="empty" style="grid-column:1/-1; padding:24px; line-height:2">
              <p style="font-size:15px; font-weight:700; margin:0 0 6px">등록된 핵심업무가 없습니다.</p>
              <p style="margin:0 0 4px">
                <a href="../risk-bia/bia.html">📋 BIA 분석 페이지</a>에서 팀별 핵심업무를 먼저 등록해주세요.
              </p>
              <p style="margin:0; color:#94a3b8">
                BIA에 등록된 업무는 이 페이지에 자동으로 반영됩니다.
                직접 추가하려면 위 "핵심업무 추가" 버튼을 사용하세요.
              </p>
            </div>`;
          return;
        }

        /* Search/filter empty */
        if (!viewRows.length) {
          cards.innerHTML = '<div class="empty" style="grid-column:1/-1">조건에 맞는 핵심업무가 없습니다.</div>';
          return;
        }

        cards.innerHTML = viewRows.map((row) => {
          const matched = orgTeams.includes(row.team);
          const isBia   = row.source === 'bia';

          const actionHtml = isBia
            ? `<a class="btn" href="../risk-bia/bia.html" title="BIA 페이지에서 수정">BIA에서 수정 →</a>`
            : `<button class="btn" type="button" data-edit="${escHtml(row.team)}">수정</button>
               <button class="btn" type="button" data-delete="${escHtml(row.team)}">삭제</button>`;

          return `
            <article class="teamCard ${isBia ? 'bia-sourced' : ''}">
              <div class="teamHead">
                <h2 class="teamTitle">${escHtml(row.team)}</h2>
                <div style="display:flex; gap:6px; flex-wrap:wrap;">
                  ${isBia
                    ? '<span class="tag tag-bia">BIA 연동</span>'
                    : '<span class="tag tag-core">직접 등록</span>'}
                  <span class="tag">${matched ? '조직 매칭 완료' : '조직 미매칭'}</span>
                </div>
              </div>
              <ul class="functionList">
                ${row.functions.map((fn) => `<li>${escHtml(fn)}</li>`).join('')}
              </ul>
              <div class="actions">${actionHtml}</div>
            </article>`;
        }).join('');
      };

      /* ── Save (modal submit) ── */
      const upsertRow = () => {
        const team      = normStr(teamInput.value);
        const functions = normFns((functionsInput.value || '').split('\n'));
        if (!team || !functions.length) {
          alert('팀명과 핵심업무를 입력해 주세요.');
          return;
        }
        saveCoreRow(team, functions);
        closeModal();
        renderCards();
      };

      /* ── Events ── */
      addBtn.addEventListener('click', () => openModal('add'));
      cancelBtn.addEventListener('click', closeModal);
      saveBtn.addEventListener('click', upsertRow);
      q.addEventListener('input', renderCards);
      matchFilter.addEventListener('change', renderCards);

      cards.addEventListener('click', (e) => {
        const editTeam   = e.target.getAttribute('data-edit');
        const deleteTeam = e.target.getAttribute('data-delete');

        if (editTeam) {
          const row = readCoreRows().find((r) => r.team === editTeam);
          if (!row) return;
          openModal('edit', row);
          return;
        }

        if (deleteTeam) {
          if (!confirm(`'${deleteTeam}' 팀의 핵심업무를 삭제할까요?`)) return;
          deleteCoreRow(deleteTeam);
          renderCards();
        }
      });

      modalWrap.addEventListener('click', (e) => {
        if (e.target === modalWrap) closeModal();
      });

      /* ── Auto-refresh when BIA data changes (cross-tab or same-tab) ── */
      window.addEventListener('storage', (e) => {
        if (e.key === BIA_KEY || e.key === CORE_KEY) renderCards();
      });

      /* ── Init ── */
      renderCards();
    })();
  </script>
  <button class="theme-toggle" id="themeToggle" title="다크모드 전환">🌙</button>
  <script>(function(){const r=document.documentElement,t=document.getElementById('themeToggle'),s=localStorage.getItem('bcmsTheme')||'light';r.setAttribute('data-theme',s);if(t){t.textContent=s==='dark'?'☀️':'🌙';t.addEventListener('click',()=>{const n=r.getAttribute('data-theme')=== 'dark'?'light':'dark';r.setAttribute('data-theme',n);t.textContent=n==='dark'?'☀️':'🌙';localStorage.setItem('bcmsTheme',n);});}})();</script>
</body>
</html>
