<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>리스크 평가 | BCMS Portal v2</title>
  <link rel="stylesheet" href="../assets/style.css"/>
  <style>
    .wrap{ max-width:1400px; margin:0 auto; }
    .hero h1{ margin:0; font-size:24px; font-weight:950; }
    .hero p{ margin:8px 0 0; font-size:16px; line-height:1.65; color:rgba(15,23,42,.66); }

    .panel{ margin-top:14px; border:1px solid rgba(15,23,42,.1); border-radius:14px; background:#fff; padding:14px; }

    .topRow{ display:grid; grid-template-columns:1fr 320px; gap:10px; align-items:end; }
    .field label{ display:block; margin-bottom:6px; font-size:14px; font-weight:800; color:#334155; }
    .field select, .field input{ width:100%; padding:10px 12px; font-size:16px; }

    .summaryGrid{ margin-top:12px; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
    .metric{ border:1px solid rgba(15,23,42,.1); border-radius:12px; background:#fff; padding:10px; }
    .metric .k{ font-size:13px; color:rgba(15,23,42,.62); font-weight:800; }
    .metric .v{ margin-top:6px; font-size:24px; font-weight:950; }

    .tableWrap{ margin-top:12px; overflow:auto; }
    table{ width:100%; min-width:1660px; border-collapse:separate; border-spacing:0; border:1px solid rgba(15,23,42,.1); border-radius:12px; overflow:hidden; }
    th, td{ padding:10px; font-size:15px; border-bottom:1px solid rgba(15,23,42,.08); vertical-align:middle; }
    th{ background:#f8fafc; font-size:13px; font-weight:900; color:#334155; text-align:left; white-space:nowrap; }
    tr:last-child td{ border-bottom:none; }
    tr.focusRow td{ background:#f4f9ff; }

    .fnName{ font-size:15px; font-weight:900; }
    .riskInput{ width:100%; font-size:14px; }
    .likelihood{ width:100%; font-size:14px; }

    .impactReadonly,
    .metaChip{
      display:inline-flex; align-items:center; border:1px solid rgba(15,23,42,.14);
      border-radius:999px; padding:4px 10px; font-size:12px; font-weight:900;
      background:#fff; color:#0f172a;
      white-space:nowrap;
    }

    .score{ font-size:18px; font-weight:950; }
    .badge{ display:inline-flex; align-items:center; border-radius:999px; padding:4px 9px; border:1px solid; font-size:12px; font-weight:900; }
    .low{ color:#166534; background:rgba(34,197,94,.12); border-color:rgba(34,197,94,.35); }
    .mid{ color:#92400e; background:rgba(245,158,11,.14); border-color:rgba(245,158,11,.35); }
    .high{ color:#991b1b; background:rgba(239,68,68,.12); border-color:rgba(239,68,68,.35); }
    .focusBadge{ display:inline-flex; margin-top:6px; padding:4px 8px; border-radius:999px; border:1px solid rgba(239,68,68,.4); background:rgba(239,68,68,.12); color:#991b1b; font-size:12px; font-weight:900; }

    .btn{ border:1px solid rgba(15,23,42,.15); border-radius:10px; background:#fff; color:#0f172a; padding:9px 12px; font-size:14px; font-weight:900; cursor:pointer; }
    .btn:hover{ background:rgba(15,23,42,.04); }
    .btn.primary{ border-color:rgba(37,99,235,.35); background:rgba(37,99,235,.08); color:#1d4ed8; }
    .btn.add{ padding:6px 10px; font-size:12px; }

    .actions{ margin-top:12px; display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
    .empty{ margin-top:12px; border:1px dashed rgba(148,163,184,.4); border-radius:12px; background:#f8fafc; color:#64748b; padding:14px; font-size:15px; }

    .matrixPanel{ margin-top:12px; border:1px solid rgba(15,23,42,.1); border-radius:12px; background:#fff; padding:12px; }
    .matrixHead{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
    .matrixTitle{ margin:0; font-size:18px; }
    .matrixHint{ font-size:14px; color:rgba(15,23,42,.62); }

    .matrixWrap{ margin-top:10px; overflow:auto; }
    .matrix{ border-collapse:separate; border-spacing:6px; margin:0 auto; }
    .matrix td, .matrix th{ width:56px; height:46px; text-align:center; vertical-align:middle; border-radius:10px; font-size:13px; font-weight:900; }
    .matrix th{ background:#f8fafc; color:#334155; border:1px solid rgba(15,23,42,.1); }
    .cell{ border:1px solid rgba(15,23,42,.12); background:#fff; color:#334155; }
    .cell.low{ background:rgba(34,197,94,.12); color:#166534; border-color:rgba(34,197,94,.35); }
    .cell.mid{ background:rgba(245,158,11,.14); color:#92400e; border-color:rgba(245,158,11,.35); }
    .cell.high{ background:rgba(239,68,68,.12); color:#991b1b; border-color:rgba(239,68,68,.35); }
    .cell.active{ box-shadow:0 0 0 3px rgba(37,99,235,.28) inset; }

    @media (max-width:960px){ .topRow{ grid-template-columns:1fr; } .summaryGrid{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <aside id="sidebarMount"></aside>
  <main class="main">
    <div class="wrap">
      <section class="hero">
        <h1>리스크 평가</h1>
        <p>BIA 저장값(중요업무 여부·업무등급·MTPD·RTO·영향도)을 그대로 불러와 중단 리스크를 평가합니다. 발생가능성을 입력하면 위험도와 중점관리 여부가 자동 계산됩니다.</p>
      </section>

      <section class="panel">
        <div class="topRow">
          <div class="field">
            <label for="teamSelect">팀 선택</label>
            <select id="teamSelect"></select>
          </div>
          <div class="field">
            <label for="quickRisk">공통 중단 리스크 빠른 입력(선택)</label>
            <input id="quickRisk" type="text" placeholder="예: 외부전력중단, UPS 장애, 네트워크 장애, 사이버 공격"/>
          </div>
        </div>

        <div class="summaryGrid">
          <article class="metric"><div class="k">선택 팀</div><div id="teamMetric" class="v">-</div></article>
          <article class="metric"><div class="k">핵심업무 수</div><div id="fnMetric" class="v">0</div></article>
          <article class="metric"><div class="k">중요업무 수</div><div id="importantMetric" class="v">0</div></article>
          <article class="metric"><div class="k">중점관리 리스크 수</div><div id="highMetric" class="v">0</div></article>
          <article class="metric"><div class="k">평균 위험도</div><div id="avgMetric" class="v">0.0</div></article>
        </div>

        <div id="tableMount" class="tableWrap"></div>

        <div class="actions">
          <button id="saveBtn" class="btn primary" type="button">저장</button>
          <button id="resetBtn" class="btn" type="button">선택 팀 초기화</button>
        </div>
      </section>

      <section class="matrixPanel">
        <div class="matrixHead">
          <h2 class="matrixTitle">리스크 매트릭스</h2>
          <span class="matrixHint" id="matrixHint">행을 클릭하면 매트릭스에서 위치가 강조됩니다.</span>
        </div>
        <div class="matrixWrap" id="matrixMount"></div>
      </section>
    </div>
  </main>

  <script src="../assets/sidebar.js"></script>
  <script src="../assets/data-store.js"></script>
  <script src="../assets/demo-seed.js"></script>
  <script>
    (() => {
      if (window.BCMSDemoSeed) {
        window.BCMSDemoSeed.ensureDemoIfEmpty();
        window.BCMSDemoSeed.mountBanner('.wrap');
      }

      const BIA_KEY = (window.DataStore && DataStore.KEY_BIA_DATA) || 'bcmsBIAData';
      const RISK_KEY = (window.DataStore && DataStore.KEY_RISK_ASSESSMENT) || 'bcmsRiskAssessment';

      const store = (window.DataStore && DataStore.get && DataStore.set) ? DataStore : {
        get: (k, f) => { try { const raw = localStorage.getItem(k); return raw ? JSON.parse(raw) : f; } catch { return f; } },
        set: (k, v) => localStorage.setItem(k, JSON.stringify(v))
      };

      const teamSelect = document.getElementById('teamSelect');
      const quickRisk = document.getElementById('quickRisk');
      const tableMount = document.getElementById('tableMount');
      const saveBtn = document.getElementById('saveBtn');
      const resetBtn = document.getElementById('resetBtn');
      const matrixMount = document.getElementById('matrixMount');
      const matrixHint = document.getElementById('matrixHint');
      const teamMetric = document.getElementById('teamMetric');
      const fnMetric = document.getElementById('fnMetric');
      const importantMetric = document.getElementById('importantMetric');
      const highMetric = document.getElementById('highMetric');
      const avgMetric = document.getElementById('avgMetric');

      const impactLabels = { 1:'매우 낮음', 2:'낮음', 3:'보통', 4:'높음', 5:'매우 높음' };
      const likelihoodLabels = { 1:'매우 낮음', 2:'낮음', 3:'보통', 4:'높음', 5:'매우 높음' };

      const uniq = (arr) => [...new Set((arr || []).filter(Boolean))];
      const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

      const scoreBand = (score) => {
        if (score <= 5) return { text: '낮음', cls: 'low' };
        if (score <= 12) return { text: '보통', cls: 'mid' };
        return { text: '높음', cls: 'high' };
      };

      const normalizeBiaRows = (raw) => {
        const rows = Array.isArray(raw) ? raw : (raw && typeof raw === 'object' && raw.team ? [raw] : []);
        return rows.map((row) => ({
          team: String(row.team || row.teamName || '').trim(),
          functions: (row.functions || []).map((fn) => {
            const name = String(fn.name || fn.function || '').trim();
            const impact = clamp(Number(fn.impact || fn.overallImpact || 3), 1, 5);
            return {
              functionId: String(fn.functionId || '').trim(),
              name,
              importance: String(fn.importance || '일반'),
              overallImpact: clamp(Number(fn.overallImpact || impact), 1, 5),
              impact,
              mtpd: String(fn.mtpd || '-'),
              rto: String(fn.rto || `${fn.rtoValue || ''}${fn.rtoUnit || ''}` || '-').trim() || '-',
              grade: String(fn.grade || '일반'),
              coreFinal: !!fn.coreFinal
            };
          }).filter((fn) => fn.name)
        })).filter((row) => row.team);
      };

      const normalizeRiskRows = (raw) => {
        const rows = Array.isArray(raw) ? raw : (raw && typeof raw === 'object' && raw.team ? [raw] : []);
        return rows.map((row) => ({
          team: String(row.team || row.teamName || '').trim(),
          risks: (row.risks || []).map((risk) => {
            const likelihood = clamp(Number(risk.likelihood || 1), 1, 5);
            const impact = clamp(Number(risk.impact || 3), 1, 5);
            const riskScore = Number(risk.riskScore || (likelihood * impact));
            const level = String(risk.riskLevel || scoreBand(riskScore).text);
            return {
              id: String(risk.id || '').trim(),
              functionId: String(risk.functionId || '').trim(),
              source: String(risk.source || 'MANUAL'),
              sourceRefId: String(risk.sourceRefId || ''),
              function: String(risk.function || '').trim(),
              risk: String(risk.risk || risk.threat || '').trim(),
              likelihood,
              impact,
              riskScore,
              riskLevel: level,
              critical: !!(risk.critical ?? (riskScore >= 13))
            };
          }).filter((risk) => risk.function)
        })).filter((row) => row.team);
      };

      const readBiaRows = () => {
        if (window.DataStore && DataStore.readBiaRecords) {
          const byTeam = new Map();
          DataStore.readBiaRecords().forEach((row) => {
            const team = String(row.teamName || '').trim();
            if (!team) return;
            if (!byTeam.has(team)) byTeam.set(team, { team, functions: [] });
            byTeam.get(team).functions.push({
              functionId: row.functionId,
              name: row.functionName,
              importance: row.importance,
              overallImpact: row.overallImpact,
              impact: row.overallImpact,
              mtpd: row.mtpdMinutes == null ? '-' : `${row.mtpdMinutes}분`,
              rto: row.rtoValue == null ? '-' : `${row.rtoValue}${row.rtoUnit || ''}`,
              grade: row.grade,
              coreFinal: row.grade !== '일반'
            });
          });
          return [...byTeam.values()];
        }
        return normalizeBiaRows(store.get(BIA_KEY, []));
      };

      const readRiskRows = () => {
        if (window.DataStore && DataStore.readRiskRecords) {
          const byTeam = new Map();
          DataStore.readRiskRecords().forEach((row) => {
            const team = String(row.teamName || '').trim();
            if (!team) return;
            if (!byTeam.has(team)) byTeam.set(team, { team, risks: [] });
            byTeam.get(team).risks.push({
              id: row.id,
              functionId: row.functionId,
              source: row.source,
              sourceRefId: row.sourceRefId,
              function: row.functionName,
              risk: row.threat,
              likelihood: row.likelihood,
              impact: row.impact,
              riskScore: row.riskScore,
              riskLevel: row.riskLevel,
              critical: row.critical
            });
          });
          return [...byTeam.values()];
        }
        return normalizeRiskRows(store.get(RISK_KEY, []));
      };

      const buildMatrixHtml = (activeLikelihood = null, activeImpact = null) => {
        const cell = (like, impact) => {
          const score = like * impact;
          const band = scoreBand(score);
          const active = Number(activeLikelihood) === like && Number(activeImpact) === impact;
          return `<td class="cell ${band.cls} ${active ? 'active' : ''}">${score}</td>`;
        };

        return `
          <table class="matrix" aria-label="리스크 매트릭스">
            <thead>
              <tr>
                <th>영향도 ↑</th>
                <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
              </tr>
            </thead>
            <tbody>
              ${[5,4,3,2,1].map((impact) => `
                <tr>
                  <th>${impact}</th>
                  ${[1,2,3,4,5].map((like) => cell(like, impact)).join('')}
                </tr>
              `).join('')}
              <tr>
                <th>발생가능성 →</th>
                <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
              </tr>
            </tbody>
          </table>
        `;
      };

      const biaRows = readBiaRows();
      let riskRows = readRiskRows();
      const biaTeamMap = new Map(biaRows.map((row) => [row.team, row.functions]));
      const teams = uniq(biaRows.map((row) => row.team));
      let activeCell = { likelihood: null, impact: null };

      teamSelect.innerHTML = teams.length
        ? teams.map((team) => `<option value="${team}">${team}</option>`).join('')
        : '<option value="">BIA 데이터가 없습니다</option>';

      const getFnMap = (team) => new Map((biaTeamMap.get(team) || []).map((fn) => [fn.name, fn]));

      const makeRisk = (fnName, impact) => {
        const riskScore = impact;
        const level = scoreBand(riskScore).text;
        return { function: fnName, risk: '', likelihood: 1, impact, riskScore, riskLevel: level, critical: riskScore >= 13 };
      };

      const ensureTeamRisk = (team) => {
        if (!team) return { team: '', risks: [] };
        let row = riskRows.find((r) => r.team === team);
        const fnMap = getFnMap(team);
        const fnNames = [...fnMap.keys()];

        if (!row) {
          row = { team, risks: fnNames.map((name) => makeRisk(name, fnMap.get(name).impact)) };
          riskRows.push(row);
          return row;
        }

        row.risks = (row.risks || [])
          .map((risk) => {
            if (!fnMap.has(risk.function)) return null;
            const meta = fnMap.get(risk.function);
            const impact = meta.impact; // BIA source of truth
            const likelihood = clamp(Number(risk.likelihood || 1), 1, 5);
            const riskScore = impact * likelihood;
            return {
              ...risk,
              impact,
              likelihood,
              riskScore,
              riskLevel: scoreBand(riskScore).text,
              critical: riskScore >= 13
            };
          })
          .filter(Boolean);

        fnNames.forEach((name) => {
          if (!row.risks.some((r) => r.function === name)) row.risks.push(makeRisk(name, fnMap.get(name).impact));
        });

        return row;
      };

      const renderMetrics = (teamRow) => {
        const team = teamRow.team || '';
        const fns = biaTeamMap.get(team) || [];
        const risks = teamRow.risks || [];
        const scores = risks.map((risk) => Number(risk.riskScore || 0));
        const high = scores.filter((score) => score >= 13).length;
        const avg = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : '0.0';

        teamMetric.textContent = team || '-';
        fnMetric.textContent = String(fns.length);
        importantMetric.textContent = String(fns.filter((fn) => fn.importance === '중요').length);
        highMetric.textContent = String(high);
        avgMetric.textContent = avg;
      };

      const renderTable = () => {
        const team = teamSelect.value;
        if (!team) {
          tableMount.innerHTML = '<div class="empty">BIA 데이터가 없어 리스크 평가를 시작할 수 없습니다.</div>';
          renderMetrics({ team: '-', risks: [] });
          matrixMount.innerHTML = buildMatrixHtml();
          return;
        }

        const teamRow = ensureTeamRisk(team);
        const risks = teamRow.risks || [];
        const fnMap = getFnMap(team);
        renderMetrics(teamRow);

        if (!risks.length) {
          tableMount.innerHTML = '<div class="empty">선택한 팀의 핵심업무가 BIA에 없습니다.</div>';
          matrixMount.innerHTML = buildMatrixHtml();
          return;
        }

        tableMount.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>핵심업무</th>
                <th>중요업무</th>
                <th>업무등급</th>
                <th>MTPD</th>
                <th>RTO</th>
                <th>영향도(BIA)</th>
                <th>중단 리스크</th>
                <th>발생가능성</th>
                <th>위험도</th>
                <th>관리등급</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody>
              ${risks.map((risk, idx) => {
                const band = scoreBand(risk.riskScore);
                const focused = Number(activeCell.likelihood) === Number(risk.likelihood) && Number(activeCell.impact) === Number(risk.impact);
                const meta = fnMap.get(risk.function) || { importance:'일반', grade:'일반', mtpd:'-', rto:'-', impact:risk.impact };

                return `
                  <tr data-idx="${idx}" class="${focused ? 'focusRow' : ''}">
                    <td>
                      <div class="fnName">${risk.function}</div>
                      <button class="btn add" type="button" data-add-risk="${risk.function}">리스크 추가</button>
                    </td>
                    <td><span class="metaChip">${meta.importance || '일반'}</span></td>
                    <td><span class="metaChip">${meta.grade || '일반'}</span></td>
                    <td><span class="metaChip">${meta.mtpd || '-'}</span></td>
                    <td><span class="metaChip">${meta.rto || '-'}</span></td>
                    <td><span class="impactReadonly">${risk.impact} ${impactLabels[risk.impact]}</span></td>
                    <td><input class="riskInput" type="text" data-field="risk" value="${risk.risk || ''}" placeholder="예: 외부전력중단, UPS 장애"/></td>
                    <td>
                      <select class="likelihood" data-field="likelihood">
                        ${[1,2,3,4,5].map((n) => `<option value="${n}" ${Number(risk.likelihood) === n ? 'selected' : ''}>${n} ${likelihoodLabels[n]}</option>`).join('')}
                      </select>
                    </td>
                    <td><div class="score">${risk.riskScore}</div></td>
                    <td><span class="badge ${band.cls}">${band.text}</span></td>
                    <td>
                      ${risk.riskScore >= 13 ? '<span class="focusBadge">중점관리</span>' : '<span class="manageText">-</span>'}
                      <div style="margin-top:6px;"><button class="btn" type="button" data-delete="${idx}">삭제</button></div>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;

        matrixMount.innerHTML = buildMatrixHtml(activeCell.likelihood, activeCell.impact);
      };

      const isInteractiveTarget = (el) => !!(el && el.closest('input, select, textarea, button, option, label'));

      const setFocusedRisk = (tr, risk) => {
        tableMount.querySelectorAll('tr.focusRow').forEach((rowEl) => rowEl.classList.remove('focusRow'));
        if (tr) tr.classList.add('focusRow');
        activeCell = risk ? { likelihood: risk.likelihood, impact: risk.impact } : { likelihood: null, impact: null };
        matrixHint.textContent = risk
          ? `선택 항목: 발생가능성 ${risk.likelihood}, 영향도 ${risk.impact}, 위험도 ${risk.riskScore}`
          : '행을 클릭하면 매트릭스에서 위치가 강조됩니다.';
        matrixMount.innerHTML = buildMatrixHtml(activeCell.likelihood, activeCell.impact);
      };

      const refreshRowVisual = (tr, risk) => {
        if (!tr || !risk) return;
        const band = scoreBand(risk.riskScore);
        const scoreEl = tr.querySelector('.score');
        const badgeEl = tr.querySelector('.badge');
        const manageCell = tr.children[10];

        if (scoreEl) scoreEl.textContent = String(risk.riskScore);
        if (badgeEl) {
          badgeEl.textContent = band.text;
          badgeEl.className = `badge ${band.cls}`;
        }

        if (manageCell) {
          const delBtnWrap = manageCell.querySelector('div');
          const focusBadge = manageCell.querySelector('.focusBadge');
          const manageText = manageCell.querySelector('.manageText');
          if (risk.riskScore >= 13 && !focusBadge) {
            const badge = document.createElement('span');
            badge.className = 'focusBadge';
            badge.textContent = '중점관리';
            manageCell.insertBefore(badge, delBtnWrap || null);
          }
          if (risk.riskScore < 13) {
            if (focusBadge) focusBadge.remove();
            if (!manageText) {
              const txt = document.createElement('span');
              txt.className = 'manageText';
              txt.textContent = '-';
              manageCell.insertBefore(txt, delBtnWrap || null);
            }
          } else if (manageText) {
            manageText.remove();
          }
        }
      };

      const updateRisk = (tr, idx, field, value) => {
        const team = teamSelect.value;
        const row = ensureTeamRisk(team);
        const risk = row.risks[idx];
        if (!risk) return;

        if (field === 'risk') risk.risk = String(value || '');
        if (field === 'likelihood') risk.likelihood = clamp(Number(value || 1), 1, 5);

        risk.riskScore = Number(risk.likelihood) * Number(risk.impact);
        risk.riskLevel = scoreBand(risk.riskScore).text;
        risk.critical = risk.riskScore >= 13;

        refreshRowVisual(tr, risk);
        renderMetrics(row);
        setFocusedRisk(tr, risk);
      };

      ['pointerdown','mousedown','click'].forEach((evtName) => {
        tableMount.addEventListener(evtName, (e) => {
          if (isInteractiveTarget(e.target)) e.stopPropagation();
        }, true);
      });

      tableMount.addEventListener('input', (e) => {
        const tr = e.target.closest('tr[data-idx]');
        if (!tr) return;
        const idx = Number(tr.dataset.idx);
        const field = e.target.getAttribute('data-field');
        if (!field) return;
        updateRisk(tr, idx, field, e.target.value);
      });

      tableMount.addEventListener('change', (e) => {
        const tr = e.target.closest('tr[data-idx]');
        if (!tr) return;
        const idx = Number(tr.dataset.idx);
        const field = e.target.getAttribute('data-field');
        if (!field) return;
        updateRisk(tr, idx, field, e.target.value);
      });

      tableMount.addEventListener('click', (e) => {
        if (isInteractiveTarget(e.target) && !e.target.getAttribute('data-delete') && !e.target.getAttribute('data-add-risk')) return;

        const addFn = e.target.getAttribute('data-add-risk');
        if (addFn) {
          const team = teamSelect.value;
          const row = ensureTeamRisk(team);
          const meta = getFnMap(team).get(addFn);
          row.risks.push(makeRisk(addFn, meta ? meta.impact : 3));
          renderTable();
          return;
        }

        const tr = e.target.closest('tr[data-idx]');
        if (tr && !e.target.getAttribute('data-delete')) {
          const idx = Number(tr.dataset.idx);
          const team = teamSelect.value;
          const row = ensureTeamRisk(team);
          const risk = row.risks[idx];
          if (risk) setFocusedRisk(tr, risk);
          return;
        }

        const deleteIdx = e.target.getAttribute('data-delete');
        if (deleteIdx == null) return;
        const team = teamSelect.value;
        const row = ensureTeamRisk(team);
        row.risks.splice(Number(deleteIdx), 1);
        activeCell = { likelihood: null, impact: null };
        matrixHint.textContent = '행을 클릭하면 매트릭스에서 위치가 강조됩니다.';
        renderTable();
      });

      teamSelect.addEventListener('change', () => {
        activeCell = { likelihood: null, impact: null };
        matrixHint.textContent = '행을 클릭하면 매트릭스에서 위치가 강조됩니다.';
        renderTable();
      });

      quickRisk.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        const team = teamSelect.value;
        const text = String(quickRisk.value || '').trim();
        if (!team || !text) return;
        const row = ensureTeamRisk(team);
        row.risks.forEach((risk) => { if (!risk.risk) risk.risk = text; });
        quickRisk.value = '';
        renderTable();
      });

      saveBtn.addEventListener('click', () => {
        riskRows = riskRows
          .map((row) => ({
            team: row.team,
            risks: (row.risks || []).map((risk) => {
              const likelihood = clamp(Number(risk.likelihood || 1), 1, 5);
              const impact = clamp(Number(risk.impact || 3), 1, 5);
              const riskScore = likelihood * impact;
              const riskLevel = scoreBand(riskScore).text;
              return {
                function: risk.function,
                risk: String(risk.risk || '').trim(),
                likelihood,
                impact,
                riskScore,
                riskLevel,
                critical: riskScore >= 13
              };
            }).filter((risk) => risk.function)
          }))
          .filter((row) => row.team);

        if (window.DataStore && DataStore.writeRiskRecords && DataStore.normalizeRiskRecord) {
          const canonical = riskRows.flatMap((row) => (row.risks || []).map((risk) => DataStore.normalizeRiskRecord({
            id: risk.id,
            teamName: row.team,
            functionId: risk.functionId,
            functionName: risk.function,
            threat: risk.risk,
            likelihood: risk.likelihood,
            impact: risk.impact,
            source: risk.source || 'MANUAL',
            sourceRefId: risk.sourceRefId || ''
          })));
          DataStore.writeRiskRecords(canonical);
        } else {
          store.set(RISK_KEY, riskRows);
        }
        alert('리스크 평가 데이터가 저장되었습니다.');
      });

      resetBtn.addEventListener('click', () => {
        const team = teamSelect.value;
        if (!team) return;
        const row = ensureTeamRisk(team);
        row.risks = (biaTeamMap.get(team) || []).map((fn) => makeRisk(fn.name, fn.impact));
        activeCell = { likelihood: null, impact: null };
        matrixHint.textContent = '행을 클릭하면 매트릭스에서 위치가 강조됩니다.';
        renderTable();
      });

      renderTable();
    })();
  </script>
</body>
</html>
