<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BCMS Portal - CAPA 관리</title>
<link rel="stylesheet" href="../assets/style.css"/>
<style>
  html, body { overflow-x: hidden; max-width: 100%; }
  .main { overflow-x: hidden; min-width: 0; }
  .wrap { max-width: 1280px; margin: 0 auto; overflow-x: hidden; }

  /* ── 헤더 ── */
  .pageHeader {
    display: flex; align-items: flex-start; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
  }
  .pageHeader h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px 0; }
  .pageHeader .desc { font-size: 13px; color: var(--text-2); margin: 0; }
  .headerBtns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn {
    padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); text-decoration: none; white-space: nowrap; transition: background .15s;
  }
  .btn:hover { background: var(--surface-hover); }
  .btn.primary {
    background: var(--accent, #0070f3); color: #fff; border-color: var(--accent, #0070f3);
  }
  .btn.primary:hover { opacity: .88; }

  /* ── KPI 카드 ── */
  .kpiGrid {
    display: grid; grid-template-columns: repeat(5, minmax(0,1fr));
    gap: 10px; margin-bottom: 18px;
  }
  @media (max-width: 960px) { .kpiGrid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 600px) { .kpiGrid { grid-template-columns: repeat(2, 1fr); } }

  .kpiCard {
    border: 0.5px solid var(--border); border-radius: 12px;
    background: var(--surface); padding: 14px 16px; text-align: center;
  }
  .kpiCard.danger { border-color: #dc2626; }
  .kpiCard .kLabel { font-size: 12px; color: var(--text-2); font-weight: 600; margin: 0 0 6px 0; }
  .kpiCard .kNum { font-size: 28px; font-weight: 900; margin: 0; }
  .kpiCard .kNum.red   { color: #dc2626; }
  .kpiCard .kNum.blue  { color: var(--accent, #0070f3); }
  .kpiCard .kNum.green { color: #16a34a; }

  /* ── 필터 바 ── */
  .filterBar {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin-bottom: 14px;
  }
  .filterBar select, .filterBar input[type="text"] {
    height: 36px; padding: 0 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-size: 13px; outline: none;
  }
  .filterBar select { min-width: 120px; }
  .filterBar input[type="text"] { min-width: 200px; flex: 1; }
  .filterBar select:focus, .filterBar input:focus { border-color: var(--accent, #0070f3); }

  /* ── 테이블 ── */
  .tableWrap { overflow-x: auto; border: 0.5px solid var(--border); border-radius: 12px; }
  table {
    width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px;
    background: var(--surface);
  }
  thead th {
    text-align: left; font-size: 11px; font-weight: 700; color: var(--text-2);
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    white-space: nowrap; background: var(--surface);
  }
  tbody tr { cursor: pointer; transition: background .12s; }
  tbody tr:hover td { background: var(--surface-hover); }
  tbody tr.row-delayed { background: rgba(239,68,68,.05); border-left: 3px solid #dc2626; }
  tbody tr.row-done { opacity: .6; }
  tbody tr.row-open { background: rgba(0,112,243,.04); }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }

  /* 인라인 상태 select */
  .statusSel {
    padding: 3px 6px; border-radius: 6px; font-size: 12px; font-weight: 700;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    cursor: pointer; outline: none;
  }

  /* ── 배지 ── */
  .badge {
    display: inline-block; padding: 2px 7px; border-radius: 4px;
    font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  .badge.gray   { background: rgba(0,0,0,.07); color: var(--text-2); }
  .badge.blue   { background: rgba(0,112,243,.1); color: #0070f3; }
  .badge.green  { background: #f0fdf4; color: #16a34a; }
  .badge.yellow { background: #fffbeb; color: #d97706; }
  .badge.red    { background: #fef2f2; color: #dc2626; }
  .badge.purple { background: rgba(124,58,237,.1); color: #7c3aed; }
  [data-theme="dark"] .badge.gray   { background: rgba(255,255,255,.1); }
  [data-theme="dark"] .badge.blue   { background: #001c3a; }
  [data-theme="dark"] .badge.green  { background: #052e16; }
  [data-theme="dark"] .badge.yellow { background: #1c1400; }
  [data-theme="dark"] .badge.red    { background: #2a0000; }
  [data-theme="dark"] .badge.purple { background: #1a0040; }

  /* ── Accordion 패널 ── */
  tr.accordion-row td { padding: 0 !important; border-bottom: 1px solid var(--border); }
  .accordion-panel {
    display: none; padding: 18px 20px; background: var(--bg);
    border-top: 1px solid var(--border);
  }
  .accordion-panel.open { display: block; }
  .panelGrid {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 12px; margin-bottom: 12px;
  }
  @media (max-width: 700px) { .panelGrid { grid-template-columns: 1fr 1fr; } }
  .panelField label { display: block; font-size: 11px; font-weight: 700; color: var(--text-2); margin-bottom: 4px; }
  .panelField input, .panelField select, .panelField textarea {
    width: 100%; padding: 7px 9px; border-radius: 7px; box-sizing: border-box;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-size: 13px; outline: none; font-family: inherit;
  }
  .panelField input:focus, .panelField select:focus, .panelField textarea:focus {
    border-color: var(--accent, #0070f3);
  }
  .panelField.full { grid-column: 1 / -1; }
  .panelBtns { display: flex; gap: 8px; margin-top: 12px; }

  /* ── 빈 상태 ── */
  .emptyState {
    text-align: center; padding: 60px 20px;
    border: 0.5px solid var(--border); border-radius: 12px;
    background: var(--surface);
  }
  .emptyState p { color: var(--text-2); font-size: 14px; margin: 0 0 16px 0; line-height: 1.6; }

  /* ── 모달 ── */
  .modalBackdrop {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.45); backdrop-filter: blur(4px);
    align-items: center; justify-content: center;
  }
  .modalBackdrop.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 14px;
    padding: 24px; width: 100%; max-width: 600px;
    max-height: 90vh; overflow-y: auto;
    border: 0.5px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }
  .modal h2 { font-size: 17px; font-weight: 800; margin: 0 0 18px 0; }
  .modalGrid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin-bottom: 12px;
  }
  .modalField label { display: block; font-size: 11px; font-weight: 700; color: var(--text-2); margin-bottom: 4px; }
  .modalField input, .modalField select, .modalField textarea {
    width: 100%; padding: 8px 10px; border-radius: 8px; box-sizing: border-box;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 13px; outline: none; font-family: inherit;
  }
  .modalField input:focus, .modalField select:focus, .modalField textarea:focus {
    border-color: var(--accent, #0070f3);
  }
  .modalField.full { grid-column: 1 / -1; }
  .modalBtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  /* ── 관리 버튼 ── */
  .iconBtn {
    padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: transparent;
    color: var(--text-2); transition: all .12s;
  }
  .iconBtn:hover { background: var(--surface-hover); color: var(--text); }
  .iconBtn.del:hover { background: #fef2f2; color: #dc2626; border-color: #dc2626; }

  @media (max-width: 640px) {
    .pageHeader { flex-direction: column; }
    .headerBtns { width: 100%; }
  }
</style>
</head>
<body>
<aside id="sidebarMount"></aside>
<main class="main">
<div class="wrap">

  <!-- 헤더 -->
  <div class="pageHeader">
    <div>
      <h1>🔧 CAPA 개선조치 관리</h1>
      <p class="desc">갭분석·내부심사·훈련·리스크 평가에서 도출된 개선조치를 통합 관리합니다.</p>
    </div>
    <div class="headerBtns">
      <button class="btn primary" id="btnAdd">+ 개선조치 추가</button>
      <button class="btn" id="btnSaveAll">전체 저장</button>
      <a href="../audit/index.html" class="btn">평가·감사 →</a>
      <button id="themeToggle" class="btn">🌙 다크모드</button>
    </div>
  </div>

  <!-- KPI -->
  <div class="kpiGrid" id="kpiGrid"></div>

  <!-- 필터 -->
  <div class="filterBar">
    <select id="fSource">
      <option value="">전체 출처</option>
      <option>갭분석</option><option>내부심사</option><option>훈련</option>
      <option>리스크</option><option>기타</option>
    </select>
    <select id="fStatus">
      <option value="">전체 상태</option>
      <option>미시작</option><option>진행중</option><option>완료</option><option>보류</option>
    </select>
    <select id="fPriority">
      <option value="">전체 우선순위</option>
      <option>높음</option><option>중간</option><option>낮음</option>
    </select>
    <input type="text" id="fSearch" placeholder="제목 또는 담당자 검색"/>
    <button class="btn" id="btnReset">필터 초기화</button>
  </div>

  <!-- 테이블 -->
  <div class="tableWrap" id="tableArea"></div>

  <!-- 빈 상태 -->
  <div class="emptyState" id="emptyState" style="display:none">
    <p>개선조치 항목이 없습니다.<br>갭분석, 내부심사, 훈련 결과에서 개선사항을 등록하세요.</p>
    <button class="btn primary" id="btnAddEmpty">+ 개선조치 추가</button>
  </div>

</div>
</main>

<!-- 추가 모달 -->
<div class="modalBackdrop" id="modalBackdrop">
  <div class="modal">
    <h2>➕ 개선조치 추가</h2>
    <div class="modalGrid">
      <div class="modalField">
        <label>CAPA ID</label>
        <input type="text" id="mId" readonly style="opacity:.6"/>
      </div>
      <div class="modalField">
        <label>우선순위</label>
        <select id="mPriority"><option>높음</option><option selected>중간</option><option>낮음</option></select>
      </div>
      <div class="modalField full">
        <label>제목 *</label>
        <input type="text" id="mTitle" placeholder="개선조치 제목을 입력하세요"/>
      </div>
      <div class="modalField">
        <label>출처</label>
        <select id="mSource"><option>갭분석</option><option>내부심사</option><option>훈련</option><option>리스크</option><option>기타</option></select>
      </div>
      <div class="modalField">
        <label>분류</label>
        <select id="mCategory"><option>예방조치</option><option>시정조치</option><option>개선조치</option></select>
      </div>
      <div class="modalField">
        <label>담당자</label>
        <input type="text" id="mOwner" placeholder="담당자명"/>
      </div>
      <div class="modalField">
        <label>목표일</label>
        <input type="date" id="mDueDate"/>
      </div>
      <div class="modalField">
        <label>상태</label>
        <select id="mStatus"><option>미시작</option><option>진행중</option><option>완료</option><option>보류</option></select>
      </div>
      <div class="modalField full">
        <label>상세 내용</label>
        <textarea id="mDesc" rows="3" placeholder="개선조치 상세 내용"></textarea>
      </div>
    </div>
    <div class="modalBtns">
      <button class="btn" id="btnModalCancel">취소</button>
      <button class="btn primary" id="btnModalAdd">추가</button>
    </div>
  </div>
</div>

<script src="../assets/demo-seed.js"></script>
<script src="../assets/sidebar.js"></script>
<script>
(function () {
  'use strict';

  const KEY = 'bcmsCapaItems';
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  /* ── 저장/로드 ── */
  function save(arr) {
    try { localStorage.setItem(KEY, JSON.stringify(arr)); } catch {}
  }
  function load() {
    try {
      const v = localStorage.getItem(KEY);
      if (!v) return [];
      const p = JSON.parse(v);
      return Array.isArray(p) ? p : [];
    } catch { return []; }
  }

  let items = load();
  let openId = null;

  /* ── ID 생성 ── */
  function nextId() {
    const nums = items
      .map(i => parseInt(String(i.id ?? '').replace('CAPA-', ''), 10))
      .filter(n => !isNaN(n));
    const max = nums.length > 0 ? Math.max(...nums) : 0;
    return 'CAPA-' + String(max + 1).padStart(3, '0');
  }

  /* ── 날짜 ── */
  const today = new Date(); today.setHours(0, 0, 0, 0);
  function todayStr() { return today.toISOString().split('T')[0]; }
  function isDelayed(item) {
    if (!item.dueDate || item.status === '완료') return false;
    const d = new Date(item.dueDate);
    return !isNaN(d) && d < today;
  }

  /* ── 배지 헬퍼 ── */
  function sourceBadge(s) {
    const m = { '갭분석':'blue','내부심사':'purple','훈련':'green','리스크':'red','기타':'gray' };
    return `<span class="badge ${m[s] ?? 'gray'}">${esc(s || '—')}</span>`;
  }
  function categoryBadge(s) {
    const m = { '예방조치':'blue','시정조치':'red','개선조치':'yellow' };
    return `<span class="badge ${m[s] ?? 'gray'}">${esc(s || '—')}</span>`;
  }
  function priorityBadge(s) {
    const m = { '높음':'red','중간':'yellow','낮음':'gray' };
    return `<span class="badge ${m[s] ?? 'gray'}">${esc(s || '—')}</span>`;
  }
  function statusInlineSel(item, idx) {
    const opts = ['미시작','진행중','완료','보류'];
    return `<select class="statusSel" data-idx="${idx}" onclick="event.stopPropagation()">
      ${opts.map(o => `<option${item.status === o ? ' selected' : ''}>${o}</option>`).join('')}
    </select>`;
  }

  /* ── KPI ── */
  function renderKPI() {
    const total   = items.length;
    const pending = items.filter(i => i.status === '미시작').length;
    const wip     = items.filter(i => i.status === '진행중').length;
    const done    = items.filter(i => i.status === '완료').length;
    const delayed = items.filter(i => isDelayed(i)).length;
    document.getElementById('kpiGrid').innerHTML = [
      { label:'전체',  num: total,   cls:'' },
      { label:'미시작', num: pending, cls:'' },
      { label:'진행중', num: wip,     cls:'blue' },
      { label:'완료',   num: done,    cls:'green' },
      { label:'지연',   num: delayed, cls:'red', danger: delayed > 0 },
    ].map(k =>
      `<div class="kpiCard${k.danger ? ' danger' : ''}">
         <p class="kLabel">${k.label}</p>
         <p class="kNum ${k.cls}">${k.num}</p>
       </div>`
    ).join('');
  }

  /* ── 필터 ── */
  function getFiltered() {
    const src = document.getElementById('fSource').value;
    const sts = document.getElementById('fStatus').value;
    const pri = document.getElementById('fPriority').value;
    const q   = document.getElementById('fSearch').value.toLowerCase().trim();
    return items
      .map((item, idx) => ({ item, idx }))
      .filter(({ item }) => {
        if (src && item.source   !== src) return false;
        if (sts && item.status   !== sts) return false;
        if (pri && item.priority !== pri) return false;
        if (q && !String(item.title ?? '').toLowerCase().includes(q) &&
                 !String(item.owner ?? '').toLowerCase().includes(q)) return false;
        return true;
      });
  }

  /* ── 테이블 렌더 ── */
  function renderTable() {
    renderKPI();
    const filtered  = getFiltered();
    const tableArea = document.getElementById('tableArea');
    const emptyEl   = document.getElementById('emptyState');

    if (items.length === 0) {
      tableArea.style.display = 'none';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';
    tableArea.style.display = '';

    if (filtered.length === 0) {
      tableArea.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-2);font-size:13px">필터 조건에 맞는 항목이 없습니다.</div>`;
      return;
    }

    let html = `<table>
      <thead><tr>
        <th style="width:108px">No</th>
        <th>제목</th>
        <th style="width:76px">출처</th>
        <th style="width:80px">분류</th>
        <th style="width:68px">우선순위</th>
        <th style="width:90px">담당자</th>
        <th style="width:96px">목표일</th>
        <th style="width:118px">상태</th>
        <th style="width:80px">관리</th>
      </tr></thead>
      <tbody>`;

    for (const { item, idx } of filtered) {
      const delayed = isDelayed(item);
      const done    = item.status === '완료';
      const open    = openId === item.id;
      const rowCls  = delayed ? 'row-delayed' : done ? 'row-done' : open ? 'row-open' : '';

      html += `
        <tr class="${rowCls}" data-id="${esc(item.id)}" data-idx="${idx}">
          <td><span style="font-size:11px;color:var(--text-2)">${esc(item.id)}</span></td>
          <td><strong>${esc(item.title || '—')}</strong></td>
          <td>${sourceBadge(item.source)}</td>
          <td>${categoryBadge(item.category)}</td>
          <td>${priorityBadge(item.priority)}</td>
          <td>${esc(item.owner || '—')}</td>
          <td style="font-size:12px;color:var(--text-2)">${esc(item.dueDate || '—')}</td>
          <td>${delayed ? '<span class="badge red">지연</span>&nbsp;' : ''}${statusInlineSel(item, idx)}</td>
          <td>
            <button class="iconBtn" onclick="togglePanel('${esc(item.id)}',${idx},event)" title="편집">✏️</button>
            <button class="iconBtn del" onclick="deleteItem(${idx},event)" title="삭제">🗑</button>
          </td>
        </tr>
        <tr class="accordion-row" id="acc-${esc(item.id)}">
          <td colspan="9">
            <div class="accordion-panel${open ? ' open' : ''}" id="panel-${esc(item.id)}">
              <div class="panelGrid">
                <div class="panelField">
                  <label>제목</label>
                  <input type="text" id="p-title-${idx}" value="${esc(item.title ?? '')}"/>
                </div>
                <div class="panelField">
                  <label>출처</label>
                  <select id="p-source-${idx}">
                    ${['갭분석','내부심사','훈련','리스크','기타'].map(o => `<option${item.source===o?' selected':''}>${o}</option>`).join('')}
                  </select>
                </div>
                <div class="panelField">
                  <label>분류</label>
                  <select id="p-category-${idx}">
                    ${['예방조치','시정조치','개선조치'].map(o => `<option${item.category===o?' selected':''}>${o}</option>`).join('')}
                  </select>
                </div>
                <div class="panelField">
                  <label>우선순위</label>
                  <select id="p-priority-${idx}">
                    ${['높음','중간','낮음'].map(o => `<option${item.priority===o?' selected':''}>${o}</option>`).join('')}
                  </select>
                </div>
                <div class="panelField">
                  <label>담당자</label>
                  <input type="text" id="p-owner-${idx}" value="${esc(item.owner ?? '')}"/>
                </div>
                <div class="panelField">
                  <label>목표일</label>
                  <input type="date" id="p-dueDate-${idx}" value="${esc(item.dueDate ?? '')}"/>
                </div>
                <div class="panelField">
                  <label>상태</label>
                  <select id="p-status-${idx}">
                    ${['미시작','진행중','완료','보류'].map(o => `<option${item.status===o?' selected':''}>${o}</option>`).join('')}
                  </select>
                </div>
                <div class="panelField full">
                  <label>상세 내용</label>
                  <textarea id="p-desc-${idx}" rows="3">${esc(item.description ?? '')}</textarea>
                </div>
              </div>
              <div class="panelBtns">
                <button class="btn primary" onclick="savePanel(${idx})">저장</button>
                <button class="btn" onclick="closePanel()">닫기</button>
              </div>
            </div>
          </td>
        </tr>`;
    }

    html += `</tbody></table>`;
    tableArea.innerHTML = html;

    /* 인라인 상태 change */
    tableArea.querySelectorAll('.statusSel').forEach(sel => {
      sel.addEventListener('change', () => {
        const idx = parseInt(sel.dataset.idx, 10);
        items[idx].status = sel.value;
        if (sel.value === '완료' && !items[idx].completedAt) items[idx].completedAt = todayStr();
        if (sel.value !== '완료') items[idx].completedAt = '';
        save(items);
        renderTable();
      });
    });

    /* 행 클릭 → accordion */
    tableArea.querySelectorAll('tbody tr[data-id]').forEach(row => {
      row.addEventListener('click', e => {
        if (e.target.closest('.statusSel') || e.target.closest('.iconBtn')) return;
        togglePanel(row.dataset.id, parseInt(row.dataset.idx, 10), e);
      });
    });
  }

  /* ── accordion ── */
  window.togglePanel = function (id, idx, e) {
    if (e) e.stopPropagation();
    openId = openId === id ? null : id;
    renderTable();
    if (openId) {
      setTimeout(() => {
        const el = document.getElementById('panel-' + id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 50);
    }
  };

  window.closePanel = function () { openId = null; renderTable(); };

  window.savePanel = function (idx) {
    const g = id => document.getElementById(id);
    items[idx].title       = g(`p-title-${idx}`).value.trim();
    items[idx].source      = g(`p-source-${idx}`).value;
    items[idx].category    = g(`p-category-${idx}`).value;
    items[idx].priority    = g(`p-priority-${idx}`).value;
    items[idx].owner       = g(`p-owner-${idx}`).value.trim();
    items[idx].dueDate     = g(`p-dueDate-${idx}`).value;
    items[idx].description = g(`p-desc-${idx}`).value.trim();
    const newSts           = g(`p-status-${idx}`).value;
    if (newSts === '완료' && !items[idx].completedAt) items[idx].completedAt = todayStr();
    if (newSts !== '완료') items[idx].completedAt = '';
    items[idx].status = newSts;
    save(items);
    openId = null;
    renderTable();
  };

  /* ── 삭제 ── */
  window.deleteItem = function (idx, e) {
    if (e) e.stopPropagation();
    if (!confirm('이 항목을 삭제하시겠습니까?')) return;
    if (openId === items[idx].id) openId = null;
    items.splice(idx, 1);
    save(items);
    renderTable();
  };

  /* ── 모달 ── */
  function openModal() {
    document.getElementById('mId').value       = nextId();
    document.getElementById('mTitle').value    = '';
    document.getElementById('mSource').value   = '갭분석';
    document.getElementById('mCategory').value = '예방조치';
    document.getElementById('mPriority').value = '중간';
    document.getElementById('mOwner').value    = '';
    document.getElementById('mDueDate').value  = '';
    document.getElementById('mStatus').value   = '미시작';
    document.getElementById('mDesc').value     = '';
    document.getElementById('modalBackdrop').classList.add('open');
    setTimeout(() => document.getElementById('mTitle').focus(), 50);
  }

  function closeModal() { document.getElementById('modalBackdrop').classList.remove('open'); }

  document.getElementById('btnAdd').addEventListener('click', openModal);
  document.getElementById('btnAddEmpty').addEventListener('click', openModal);
  document.getElementById('btnModalCancel').addEventListener('click', closeModal);
  document.getElementById('modalBackdrop').addEventListener('click', e => {
    if (e.target === document.getElementById('modalBackdrop')) closeModal();
  });
  document.getElementById('btnModalAdd').addEventListener('click', () => {
    const title = document.getElementById('mTitle').value.trim();
    if (!title) { alert('제목을 입력하세요.'); return; }
    const sts = document.getElementById('mStatus').value;
    items.push({
      id:          document.getElementById('mId').value,
      title,
      source:      document.getElementById('mSource').value,
      category:    document.getElementById('mCategory').value,
      priority:    document.getElementById('mPriority').value,
      owner:       document.getElementById('mOwner').value.trim(),
      dueDate:     document.getElementById('mDueDate').value,
      status:      sts,
      description: document.getElementById('mDesc').value.trim(),
      createdAt:   todayStr(),
      completedAt: sts === '완료' ? todayStr() : '',
    });
    save(items);
    closeModal();
    renderTable();
  });

  /* ── 전체 저장 버튼 ── */
  document.getElementById('btnSaveAll').addEventListener('click', () => {
    save(items);
    const btn = document.getElementById('btnSaveAll');
    const prev = btn.textContent;
    btn.textContent = '✓ 저장됨';
    setTimeout(() => { btn.textContent = prev; }, 1500);
  });

  /* ── 필터 이벤트 ── */
  ['fSource','fStatus','fPriority'].forEach(id =>
    document.getElementById(id).addEventListener('change', renderTable)
  );
  document.getElementById('fSearch').addEventListener('input', renderTable);
  document.getElementById('btnReset').addEventListener('click', () => {
    ['fSource','fStatus','fPriority'].forEach(id => { document.getElementById(id).value = ''; });
    document.getElementById('fSearch').value = '';
    renderTable();
  });

  /* ── 다크모드 ── */
  const htmlEl = document.documentElement;
  const themeBtn = document.getElementById('themeToggle');
  function applyTheme(t) {
    htmlEl.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'dark' ? '☀️ 라이트모드' : '🌙 다크모드';
    try { localStorage.setItem('bcmsTheme', t); } catch {}
  }
  try { const s = localStorage.getItem('bcmsTheme'); if (s) applyTheme(s); } catch {}
  themeBtn.addEventListener('click', () =>
    applyTheme(htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark')
  );

  /* ── 초기 렌더 ── */
  renderTable();

})();
</script>
</body>
</html>
