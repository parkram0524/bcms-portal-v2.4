<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>DRP 절차 관리 | 전략·계획</title>
  <link rel="stylesheet" href="../assets/style.css"/>
  <style>
    .wrap{ max-width:1460px; margin:0 auto; }
    .topbar{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
    .topbar h1{ margin:0; font-size:26px; font-weight:950; }
    .desc{ margin:8px 0 0; color:rgba(15,23,42,.66); font-size:14px; line-height:1.6; max-width:1000px; }

    .actions{ display:flex; gap:8px; flex-wrap:wrap; }
    .btn{ text-decoration:none; padding:10px 13px; border:1px solid rgba(15,23,42,.14); border-radius:999px; background:#fff; color:#0f172a; font-size:14px; font-weight:900; cursor:pointer; }
    .btn.primary{ background:rgba(96,165,250,.2); border-color:rgba(96,165,250,.45); }

    .grid{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:14px; }
    .card{ border:1px solid rgba(15,23,42,.12); border-radius:16px; background:rgba(255,255,255,.95); padding:14px; }
    .kpi{ grid-column:span 3; }
    .full{ grid-column:span 12; }
    @media (max-width:1080px){ .kpi{ grid-column:span 6; } }
    @media (max-width:640px){ .kpi{ grid-column:span 12; } }

    .kTitle{ margin:0; font-size:13px; color:rgba(15,23,42,.74); font-weight:900; }
    .kValue{ margin:8px 0 0; font-size:31px; font-weight:950; }

    .filters{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; align-items:end; }
    .field label{ display:block; font-size:12px; font-weight:800; color:rgba(15,23,42,.74); margin-bottom:6px; }
    .field select,.field input{ width:100%; padding:9px 10px; border:1px solid rgba(15,23,42,.2); border-radius:10px; background:#fff; }
    .toggle{ display:flex; align-items:center; gap:7px; font-size:13px; font-weight:800; padding:8px 0; }
    @media (max-width:1000px){ .filters{ grid-template-columns:1fr; } }

    .tableWrap{ overflow:auto; }
    table{ width:100%; min-width:1500px; border-collapse:separate; border-spacing:0; border:1px solid rgba(15,23,42,.12); border-radius:12px; overflow:hidden; }
    th,td{ padding:10px 9px; border-bottom:1px solid rgba(15,23,42,.08); font-size:13px; vertical-align:top; background:#fff; }
    th{ text-align:left; background:#f8fafc; color:rgba(15,23,42,.76); font-size:12px; white-space:nowrap; }
    tr:last-child td{ border-bottom:none; }

    .badge{ display:inline-flex; align-items:center; border:1px solid rgba(15,23,42,.16); border-radius:999px; padding:3px 8px; font-size:11px; font-weight:900; }
    .high{ background:rgba(239,68,68,.12); color:#b91c1c; border-color:rgba(239,68,68,.38); }
    .prio{ background:rgba(59,130,246,.12); color:#1d4ed8; border-color:rgba(59,130,246,.38); }
    .ok{ background:rgba(34,197,94,.12); color:#166534; border-color:rgba(34,197,94,.35); }

    .detailRow{ background:rgba(248,250,252,.6); }
    .detailCell{ padding:12px; }
    .detailGrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .detailField label{ display:block; font-size:12px; font-weight:800; color:rgba(15,23,42,.74); margin-bottom:6px; }
    .detailField input,.detailField textarea,.detailField select{ width:100%; padding:8px 10px; border:1px solid rgba(15,23,42,.2); border-radius:9px; background:#fff; font-size:13px; font-family:inherit; }
    .detailField textarea{ min-height:66px; resize:vertical; }
    .span2{ grid-column:1 / -1; }

    .resourceBox{ display:flex; gap:8px; flex-wrap:wrap; }
    .resourceChip{ border:1px solid rgba(15,23,42,.18); border-radius:999px; background:#fff; padding:5px 8px; font-size:11.5px; }
    .resourceChip input{ margin-right:4px; vertical-align:middle; }

    .steps{ display:flex; flex-direction:column; gap:7px; }
    .stepItem{ display:grid; grid-template-columns:70px 1.8fr 1fr 100px 1.3fr auto; gap:6px; align-items:center; }
    .stepItem input{ width:100%; padding:7px 8px; border:1px solid rgba(15,23,42,.2); border-radius:8px; font-size:12px; }
    .miniBtn{ border:1px solid rgba(15,23,42,.16); border-radius:8px; background:#fff; padding:6px 8px; font-size:11.5px; font-weight:800; cursor:pointer; }
    .miniBtn.primary{ background:rgba(59,130,246,.14); border-color:rgba(59,130,246,.35); }
    .miniBtn.danger{ background:rgba(239,68,68,.12); border-color:rgba(239,68,68,.35); }

    .rowActions{ display:flex; gap:6px; flex-wrap:wrap; }
    .hidden{ display:none; }
    .empty{ text-align:center; padding:25px 12px; color:rgba(15,23,42,.62); }
  </style>
</head>
<body>
  <aside id="sidebarMount"></aside>
  <main class="main">
    <div class="wrap">
      <div class="topbar">
        <div>
          <h1>🧰 DRP 절차</h1>
          <p class="desc">BCP 전략 기반 복구 절차를 관리합니다. 중점관리 리스크 중 전략이 작성된 항목을 대상으로, 발동 조건·사전 확인사항·단계별 실행 절차를 입력합니다.</p>
        </div>
        <div class="actions">
          <a class="btn" href="./index.html">전략·계획 홈</a>
          <a class="btn" href="./bcp.html">BCP 전략</a>
          <button class="btn primary" id="reloadBtn" type="button">최신 데이터 다시 불러오기</button>
        </div>
      </div>
      <div class="card" id="focusBanner" style="display:none; margin-bottom:12px;"></div>

      <div class="grid">
        <section class="card kpi"><p class="kTitle">DRP 대상 리스크 수</p><div class="kValue" id="kTarget">0</div></section>
        <section class="card kpi"><p class="kTitle">DR 절차 작성 수</p><div class="kValue" id="kWritten">0</div></section>
        <section class="card kpi"><p class="kTitle">확정 절차 수</p><div class="kValue" id="kFinal">0</div></section>
        <section class="card kpi"><p class="kTitle">미작성 절차 수</p><div class="kValue" id="kPending">0</div></section>

        <section class="card full">
          <div class="filters">
            <div class="field">
              <label for="teamFilter">팀 필터</label>
              <select id="teamFilter"><option value="">전체 팀</option></select>
            </div>
            <div class="field">
              <label for="drpStatusFilter">DRP 상태 필터</label>
              <select id="drpStatusFilter">
                <option value="">전체 상태</option>
                <option value="초안">초안</option>
                <option value="검토중">검토중</option>
                <option value="확정">확정</option>
              </select>
            </div>
            <label class="toggle"><input type="checkbox" id="bcpFinalOnly"/> 확정 전략만 보기</label>
            <label class="toggle"><input type="checkbox" id="criticalOnly" checked/> 중점관리 리스크만 보기</label>
            <div style="text-align:right;"><button class="btn" type="button" id="saveAllBtn">전체 저장</button></div>
          </div>
        </section>

        <section class="card full">
          <div class="tableWrap">
            <table>
              <thead>
                <tr>
                  <th>팀</th><th>핵심업무</th><th>업무등급</th><th>MTPD</th><th>RTO</th><th>중단 리스크</th><th>위험도</th><th>BCP 전략</th><th>DRP 상태</th><th>관리</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="../assets/sidebar.js"></script>
  <script src="../assets/demo-seed.js"></script>
  <script src="../assets/response-assets.js"></script>
  <script>
    (() => {
      if (window.BCMSDemoSeed) {
        window.BCMSDemoSeed.ensureDemoIfEmpty();
        window.BCMSDemoSeed.mountBanner('.wrap');
      }

      const KEY_BIA = 'bcmsBIAData';
      const KEY_RISK = 'bcmsRiskAssessment';
      const KEY_BCP = 'bcmsBCP';
      const KEY_DRP = 'bcmsDRP';

      const STATUS_OPTIONS = ['초안', '검토중', '확정'];
      const RESOURCE_OPTIONS = ['인력','시스템','데이터','설비','유틸리티','협력업체','예비부품','작업공간'];
      const OWNER_HINT = '예: 전기팀, SRE/플랫폼운영팀';

      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
      const parseJSON = (raw, fallback) => { try { return JSON.parse(raw); } catch { return fallback; } };
      const toNum = (v) => { const n = Number(v); return Number.isFinite(n) ? n : null; };
      const txt = (v, fb='-') => { const s = String(v ?? '').trim(); return s || fb; };
      const uniq = (arr) => [...new Set((arr || []).filter(Boolean))];

      const state = { rows: [] };
      const renderFocusBanner = () => {
        const banner = $('focusBanner');
        if (!banner) return;
        const focus = (window.ResponseAssetRegistry && ResponseAssetRegistry.readFocusTarget) ? ResponseAssetRegistry.readFocusTarget() : {};
        const matched = focus.source === 'incident_recommendation' && focus.assetId === 'strategy-drp-main';
        if (!matched) { banner.style.display = 'none'; return; }
        banner.style.display = '';
        banner.innerHTML = `<b>Incident ${esc(focus.incidentId || '-')}에서 추천된 DR 실행계획</b><div class="muted" style="margin-top:6px;">영향 서비스: ${esc(focus.serviceName || '-')}</div>`;
      };

      function get(key, fallback = []) {
        const val = parseJSON(localStorage.getItem(key) || 'null', fallback);
        return val ?? fallback;
      }

      function normalizeBia(raw) {
        const rows = Array.isArray(raw) ? raw : (raw && raw.team ? [raw] : []);
        return rows
          .map((row) => ({
            team: String(row.team || '').trim(),
            functions: Array.isArray(row.functions) ? row.functions : []
          }))
          .filter((row) => row.team)
          .flatMap((row) => row.functions.map((fn) => ({
            team: row.team,
            function: txt(fn.name || fn.function || fn.work, ''),
            importance: txt(fn.importance, '일반'),
            grade: txt(fn.grade, '일반'),
            mtpd: txt(fn.mtpd, '-'),
            rto: txt(fn.rto || `${fn.rtoValue ?? ''}${fn.rtoUnit ?? ''}`.trim(), '-'),
            impact: toNum(fn.impact || fn.overallImpact) ?? 3,
            coreFinal: !!fn.coreFinal
          })))
          .filter((x) => x.function);
      }

      function normalizeRisk(raw) {
        const rows = Array.isArray(raw) ? raw : (raw && raw.team ? [raw] : []);
        return rows
          .map((row) => ({ team: String(row.team || '').trim(), risks: Array.isArray(row.risks) ? row.risks : [] }))
          .filter((row) => row.team)
          .flatMap((row) => row.risks.map((risk) => {
            const impact = toNum(risk.impact) ?? 3;
            const likelihood = toNum(risk.likelihood || risk.like) ?? 1;
            const riskScore = toNum(risk.riskScore) ?? (impact * likelihood);
            const critical = risk.critical === undefined ? (riskScore >= 13) : !!risk.critical;
            return {
              team: row.team,
              function: txt(risk.function || risk.process || risk.work, ''),
              risk: txt(risk.risk || risk.threat || risk.hazard, ''),
              likelihood,
              riskScore,
              critical,
              riskLevel: txt(risk.riskLevel, riskScore >= 13 ? '높음' : (riskScore >= 6 ? '보통' : '낮음'))
            };
          }))
          .filter((x) => x.function && x.risk);
      }

      function normalizeBCP(raw) {
        const rows = Array.isArray(raw) ? raw : (raw && typeof raw === 'object' ? [raw] : []);
        const out = [];
        const push = (item, teamFallback = '') => {
          const team = txt(item.team || teamFallback, '미지정 팀');
          const strategyText = txt(item.strategyText || item.strategy || item.recovery, '');
          out.push({
            team,
            function: txt(item.function || item.coreFunction || item.work, ''),
            risk: txt(item.risk || item.riskName || item.threat, ''),
            riskScore: toNum(item.riskScore),
            critical: item.critical === undefined ? undefined : !!item.critical,
            strategyType: txt(item.strategyType, '-'),
            strategyText,
            requiredResources: Array.isArray(item.requiredResources) ? item.requiredResources.filter(Boolean) : [],
            bcpStatus: STATUS_OPTIONS.includes(item.status) ? item.status : '초안',
            importance: txt(item.importance, '일반'),
            grade: txt(item.grade, '일반'),
            mtpd: txt(item.mtpd, '-'),
            rto: txt(item.rto, '-'),
            impact: toNum(item.impact),
            coreFinal: !!item.coreFinal
          });
        };

        rows.forEach((row) => {
          if (Array.isArray(row?.strategies)) row.strategies.forEach((s) => push(s, row.team || ''));
          else if (row && typeof row === 'object') push(row, row.team || '');
        });

        return out.filter((x) => x.function && x.risk);
      }

      function normalizeDRP(raw) {
        const rows = Array.isArray(raw) ? raw : (raw && typeof raw === 'object' ? [raw] : []);
        const map = new Map();

        const put = (team, item) => {
          const key = `${team}||${txt(item.function, '')}||${txt(item.risk, '')}`;
          if (!txt(item.function, '') || !txt(item.risk, '')) return;
          const stepRaw = Array.isArray(item.steps) ? item.steps : [];
          const steps = stepRaw.map((step, idx) => {
            if (typeof step === 'string') {
              return { stepNo: idx + 1, action: step, owner: '', targetTime: '', verification: '' };
            }
            return {
              stepNo: toNum(step.stepNo) ?? (idx + 1),
              action: txt(step.action, ''),
              owner: txt(step.owner, ''),
              targetTime: txt(step.targetTime, ''),
              verification: txt(step.verification, '')
            };
          });

          map.set(key, {
            triggerCondition: txt(item.triggerCondition, ''),
            recoveryOverview: txt(item.recoveryOverview, ''),
            preChecks: Array.isArray(item.preChecks) ? item.preChecks : String(item.preChecks || '').split('\n').map((x) => x.trim()).filter(Boolean),
            steps,
            owners: Array.isArray(item.owners) ? item.owners.filter(Boolean) : String(item.owners || '').split(',').map((x) => x.trim()).filter(Boolean),
            completionCriteria: txt(item.completionCriteria, ''),
            notes: txt(item.notes, ''),
            requiredResources: Array.isArray(item.requiredResources) ? item.requiredResources.filter(Boolean) : [],
            status: STATUS_OPTIONS.includes(item.status) ? item.status : '초안'
          });
        };

        rows.forEach((row) => {
          if (Array.isArray(row?.procedures)) {
            const team = txt(row.team, '미지정 팀');
            row.procedures.forEach((p) => put(team, p));
          } else if (row && typeof row === 'object') {
            put(txt(row.team, '미지정 팀'), row);
          }
        });

        return map;
      }

      function loadRows() {
        const bia = normalizeBia(get(KEY_BIA, []));
        const risk = normalizeRisk(get(KEY_RISK, []));
        const bcp = normalizeBCP(get(KEY_BCP, []));
        const drpMap = normalizeDRP(get(KEY_DRP, []));

        const biaMap = new Map(bia.map((x) => [`${x.team}||${x.function}`, x]));
        const riskMap = new Map(risk.map((x) => [`${x.team}||${x.function}||${x.risk}`, x]));

        state.rows = bcp
          .map((b) => {
            const riskKey = `${b.team}||${b.function}||${b.risk}`;
            const r = riskMap.get(riskKey) || {};
            const bInfo = biaMap.get(`${b.team}||${b.function}`) || {};
            const riskScore = toNum(r.riskScore ?? b.riskScore) ?? 0;
            const critical = r.critical === undefined ? (b.critical === undefined ? riskScore >= 13 : !!b.critical) : !!r.critical;
            const hasStrategy = !!txt(b.strategyText, '');
            const statusDriven = ['검토중','확정'].includes(b.bcpStatus);

            if (!(hasStrategy || statusDriven)) return null;
            if (!(critical || riskScore >= 13)) return null;

            const key = `${b.team}||${b.function}||${b.risk}`;
            const d = drpMap.get(key) || {};
            const steps = Array.isArray(d.steps) && d.steps.length
              ? d.steps.map((s, i) => ({ ...s, stepNo: i + 1 }))
              : [{ stepNo: 1, action: '', owner: '', targetTime: '', verification: '' }];

            return {
              key,
              team: b.team,
              function: b.function,
              risk: b.risk,
              likelihood: toNum(r.likelihood) ?? 1,
              riskScore,
              critical,
              riskLevel: txt(r.riskLevel, riskScore >= 13 ? '높음' : '보통'),
              importance: txt(bInfo.importance ?? b.importance, '일반'),
              grade: txt(bInfo.grade ?? b.grade, '일반'),
              mtpd: txt(bInfo.mtpd ?? b.mtpd, '-'),
              rto: txt(bInfo.rto ?? b.rto, '-'),
              impact: toNum(bInfo.impact ?? b.impact) ?? 3,
              coreFinal: !!(bInfo.coreFinal ?? b.coreFinal),
              strategyType: txt(b.strategyType, '-'),
              strategyText: txt(b.strategyText, ''),
              requiredResources: uniq([...(b.requiredResources || []), ...(d.requiredResources || [])]),
              bcpStatus: b.bcpStatus,
              drpStatus: STATUS_OPTIONS.includes(d.status) ? d.status : '초안',
              recoveryOverview: txt(d.recoveryOverview, ''),
              triggerCondition: txt(d.triggerCondition, ''),
              preChecks: Array.isArray(d.preChecks) ? d.preChecks : [],
              steps,
              owners: Array.isArray(d.owners) ? d.owners : [],
              completionCriteria: txt(d.completionCriteria, ''),
              notes: txt(d.notes, '')
            };
          })
          .filter(Boolean)
          .sort((a, b) => (b.riskScore - a.riskScore) || a.team.localeCompare(b.team, 'ko'));
      }

      function setTeamFilterOptions() {
        const teams = uniq(state.rows.map((r) => r.team));
        $('teamFilter').innerHTML = '<option value="">전체 팀</option>' + teams.map((team) => `<option value="${esc(team)}">${esc(team)}</option>`).join('');
      }

      function filteredRows() {
        const team = $('teamFilter').value;
        const drpStatus = $('drpStatusFilter').value;
        const bcpFinalOnly = $('bcpFinalOnly').checked;
        const criticalOnly = $('criticalOnly').checked;

        return state.rows.filter((row) => {
          if (team && row.team !== team) return false;
          if (drpStatus && row.drpStatus !== drpStatus) return false;
          if (bcpFinalOnly && row.bcpStatus !== '확정') return false;
          if (criticalOnly && !(row.critical || row.riskScore >= 13)) return false;
          return true;
        });
      }

      function renderKpi() {
        const target = state.rows.length;
        const written = state.rows.filter((r) => r.steps.some((s) => txt(s.action, '') !== '')).length;
        const finalCount = state.rows.filter((r) => r.drpStatus === '확정').length;
        const pending = Math.max(target - written, 0);

        $('kTarget').textContent = String(target);
        $('kWritten').textContent = String(written);
        $('kFinal').textContent = String(finalCount);
        $('kPending').textContent = String(pending);
      }

      function buildStepRow(row, step, idx) {
        return `
          <div class="stepItem" data-step-index="${idx}">
            <input data-step-field="stepNo" value="${esc(step.stepNo || idx + 1)}" readonly/>
            <input data-step-field="action" value="${esc(step.action)}" placeholder="복구 실행 내용"/>
            <input data-step-field="owner" value="${esc(step.owner)}" placeholder="담당"/>
            <input data-step-field="targetTime" value="${esc(step.targetTime)}" placeholder="예: 10분"/>
            <input data-step-field="verification" value="${esc(step.verification)}" placeholder="완료 확인 기준"/>
            <button type="button" class="miniBtn danger" data-action="removeStep">삭제</button>
          </div>
        `;
      }

      function renderTable() {
        const rows = filteredRows();
        const html = rows.map((row) => {
          const levelBadge = (row.critical || row.riskScore >= 13) ? '<span class="badge high">중점관리</span>' : '<span class="badge">일반</span>';
          const prioBadge = row.bcpStatus === '확정' ? '<span class="badge prio">BCP 확정(우선 작성)</span>' : '<span class="badge">BCP ' + esc(row.bcpStatus) + '</span>';

          const resources = RESOURCE_OPTIONS.map((res) => `
            <label class="resourceChip"><input type="checkbox" data-detail-field="requiredResources" data-value="${esc(res)}" ${row.requiredResources.includes(res) ? 'checked' : ''}/> ${esc(res)}</label>
          `).join('');

          return `
            <tr data-key="${esc(row.key)}">
              <td>${esc(row.team)}</td>
              <td>${esc(row.function)}</td>
              <td>${esc(row.grade)}</td>
              <td>${esc(row.mtpd)}</td>
              <td>${esc(row.rto)}</td>
              <td>${esc(row.risk)}<div style="margin-top:4px;">${levelBadge}</div></td>
              <td>${esc(row.riskScore)}<div style="margin-top:4px;"><small>L:${esc(row.likelihood)} / ${esc(row.riskLevel)}</small></div></td>
              <td>${esc(row.strategyText)}<div style="margin-top:4px;"><small>${esc(row.strategyType)}</small></div></td>
              <td><span class="badge ok">${esc(row.drpStatus)}</span><div style="margin-top:4px;">${prioBadge}</div></td>
              <td><div class="rowActions"><button class="miniBtn" type="button" data-action="toggle">상세 보기</button><button class="miniBtn primary" type="button" data-action="save">저장</button></div></td>
            </tr>
            <tr class="detailRow hidden" data-detail="${esc(row.key)}">
              <td colspan="10" class="detailCell">
                <div class="detailGrid">
                  <div class="detailField"><label>복구 개요</label><input data-detail-field="recoveryOverview" value="${esc(row.recoveryOverview)}" placeholder="해당 리스크에 대한 복구 절차 개요"/></div>
                  <div class="detailField"><label>발동 조건</label><input data-detail-field="triggerCondition" value="${esc(row.triggerCondition)}" placeholder="UPS 장애로 이중화 전환 실패 시"/></div>
                  <div class="detailField"><label>담당 조직/역할 (쉼표 구분)</label><input data-detail-field="ownersText" value="${esc(row.owners.join(', '))}" placeholder="${esc(OWNER_HINT)}"/></div>
                  <div class="detailField"><label>절차 상태</label><select data-detail-field="drpStatus">${STATUS_OPTIONS.map((s) => `<option value="${esc(s)}" ${row.drpStatus === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></div>

                  <div class="detailField span2"><label>사전 확인사항 (줄바꿈으로 구분)</label><textarea data-detail-field="preChecksText" placeholder="관련 알람 확인&#10;영향 범위 확인&#10;승인권자 연락">${esc(row.preChecks.join('\n'))}</textarea></div>

                  <div class="detailField span2"><label>복구 절차 단계 목록</label><div class="steps" data-steps-box="1">${row.steps.map((step, idx) => buildStepRow(row, step, idx)).join('')}</div><div style="margin-top:6px;"><button class="miniBtn" type="button" data-action="addStep">단계 추가</button></div></div>

                  <div class="detailField span2"><label>필요 자원</label><div class="resourceBox">${resources}</div></div>
                  <div class="detailField span2"><label>완료 확인 기준</label><textarea data-detail-field="completionCriteria" placeholder="주요 경보 해제 확인 / 서비스 정상 응답 확인">${esc(row.completionCriteria)}</textarea></div>
                  <div class="detailField span2"><label>비고</label><textarea data-detail-field="notes" placeholder="특이사항 기록">${esc(row.notes)}</textarea></div>

                  <div class="detailField span2"><small>연동 정보: 중요도 ${esc(row.importance)} · 영향도 ${esc(row.impact)} · Core Final ${row.coreFinal ? 'Y' : 'N'} · BCP 상태 ${esc(row.bcpStatus)}</small></div>
                </div>
              </td>
            </tr>
          `;
        }).join('');

        $('tbody').innerHTML = html || '<tr><td colspan="10" class="empty">DRP 대상이 없습니다. 중점관리 리스크에 BCP 전략을 먼저 입력해 주세요.</td></tr>';
        renderKpi();
      }

      function updateRow(key, updater) {
        const idx = state.rows.findIndex((r) => r.key === key);
        if (idx < 0) return;
        state.rows[idx] = updater({ ...state.rows[idx], steps: state.rows[idx].steps.map((s) => ({ ...s })) });
      }

      function saveToStorage() {
        const teamMap = new Map();
        state.rows.forEach((row) => {
          if (!teamMap.has(row.team)) teamMap.set(row.team, { team: row.team, procedures: [] });
          teamMap.get(row.team).procedures.push({
            function: row.function,
            risk: row.risk,
            riskScore: row.riskScore,
            critical: row.critical,
            importance: row.importance,
            grade: row.grade,
            mtpd: row.mtpd,
            rto: row.rto,
            strategyType: row.strategyType,
            strategyText: row.strategyText,
            triggerCondition: row.triggerCondition,
            recoveryOverview: row.recoveryOverview,
            preChecks: row.preChecks,
            steps: row.steps.map((step, i) => ({
              stepNo: i + 1,
              action: txt(step.action, ''),
              owner: txt(step.owner, ''),
              targetTime: txt(step.targetTime, ''),
              verification: txt(step.verification, '')
            })),
            owners: row.owners,
            requiredResources: row.requiredResources,
            completionCriteria: row.completionCriteria,
            status: row.drpStatus,
            notes: row.notes
          });
        });

        localStorage.setItem(KEY_DRP, JSON.stringify([...teamMap.values()]));
      }

      $('tbody').addEventListener('click', (e) => {
        const mainTr = e.target.closest('tr[data-key]');
        const detailTr = e.target.closest('tr[data-detail]');
        const key = mainTr?.dataset.key || detailTr?.dataset.detail;
        if (!key) return;

        if (e.target.closest('[data-action="toggle"]')) {
          const detail = document.querySelector(`tr[data-detail="${CSS.escape(key)}"]`);
          if (detail) detail.classList.toggle('hidden');
          return;
        }

        if (e.target.closest('[data-action="save"]')) {
          saveToStorage();
          const btn = e.target.closest('[data-action="save"]');
          btn.textContent = '저장됨';
          setTimeout(() => { btn.textContent = '저장'; }, 900);
          return;
        }

        if (e.target.closest('[data-action="addStep"]')) {
          updateRow(key, (row) => {
            row.steps.push({ stepNo: row.steps.length + 1, action: '', owner: '', targetTime: '', verification: '' });
            return row;
          });
          renderTable();
          const detail = document.querySelector(`tr[data-detail="${CSS.escape(key)}"]`);
          if (detail) detail.classList.remove('hidden');
          return;
        }

        if (e.target.closest('[data-action="removeStep"]')) {
          const stepItem = e.target.closest('.stepItem');
          const idx = Number(stepItem?.dataset.stepIndex);
          updateRow(key, (row) => {
            if (row.steps.length <= 1) {
              row.steps[0] = { stepNo: 1, action: '', owner: '', targetTime: '', verification: '' };
              return row;
            }
            row.steps = row.steps.filter((_, i) => i !== idx).map((step, i) => ({ ...step, stepNo: i + 1 }));
            return row;
          });
          renderTable();
          const detail = document.querySelector(`tr[data-detail="${CSS.escape(key)}"]`);
          if (detail) detail.classList.remove('hidden');
        }
      });

      $('tbody').addEventListener('input', (e) => {
        const detailTr = e.target.closest('tr[data-detail]');
        if (!detailTr) return;
        const key = detailTr.dataset.detail;

        if (e.target.matches('[data-detail-field]')) {
          const field = e.target.dataset.detailField;
          updateRow(key, (row) => {
            if (field === 'preChecksText') row.preChecks = e.target.value.split('\n').map((x) => x.trim()).filter(Boolean);
            else if (field === 'ownersText') row.owners = e.target.value.split(',').map((x) => x.trim()).filter(Boolean);
            else if (field === 'drpStatus') row.drpStatus = e.target.value;
            else row[field] = e.target.value;
            return row;
          });
          renderKpi();
          return;
        }

        const stepItem = e.target.closest('.stepItem');
        if (stepItem && e.target.matches('[data-step-field]')) {
          const idx = Number(stepItem.dataset.stepIndex);
          const field = e.target.dataset.stepField;
          updateRow(key, (row) => {
            if (!row.steps[idx]) return row;
            row.steps[idx][field] = e.target.value;
            return row;
          });
        }
      });

      $('tbody').addEventListener('change', (e) => {
        const detailTr = e.target.closest('tr[data-detail]');
        if (!detailTr) return;
        const key = detailTr.dataset.detail;

        if (e.target.dataset.detailField === 'requiredResources') {
          const selected = [...detailTr.querySelectorAll('input[data-detail-field="requiredResources"]:checked')].map((el) => el.dataset.value);
          updateRow(key, (row) => {
            row.requiredResources = selected;
            return row;
          });
          return;
        }

        if (e.target.dataset.detailField === 'drpStatus') {
          updateRow(key, (row) => {
            row.drpStatus = e.target.value;
            return row;
          });
          renderKpi();
        }
      });

      ['teamFilter','drpStatusFilter','bcpFinalOnly','criticalOnly'].forEach((id) => {
        $(id).addEventListener('change', renderTable);
      });

      $('saveAllBtn').addEventListener('click', () => {
        saveToStorage();
        $('saveAllBtn').textContent = '전체 저장됨';
        setTimeout(() => { $('saveAllBtn').textContent = '전체 저장'; }, 1000);
      });

      $('reloadBtn').addEventListener('click', () => {
        loadRows();
        setTeamFilterOptions();
        renderTable();
      });

      loadRows();
      setTeamFilterOptions();
      renderFocusBanner();
      renderTable();
    })();
  </script>
</body>
</html>
