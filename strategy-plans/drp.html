<!doctype html>

    .btn{ text-decoration:none; padding:10px 13px; border:1px solid rgba(15,23,42,.14); border-radius:999px; background:rgba(255,255,255,.96); color:#0f172a; font-size:14px; font-weight:900; }

  <aside id="sidebarMount"></aside>

    <div class="wrap">

        <p class="note">상세 DR 실행 절차와 체크리스트는 Procedure Library의 DRP 문서와 연계됩니다.</p>
