<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Evidence Management (증적 관리) | BCMS Portal v2</title>
  <link rel="stylesheet" href="../assets/style.css"/>
  <style>
    .pageGrid{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:14px; }
    .formCard,.listCard{ grid-column:span 12; }
    .formGrid{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:10px; }
    .col-6{ grid-column:span 6; } .col-4{ grid-column:span 4; } .col-3{ grid-column:span 3; } .col-12{ grid-column:span 12; }
    .field label{ display:block; margin-bottom:6px; font-size:13px; font-weight:800; }
    .field input,.field select,.field textarea{ width:100%; padding:10px 12px; }
    .field textarea{ min-height:86px; resize:vertical; }
    .pickerBox{ border:1px solid var(--line); border-radius:12px; padding:8px; max-height:128px; overflow:auto; }
    .pickerPill{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--lineStrong); border-radius:999px; padding:4px 10px; font-size:12px; margin:0 6px 6px 0; }
    .pickerPill button{ border:none !important; background:transparent !important; padding:0 !important; color:#475569 !important; cursor:pointer; }
    .toolbar{ display:grid; grid-template-columns:1fr 180px 180px; gap:10px; margin-bottom:10px; }
    .tableWrap{ overflow:auto; }
    table{ width:100%; min-width:1120px; }
    th,td{ padding:10px 12px; font-size:14px; text-align:left; vertical-align:top; }
    .actions{ display:flex; gap:6px; }
    .state{ display:inline-flex; align-items:center; border-radius:999px; padding:4px 10px; border:1px solid var(--lineStrong); font-size:12px; font-weight:800; }
    .pending{ background:rgba(217,119,6,.12); color:#92400e; border-color:rgba(217,119,6,.32); }
    .done{ background:rgba(22,163,74,.12); color:#166534; border-color:rgba(22,163,74,.32); }
    .focusRow td{ background:rgba(37,99,235,.08); }
    .focusBadge{ display:inline-flex; align-items:center; border-radius:999px; border:1px solid rgba(37,99,235,.35); background:rgba(37,99,235,.12); color:#1d4ed8; font-size:11px; font-weight:900; padding:3px 8px; margin-left:6px; }
    .sub{ font-size:12px; color:var(--muted); }
    @media (max-width:980px){ .toolbar{ grid-template-columns:1fr; } .col-6,.col-4,.col-3{ grid-column:span 12; } }
  </style>
</head>
<body>
  <aside id="sidebarMount"></aside>
  <main class="main">
    <div class="wrap">
      <h1 class="page-title">🧾 Evidence Management (증적 관리)</h1>

      <section class="pageGrid">
        <article class="card formCard">
          <h3>증적 등록</h3>
          <form id="evidenceForm" class="formGrid">
            <div class="field col-3">
              <label for="evType">증적 유형 *</label>
              <select id="evType" required>
                <option>훈련</option><option selected>장애대응</option><option>DR전환</option><option>테스트</option><option>정책개정</option><option>기타</option>
              </select>
            </div>
            <div class="field col-3">
              <label for="evIncident">관련 Incident (선택)</label>
              <select id="evIncident"><option value="">선택 안함</option></select>
            </div>
            <div class="field col-3">
              <label for="evCollectedAt">발생/수집 일시 *</label>
              <input id="evCollectedAt" type="datetime-local" required/>
            </div>
            <div class="field col-3">
              <label for="evStatus">상태 *</label>
              <select id="evStatus" required><option selected>확인필요</option><option>확인완료</option></select>
            </div>

            <div class="field col-12">
              <label for="serviceSearch">관련 서비스 (선택)</label>
              <input id="serviceSearch" type="search" placeholder="서비스명 검색"/>
              <div id="servicePicker" class="pickerBox" style="margin-top:8px;"></div>
              <div id="selectedServicePills" style="margin-top:6px;"></div>
            </div>

            <div class="field col-8">
              <label for="evDescription">설명 *</label>
              <textarea id="evDescription" required placeholder="증적 내용 요약"></textarea>
            </div>
            <div class="field col-4">
              <label for="evAttachment">첨부 (선택)</label>
              <input id="evAttachment" type="file"/>
              <p id="attachmentInfo" class="sub" style="margin-top:8px;">파일 미선택</p>
            </div>

            <div class="col-12 actions">
              <button class="btn" type="submit">증적 등록</button>
              <button class="btn" id="resetSamplesBtn" type="button">샘플 데이터 리셋</button>
            </div>
          </form>
        </article>

        <article class="card listCard">
          <h3>증적 목록</h3>
          <div class="toolbar">
            <input id="searchInput" type="search" placeholder="설명/서비스/Incident 검색"/>
            <select id="typeFilter">
              <option value="전체">전체 유형</option>
              <option>훈련</option><option>장애대응</option><option>DR전환</option><option>테스트</option><option>정책개정</option><option>기타</option>
            </select>
            <select id="statusFilter">
              <option value="전체">전체 상태</option>
              <option>확인필요</option><option>확인완료</option>
            </select>
          </div>

          <div class="tableWrap">
            <table>
              <thead>
                <tr>
                  <th>등록일시</th><th>유형</th><th>관련 서비스</th><th>관련 조직</th><th>관련 Incident</th><th>설명</th><th>첨부파일</th><th>상태(토글)</th><th>작업</th>
                </tr>
              </thead>
              <tbody id="evidenceBody"></tbody>
            </table>
          </div>
        </article>
      </section>
    </div>
  </main>

  <script src="../assets/sidebar.js"></script>
  <script src="../assets/data-store.js"></script>
  <script>
    (() => {
      const EVIDENCE_KEY = (window.DataStore && DataStore.KEY_EVIDENCE) || 'bcms_audit_evidence_v1';
      const EVIDENCE_ITEMS_KEY = 'bcmsEvidenceItems';
      const SELECTED_EVIDENCE_KEY = 'bcms_selected_evidence';
      const FOCUS_TARGET_KEY = 'bcmsFocusTarget';
      const SERVICE_KEY = (window.DataStore && DataStore.KEY_SERVICE_REGISTRY) || 'bcms_service_registry_v1';
      const INCIDENT_KEY = (window.DataStore && DataStore.KEY_INCIDENTS) || 'bcms_incidents_v1';

      const store = (window.DataStore && DataStore.get && DataStore.set && DataStore.update) ? DataStore : {
        get: (k, f) => { try { const raw = localStorage.getItem(k); if (raw === null) return f; return JSON.parse(raw); } catch { return f; } },
        set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
        update: (k, fn) => { const current = (() => { try { const raw = localStorage.getItem(k); return raw ? JSON.parse(raw) : []; } catch { return []; } })(); const next = fn(current); localStorage.setItem(k, JSON.stringify(next)); return next; }
      };

      const nowISO = () => (window.DataStore && DataStore.nowISO ? DataStore.nowISO() : new Date().toISOString());
      const uid = () => (window.DataStore && DataStore.uid ? DataStore.uid('EVD') : `EVD-${Date.now()}`);
      const toLocalInput = (iso) => new Date(iso).toISOString().slice(0, 16);
      const toText = (iso) => { const d = new Date(iso); return Number.isNaN(d.getTime()) ? '-' : d.toLocaleString('ko-KR', { hour12:false }); };

      const evForm = document.getElementById('evidenceForm');
      const evType = document.getElementById('evType');
      const evIncident = document.getElementById('evIncident');
      const evCollectedAt = document.getElementById('evCollectedAt');
      const evDescription = document.getElementById('evDescription');
      const evAttachment = document.getElementById('evAttachment');
      const evStatus = document.getElementById('evStatus');
      const attachmentInfo = document.getElementById('attachmentInfo');
      const serviceSearch = document.getElementById('serviceSearch');
      const servicePicker = document.getElementById('servicePicker');
      const selectedServicePills = document.getElementById('selectedServicePills');
      const searchInput = document.getElementById('searchInput');
      const typeFilter = document.getElementById('typeFilter');
      const statusFilter = document.getElementById('statusFilter');
      const evidenceBody = document.getElementById('evidenceBody');
      const resetSamplesBtn = document.getElementById('resetSamplesBtn');
      const query = new URLSearchParams(location.search);

      const readSelectedEvidence = () => {
        const fromQuery = (query.get('focus') || '').trim();
        let fromStorage = '';
        try {
          const parsed = JSON.parse(localStorage.getItem(SELECTED_EVIDENCE_KEY) || 'null');
          fromStorage = (parsed?.evidenceId || '').trim();
        } catch {
          fromStorage = '';
        }
        try {
          const focus = JSON.parse(localStorage.getItem(FOCUS_TARGET_KEY) || 'null');
          if (focus?.type === 'evidence' && focus?.id) fromStorage = String(focus.id).trim();
        } catch {}
        localStorage.removeItem(SELECTED_EVIDENCE_KEY);
        localStorage.removeItem(FOCUS_TARGET_KEY);
        return fromQuery || fromStorage;
      };
      const selectedEvidenceId = readSelectedEvidence();
      let focusDone = false;

      const services = (store.get(SERVICE_KEY, []) || []).filter((v) => v && v.id && v.name);
      const incidentState = store.get(INCIDENT_KEY, null);
      const incidentOptions = [];
      if (incidentState && incidentState.currentIncident) {
        const ci = incidentState.currentIncident;
        const label = `${ci.status || 'Incident'} / ${ci.startTime || '-'} / ${ci.severity || '-'}`;
        incidentOptions.push({ id: ci.id || `INC-CURRENT-${Date.now()}`, label });
      }

      const sampleData = () => ([
        { id: uid(), createdAt: nowISO(), type:'장애대응', services:['결제 API','인증 서비스'], relatedOrgText:'IT서비스운영본부 / 애플리케이션운영팀', incident:'INC-20260305-AX1B', description:'장애 전환 및 우회 처리 로그 정리', attachment:{name:'incident-log.txt',size:18432}, status:'확인필요' },
        { id: uid(), createdAt: nowISO(), type:'DR전환', services:['DB 클러스터'], incident:'INC-20260304-PQ2R', description:'DR센터 전환 체크리스트 완료 증적', attachment:{name:'dr-checklist.pdf',size:98212}, status:'확인완료' },
        { id: uid(), createdAt: nowISO(), type:'훈련', services:['고객 포털'], incident:'', description:'분기 복구 훈련 결과 보고', attachment:{name:'training-result.xlsx',size:64122}, status:'확인필요' },
        { id: uid(), createdAt: nowISO(), type:'테스트', services:['DNS','VPN'], incident:'', description:'장애 복구 시나리오 테스트 캡처', attachment:{name:'test-capture.zip',size:124012}, status:'확인완료' },
        { id: uid(), createdAt: nowISO(), type:'정책개정', services:['파일 스토리지'], incident:'', description:'증적 보존기간 정책 업데이트', attachment:{name:'policy-v2.docx',size:42210}, status:'확인필요' },
        { id: uid(), createdAt: nowISO(), type:'기타', services:['모니터링'], incident:'', description:'외부 벤더 점검 회신', attachment:{name:'vendor-mail.eml',size:13220}, status:'확인완료' },
        { id: uid(), createdAt: nowISO(), type:'장애대응', services:['로그 수집','배치 처리'], incident:'INC-20260303-GH7T', description:'오류 배치 재처리 이력', attachment:{name:'batch-rerun.csv',size:24112}, status:'확인필요' },
        { id: uid(), createdAt: nowISO(), type:'테스트', services:['결제 API'], incident:'', description:'결제 장애 재현 테스트 리포트', attachment:{name:'payment-test.pdf',size:78123}, status:'확인완료' },
      ]);

      const seedIfEmpty = () => {
        const modernRows = store.get(EVIDENCE_ITEMS_KEY, null);
        const rows = Array.isArray(modernRows) ? modernRows : store.get(EVIDENCE_KEY, null);
        if (!Array.isArray(rows) || !rows.length) {
          const seeds = sampleData();
          store.set(EVIDENCE_KEY, seeds);
          store.set(EVIDENCE_ITEMS_KEY, seeds);
          return seeds;
        }
        return rows;
      };

      let selectedServiceIds = [];
      let rows = seedIfEmpty();

      const renderIncidentOptions = () => {
        evIncident.innerHTML = '<option value="">선택 안함</option>';
        incidentOptions.forEach((it) => {
          const opt = document.createElement('option');
          opt.value = it.id; opt.textContent = it.label;
          evIncident.appendChild(opt);
        });
      };

      const renderServicePicker = () => {
        const q = (serviceSearch.value || '').trim().toLowerCase();
        const filtered = services.filter((s) => !q || s.name.toLowerCase().includes(q));
        servicePicker.innerHTML = '';
        if (!services.length) { servicePicker.innerHTML = '<div class="sub">등록된 서비스가 없습니다.</div>'; return; }
        if (!filtered.length) { servicePicker.innerHTML = '<div class="sub">검색 결과 없음</div>'; return; }

        filtered.forEach((svc) => {
          const label = document.createElement('label');
          label.className = 'pickerPill';
          label.innerHTML = `<input type="checkbox" data-id="${svc.id}" ${selectedServiceIds.includes(svc.id) ? 'checked' : ''}/> ${svc.name}`;
          servicePicker.appendChild(label);
        });
      };

      const renderSelectedPills = () => {
        selectedServicePills.innerHTML = '';
        const map = new Map(services.map((s) => [s.id, s.name]));
        selectedServiceIds.forEach((id) => {
          const name = map.get(id); if (!name) return;
          const span = document.createElement('span');
          span.className = 'pickerPill';
          span.innerHTML = `${name} <button type="button" data-remove="${id}">×</button>`;
          selectedServicePills.appendChild(span);
        });
      };

      const readAttachment = () => {
        const file = evAttachment.files && evAttachment.files[0];
        if (!file) return null;
        return { name: file.name, size: file.size };
      };

      const saveRows = () => { store.set(EVIDENCE_KEY, rows); store.set(EVIDENCE_ITEMS_KEY, rows); };

      const filteredRows = () => {
        const q = (searchInput.value || '').trim().toLowerCase();
        return rows.filter((r) => {
          const matchQ = !q || (r.description || '').toLowerCase().includes(q) || (r.incident || '').toLowerCase().includes(q) || (r.relatedOrgText || '').toLowerCase().includes(q) || (r.services || []).join(', ').toLowerCase().includes(q);
          const matchType = typeFilter.value === '전체' || r.type === typeFilter.value;
          const matchStatus = statusFilter.value === '전체' || r.status === statusFilter.value;
          return matchQ && matchType && matchStatus;
        });
      };

      const renderTable = () => {
        evidenceBody.innerHTML = '';
        const view = filteredRows();
        if (!view.length) {
          evidenceBody.innerHTML = '<tr><td colspan="9" class="sub">조건에 맞는 증적이 없습니다.</td></tr>';
          return;
        }

        view.forEach((r) => {
          const tr = document.createElement('tr');
          const focused = selectedEvidenceId && r.id === selectedEvidenceId;
          const stateClass = r.status === '확인완료' ? 'done' : 'pending';
          tr.dataset.evidenceId = r.id;
          if (focused) tr.classList.add('focusRow');
          const orgUnits = Array.isArray(r.relatedOrgUnits) ? r.relatedOrgUnits.filter(Boolean).join(', ') : '';
          tr.innerHTML = `
            <td>${toText(r.createdAt)}</td>
            <td>${r.type}</td>
            <td>${(r.services || []).join(', ') || '-'}</td>
            <td>${orgUnits || r.relatedOrgText || '-'}</td>
            <td>${r.incident || '-'}</td>
            <td>${r.description || '-'}${focused ? '<span class="focusBadge">현재 선택 항목</span>' : ''}</td>
            <td>${r.attachment ? `${r.attachment.name} (${Math.round(r.attachment.size / 1024)}KB)` : '-'}</td>
            <td><button type="button" class="state ${stateClass}" data-toggle="${r.id}">${r.status}</button></td>
            <td><button type="button" class="btn" data-delete="${r.id}">삭제</button></td>
          `;
          evidenceBody.appendChild(tr);
        });

        if (selectedEvidenceId && !focusDone) {
          const target = evidenceBody.querySelector(`tr[data-evidence-id="${CSS.escape(selectedEvidenceId)}"]`);
          if (target) {
            target.scrollIntoView({ behavior:'smooth', block:'center' });
            focusDone = true;
          }
        }
      };

      evAttachment.addEventListener('change', () => {
        const att = readAttachment();
        attachmentInfo.textContent = att ? `${att.name} / ${Math.round(att.size / 1024)}KB` : '파일 미선택';
      });

      servicePicker.addEventListener('change', (e) => {
        if (!e.target.matches('input[type="checkbox"][data-id]')) return;
        const id = e.target.getAttribute('data-id');
        const set = new Set(selectedServiceIds);
        if (e.target.checked) set.add(id); else set.delete(id);
        selectedServiceIds = [...set];
        renderServicePicker();
        renderSelectedPills();
      });

      selectedServicePills.addEventListener('click', (e) => {
        const id = e.target.getAttribute('data-remove');
        if (!id) return;
        selectedServiceIds = selectedServiceIds.filter((v) => v !== id);
        renderServicePicker();
        renderSelectedPills();
      });

      evForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const map = new Map(services.map((s) => [s.id, s.name]));
        const serviceNames = selectedServiceIds.map((id) => map.get(id)).filter(Boolean);
        const incidentText = evIncident.value ? evIncident.options[evIncident.selectedIndex].textContent : '';
        const item = {
          id: uid(),
          createdAt: new Date(evCollectedAt.value).toISOString(),
          type: evType.value,
          services: serviceNames,
          relatedOrgText: '-',
          incident: incidentText,
          description: evDescription.value.trim(),
          attachment: readAttachment(),
          status: evStatus.value,
        };
        rows.unshift(item);
        saveRows();
        evForm.reset();
        evType.value = '장애대응';
        evStatus.value = '확인필요';
        evCollectedAt.value = toLocalInput(nowISO());
        selectedServiceIds = [];
        attachmentInfo.textContent = '파일 미선택';
        renderServicePicker();
        renderSelectedPills();
        renderTable();
      });

      evidenceBody.addEventListener('click', (e) => {
        const toggleId = e.target.getAttribute('data-toggle');
        const deleteId = e.target.getAttribute('data-delete');
        if (toggleId) {
          rows = rows.map((r) => r.id === toggleId ? { ...r, status: r.status === '확인완료' ? '확인필요' : '확인완료' } : r);
          saveRows();
          renderTable();
          return;
        }
        if (deleteId) {
          rows = rows.filter((r) => r.id !== deleteId);
          saveRows();
          renderTable();
        }
      });

      searchInput.addEventListener('input', renderTable);
      typeFilter.addEventListener('change', renderTable);
      statusFilter.addEventListener('change', renderTable);
      serviceSearch.addEventListener('input', renderServicePicker);

      resetSamplesBtn.addEventListener('click', () => {
        rows = sampleData();
        saveRows();
        renderTable();
      });

      renderIncidentOptions();
      evCollectedAt.value = toLocalInput(nowISO());
      renderServicePicker();
      renderSelectedPills();
      renderTable();
    })();
  </script>
</body>
</html>
