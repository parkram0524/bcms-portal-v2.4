<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CAPA Management (개선조치 관리) | BCMS Portal v2</title>
  <link rel="stylesheet" href="../assets/style.css"/>
  <style>
    .pageGrid{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:14px; }
    .formCard,.listCard{ grid-column:span 12; }
    .formGrid{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:10px; }
    .col-6{ grid-column:span 6; } .col-4{ grid-column:span 4; } .col-3{ grid-column:span 3; } .col-12{ grid-column:span 12; }
    .field label{ display:block; margin-bottom:6px; font-size:13px; font-weight:800; }
    .field input,.field select,.field textarea{ width:100%; padding:10px 12px; }
    .field textarea{ min-height:90px; resize:vertical; }
    .toolbar{ display:grid; grid-template-columns:1fr 160px 160px 170px; gap:10px; margin-bottom:10px; }
    .tableWrap{ overflow:auto; }
    table{ width:100%; min-width:1250px; }
    th,td{ padding:10px 12px; font-size:14px; text-align:left; vertical-align:top; }
    .actions{ display:flex; gap:6px; flex-wrap:wrap; }
    .tag{ display:inline-flex; align-items:center; border-radius:999px; padding:4px 10px; border:1px solid var(--lineStrong); font-size:12px; font-weight:800; }
    .prio-low{ background:rgba(34,197,94,.10); color:#166534; border-color:rgba(34,197,94,.3); }
    .prio-mid{ background:rgba(234,179,8,.16); color:#854d0e; border-color:rgba(234,179,8,.35); }
    .prio-high{ background:rgba(249,115,22,.14); color:#9a3412; border-color:rgba(249,115,22,.35); }
    .prio-critical{ background:rgba(239,68,68,.12); color:#991b1b; border-color:rgba(239,68,68,.35); }
    .focusRow td{ background:rgba(37,99,235,.08); }
    .focusBadge{ display:inline-flex; align-items:center; border-radius:999px; border:1px solid rgba(37,99,235,.35); background:rgba(37,99,235,.12); color:#1d4ed8; font-size:11px; font-weight:900; padding:3px 8px; margin-left:6px; }
    .sub{ font-size:12px; color:var(--muted); }
    @media (max-width:1024px){ .toolbar{ grid-template-columns:1fr; } .col-6,.col-4,.col-3{ grid-column:span 12; } }
  </style>
</head>
<body>
  <aside id="sidebarMount"></aside>
  <main class="main">
    <div class="wrap">
      <h1 class="page-title">🛠️ CAPA Management (개선조치 관리)</h1>

      <section class="pageGrid">
        <article class="card formCard">
          <h3>CAPA 등록 / 수정</h3>
          <form id="capaForm" class="formGrid">
            <input id="capaId" type="hidden"/>

            <div class="field col-6"><label for="title">제목 *</label><input id="title" required/></div>
            <div class="field col-3"><label for="cause">원인 분류 *</label><select id="cause" required><option>프로세스</option><option>시스템</option><option>인력</option><option>협력사</option><option>기타</option></select></div>
            <div class="field col-3"><label for="incident">관련 Incident (선택)</label><select id="incident"><option value="">선택 안함</option></select></div>

            <div class="field col-6"><label for="service">관련 서비스 (선택)</label><input id="service" placeholder="예: 결제 API, 고객 포털" list="serviceList"/><datalist id="serviceList"></datalist></div>
            <div class="field col-6"><label for="orgUnit">관련 조직 (선택)</label><input id="orgUnit" placeholder="예: IT서비스운영본부 / SRE/플랫폼운영팀"/></div>
            <div class="field col-3"><label for="owner">담당자 *</label><input id="owner" required placeholder="예: 김운영"/></div>
            <div class="field col-3"><label for="dueDate">완료 기한 *</label><input id="dueDate" type="date" required/></div>

            <div class="field col-6"><label for="actionPlan">조치 내용 *</label><textarea id="actionPlan" required></textarea></div>
            <div class="field col-3"><label for="status">상태 *</label><select id="status" required><option>미착수</option><option>진행중</option><option>완료</option></select></div>
            <div class="field col-3"><label for="priority">우선순위 *</label><select id="priority" required><option>낮음</option><option selected>보통</option><option>높음</option><option>매우높음</option></select></div>

            <div class="col-12 actions">
              <button class="btn" type="submit">CAPA 등록</button>
              <button class="btn" id="resetBtn" type="button">샘플 데이터 리셋</button>
            </div>
          </form>
        </article>

        <article class="card listCard">
          <h3>CAPA 목록</h3>
          <div class="toolbar">
            <input id="searchInput" type="search" placeholder="제목/담당자/서비스 검색"/>
            <select id="statusFilter"><option value="전체">전체 상태</option><option>미착수</option><option>진행중</option><option>완료</option></select>
            <select id="priorityFilter"><option value="전체">전체 우선순위</option><option>낮음</option><option>보통</option><option>높음</option><option>매우높음</option></select>
            <select id="causeFilter"><option value="전체">전체 원인</option><option>프로세스</option><option>시스템</option><option>인력</option><option>협력사</option><option>기타</option></select>
          </div>
          <div class="tableWrap">
            <table>
              <thead><tr><th>등록일</th><th>제목</th><th>우선순위</th><th>상태</th><th>담당자</th><th>기한</th><th>관련 Incident</th><th>관련 서비스</th><th>관련 조직</th><th>최종수정</th><th>작업</th></tr></thead>
              <tbody id="capaBody"></tbody>
            </table>
          </div>
        </article>
      </section>
    </div>
  </main>

  <script src="../assets/sidebar.js"></script>
  <script src="../assets/data-store.js"></script>
  <script>
    (() => {
      const KEY = (window.DataStore && DataStore.KEY_CAPA) || 'bcms_capa_v1';
      const ACTION_ITEMS_KEY = 'bcmsActionItems';
      const INCIDENT_KEY = (window.DataStore && DataStore.KEY_INCIDENTS) || 'bcms_incidents_v1';
      const SERVICE_KEY = (window.DataStore && DataStore.KEY_SERVICE_REGISTRY) || 'bcms_service_registry_v1';
      const SELECTED_CAPA_KEY = 'bcms_selected_capa';
      const FOCUS_TARGET_KEY = 'bcmsFocusTarget';
      const store = (window.DataStore && DataStore.get && DataStore.set && DataStore.update) ? DataStore : {
        get: (k,f) => { try { const raw=localStorage.getItem(k); if(raw===null) return f; return JSON.parse(raw);} catch { return f; } },
        set: (k,v) => localStorage.setItem(k, JSON.stringify(v)),
        update: (k,fn) => { const cur = (()=>{ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):[];}catch{return[];} })(); const next=fn(cur); localStorage.setItem(k, JSON.stringify(next)); return next; }
      };
      const nowISO = () => (window.DataStore && DataStore.nowISO ? DataStore.nowISO() : new Date().toISOString());
      const uid = () => (window.DataStore && DataStore.uid ? DataStore.uid('CAPA') : `CAPA-${Date.now()}`);
      const toDate = (iso) => { const d=new Date(iso); return Number.isNaN(d.getTime())?'-':d.toLocaleDateString('ko-KR'); };
      const toDateTime = (iso) => { const d=new Date(iso); return Number.isNaN(d.getTime())?'-':d.toLocaleString('ko-KR',{hour12:false}); };

      const title=document.getElementById('title');
      const cause=document.getElementById('cause');
      const incident=document.getElementById('incident');
      const service=document.getElementById('service');
      const orgUnit=document.getElementById('orgUnit');
      const owner=document.getElementById('owner');
      const dueDate=document.getElementById('dueDate');
      const actionPlan=document.getElementById('actionPlan');
      const status=document.getElementById('status');
      const priority=document.getElementById('priority');
      const capaId=document.getElementById('capaId');
      const capaForm=document.getElementById('capaForm');
      const capaBody=document.getElementById('capaBody');
      const resetBtn=document.getElementById('resetBtn');

      const searchInput=document.getElementById('searchInput');
      const statusFilter=document.getElementById('statusFilter');
      const priorityFilter=document.getElementById('priorityFilter');
      const causeFilter=document.getElementById('causeFilter');
      const query = new URLSearchParams(location.search);
      const readSelectedCapa = () => {
        const fromQuery = (query.get('focus') || '').trim();
        let fromStorage = '';
        try {
          const parsed = JSON.parse(localStorage.getItem(SELECTED_CAPA_KEY) || 'null');
          fromStorage = (parsed?.capaId || '').trim();
        } catch {
          fromStorage = '';
        }
        try {
          const focus = JSON.parse(localStorage.getItem(FOCUS_TARGET_KEY) || 'null');
          if (focus?.type === 'action' && focus?.id) fromStorage = String(focus.id).trim();
        } catch {}
        localStorage.removeItem(SELECTED_CAPA_KEY);
        localStorage.removeItem(FOCUS_TARGET_KEY);
        return fromQuery || fromStorage;
      };
      const selectedCapaId = readSelectedCapa();
      let focusDone = false;
      const serviceList=document.getElementById('serviceList');

      const incidentState=store.get(INCIDENT_KEY,null);
      if (incidentState && incidentState.currentIncident) {
        const c=incidentState.currentIncident;
        const label=`${c.status || 'Incident'} / ${c.startTime || '-'} / ${c.severity || '-'}`;
        const opt=document.createElement('option'); opt.value=label; opt.textContent=label; incident.appendChild(opt);
      }
      (store.get(SERVICE_KEY,[])||[]).forEach((s)=>{ if(!s || !s.name) return; const opt=document.createElement('option'); opt.value=s.name; serviceList.appendChild(opt); });

      const sampleData=()=>[
        {id:uid(), createdAt:nowISO(), updatedAt:nowISO(), title:'결제 오류 재발 방지 절차 수립', cause:'프로세스', incident:'INC-20260305-AX1B', service:'결제 API', orgUnit:'IT서비스운영본부 / 애플리케이션운영팀', actionPlan:'장애 대응 체크리스트 개정 및 승인 프로세스 보완', owner:'김운영', dueDate:'2026-03-20', status:'진행중', priority:'높음'},
        {id:uid(), createdAt:nowISO(), updatedAt:nowISO(), title:'인증 서버 용량 증설', cause:'시스템', incident:'INC-20260304-ZT7Q', service:'인증 서비스', actionPlan:'오토스케일 임계치 조정 및 노드 증설', owner:'이인프라', dueDate:'2026-03-18', status:'미착수', priority:'매우높음'},
        {id:uid(), createdAt:nowISO(), updatedAt:nowISO(), title:'야간 당직 교육 보강', cause:'인력', incident:'', service:'고객 포털', actionPlan:'야간 장애 핸들링 교육 월 1회 정례화', owner:'박매니저', dueDate:'2026-03-25', status:'진행중', priority:'보통'},
        {id:uid(), createdAt:nowISO(), updatedAt:nowISO(), title:'백업 벤더 SLA 재협상', cause:'협력사', incident:'', service:'파일 스토리지', actionPlan:'복구 시간 SLA 명문화 및 위약 조항 추가', owner:'최구매', dueDate:'2026-03-30', status:'미착수', priority:'높음'},
        {id:uid(), createdAt:nowISO(), updatedAt:nowISO(), title:'DNS 장애 탐지 룰 개선', cause:'시스템', incident:'INC-20260302-KL2M', service:'DNS', actionPlan:'탐지 룰 민감도 조정과 다중 알람 채널 구성', owner:'정네트워크', dueDate:'2026-03-16', status:'완료', priority:'보통'},
        {id:uid(), createdAt:nowISO(), updatedAt:nowISO(), title:'대체 절차 문서 업데이트', cause:'기타', incident:'', service:'VPN', actionPlan:'비상시 수기 접수 및 우회 경로 문서 최신화', owner:'서문서', dueDate:'2026-03-22', status:'미착수', priority:'낮음'},
      ];

      const seedIfEmpty=()=>{ const modern=store.get(ACTION_ITEMS_KEY,null); const rows=Array.isArray(modern)?modern:store.get(KEY,null); if(!Array.isArray(rows)||!rows.length){ const s=sampleData(); store.set(KEY,s); store.set(ACTION_ITEMS_KEY,s); return s; } return rows; };
      let rows=seedIfEmpty();

      const prioClass=(v)=> v==='매우높음' ? 'prio-critical' : v==='높음' ? 'prio-high' : v==='낮음' ? 'prio-low' : 'prio-mid';
      const persist=()=>{ store.set(KEY,rows); store.set(ACTION_ITEMS_KEY,rows); };
      const clearForm=()=>{ capaForm.reset(); capaId.value=''; orgUnit.value=''; cause.value='프로세스'; status.value='미착수'; priority.value='보통'; dueDate.value=new Date(Date.now()+14*24*3600*1000).toISOString().slice(0,10); };

      const filtered=()=>{
        const q=(searchInput.value||'').trim().toLowerCase();
        return rows.filter((r)=>{
          const mq=!q || r.title.toLowerCase().includes(q) || r.owner.toLowerCase().includes(q) || (r.service||'').toLowerCase().includes(q) || (r.orgUnit||'').toLowerCase().includes(q);
          const ms=statusFilter.value==='전체' || r.status===statusFilter.value;
          const mp=priorityFilter.value==='전체' || r.priority===priorityFilter.value;
          const mc=causeFilter.value==='전체' || r.cause===causeFilter.value;
          return mq&&ms&&mp&&mc;
        });
      };

      const render=()=>{
        capaBody.innerHTML='';
        const view=filtered();
        if(!view.length){ capaBody.innerHTML='<tr><td colspan="11" class="sub">조건에 맞는 CAPA가 없습니다.</td></tr>'; return; }
        view.forEach((r)=>{
          const tr=document.createElement('tr');
          const focused = selectedCapaId && r.id === selectedCapaId;
          tr.dataset.capaId = r.id;
          if (focused) tr.classList.add('focusRow');
          tr.innerHTML=`
            <td>${toDate(r.createdAt)}</td>
            <td>${r.title}${focused ? '<span class="focusBadge">현재 선택 항목</span>' : ''}</td>
            <td><span class="tag ${prioClass(r.priority)}">${r.priority}</span></td>
            <td>
              <select data-status="${r.id}">
                <option ${r.status==='미착수'?'selected':''}>미착수</option>
                <option ${r.status==='진행중'?'selected':''}>진행중</option>
                <option ${r.status==='완료'?'selected':''}>완료</option>
              </select>
            </td>
            <td>${r.owner}</td>
            <td>${r.dueDate || '-'}</td>
            <td>${r.incident || '-'}</td>
            <td>${r.service || '-'}</td>
            <td>${r.orgUnit || '-'}</td>
            <td>${toDateTime(r.updatedAt)}</td>
            <td class="actions"><button class="btn" type="button" data-edit="${r.id}">수정</button><button class="btn" type="button" data-del="${r.id}">삭제</button></td>
          `;
          capaBody.appendChild(tr);
        });

        if (selectedCapaId && !focusDone) {
          const target = capaBody.querySelector(`tr[data-capa-id="${CSS.escape(selectedCapaId)}"]`);
          if (target) {
            target.scrollIntoView({ behavior:'smooth', block:'center' });
            focusDone = true;
          }
        }
      };

      capaForm.addEventListener('submit',(e)=>{
        e.preventDefault();
        const item={
          id:capaId.value || uid(),
          createdAt: capaId.value ? (rows.find((r)=>r.id===capaId.value)?.createdAt || nowISO()) : nowISO(),
          updatedAt: nowISO(),
          title:title.value.trim(),
          cause:cause.value,
          incident:incident.value,
          service:service.value.trim(),
          orgUnit:orgUnit.value.trim(),
          actionPlan:actionPlan.value.trim(),
          owner:owner.value.trim(),
          dueDate:dueDate.value,
          status:status.value,
          priority:priority.value,
        };
        const idx=rows.findIndex((r)=>r.id===item.id);
        if(idx>=0) rows[idx]=item; else rows.unshift(item);
        persist(); clearForm(); render();
      });

      capaBody.addEventListener('change',(e)=>{
        const id=e.target.getAttribute('data-status');
        if(!id) return;
        rows=rows.map((r)=> r.id===id ? { ...r, status:e.target.value, updatedAt:nowISO() } : r);
        persist(); render();
      });

      capaBody.addEventListener('click',(e)=>{
        const editId=e.target.getAttribute('data-edit');
        const delId=e.target.getAttribute('data-del');
        if(editId){
          const r=rows.find((x)=>x.id===editId); if(!r) return;
          capaId.value=r.id; title.value=r.title; cause.value=r.cause; incident.value=r.incident||''; service.value=r.service||''; orgUnit.value=r.orgUnit||''; actionPlan.value=r.actionPlan; owner.value=r.owner; dueDate.value=r.dueDate; status.value=r.status; priority.value=r.priority;
          title.focus();
          return;
        }
        if(delId){ rows=rows.filter((r)=>r.id!==delId); persist(); render(); }
      });

      resetBtn.addEventListener('click',()=>{ rows=sampleData(); persist(); clearForm(); render(); });
      searchInput.addEventListener('input',render);
      statusFilter.addEventListener('change',render);
      priorityFilter.addEventListener('change',render);
      causeFilter.addEventListener('change',render);

      clearForm();
      render();
    })();
  </script>
</body>
</html>
